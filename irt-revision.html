{id:"C2-1.1", title:"Annual Reports and Accounts", blurb:"Why accounts exist, size tests, listed PLC extras, IFRS, GAAP and who sets the rules.",
html:`<p>Financial statements give relevant, reliable information on a company's <b>profitability, liquidity, solvency, financial position and cash flows</b>, so stakeholders can make informed decisions.</p>
<ul><li>The legal duty to prepare them rests with the <b>directors</b>.</li><li>The accounting period is <b>usually 12 months</b>. It can be shorter or longer, e.g. a new company or one being wound up.</li></ul>
<h3>Company size and reporting</h3>
<p>Bigger companies have more obligations and fuller disclosures; smaller ones get exemptions. Size is judged on three criteria, and a company must qualify over <b>two successive accounting periods</b>:</p>
<div class="tw"><table class="tbl"><tr><th>Criterion</th><th>What it measures</th></tr><tr><td>1. Turnover</td><td>Total sales/income</td></tr><tr><td>2. Total assets</td><td>Value of everything the company owns</td></tr><tr><td>3. Average number of employees</td><td>Headcount over the year</td></tr></table></div>
<h3>Extra requirements for listed PLCs</h3>
<div class="tw"><table class="tbl"><tr><th>Requirement</th><th>What it covers</th></tr>
<tr><td><b>Statement of Changes in Equity</b></td><td>Profits/losses for equity holders. Dividends paid shown separately as an appropriation of profit</td></tr>
<tr><td><b>Operating &amp; Financial Review (OFR)</b></td><td>Narrative on performance and prospects, consistent with the accounts</td></tr>
<tr><td><b>Governance disclosures</b></td><td>How the company follows governance standards (e.g. UK Corporate Governance Code)</td></tr></table></div>
<ul><li><b>Voluntary</b> extras: chairman's statement, CEO review, finance director's report.</li><li><b>Climate-related disclosures:</b> mandatory in some countries, voluntary in others.</li><li><b>Half-yearly (interim) reports:</b> required for listed companies, less detail, <b>not fully audited</b>.</li></ul>
<h3>Regulatory framework</h3>
<div class="tw"><table class="tbl"><tr><th>Body / standard</th><th>Key facts</th></tr>
<tr><td><b>IFRS</b></td><td>International Financial Reporting Standards. Followed by most jurisdictions</td></tr>
<tr><td><b>IAS 1</b></td><td>'Presentation of Financial Statements': the overall framework so information is transparent and comparable</td></tr>
<tr><td><b>IASB</b></td><td>Issues the standards. Independent, privately funded, based in <b>London</b></td></tr>
<tr><td><b>UK</b></td><td>Legal framework = the <b>Companies Acts</b>. Accounting standards set by the <b>FRC</b></td></tr>
<tr><td><b>IFRS 18</b> (issued 2024)</td><td>All companies, all industries. Effective for periods beginning on or after <b>1 January 2027</b>; early adoption allowed</td></tr></table></div>
<h3>GAAP vs IFRS</h3>
<div class="tw"><table class="tbl"><tr><th></th><th>GAAP</th><th>IFRS</th></tr>
<tr><td>Approach</td><td><b>Rules</b>-based</td><td><b>Principles</b>-based</td></tr>
<tr><td>Issue</td><td>Each country had its own, hard to compare</td><td>One global standard to solve this</td></tr>
<tr><td>Adoption</td><td>Varies by country</td><td>Most countries adopted or converged</td></tr></table></div>
<ul><li><b>The US is the notable exception</b>: it hasn't adopted IFRS, but the SEC lets <b>foreign issuers</b> use it.</li><li>The <b>UK replaced its GAAP with FRS in 2015</b> to align with IFRS.</li></ul>`,
traps:["<b>Directors</b> (not auditors) have the legal duty to prepare the accounts.","Size test = turnover, total assets, employees, over <b>two successive periods</b>. Market cap is not a criterion.","Chairman's statement and CEO review are <b>voluntary</b>. SOCE, OFR and governance disclosures are required for listed PLCs.","Interim reports are <b>not fully audited</b>.","<b>IASB</b> issues the standards; the <b>FRC</b> sets UK standards. Don't swap them.","GAAP = <b>rules</b>, IFRS = <b>principles</b>. IFRS 18 effective <b>1 Jan 2027</b>."]},

{id:"C2-1.2", title:"The Three Financial Statements", blurb:"Balance sheet, income statement and cash flow statement: what each shows and when.",
html:`<div class="tw"><table class="tbl"><tr><th>Statement</th><th>Also called</th><th>Purpose</th></tr>
<tr><td><b>Statement of Financial Position</b></td><td>Balance sheet</td><td>Snapshot of assets and how they're financed</td></tr>
<tr><td><b>Statement of Comprehensive Income</b></td><td>Income statement / P&amp;L</td><td>Profit or loss over the period</td></tr>
<tr><td><b>Statement of Cash Flows</b></td><td>Cash flow statement</td><td>How cash is generated and spent</td></tr></table></div>
<h3>Balance sheet</h3>
<ul><li>A <b>"photograph" at one point in time</b> (the year end). Format set by regulation (e.g. Companies Acts).</li><li>Accounting equation: <span class="formula">Assets = Liabilities + Equity</span></li></ul>
<div class="tw"><table class="tbl"><tr><th>Type</th><th>Definition</th><th>Timeframe</th></tr>
<tr><td>Current assets</td><td>For resale or conversion to cash in normal business</td><td>Within 12 months</td></tr>
<tr><td>Non-current assets</td><td>Held for long-term use</td><td>Beyond 12 months</td></tr>
<tr><td>Current liabilities</td><td>Owed to outsiders</td><td>Within 1 year</td></tr>
<tr><td>Non-current liabilities</td><td>Owed to outsiders</td><td>After more than 1 year</td></tr></table></div>
<ul><li><b>Fixed assets</b>: <b>tangible</b> (physical, e.g. property) or <b>intangible</b> (no physical substance but identifiable and transferable, e.g. IP rights). Held for <b>use</b> in the business. Your notes say "held for sale", so check your workbook's wording.</li>
<li><b>Equity</b> = shareholders' funds = what's left after all liabilities. Includes <b>retained earnings</b>.</li></ul>
<div class="worked"><b class="lab">Worked example (Alpha plc)</b>Total assets £60m, current liabilities £10m, non-current liabilities £15m. Equity = 60 − (10 + 15) = <b>£35m</b>. Check: 25 + 35 = £60m.</div>
<h3>Income statement</h3>
<ul><li>Revenue transactions over the period, giving a profit or loss. <b>Accruals basis</b>, not cash, so <b>profit ≠ cash</b>.</li><li>Revenue is the <b>top line</b>; profit the <b>bottom line</b>. Net income flows to the SOCE, then retained earnings.</li></ul>
<h3>Cash flow statement</h3>
<ul><li><b>Depreciation is not a cash flow</b>; buying or selling an asset is. Cash moves when debts are <b>settled</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Category</th><th>Includes</th></tr>
<tr><td><b>Operating</b></td><td>Cash from customers, payments to suppliers and staff</td></tr>
<tr><td><b>Investing</b></td><td>Buying and selling long-term assets and investments</td></tr>
<tr><td><b>Financing</b></td><td>Dividends paid, loan repayments, share issue proceeds</td></tr>
<tr><td>Cash &amp; equivalents</td><td>Overall change in cash, incl. demand deposits and short-term liquid investments</td></tr></table></div>`,
traps:["Balance sheet = <b>one point in time</b>. Income and cash flow statements = <b>over a period</b>.","<b>Proposed dividends are NOT a liability</b> until declared by shareholder resolution at a general meeting.","Accruals basis: a profitable company can still run out of cash.","Depreciation reduces profit but is <b>not a cash flow</b>.","Dividends paid = <b>financing</b>. Buying a factory = <b>investing</b>. Paying suppliers = <b>operating</b>."]},

{id:"C2-1.3", title:"Valuing and Comparing Companies", blurb:"Who uses ratios, the four ratio families, and the Alpha plc example company.",
html:`<p>Ratios help interpret the accounts. <b>Investors</b> judge returns and risk, <b>directors</b> judge efficiency, <b>lenders</b> judge ability to repay.</p>
<div class="tw"><table class="tbl"><tr><th>Ratio type</th><th>What it assesses</th></tr>
<tr><td><b>Profitability</b></td><td>Trading performance; ability to make profit</td></tr>
<tr><td><b>Liquidity</b></td><td>Trading risk: can it pay suppliers? (going concern)</td></tr>
<tr><td><b>Gearing</b></td><td>Ability to meet long-term debts; borrowing risk</td></tr>
<tr><td><b>Investors' ratios</b></td><td>Returns to finance providers; efficiency</td></tr></table></div>
<p>Benchmark against <b>peer companies</b> or the company's <b>own history</b>.</p>
<div class="worked"><b class="lab">Alpha plc (used in the worked examples)</b>Revenue £50m, cost of sales £30m, operating expenses £12m, interest £1m, tax £1.75m, D&amp;A £2m. Total assets £60m; current assets £15m (inventory £6m, cash £3m); current liabilities £10m; non-current liabilities (all debt) £15m; equity £35m. 25m shares at 315p. Net dividend 7p. Operating cash flow £9m. EPS growth 10% a year.</div>`,
traps:[]},

{id:"C2-1.3.1", title:"Profitability Ratios", blurb:"Margins, EBIT and EBITDA, ROE and ROCE.",
html:`<div class="tw"><table class="tbl"><tr><th>Ratio</th><th>Formula</th><th>Measures</th></tr>
<tr><td>Gross margin</td><td>Gross profit ÷ Revenue</td><td>Left after cost of sales</td></tr>
<tr><td>Operating margin</td><td>Operating profit ÷ Revenue</td><td>Left after cost of sales and operating expenses</td></tr>
<tr><td>Net margin</td><td>Net profit ÷ Revenue</td><td>Left after all expenses</td></tr></table></div>
<ul><li>Higher is better; compare with industry averages. Margins can be negative, and a high margin doesn't always mean high cash flow.</li>
<li><b>Operating profit = PBIT = EBIT</b>. <b>EBITDA</b> = net profit + interest + tax + depreciation + amortisation. It strips out financing and accounting choices, so it's used to compare companies.</li></ul>
<div class="worked"><b class="lab">Worked example (Alpha plc)</b>Gross profit 50 − 30 = £20m → <b>40%</b>. Operating profit 20 − 12 = £8m → <b>16%</b>. Net profit 8 − 1 − 1.75 = £5.25m → <b>10.5%</b>. EBITDA = 5.25 + 1 + 1.75 + 2 = <b>£10m</b>.</div>
<h3>ROE (return on shareholders' funds / net worth)</h3>
<p><span class="formula">ROE = Net income ÷ Shareholders' equity</span></p>
<ul><li>Equity = total assets − total liabilities, or share capital + share premium + retained earnings.</li><li>Aim for ROE <b>equal to or just above</b> the industry average. Averages can be skewed by outliers.</li></ul>
<h3>ROCE</h3>
<p><span class="formula">ROCE = Operating profit ÷ Capital employed</span></p>
<ul><li>Capital employed = equity + <b>non-current</b> liabilities = total assets − <b>current</b> liabilities.</li><li><b>Better than ROE for comparing companies</b>, because ROE is distorted by different debt/equity mixes. Uses profit before interest and tax. Useful for capital-intensive sectors.</li></ul>
<div class="worked"><b class="lab">Worked example (Alpha plc)</b>ROE = 5.25 ÷ 35 = <b>15%</b>. Capital employed = 35 + 15 = £50m. ROCE = 8 ÷ 50 = <b>16%</b>.</div>`,
traps:["ROE uses <b>net income</b>. ROCE uses <b>operating profit (EBIT)</b>.","Capital employed = equity + <b>non-current</b> liabilities (= total assets − <b>current</b> liabilities).","ROCE is the better cross-company measure because capital structures differ.","EBITDA adds back interest, tax, depreciation <b>and</b> amortisation."]},

{id:"C2-1.3.2", title:"Liquidity Ratios", blurb:"Current ratio and quick ratio, and how to read them.",
html:`<p>Liquidity = meeting short-term cash needs from working capital. <b>Profitable companies can still fail if they run out of cash.</b></p>
<div class="tw"><table class="tbl"><tr><th>Ratio</th><th>Formula</th><th>Benchmark</th></tr>
<tr><td>Current ratio (working capital ratio)</td><td>Current assets ÷ Current liabilities</td><td><b>1.5–2x</b> acceptable</td></tr>
<tr><td>Quick ratio (acid test)</td><td>(Current assets − <b>Inventory</b>) ÷ Current liabilities</td><td><b>1:1</b> or better</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Current ratio</th><th>Meaning</th></tr>
<tr><td>Above 1</td><td>Enough short-term assets; can negotiate supplier discounts</td></tr>
<tr><td>Below 1</td><td>Negative working capital; liquidity problems likely; may need an overdraft</td></tr>
<tr><td>Above 2</td><td>Too many idle current assets; not investing efficiently</td></tr></table></div>
<p>The quick ratio drops inventory, which may not turn into cash quickly, so it's the <b>stricter test</b>. Below 1 doesn't automatically mean insolvent; it varies by industry.</p>
<div class="worked"><b class="lab">Worked example (Alpha plc)</b>Current ratio = 15 ÷ 10 = <b>1.5x</b>. Quick ratio = (15 − 6) ÷ 10 = <b>0.9x</b>.</div>`,
traps:["Quick ratio = current assets <b>minus inventory</b>. Not minus cash or receivables.","A current ratio <b>above 2</b> isn't \"better\". It suggests idle assets.","Quick ratio below 1 ≠ insolvent."]},

{id:"C2-1.3.3", title:"Gearing Ratios", blurb:"Gearing, debt/equity, net debt/equity, times interest earned, interest cover.",
html:`<p>Gearing = borrowings relative to shareholders' funds. <b>High gearing = higher financial risk.</b></p>
<div class="tw"><table class="tbl"><tr><th>Ratio</th><th>Formula</th></tr>
<tr><td>Gearing</td><td>Long-term liabilities ÷ Capital employed</td></tr>
<tr><td>Times interest earned</td><td>EBIT ÷ Interest payable</td></tr>
<tr><td>Debt/equity</td><td>(Debts + Preference capital) ÷ Shareholders' equity</td></tr>
<tr><td>Net debt/equity</td><td>(Debts + Preference capital − Cash) ÷ Shareholders' equity</td></tr>
<tr><td>Interest cover</td><td>(Operating profit + Interest receivable + Other income) ÷ Interest payable</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Highly geared: risks</th><th>Highly geared: upside</th></tr>
<tr><td>Must service debt even in bad years; lenders may refuse to roll over; strategy bent by cash needs; rising rates hit profit hard</td><td>In good times interest stays fixed, so surplus profit flows to shareholders</td></tr></table></div>
<p>Interest cover: <b>higher = less risk</b>. No single optimal level; it varies by sector.</p>
<div class="worked"><b class="lab">Worked example (Alpha plc)</b>Gearing = 15 ÷ 50 = <b>30%</b>. Times interest earned = 8 ÷ 1 = <b>8x</b>. Debt/equity = 15 ÷ 35 = <b>42.9%</b>. Net debt/equity = (15 − 3) ÷ 35 = <b>34.3%</b>.</div>`,
traps:["<b>Preference share capital counts as debt</b> in the debt/equity ratios.","Gearing divides by <b>capital employed</b>; debt/equity divides by <b>equity</b>.","High gearing magnifies both good and bad years for shareholders."]},

{id:"C2-1.3.4", title:"Investors' Ratios", blurb:"Yields, EPS, P/E, PEG, dividend cover, P/CF, P/B, NAV and EV.",
html:`<div class="tw"><table class="tbl"><tr><th>Ratio</th><th>Formula</th><th>Notes</th></tr>
<tr><td>Dividend yield</td><td>Gross DPS ÷ Price</td><td>Historical, gross</td></tr>
<tr><td>EPS</td><td>Profit for ordinary shareholders ÷ <b>Weighted average</b> shares</td><td><b>IAS 33</b></td></tr>
<tr><td>Diluted EPS</td><td>As EPS, incl. options and convertibles</td><td>Worst case, lower or equal</td></tr>
<tr><td>Earnings yield</td><td>Gross EPS ÷ Price</td><td>= 1 ÷ P/E</td></tr>
<tr><td>P/E</td><td>Price ÷ EPS</td><td>Fair, over or undervalued?</td></tr>
<tr><td>PEG</td><td>P/E ÷ EPS growth rate</td><td>Adjusts P/E for growth</td></tr>
<tr><td>Dividend cover</td><td>EPS ÷ Net DPS</td><td>Sustainability</td></tr>
<tr><td>P/CF</td><td>Price ÷ Operating cash flow per share</td><td>Removes depreciation</td></tr>
<tr><td>P/B</td><td>Price ÷ Book value per share</td><td>Mainly <b>banks</b></td></tr>
<tr><td>NAV per share</td><td>(Assets − Liabilities) ÷ Shares</td><td>Key for <b>investment trusts</b></td></tr>
<tr><td>Enterprise value</td><td>Market cap + Debt − Cash</td><td>Theoretical takeover cost</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Ratio</th><th>Reading</th></tr>
<tr><td>Dividend yield</td><td>Historical only; no right to future dividends</td></tr>
<tr><td>High P/E</td><td>High growth expected, OR overvalued, OR low risk</td></tr>
<tr><td>Low P/E</td><td>Cheap (possible re-rating), OR in difficulty / high risk</td></tr>
<tr><td>PEG</td><td>= 1 fair; <b>&gt; 1 overvalued; &lt; 1 undervalued</b></td></tr>
<tr><td>Dividend cover</td><td><b>≥ 2x prudent</b>; very high = retaining for growth; <b>&lt; 1x uncovered</b>, paid from reserves</td></tr>
<tr><td>P/CF</td><td>Low = possibly undervalued; high = weak cash vs peers</td></tr>
<tr><td>NAV</td><td>Price below NAV = buffer (price 100p, NAV 130p = 30p)</td></tr>
<tr><td>EV</td><td>Value of the ongoing operations</td></tr></table></div>
<div class="worked"><b class="lab">Worked example (Alpha plc)</b>EPS = 5.25m ÷ 25m = <b>21p</b>; P/E = 315 ÷ 21 = <b>15</b>; PEG = 15 ÷ 10 = <b>1.5</b> (overvalued). Cover = 21 ÷ 7 = <b>3x</b>. Dividend yield = 7 ÷ 315 = <b>2.22%</b>; earnings yield = 21 ÷ 315 = <b>6.67%</b>. NAV = 35m ÷ 25m = <b>140p</b>, P/B = <b>2.25</b>. OCF/share = 36p, P/CF = <b>8.75</b>. Market cap £78.75m, EV = 78.75 + 15 − 3 = <b>£90.75m</b>.</div>`,
traps:["EPS uses the <b>weighted average</b> number of shares, not the year-end number.","Diluted EPS is <b>lower or equal</b>, never higher: it's the worst case.","PEG <b>below 1 = undervalued</b>. Don't reverse it.","Dividend cover below 1 = <b>uncovered</b>, paid from reserves.","EV <b>adds</b> debt and <b>subtracts</b> cash.","P/B mainly for <b>banks</b>. NAV matters most for <b>investment trusts</b>."]},

{id:"C2-1.3.5", title:"Past Performance", blurb:"Benchmarks, total return and volatility.",
html:`<p>Past performance is <b>not a guarantee</b> of future performance. Look at:</p>
<div class="tw"><table class="tbl"><tr><th>Factor</th><th>What to look at</th></tr>
<tr><td>Market benchmark</td><td>A suitable index, e.g. Nikkei 225 for Japan, DAX 40 for German blue chips</td></tr>
<tr><td><b>Total return</b></td><td>Capital growth or loss <b>plus dividends</b>. The price drops when a dividend goes ex, so compare total return, not price alone</td></tr>
<tr><td>Volatility</td><td>How bumpy the ride was, not just how well it did</td></tr></table></div>`,
traps:["Comparing on <b>price only</b> understates the return on high-dividend shares."]}
];

ch of the following must a listed PLC include in its annual report?\nI. A statement of changes in equity\nII. An Operating and Financial Review\nIII. Disclosures on how it follows corporate governance standards\nIV. A chairman's statement", "o": ["I, II and III only", "I and IV only", "II, III and IV only", "I, II, III and IV"], "a": 0, "why": "Statements I to III are requirements for listed PLCs. A chairman's statement is a common voluntary addition, along with a CEO review and a finance director's report.", "eq": "No calculation needed. Key rule: Listed PLC must-haves: SOCE, OFR, governance disclosures. Voluntary: chairman's statement, CEO review, FD report."}, {"id": "CH2S1-NC-010", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1 Annual reports and accounts", "calc": false, "q": "Which of the following is a VOLUNTARY addition that many listed companies include in their annual report?", "o": ["A statement of changes in equity", "An Operating and Financial Review", "Disclosure of adherence to the UK Corporate Governance Code", "A finance director's report"], "a": 3, "why": "Many listed companies voluntarily add a chairman's statement, a CEO review and a finance director's report. The other three options are requirements.", "eq": "No calculation needed. Key rule: Voluntary extras: chairman's statement, CEO review, FD report."}, {"id": "CH2S1-NC-011", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1 Annual reports and accounts", "calc": false, "q": "Which of the following statements about the half-yearly (interim) reports of listed companies is correct?", "o": ["They are fully audited, with the same detail as the annual report", "They are optional for listed companies", "They replace the annual report", "They contain less detail than annual reports and are not subject to a full independent audit"], "a": 3, "why": "Listed companies must publish half-yearly reports. They contain less detail and are not subject to a full independent audit.", "eq": "No calculation needed. Key rule: Interim reports = half-yearly, required for listed companies, less detail, not fully audited."}, {"id": "CH2S1-NC-012", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1 Annual reports and accounts", "calc": false, "q": "Which of the following statements about climate-related disclosures is correct?", "o": ["They are mandatory in every country", "They are prohibited under IFRS", "They are mandatory in some countries and voluntary in others", "They only appear in interim reports"], "a": 2, "why": "Climate-related disclosures are mandatory in some jurisdictions and voluntary in others.", "eq": "No calculation needed. Key rule: Climate disclosures: mandatory in some countries, voluntary in others."}, {"id": "CH2S1-NC-013", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1 Annual reports and accounts", "calc": false, "q": "An investor wants the most reliable, independently checked figures for a listed company's full year. Which document should they rely on?", "o": ["The audited annual report and accounts", "The half-yearly interim report", "The chairman's statement", "A broker's research note"], "a": 0, "why": "The annual report and accounts are subject to a full independent audit. Interim reports are not, and the chairman's statement is a voluntary narrative.", "eq": "No calculation needed. Key rule: Annual accounts are fully audited. Interim reports are not."}, {"id": "CH2S1-NC-014", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1 Annual reports and accounts", "calc": false, "q": "A company's governance section explains how it has complied with the UK Corporate Governance Code. Which category of listed PLC requirement does this fall under?", "o": ["The statement of changes in equity", "The statement of cash flows", "Voluntary narrative only", "Additional disclosures"], "a": 3, "why": "Listed PLCs must make additional disclosures about how they adhere to corporate governance standards, such as the UK Corporate Governance Code.", "eq": "No calculation needed. Key rule: Additional disclosures = adherence to corporate governance standards."}, {"id": "CH2S1-NC-015", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1.1-1.1.2 Regulatory framework, GAAP vs IFRS", "calc": false, "q": "What is the main purpose of IAS 1?", "o": ["To set the rules for calculating EPS", "To regulate stock exchange listings", "To set UK company law", "To set the overall framework for presenting financial statements, so that information is transparent and comparable"], "a": 3, "why": "IAS 1, 'Presentation of Financial Statements', sets the overall framework for presenting financial statements and ensures the information is transparent and comparable. EPS is covered by IAS 33.", "eq": "No calculation needed. Key rule: IAS 1 = presentation framework. IAS 33 = EPS."}, {"id": "CH2S1-NC-016", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1.1-1.1.2 Regulatory framework, GAAP vs IFRS", "calc": false, "q": "Which of the following statements about the IASB is correct?", "o": ["It is independent, privately funded and based in London", "It is a UK government agency", "It is part of the SEC", "It is funded by the Bank of England"], "a": 0, "why": "The International Accounting Standards Board issues IFRS and IAS. It is an independent, privately funded body based in London.", "eq": "No calculation needed. Key rule: IASB = issues the standards; independent, privately funded, London."}, {"id": "CH2S1-NC-017", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1.1-1.1.2 Regulatory framework, GAAP vs IFRS", "calc": false, "q": "In the UK, which body sets accounting standards?", "o": ["The Financial Reporting Council (FRC)", "The FCA", "The PRA", "HM Treasury"], "a": 0, "why": "The UK legal framework for accounts is the Companies Acts, and the accounting standards are set by the FRC.", "eq": "No calculation needed. Key rule: UK: Companies Acts = legal framework. FRC = standards."}, {"id": "CH2S1-NC-018", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1.1-1.1.2 Regulatory framework, GAAP vs IFRS", "calc": false, "q": "What provides the legal framework for company accounts in the UK?", "o": ["FSMA 2000", "IAS 1", "The Companies Acts", "The UK Corporate Governance Code"], "a": 2, "why": "The Companies Acts govern the UK legal framework. The FRC sets the standards within it.", "eq": "No calculation needed. Key rule: UK legal framework = the Companies Acts."}, {"id": "CH2S1-NC-019", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1.1-1.1.2 Regulatory framework, GAAP vs IFRS", "calc": false, "q": "From when does IFRS 18 take effect?", "o": ["For periods beginning on or after 1 January 2024, with no early adoption", "For periods beginning on or after 1 January 2025, for banks only", "Immediately on publication in 2024, for listed companies only", "For periods beginning on or after 1 January 2027, with early adoption permitted"], "a": 3, "why": "IFRS 18 was issued in 2024 and takes effect for periods beginning on or after 1 January 2027. Early adoption is permitted.", "eq": "No calculation needed. Key rule: IFRS 18: issued 2024, effective 1 January 2027, early adoption allowed."}, {"id": "CH2S1-NC-020", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1.1-1.1.2 Regulatory framework, GAAP vs IFRS", "calc": false, "q": "Which companies does IFRS 18 apply to?", "o": ["Only listed companies", "Only banks and insurers", "All companies in all industries", "Only US companies"], "a": 2, "why": "IFRS 18 applies to all companies, in all industries.", "eq": "No calculation needed. Key rule: IFRS 18 = all companies, all industries."}, {"id": "CH2S1-NC-021", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1.1-1.1.2 Regulatory framework, GAAP vs IFRS", "calc": false, "q": "What is the main aim of IFRS 18?", "o": ["To replace national company law", "To abolish interim reporting", "Greater transparency, comparability and consistency for investors", "To set tax rates on corporate profits"], "a": 2, "why": "IFRS 18 aims to give investors greater transparency, comparability and consistency.", "eq": "No calculation needed. Key rule: IFRS 18 aim = transparency, comparability and consistency."}, {"id": "CH2S1-NC-022", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1.1-1.1.2 Regulatory framework, GAAP vs IFRS", "calc": false, "q": "What is the key difference in approach between GAAP and IFRS?", "o": ["GAAP is principles-based; IFRS is rules-based", "Both are rules-based", "Both are principles-based", "GAAP is rules-based; IFRS is principles-based"], "a": 3, "why": "GAAP is rules-based, while IFRS is principles-based.", "eq": "No calculation needed. Key rule: GAAP = rules. IFRS = principles."}, {"id": "CH2S1-NC-023", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1.1-1.1.2 Regulatory framework, GAAP vs IFRS", "calc": false, "q": "Why was IFRS developed as a global standard?", "o": ["Because GAAP was principles-based and too vague", "Because each country had developed its own GAAP, which made international comparison hard", "To replace company law in every country", "Because the US required it"], "a": 1, "why": "Each country developed its own version of GAAP, which made it difficult to compare companies internationally. IFRS was created as a global standard to solve this.", "eq": "No calculation needed. Key rule: National GAAPs were hard to compare, so IFRS was introduced as a global standard."}, {"id": "CH2S1-NC-024", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1.1-1.1.2 Regulatory framework, GAAP vs IFRS", "calc": false, "q": "Which statement about the United States and IFRS is correct?", "o": ["The US adopted IFRS in full", "The SEC bans IFRS for all companies", "The US has not adopted IFRS, but the SEC allows foreign issuers to use it", "US companies must report under IFRS and GAAP"], "a": 2, "why": "The US is the notable exception: it has not adopted IFRS, but the SEC allows foreign issuers to use IFRS.", "eq": "No calculation needed. Key rule: US = no IFRS adoption, but the SEC allows foreign issuers to use it."}, {"id": "CH2S1-NC-025", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1.1-1.1.2 Regulatory framework, GAAP vs IFRS", "calc": false, "q": "What did the UK do in 2015?", "o": ["It adopted US GAAP", "It abolished the FRC", "It replaced its own GAAP with FRS to align with IFRS", "It introduced IFRS 18"], "a": 2, "why": "In 2015 the UK replaced its GAAP with Financial Reporting Standards (FRS) to align with IFRS.", "eq": "No calculation needed. Key rule: UK: GAAP replaced by FRS in 2015."}, {"id": "CH2S1-NC-026", "ch": 2, "sec": "ca", "t": "C2-1.1", "tl": "1.1.1-1.1.2 Regulatory framework, GAAP vs IFRS", "calc": false, "q": "An accountant has to apply the intention of a standard to an unusual transaction, rather than following a detailed checklist. Which framework does this describe?", "o": ["GAAP, because it is principles-based", "GAAP, because it is a global standard", "IFRS, because it is rules-based", "IFRS, because it is principles-based"], "a": 3, "why": "Applying the intent of a standard instead of detailed rules is the principles-based approach of IFRS. GAAP is rules-based.", "eq": "No calculation needed. Key rule: Principles-based (IFRS) = apply the intent. Rules-based (GAAP) = follow detailed rules."}, {"id": "CH2S1-NC-027", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "Which statement shows how a company generates and spends cash over the period?", "o": ["The statement of cash flows", "The statement of financial position", "The statement of comprehensive income", "The statement of changes in equity"], "a": 0, "why": "The statement of cash flows shows how cash is generated and spent. The balance sheet is a snapshot of assets and financing, and the income statement shows profit or loss.", "eq": "No calculation needed. Key rule: Balance sheet = snapshot. Income statement = profit or loss. Cash flow statement = cash generated and spent."}, {"id": "CH2S1-NC-028", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "Which of the following statements about the statement of financial position is correct?", "o": ["It shows the company's position at one point in time, usually the year end", "It shows profit over the whole year", "It is prepared on a cash basis", "It shows only cash and cash equivalents"], "a": 0, "why": "The balance sheet is a 'photograph' of the company at one point in time. The income statement and the cash flow statement cover a period.", "eq": "No calculation needed. Key rule: Balance sheet = a point in time. The other two statements = a period."}, {"id": "CH2S1-NC-029", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "Which equation underpins the statement of financial position?", "o": ["Assets = Revenue − Expenses", "Equity = Assets + Liabilities", "Profit = Assets − Liabilities", "Assets = Liabilities + Equity"], "a": 3, "why": "The balance sheet is based on the accounting equation: Assets = Liabilities + Equity.", "eq": "No calculation needed. Key rule: Assets = Liabilities + Equity."}, {"id": "CH2S1-NC-030", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "Which of the following would be classed as a current asset?", "o": ["Trade receivables due to be collected within 3 months", "A factory used for production", "A patent with 10 years to run", "A long-term investment in another company"], "a": 0, "why": "Current assets are intended for resale or conversion to cash in the ordinary course of business within 12 months. Receivables due within 3 months qualify. The other three are held for long-term use.", "eq": "No calculation needed. Key rule: Current asset = turns into cash within 12 months. Non-current = held for long-term use."}, {"id": "CH2S1-NC-031", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "A company has a 5-year bank loan, and an overdraft repayable on demand. How are they classified?", "o": ["The loan is a non-current liability; the overdraft is a current liability", "Both are current liabilities", "Both are non-current liabilities", "The loan is a current liability; the overdraft is a non-current liability"], "a": 0, "why": "Liabilities due within 1 year are current, and those due after more than 1 year are non-current. An overdraft repayable on demand is current, while a 5-year loan is non-current.", "eq": "No calculation needed. Key rule: Current liability = due within 1 year. Non-current = due after more than 1 year."}, {"id": "CH2S1-NC-032", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "Which of the following BEST describes an intangible non-current asset?", "o": ["Any asset that can be sold within 12 months", "A physical asset such as property", "An asset with no physical substance that is separately identifiable and transferable, such as intellectual property rights", "Cash held on deposit"], "a": 2, "why": "Intangible fixed assets have no physical substance but are separately identifiable and transferable, for example intellectual property rights. Tangible assets, such as property, are physical.", "eq": "No calculation needed. Key rule: Tangible = physical. Intangible = no physical substance, but identifiable and transferable."}, {"id": "CH2S1-NC-033", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "In your notes, what are 'long-lived assets'?", "o": ["Assets used by the business to generate revenue on a continuing basis", "Assets intended for resale within 12 months", "Liabilities due after more than one year", "Retained earnings"], "a": 0, "why": "Long-lived assets are a type of non-current asset, used by the business to generate revenue on a continuing basis.", "eq": "No calculation needed. Key rule: Long-lived assets = used to generate revenue on a continuing basis."}, {"id": "CH2S1-NC-034", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "Which of the following BEST describes shareholders' equity on the balance sheet?", "o": ["The residual value of the assets after all liabilities have been deducted", "The total value of all assets", "The market value of the company's shares", "Cash held for paying dividends"], "a": 0, "why": "Equity, also called shareholders' funds, is what remains of the assets once all liabilities have been deducted. It is a book value, not the market capitalisation.", "eq": "No calculation needed. Key rule: Equity = Assets − Liabilities (book value, not market value)."}, {"id": "CH2S1-NC-035", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "What are retained earnings?", "o": ["Cash held in the bank", "Profits kept from operations that are available for dividends or reinvestment", "Money raised by issuing new shares", "Dividends declared but not yet paid"], "a": 1, "why": "Retained earnings are accumulated profits that have not been paid out as dividends. They are available to pay future dividends or to reinvest. Money from issuing shares is share capital and share premium.", "eq": "No calculation needed. Key rule: Retained earnings = accumulated profits not paid out as dividends."}, {"id": "CH2S1-NC-036", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "At its year end, a company's directors propose a final dividend, which shareholders will approve at the AGM held after the year end. How is it treated in the year-end balance sheet?", "o": ["It is not recognised as a liability, because it has not yet been declared by shareholder resolution at a general meeting", "As a current liability", "As a non-current liability", "As a deduction from cash"], "a": 0, "why": "Proposed dividends are not recognised as a liability until shareholders declare them by resolution at a general meeting.", "eq": "No calculation needed. Key rule: Proposed dividends are NOT a liability until declared at a general meeting."}, {"id": "CH2S1-NC-037", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "A company reports a strong profit but struggles to pay its suppliers. What is the MOST likely explanation?", "o": ["Profit is calculated on an accruals basis, so it does not equal the company's cash position", "The income statement is prepared on a cash basis", "Profit always equals cash", "Depreciation is a large cash outflow"], "a": 0, "why": "The income statement uses the accruals basis: revenue and expenses are recognised when earned or incurred, not when the cash moves. So profit does not equal cash.", "eq": "No calculation needed. Key rule: Accruals basis means profit ≠ cash."}, {"id": "CH2S1-NC-038", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "What happens to a company's net income for the year?", "o": ["It is added to current liabilities", "It is shown only in the cash flow statement", "It flows to the statement of changes in equity and then appears in retained earnings on the balance sheet", "It is paid out in full as dividends"], "a": 2, "why": "Net income flows to the statement of changes in equity and then shows up as retained earnings on the balance sheet.", "eq": "No calculation needed. Key rule: Net income goes to the SOCE, then to retained earnings."}, {"id": "CH2S1-NC-039", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "Which of the following statements about the income statement are correct?\nI. Revenue is the 'top line'\nII. Profit is the 'bottom line'\nIII. Profit affects the ability to pay dividends and fund growth internally\nIV. Revenue includes money raised from issuing shares", "o": ["I and IV only", "II, III and IV only", "I, II, III and IV", "I, II and III only"], "a": 3, "why": "Statements I to III are all correct. Statement IV is false: revenue is income from selling goods and services in normal operations. Share issues are financing.", "eq": "No calculation needed. Key rule: Revenue = top line, from normal operations. Profit = bottom line, revenue minus all allowable expenses."}, {"id": "CH2S1-NC-040", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "Which of the following reduces profit but does NOT cause a cash flow?", "o": ["Depreciation of equipment", "Buying new equipment", "Paying employees' wages", "Repaying a loan"], "a": 0, "why": "Depreciation is an accounting charge, so it reduces profit without any cash moving. Buying or selling an asset is a cash flow.", "eq": "No calculation needed. Key rule: Depreciation is not a cash flow. Buying or selling an asset is."}, {"id": "CH2S1-NC-041", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "When is a cash flow recorded in the statement of cash flows?", "o": ["When an invoice is issued", "When a sale is agreed", "At the year end only", "When a debt is settled, which is not necessarily when the revenue or expense is recognised"], "a": 3, "why": "Cash flows happen when debts are settled. That is not necessarily the same time that revenue or expense is recognised in the income statement.", "eq": "No calculation needed. Key rule: Cash flow = when settled. Income statement = when recognised (accruals)."}, {"id": "CH2S1-NC-042", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "Which of the following correctly classifies these cash flows?\nI. Loan repayments: financing\nII. Sale of a warehouse: investing\nIII. Cash received from customers: operating\nIV. Dividends paid: investing", "o": ["I and IV only", "II, III and IV only", "I, II, III and IV", "I, II and III only"], "a": 3, "why": "Statements I to III are correct. Statement IV is false: dividends paid are a financing cash flow.", "eq": "No calculation needed. Key rule: Operating = core trading. Investing = long-term assets and investments. Financing = dividends, loans, share issues."}, {"id": "CH2S1-NC-043", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "A company receives the proceeds from a new share issue. In which category of cash flow does this appear?", "o": ["Operating activities", "Investing activities", "It is not a cash flow", "Financing activities"], "a": 3, "why": "Proceeds from issuing shares are a financing cash flow, along with dividends paid and loan repayments.", "eq": "No calculation needed. Key rule: Financing = dividends paid, loan repayments, share issue proceeds."}, {"id": "CH2S1-NC-044", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": false, "q": "Which of the following would NOT normally be classed as a cash equivalent?", "o": ["A demand deposit", "An investment in listed ordinary shares", "A short-term, highly liquid deposit", "A short-term investment easily convertible to cash with minimal risk"], "a": 1, "why": "Cash equivalents are demand deposits and short-term liquid investments that are easily convertible to cash with minimal risk. Listed shares can fall in value, so they are not cash equivalents.", "eq": "No calculation needed. Key rule: Cash equivalents = demand deposits and short-term liquid investments with minimal risk."}, {"id": "CH2S1-NC-045", "ch": 2, "sec": "ca", "t": "C2-1.3", "tl": "1.3 Ratio overview", "calc": false, "q": "A bank is deciding whether to lend to a company. What is it MAINLY using financial ratios to assess?", "o": ["Directors' efficiency only", "The company's ability to meet its debt obligations", "Investors' dividend returns", "The company's share price trend"], "a": 1, "why": "Lenders use ratios to assess the ability to meet debt obligations. Investors focus on returns and risk, and directors and managers on efficiency and profit generation.", "eq": "No calculation needed. Key rule: Investors = returns and risk. Directors = efficiency. Lenders = ability to repay debt."}, {"id": "CH2S1-NC-046", "ch": 2, "sec": "ca", "t": "C2-1.3", "tl": "1.3 Ratio overview", "calc": false, "q": "Which type of ratio assesses trading risk, meaning whether the company can pay its suppliers and remain a going concern?", "o": ["Profitability ratios", "Gearing ratios", "Investors' ratios", "Liquidity ratios"], "a": 3, "why": "Liquidity ratios assess trading risk, such as whether the company can pay its suppliers. Gearing looks at long-term debt risk.", "eq": "No calculation needed. Key rule: Liquidity = short-term trading risk. Gearing = long-term debt risk."}, {"id": "CH2S1-NC-047", "ch": 2, "sec": "ca", "t": "C2-1.3", "tl": "1.3 Ratio overview", "calc": false, "q": "How should a company's ratios be benchmarked?", "o": ["Only against the FTSE 100", "Only against a fixed universal target", "Against no benchmark, because ratios are absolute", "Against peer companies or the company's own past performance"], "a": 3, "why": "Ratios are only meaningful when compared, either with peers or with the company's own history.", "eq": "No calculation needed. Key rule: Benchmark ratios against peers or the company's own history."}, {"id": "CH2S1-NC-048", "ch": 2, "sec": "ca", "t": "C2-1.3", "tl": "1.3 Ratio overview", "calc": false, "q": "Which category of ratio looks at returns to finance providers and efficiency in managing assets?", "o": ["Liquidity ratios", "Gearing ratios", "Investment returns (investors') ratios", "Profit margins only"], "a": 2, "why": "Investors' ratios assess the returns to finance providers and how efficiently assets are managed.", "eq": "No calculation needed. Key rule: Investors' ratios = returns to finance providers and efficiency in managing assets."}, {"id": "CH2S1-NC-049", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": false, "q": "Which of the following statements about profit margins are correct?\nI. Higher margins usually mean the company is better at turning sales into profit\nII. A low margin does not always mean poor performance\nIII. A high margin does not always mean high cash flow\nIV. Margins can never be negative", "o": ["I and IV only", "II, III and IV only", "I, II, III and IV", "I, II and III only"], "a": 3, "why": "Statements I to III are all correct. Statement IV is false: margins can be negative, for example when overheads are too high.", "eq": "No calculation needed. Key rule: Higher margin = better conversion, but low ≠ always poor, high ≠ always cash-rich, and margins can be negative."}, {"id": "CH2S1-NC-050", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": false, "q": "Which of the following terms usually describe the SAME figure?", "o": ["EBIT and net profit", "EBITDA and operating profit", "Operating profit, PBIT and EBIT", "Gross profit and EBIT"], "a": 2, "why": "Operating profit = PBIT = EBIT (profit before interest and tax). EBIT can sometimes include non-operating revenue; where there is none, EBIT equals operating profit.", "eq": "No calculation needed. Key rule: Operating profit = PBIT = EBIT."}, {"id": "CH2S1-NC-051", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": false, "q": "Why is EBITDA widely used to compare profitability across companies and industries?", "o": ["It is the legal basis for dividends", "It removes the effects of financing and accounting decisions", "It includes all cash flows", "It is always lower than net profit"], "a": 1, "why": "EBITDA strips out interest (financing), tax, and depreciation and amortisation (accounting policy), so companies with different structures can be compared.", "eq": "No calculation needed. Key rule: EBITDA = Net profit + Interest + Tax + Depreciation + Amortisation. It removes financing and accounting effects."}, {"id": "CH2S1-NC-052", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": false, "q": "Return on equity is also known by which other names?", "o": ["ROCE and ROA", "Earnings yield and EPS", "Return on shareholders' funds (ROSF) and return on net worth (RONW)", "Gross margin and net margin"], "a": 2, "why": "ROE is also called ROSF (return on shareholders' funds) and RONW (return on net worth).", "eq": "No calculation needed. Key rule: ROE = ROSF = RONW = Net income ÷ Shareholders' equity."}, {"id": "CH2S1-NC-053", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": false, "q": "According to your notes, what is a good rule of thumb for a company's ROE?", "o": ["Equal to or just above the industry average", "At least double the industry average", "Exactly 15% for every company", "Below the industry average, to reduce risk"], "a": 0, "why": "A good rule of thumb is to target an ROE equal to or just above the industry average. The average itself can be skewed by outliers.", "eq": "No calculation needed. Key rule: Target ROE = equal to or just above the industry average (beware outliers)."}, {"id": "CH2S1-NC-054", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": false, "q": "According to your notes, what is 'the most fundamental characteristic of a good company'?", "o": ["A high P/E ratio", "An ability to earn consistently above-average returns on equity", "Low gearing", "A current ratio above 2"], "a": 1, "why": "Your notes quote the idea that the ability to earn consistently above-average rates of return on equity is the most fundamental characteristic of a good company.", "eq": "No calculation needed. Key rule: Consistently above-average ROE = the hallmark of a good company."}, {"id": "CH2S1-NC-055", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": false, "q": "Why does ROCE use operating profit rather than net profit?", "o": ["Because net profit is not reported", "Because companies have different financing commitments and tax rates, so profit before interest and tax gives a fairer comparison", "Because operating profit includes dividends", "Because ROCE is measured only for banks"], "a": 1, "why": "ROCE measures returns on all long-term capital (equity plus long-term debt). Using profit before interest and tax removes differences in financing and tax.", "eq": "No calculation needed. Key rule: ROCE = Operating profit ÷ Capital employed. It is before interest and tax, so it is comparable across capital structures."}, {"id": "CH2S1-NC-056", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": false, "q": "In which type of sector is ROCE especially useful?", "o": ["Sectors with no long-term debt", "Capital-intensive sectors with large capital expenditure", "Only financial services", "Sectors with negative equity"], "a": 1, "why": "ROCE is especially useful in capital-intensive sectors. It must be compared with same-sector peers, taking market conditions into account.", "eq": "No calculation needed. Key rule: ROCE = best for capital-intensive sectors; compare with same-sector peers."}, {"id": "CH2S1-NC-057", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": false, "q": "Which of the following BEST describes liquidity in company analysis?", "o": ["The ability to earn profit from sales", "The level of long-term borrowing", "The return to shareholders", "The ability to meet short-term cash requirements from working capital"], "a": 3, "why": "Liquidity is the ability to meet short-term cash needs from working capital. Even a profitable company with strong assets can fail if it runs out of cash.", "eq": "No calculation needed. Key rule: Liquidity = meeting short-term cash needs from working capital."}, {"id": "CH2S1-NC-058", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": false, "q": "A profitable company with valuable property collapses because it cannot pay its suppliers. Which lesson from your notes does this illustrate?", "o": ["Profitable companies cannot fail", "Property is always a current asset", "Even profitable companies with strong assets can fail if they lack cash", "Gearing is the only risk that matters"], "a": 2, "why": "Your notes stress that profitable companies with strong assets can still fail through a lack of cash. That is why liquidity ratios matter.", "eq": "No calculation needed. Key rule: Profit and assets don't protect a company that runs out of cash."}, {"id": "CH2S1-NC-059", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": false, "q": "A company has a current ratio of 1.3x. Which benefit does your notes link to a current ratio above 1?", "o": ["It holds too many idle assets", "It has negative working capital", "It has enough short-term assets, and may be able to negotiate cash discounts with suppliers", "It needs an overdraft"], "a": 2, "why": "A current ratio above 1 means there are sufficient short-term assets, which can let the company negotiate cash discounts with suppliers. Above 2 suggests idle assets.", "eq": "No calculation needed. Key rule: Above 1 = sufficient. Below 1 = negative working capital. Above 2 = idle assets. Acceptable range = 1.5-2x."}, {"id": "CH2S1-NC-060", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": false, "q": "What is the acceptable range for the current ratio, according to your notes?", "o": ["0.5-1x", "1.5-2x", "3-4x", "Exactly 1x"], "a": 1, "why": "Your notes give 1.5-2x as acceptable for the current ratio. For the quick ratio, the benchmark is 1:1 or better.", "eq": "No calculation needed. Key rule: Current ratio 1.5-2x. Quick ratio 1:1 or better."}, {"id": "CH2S1-NC-061", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": false, "q": "Why does the quick ratio exclude inventory?", "o": ["Because inventory is a non-current asset", "Because inventory may not be quickly convertible to cash, especially in a financial crisis", "Because inventory is a liability", "Because inventory is always overvalued"], "a": 1, "why": "Inventory may take time to sell, especially in a crisis, so the quick (acid test) ratio strips it out and gives a stricter test.", "eq": "No calculation needed. Key rule: Quick ratio = (Current assets − Inventory) ÷ Current liabilities."}, {"id": "CH2S1-NC-062", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": false, "q": "Which of the following statements about the quick ratio is correct?", "o": ["A quick ratio below 1 always means insolvency", "The quick ratio is less strict than the current ratio", "A quick ratio below 1 does not automatically mean insolvency, because it varies by industry", "The quick ratio includes inventory"], "a": 2, "why": "A quick ratio below 1 is not automatically a sign of insolvency. Some industries normally operate below 1.", "eq": "No calculation needed. Key rule: Quick ratio < 1 ≠ insolvent; it depends on the industry."}, {"id": "CH2S1-NC-063", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": false, "q": "What does gearing measure?", "o": ["The relationship between current assets and current liabilities", "The relationship between borrowings and shareholders' funds", "Profit as a percentage of revenue", "Dividends as a percentage of earnings"], "a": 1, "why": "Gearing is the relationship between borrowings and shareholders' funds. High gearing means higher financial risk.", "eq": "No calculation needed. Key rule: Gearing = borrowings vs shareholders' funds. High gearing = high financial risk."}, {"id": "CH2S1-NC-064", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": false, "q": "Which of the following is NOT a risk of high gearing?", "o": ["Having to service debt even when earnings are depressed", "Surplus profits flowing to shareholders in good times", "Lenders refusing to roll over debt", "Strategy being distorted by the need for short-term cash"], "a": 1, "why": "When times are good, fixed interest payments stay the same, so surplus profits flow to shareholders. That is the upside of gearing, not a risk.", "eq": "No calculation needed. Key rule: Gearing risks: must service debt, roll-over refusal, distorted strategy, disproportionate profit falls. Upside: surplus profits to shareholders."}, {"id": "CH2S1-NC-065", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": false, "q": "Interest rates rise sharply. Why do highly geared companies suffer disproportionately?", "o": ["Their revenue falls automatically", "They must convert debt to equity", "Higher interest costs take a larger share of operating profit, so profit for shareholders falls by more than the change in rates or profits", "Their current ratio rises"], "a": 2, "why": "With high gearing, interest is a large fixed cost. Rising rates or falling profits therefore cause a disproportionate decline in profit for shareholders.", "eq": "No calculation needed. Key rule: Fixed interest magnifies changes in profit for shareholders."}, {"id": "CH2S1-NC-066", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": false, "q": "Which of the following statements about interest cover is correct?", "o": ["A lower interest cover means less risk", "A higher interest cover means less risk for shareholders and lenders, and there is no single optimal level", "The optimal interest cover is 2x in every sector", "Interest cover only matters to shareholders"], "a": 1, "why": "Higher interest cover means interest is more comfortably covered by profits, so risk is lower. There is no single optimal level; it varies by sector.", "eq": "No calculation needed. Key rule: Higher interest cover = less risk. Optimal level varies by sector."}, {"id": "CH2S1-NC-067", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": false, "q": "In your notes, what is included in debts for the debt/equity ratio?", "o": ["Debts only", "Debts minus preference share capital", "Current liabilities only", "Debts plus preference share capital"], "a": 3, "why": "The debt/equity ratio in your notes is (Debts + Preference share capital) ÷ Shareholders' equity, because preference shares have a fixed, debt-like claim.", "eq": "No calculation needed. Key rule: Debt/equity = (Debts + Pref capital) ÷ Equity. Net debt/equity also deducts cash."}, {"id": "CH2S1-NC-068", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": false, "q": "A highly geared company is under pressure to generate short-term cash to service its debt. Which risk from your notes does this illustrate?", "o": ["Its strategy may be distorted by short-term cash generation needs", "Its current ratio must exceed 2", "It cannot pay dividends by law", "Its EPS must rise"], "a": 0, "why": "Your notes list strategy distortion by short-term cash generation needs as one of the risks of high gearing.", "eq": "No calculation needed. Key rule: High gearing can distort strategy towards short-term cash."}, {"id": "CH2S1-NC-069", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": false, "q": "A company reports EPS of 40p. Which statement is correct?", "o": ["The investor will receive 40p per share as a dividend", "EPS is a percentage measure", "EPS is not governed by any standard", "The investor will not necessarily receive 40p as a dividend, because some profit may be retained"], "a": 3, "why": "EPS is earnings per share in money terms, governed by IAS 33. Some of the profit is usually retained, so EPS is not the dividend.", "eq": "No calculation needed. Key rule: EPS ≠ dividend. EPS is governed by IAS 33."}, {"id": "CH2S1-NC-070", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": false, "q": "Why is diluted EPS considered more conservative than basic EPS?", "o": ["It excludes preference dividends", "It includes dilutive securities such as options and convertibles, giving a 'worst case' figure", "It uses year-end shares instead of the weighted average", "It is always higher than basic EPS"], "a": 1, "why": "Diluted EPS assumes options and convertibles are turned into shares, increasing the share count. The result is lower (or equal), making it the worst case.", "eq": "No calculation needed. Key rule: Diluted EPS includes options and convertibles, so it is ≤ basic EPS."}, {"id": "CH2S1-NC-071", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": false, "q": "Which of the following could explain a LOW P/E ratio?\nI. The shares are cheap and could correct upwards\nII. The company is in difficulty\nIII. The company is seen as high risk\nIV. The market expects very high growth", "o": ["I and IV only", "I, II and III only", "II, III and IV only", "I, II, III and IV"], "a": 1, "why": "A low P/E can mean the shares are cheap or that the company is in difficulty or seen as high risk. High expected growth pushes the P/E UP, so statement IV is false.", "eq": "No calculation needed. Key rule: High P/E = growth expected, overvalued, or low risk. Low P/E = cheap, or in difficulty/high risk."}, {"id": "CH2S1-NC-072", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": false, "q": "Which statement about the P/E ratio is correct?", "o": ["It can be calculated on a historic or projected basis and should not be viewed in isolation", "It can only be calculated on historic earnings", "A high P/E always means the shares are overvalued", "It is the same as the earnings yield"], "a": 0, "why": "The P/E can use historic or projected earnings, and it should always be read alongside other measures. A high P/E has several possible explanations.", "eq": "No calculation needed. Key rule: P/E = Price ÷ EPS; historic or projected; never in isolation."}, {"id": "CH2S1-NC-073", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": false, "q": "A share has a PEG ratio of 0.7. How is this usually interpreted?", "o": ["The shares are overvalued", "The shares may be undervalued, which is favourable", "The shares are fairly valued", "The company has negative growth"], "a": 1, "why": "A PEG below 1 suggests undervalued, a PEG of 1 means market value and projected growth are perfectly matched, and a PEG above 1 suggests overvalued.", "eq": "No calculation needed. Key rule: PEG = P/E ÷ growth. <1 undervalued, =1 fair, >1 overvalued."}, {"id": "CH2S1-NC-074", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": false, "q": "A company's dividend cover is very high (8x). What does this MOST likely show?", "o": ["The dividend is uncovered", "It retains most of its earnings, which is typical of a high-growth company", "It is paying dividends from reserves", "It is about to cut its dividend"], "a": 1, "why": "A very high dividend cover means only a small part of earnings is paid out, which is typical of high-growth companies reinvesting their profits.", "eq": "No calculation needed. Key rule: Cover ≥ 2x prudent. Very high = growth company retaining earnings. < 1x = uncovered."}, {"id": "CH2S1-NC-075", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": false, "q": "Which of the following statements about the P/CF ratio is correct?", "o": ["It uses net profit", "It is like the P/E but uses operating cash flow, which removes the effect of depreciation; a low P/CF may indicate undervaluation", "A high P/CF shows strong cash generation", "It cannot use free cash flow"], "a": 1, "why": "P/CF = Price ÷ Operating cash flow per share. It removes depreciation's effect. Low means potentially undervalued, and high means weak cash generation compared with peers. Free cash flow is sometimes used instead.", "eq": "No calculation needed. Key rule: P/CF = Price ÷ Operating cash flow per share."}, {"id": "CH2S1-NC-076", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": false, "q": "Which pairing of ratio and main use is correct?", "o": ["P/B: investment trusts. NAV: banks", "EV: dividend sustainability. Dividend cover: takeover cost", "P/B: mainly the banking sector. NAV: key for investment trusts", "PEG: liquidity. Quick ratio: growth"], "a": 2, "why": "P/B is mainly used for banks, and NAV is especially important for investment trust investors. EV is the theoretical takeover cost, and dividend cover shows dividend sustainability.", "eq": "No calculation needed. Key rule: P/B = banks. NAV = investment trusts. EV = takeover cost. Cover = dividend sustainability."}, {"id": "CH2S1-NC-077", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": false, "q": "Which of the following statements about enterprise value is correct?", "o": ["It is the same as market capitalisation", "It adds cash and deducts debt", "It measures the value of the ongoing operations and is seen as a theoretical takeover cost", "It values only the company's property"], "a": 2, "why": "EV = Market cap + Debt − Cash − Cash equivalents. It values the ongoing operations rather than the company itself, and is a theoretical takeover cost.", "eq": "No calculation needed. Key rule: EV = Market cap + Debt − Cash − Cash equivalents."}, {"id": "CH2S1-NC-078", "ch": 2, "sec": "ca", "t": "C2-1.3.5", "tl": "1.3.5 Past performance", "calc": false, "q": "Which is the MOST appropriate benchmark for a portfolio of large Japanese shares?", "o": ["DAX 40", "FTSE 100", "Nikkei 225", "S&P 500"], "a": 2, "why": "Performance should be compared with an appropriate index. Your notes use the Nikkei 225 for Japan and the DAX 40 for German blue chips.", "eq": "No calculation needed. Key rule: Use the right benchmark: Japan = Nikkei 225, Germany = DAX 40."}, {"id": "CH2S1-NC-079", "ch": 2, "sec": "ca", "t": "C2-1.3.5", "tl": "1.3.5 Past performance", "calc": false, "q": "A high-yield share appears to have underperformed a low-yield share when comparing price movements only. Why might this be misleading?", "o": ["The share price falls when a dividend goes ex, so a price-only comparison ignores the income; compare on total return", "Dividends have no effect on share prices", "Price-only comparisons are required by the FCA", "Total return excludes dividends"], "a": 0, "why": "Share prices drop when dividends go ex. A high-yield share loses more value this way, so comparisons must be made on total return (capital plus dividends).", "eq": "No calculation needed. Key rule: Total return = capital growth/loss + dividends received."}, {"id": "CH2S1-NC-080", "ch": 2, "sec": "ca", "t": "C2-1.3.5", "tl": "1.3.5 Past performance", "calc": false, "q": "Which of the following statements about past performance are correct?\nI. Past performance is not a guarantee of future performance\nII. It should be compared with an appropriate benchmark\nIII. Volatility shows how bumpy the ride was\nIV. Price return is enough to compare dividend-paying shares", "o": ["I and IV only", "I, II and III only", "II, III and IV only", "I, II, III and IV"], "a": 1, "why": "Statements I to III are all correct. Statement IV is false: dividend-paying shares should be compared on total return.", "eq": "No calculation needed. Key rule: Past performance: no guarantee; use a benchmark, total return and volatility."}, {"id": "CH2S1-CALC-001", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": true, "q": "A company has total assets of £150m, current liabilities of £35m and non-current liabilities of £45m. What is its shareholders' equity?", "o": ["£115m", "£70m", "£105m", "£230m"], "a": 1, "why": "Equity = Assets − Liabilities = 150 − (35 + 45) = £70m. Deduct BOTH current and non-current liabilities.", "eq": "Assets = Liabilities + Equity, so Equity = Assets − Total liabilities"}, {"id": "CH2S1-CALC-002", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": true, "q": "A company has equity of £90m, current liabilities of £20m and non-current liabilities of £40m. What are its total assets?", "o": ["£130m", "£110m", "£30m", "£150m"], "a": 3, "why": "Assets = Liabilities + Equity = (20 + 40) + 90 = £150m.", "eq": "Assets = Liabilities + Equity"}, {"id": "CH2S1-CALC-003", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": true, "q": "A company has share capital of £12m, share premium of £18m and retained earnings of £45m. What is its shareholders' equity?", "o": ["£30m", "£57m", "£63m", "£75m"], "a": 3, "why": "Shareholders' equity = Share capital + Share premium + Retained earnings = 12 + 18 + 45 = £75m.", "eq": "Shareholders' equity = Share capital + Share premium + Retained earnings"}, {"id": "CH2S1-CALC-004", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": true, "q": "A company's retained earnings were £40m at the start of the year. It made net income of £15m and paid dividends of £6m. What are its retained earnings at the year end?", "o": ["£55m", "£61m", "£49m", "£34m"], "a": 2, "why": "Net income flows into retained earnings, and dividends paid are an appropriation of profit: 40 + 15 − 6 = £49m.", "eq": "Closing retained earnings = Opening + Net income − Dividends paid"}, {"id": "CH2S1-CALC-005", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": true, "q": "A company's balance sheet shows inventory £8m, trade receivables £12m, cash £5m, property £60m and a 7-year loan of £30m. What are its current assets?", "o": ["£85m", "£17m", "£25m", "£55m"], "a": 2, "why": "Current assets = inventory + receivables + cash = 8 + 12 + 5 = £25m. The property is a non-current asset, and the loan is a non-current liability.", "eq": "Current assets = items converting to cash within 12 months (inventory, receivables, cash)"}, {"id": "CH2S1-CALC-006", "ch": 2, "sec": "ca", "t": "C2-1.2", "tl": "1.2 Financial statements", "calc": true, "q": "A company starts the year with £10m of cash. Its cash flows are: operating +£22m, investing −£15m and financing −£4m. What is its closing cash?", "o": ["£3m", "£51m", "£29m", "£13m"], "a": 3, "why": "Net change = 22 − 15 − 4 = +£3m. Closing cash = 10 + 3 = £13m.", "eq": "Closing cash = Opening cash + Operating + Investing + Financing cash flows"}, {"id": "CH2S1-CALC-007", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "Kappa plc: revenue £120m, cost of sales £78m, operating expenses £24m, interest £3m, tax £3.75m, depreciation and amortisation £6m. What is Kappa plc's gross profit margin?", "o": ["35.00%", "15.00%", "65.00%", "9.38%"], "a": 0, "why": "Gross profit = 120 − 78 = £42m. Gross margin = 42 ÷ 120 = 35.00%.", "eq": "Gross profit margin = (Revenue − Cost of sales) ÷ Revenue"}, {"id": "CH2S1-CALC-008", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "Kappa plc: revenue £120m, cost of sales £78m, operating expenses £24m, interest £3m, tax £3.75m, depreciation and amortisation £6m. What is Kappa plc's operating profit margin?", "o": ["35.00%", "9.38%", "15.00%", "12.50%"], "a": 2, "why": "Operating profit = 42 − 24 = £18m. Operating margin = 18 ÷ 120 = 15.00%. Interest and tax are NOT deducted yet.", "eq": "Operating profit margin = Operating profit (EBIT) ÷ Revenue"}, {"id": "CH2S1-CALC-009", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "Kappa plc: revenue £120m, cost of sales £78m, operating expenses £24m, interest £3m, tax £3.75m, depreciation and amortisation £6m. What is Kappa plc's net profit margin?", "o": ["15.00%", "9.38%", "11.88%", "12.50%"], "a": 1, "why": "Net profit = 18 − 3 − 3.75 = £11.25m. Net margin = 11.25 ÷ 120 = 9.38%. Deduct BOTH interest and tax.", "eq": "Net profit margin = Net profit ÷ Revenue"}, {"id": "CH2S1-CALC-010", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "Kappa plc: revenue £120m, cost of sales £78m, operating expenses £24m, interest £3m, tax £3.75m, depreciation and amortisation £6m. What is Kappa plc's EBITDA?", "o": ["£18m", "£17.25m", "£42m", "£24m"], "a": 3, "why": "EBITDA = Net profit + Interest + Tax + D&A = 11.25 + 3 + 3.75 + 6 = £24m. Check: operating profit 18 + D&A 6 = £24m.", "eq": "EBITDA = Net profit + Interest + Tax + Depreciation + Amortisation (= EBIT + D&A)"}, {"id": "CH2S1-CALC-011", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company's revenue is £200m and its operating margin is 12%. Interest is £4m and tax is 25% of profit before tax. What is its net profit margin?", "o": ["12.00%", "10.00%", "9.00%", "7.50%"], "a": 3, "why": "Operating profit = 12% × 200 = £24m. PBT = 24 − 4 = £20m. Tax = 25% × 20 = £5m. Net profit = £15m. Net margin = 15 ÷ 200 = 7.50%.", "eq": "Operating profit = Margin × Revenue. Net profit = (EBIT − Interest) × (1 − tax rate). Net margin = Net profit ÷ Revenue"}, {"id": "CH2S1-CALC-012", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company has net profit of £9m, interest of £2m, tax of £3m, depreciation of £4m and amortisation of £1m. What is its EBITDA?", "o": ["£19m", "£18m", "£14m", "£13m"], "a": 0, "why": "EBITDA = 9 + 2 + 3 + 4 + 1 = £19m. £18m forgets amortisation, £14m is EBIT, and £13m adds back only D&A.", "eq": "EBITDA = Net profit + Interest + Tax + Depreciation + Amortisation"}, {"id": "CH2S1-CALC-013", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company has EBITDA of £30m and depreciation and amortisation of £8m. What is its EBIT (operating profit)?", "o": ["£38m", "£30m", "£8m", "£22m"], "a": 3, "why": "EBIT = EBITDA − Depreciation and amortisation = 30 − 8 = £22m.", "eq": "EBIT = EBITDA − D&A"}, {"id": "CH2S1-CALC-014", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company has net income of £14m, share capital of £20m, share premium of £15m and retained earnings of £35m. What is its ROE?", "o": ["40.00%", "70.00%", "20.00%", "28.00%"], "a": 2, "why": "Shareholders' equity = 20 + 15 + 35 = £70m. ROE = 14 ÷ 70 = 20%.", "eq": "ROE = Net income ÷ (Share capital + Share premium + Retained earnings)"}, {"id": "CH2S1-CALC-015", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company has total assets of £300m, total liabilities of £180m and net income of £18m. What is its ROE?", "o": ["6.00%", "10.00%", "15.00%", "3.75%"], "a": 2, "why": "Equity = 300 − 180 = £120m. ROE = 18 ÷ 120 = 15%.", "eq": "ROE = Net income ÷ (Total assets − Total liabilities)"}, {"id": "CH2S1-CALC-016", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company has operating profit of £27m, equity of £120m and non-current liabilities of £60m. What is its ROCE?", "o": ["22.50%", "45.00%", "15.00%", "9.00%"], "a": 2, "why": "Capital employed = Equity + Non-current liabilities = 120 + 60 = £180m. ROCE = 27 ÷ 180 = 15%.", "eq": "ROCE = Operating profit ÷ (Equity + Non-current liabilities)"}, {"id": "CH2S1-CALC-017", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company has total assets of £250m, current liabilities of £50m and operating profit of £32m. What is its ROCE?", "o": ["12.80%", "16.00%", "64.00%", "10.67%"], "a": 1, "why": "Capital employed = Total assets − Current liabilities = 250 − 50 = £200m. ROCE = 32 ÷ 200 = 16%.", "eq": "ROCE = Operating profit ÷ (Total assets − Current liabilities)"}, {"id": "CH2S1-CALC-018", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "Companies X and Y both have operating profit of £20m and capital employed of £200m. X is funded entirely by equity (£200m) and pays tax of £5m. Y has equity of £80m and debt of £120m, pays interest of £8m, and pays tax of £3m. Which statement is correct?", "o": ["Both have a ROCE of 10%, but Y's ROE (11.25%) is higher than X's (7.5%) because of gearing", "X has a higher ROCE than Y", "Both have the same ROE of 10%", "Y's ROE is lower because it pays interest"], "a": 0, "why": "ROCE = 20 ÷ 200 = 10% for both. X: net income = 20 − 5 = £15m, so ROE = 15 ÷ 200 = 7.5%. Y: net income = 20 − 8 − 3 = £9m, so ROE = 9 ÷ 80 = 11.25%. Gearing boosts Y's ROE, which is why ROCE is the better cross-company comparison.", "eq": "ROCE = Operating profit ÷ Capital employed. ROE = Net income ÷ Equity"}, {"id": "CH2S1-CALC-019", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company's revenue rises from £100m to £110m. Cost of sales stays at 60% of revenue, and operating expenses are fixed at £25m. What is the new operating margin?", "o": ["17.27%", "15.00%", "40.00%", "19.00%"], "a": 0, "why": "New gross profit = 40% × 110 = £44m. Operating profit = 44 − 25 = £19m. Margin = 19 ÷ 110 = 17.27%, up from 15%, because fixed costs are spread over more revenue.", "eq": "Operating margin = (Revenue − Cost of sales − Operating expenses) ÷ Revenue"}, {"id": "CH2S1-CALC-020", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company has revenue of £80m and targets a gross profit margin of 45%. What is the MAXIMUM cost of sales it can incur?", "o": ["£36m", "£44m", "£80m", "£35m"], "a": 1, "why": "Gross profit needed = 45% × 80 = £36m. Maximum cost of sales = 80 − 36 = £44m.", "eq": "Cost of sales = Revenue × (1 − Gross margin)"}, {"id": "CH2S1-CALC-021", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company wants operating profit of £12m and expects an operating margin of 8%. What revenue does it need?", "o": ["£96m", "£12.96m", "£150m", "£120m"], "a": 2, "why": "Revenue = Operating profit ÷ Margin = 12 ÷ 0.08 = £150m.", "eq": "Revenue = Operating profit ÷ Operating margin"}, {"id": "CH2S1-CALC-022", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company's equity is £64m and its ROE is 12.5%. What is its net income?", "o": ["£5.12m", "£8m", "£51.2m", "£80m"], "a": 1, "why": "Net income = ROE × Equity = 12.5% × 64 = £8m.", "eq": "Net income = ROE × Shareholders' equity"}, {"id": "CH2S1-CALC-023", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company has net profit of £21m, after interest of £4m and tax of £7m. Its revenue is £256m. What is its operating profit margin?", "o": ["8.20%", "10.94%", "12.50%", "9.77%"], "a": 2, "why": "Operating profit (PBIT) = 21 + 4 + 7 = £32m. Operating margin = 32 ÷ 256 = 12.50%.", "eq": "EBIT = Net profit + Interest + Tax. Operating margin = EBIT ÷ Revenue"}, {"id": "CH2S1-CALC-024", "ch": 2, "sec": "ca", "t": "C2-1.3.1", "tl": "1.3.1 Profitability", "calc": true, "q": "A company has revenue of £50m, cost of sales of £35m and operating expenses of £18m. What is its operating margin?", "o": ["6.00%", "30.00%", "-36.00%", "-6.00%"], "a": 3, "why": "Gross profit = 50 − 35 = £15m. Operating profit = 15 − 18 = −£3m. Margin = −3 ÷ 50 = −6%. Margins can be negative when overheads are too high.", "eq": "Operating margin = (Revenue − Cost of sales − Operating expenses) ÷ Revenue"}, {"id": "CH2S1-CALC-025", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": true, "q": "A company has current assets of £36m and current liabilities of £20m. What is its current ratio?", "o": ["0.56x", "1.16x", "2.80x", "1.80x"], "a": 3, "why": "Current ratio = 36 ÷ 20 = 1.80x, which is within the acceptable 1.5-2x range.", "eq": "Current ratio = Current assets ÷ Current liabilities"}, {"id": "CH2S1-CALC-026", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": true, "q": "A company has current assets of £36m, including inventory of £14m, and current liabilities of £20m. What is its quick ratio?", "o": ["1.10x", "1.80x", "0.70x", "2.50x"], "a": 0, "why": "Quick ratio = (36 − 14) ÷ 20 = 22 ÷ 20 = 1.10x, which is above the 1:1 benchmark.", "eq": "Quick ratio = (Current assets − Inventory) ÷ Current liabilities"}, {"id": "CH2S1-CALC-027", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": true, "q": "A company has inventory of £6m, receivables of £9m, cash of £3m and current liabilities of £12m. What are
