growth, low inflation (NICE). Worst = high inflation, low growth (stagflation)."},{"id":"CH1-NC-061","sec":"pr","t":"4.4","tl":"4.4 Leases","calc":false,"q":"A 15-year commercial lease gives the tenant an option to break at year 5. How will a valuer usually treat it?","o":["Ignore it, because breaks are rarely used","Assume the tenant will exercise the break, which reduces the value","Treat it as positive for the landlord","Assume the rent doubles at year 5"],"a":1,"why":"A tenant's break is assumed to be exercised, so the secure income may last only 5 years, which reduces value. A landlord's break is positive, because it gives the chance to re-let at a higher rent or refurbish.","eq":"No calculation needed. Key rule: Tenant break = negative (assumed to be used). Landlord break = positive."},{"id":"CH1-NC-062","sec":"pr","t":"4.4","tl":"4.4 Tenure","calc":false,"q":"Which of the following statements about property tenure is correct?","o":["Commonhold applies only in England and Wales. Each unit is owned freehold, and the common areas are run by a Commonhold Association","Commonhold is the main form of tenure in Scotland","Commonhold flats have a landlord and a shrinking lease","Leasehold gives ownership in perpetuity"],"a":0,"why":"Commonhold is an alternative to leasehold for flats in England and Wales. There is no landlord and no shrinking lease, and the association is governed by a Commonhold Community Statement. Scotland uses 'outright ownership', which is similar to freehold.","eq":"No calculation needed. Key rule: Freehold = full rights. Leasehold = set period. Commonhold = freehold flats plus an association (England and Wales only)."},{"id":"CH1-NC-063","sec":"pr","t":"4.4","tl":"4.4 Conveyancing","calc":false,"q":"Which of the following statements about conveyancing are correct?\nI. The seller's conveyancer obtains the Land Registry entry and drafts the contract\nII. The buyer's solicitor carries out the searches\nIII. Before exchange, either party can withdraw with no penalty other than their costs\nIV. The contract becomes legally binding at completion","o":["I and IV only","I, II and III only","II, III and IV only","I, II, III and IV"],"a":1,"why":"Statements I to III are all correct. Statement IV is false: the contract becomes legally binding at exchange of contracts. Completion is when the money is paid and the keys are handed over.","eq":"No calculation needed. Key rule: Exchange = legally binding (the point of no return). Completion = money paid and keys handed over."},{"id":"CH1-NC-064","sec":"pr","t":"4.4","tl":"4.4 SDLT","calc":false,"q":"Which of the following transactions is NOT subject to SDLT?","o":["A purchase of a buy-to-let flat in Manchester","A purchase of a home in Belfast","A transfer of a home between spouses as part of a divorce","A purchase of a shop in Birmingham"],"a":2,"why":"SDLT applies in England and Northern Ireland, so Manchester, Belfast and Birmingham are all within scope. It is not charged on transfers made on divorce, or to charities for charitable use. (Wales uses LTT and Scotland uses LBTT.)","eq":"No calculation needed. Key rule: SDLT = England and NI. Wales = LTT. Scotland = LBTT. No SDLT on divorce transfers or on transfers to charities for charitable use."},{"id":"CH1-NC-065","sec":"pr","t":"4.7","tl":"4.7 Leasehold valuation","calc":false,"q":"Which of the following statements about leasehold valuation are correct?\nI. The value falls as the lease runs down\nII. Improvements made by the leaseholder are disregarded\nIII. Long leaseholders who stay on as assured tenants reduce the value, because the landlord does not get vacant possession\nIV. Extending the lease generally reduces its value","o":["I and IV only","I, II and III only","II, III and IV only","I, II, III and IV"],"a":1,"why":"Statements I to III are all correct. Statement IV is false: enfranchisement (extending the lease) generally raises the value, because a longer lease is worth more.","eq":"No calculation needed. Key rule: Longer lease = more value. Leaseholder improvements are ignored. Reversionary value = expected value at the end of the lease."},{"id":"CH1-NC-066","sec":"pr","t":"4.7","tl":"4.7 Property indices","calc":false,"q":"An adviser wants to compare investment trusts that invest in property. Which index group should they use?","o":["The Investment Association 'UK Direct Property' sector","The Nationwide House Price Index","The MSCI World index","The AIC property sectors"],"a":3,"why":"The AIC covers investment trusts and has 8 property sectors. The IA covers unit trusts, OEICs and ETFs. Nationwide measures UK house prices, and MSCI World is an equity index.","eq":"No calculation needed. Key rule: AIC = investment trusts (8 property sectors). IA = unit trusts, OEICs and ETFs. AREF = quarterly, collective schemes."},{"id":"CH1-NC-067","sec":"pr","t":"4.8","tl":"4.8 PAIFs and REITs","calc":false,"q":"Which of the following statements is correct?","o":["A PAIF must be listed on the Main Market, and a REIT must be an OEIC","A REIT must be dual-resident in the UK and another country","A PAIF must be an open-ended OEIC. A REIT is closed-ended and listed (AIM counts), and must not be a close company","A PAIF must distribute 90% of its profits, and a REIT has no distribution requirement"],"a":2,"why":"A PAIF has to be an OEIC, with 60% of its net income and 60% of its assets in property investment, and no corporate investor holding 10% or more. A REIT must be UK resident only, listed on a recognised exchange (AIM counts), not a close company, and must distribute 90% of profits.","eq":"No calculation needed. Key rule: PAIF = OEIC, 60/60/10. REIT = UK-only resident, listed, at least 100 holders, 75% of income from rent, 90% paid out, 75% of assets in property, no property over 40%, 1.25x interest cover."},{"id":"CH1-NC-068","sec":"pr","t":"4.8","tl":"4.8 Indirect property","calc":false,"q":"Which of the following statements about life assurance property bonds is correct?","o":["It is a fixed-interest bond that pays a regular coupon","Non-taxpayers can reclaim the tax paid within the fund","It is a life policy whose value is linked to the fund's NAV. The fund cannot borrow and can postpone encashments","The fund can borrow to boost returns, like a REIT"],"a":2,"why":"Despite the name, it is a life policy, not a bond. Tax is paid at 20% within the fund, which non-taxpayers cannot reclaim and higher-rate taxpayers must top up. Unlike a REIT, it cannot borrow.","eq":"No calculation needed. Key rule: Life property bond = a life policy, linked to NAV, cannot borrow, 20% tax in the fund that non-taxpayers can't reclaim."},{"id":"CH1-NC-069","sec":"pr","t":"4.12","tl":"4.12 Open vs closed-ended","calc":false,"q":"Which of the following statements about property funds are correct?\nI. An open-ended fund must suspend dealing if a valuer cannot value at least 20% of its assets\nII. An open-ended fund may switch from offer to bid pricing to protect remaining investors\nIII. LTAFs allow longer notice periods for redemptions\nIV. A closed-ended REIT must sell properties to meet redemptions","o":["I, II and III only","I and IV only","II, III and IV only","I, II, III and IV"],"a":0,"why":"Statements I to III are all correct. Statement IV is false: closed-ended vehicles never have to sell, because investors trade shares with each other, and illiquidity shows up as a wider discount instead.","eq":"No calculation needed. Key rule: FCA suspension trigger = 20% cannot be valued. Switching from offer to bid pricing protects remaining investors. LTAFs (2021) = longer notice periods."},{"id":"CH1-NC-070","sec":"pr","t":"4.9","tl":"4.9-4.12 Direct vs indirect","calc":false,"q":"Which of the following statements is correct?","o":["Tax reliefs are only available on direct property, and directly invested funds can only be managed actively","Tax reliefs are only available on indirect property","Directly invested funds can be managed passively","Passive indirect funds can hold buildings directly"],"a":0,"why":"Direct property may get tax reliefs, but indirect property does not. Directly invested funds are active only. Passive indirect funds can only hold listed shares.","eq":"No calculation needed. Key rule: Direct = large capital, illiquid, tax reliefs possible, active only. Indirect = smaller capital, more liquid, active or passive."},{"id":"CH1-NC-071","sec":"oa","t":"5.0","tl":"5.0 Alternatives","calc":false,"q":"Which of the following is NOT a common feature of alternative investments?","o":["They depend more on the specific item than on market trends","They are usually valued daily on an exchange","Redemption can be restricted","They have unique tax and legal rules"],"a":1,"why":"Alternatives are hard to value because there is usually no exchange price. The other three options are among the 8 common features: market reliance, hard to value, low correlation, low liquidity, less regulation, high costs, unique tax and legal rules, and restricted redemption.","eq":"No calculation needed. Key rule: 8 features: market reliance, hard to value, low correlation, low liquidity, less regulation, high costs, unique tax/legal rules, restricted redemption."},{"id":"CH1-NC-072","sec":"oa","t":"5.3","tl":"5.3 Gold","calc":false,"q":"Which of the following statements about gold are correct?\nI. Demand for gold tends to track fear\nII. Gold is intrinsically valuable and accepted worldwide\nIII. Bullion banks pay a dividend on gold held with them\nIV. Technology, such as its use in cars, can affect the price","o":["I, II and IV only","I and III only","II, III and IV only","I, II, III and IV"],"a":0,"why":"Statements I, II and IV are all correct. Statement III is false: gold pays no dividends, and banks may actually charge for holding it.","eq":"No calculation needed. Key rule: Gold = no income, demand tracks fear, attractive when inflation is high, currencies are weak and markets are falling."},{"id":"CH1-NC-073","sec":"oa","t":"5.3","tl":"5.3 Commodities","calc":false,"q":"A client has £20,000 and wants commodity exposure with a sensible spread of risk, without any chance of losing more than they invest. Which route is MOST suitable?","o":["Spread betting on a commodity index","Shares in a single mining company","Buying physical cocoa","A commodities or natural resources fund"],"a":3,"why":"A fund spreads risk across many holdings and losses are limited to the amount invested. Spread betting losses are unlimited and can exceed the stake. A single mining share gives a poor spread of risk unless the investor has a lot of capital. Cocoa is perishable and very volatile.","eq":"No calculation needed. Key rule: 3 routes into commodities: spread betting (unlimited losses), mining shares (poor spread), or a fund (best for most investors)."},{"id":"CH1-NC-074","sec":"oa","t":"5.4","tl":"5.4 Land","calc":false,"q":"Which method of investing in land is MOST likely to produce a large rise in value without selling the land?","o":["Renting it to farmers","Keeping the freehold to receive ground rents","Listing it on a stock exchange","Obtaining planning permission"],"a":3,"why":"Buying land and obtaining planning permission can sharply raise its value. Renting to farmers and collecting ground rents produce income rather than a step change in capital value. Land cannot be listed on an exchange.","eq":"No calculation needed. Key rule: 4 ways into land: rent to farmers, obtain planning permission, sell to a developer, keep the freehold for ground rents."},{"id":"CH1-NC-075","sec":"oa","t":"5.5","tl":"5.5 Crypto","calc":false,"q":"Bitcoin mining uses vast amounts of electricity, which limits how efficiently the network can grow. Which crypto risk is this?","o":["Scalability","Volatility","Not being reserve-backed","Decentralisation"],"a":0,"why":"Scalability is the risk that energy-hungry mining limits the network's growth. The 6 crypto risks are volatility, decentralisation, being unregulated, not being reserve-backed, scalability, and human error or hacking.","eq":"No calculation needed. Key rule: 6 crypto risks: volatility, decentralised, unregulated, not reserve-backed, scalability, hacking/human error."},{"id":"CH1-NC-076","sec":"oa","t":"5.5","tl":"5.5 Crypto regulation","calc":false,"q":"Which of the following statements about crypto regulation is correct?","o":["Crypto exchanges are banned in Japan","In April 2025 the UK published draft law to bring crypto inside the FCA's regulatory perimeter, and in May 2025 the FCA published DP25/1","UK crypto wallet providers do not need to register with the FCA","China regulates crypto exchanges by requiring them to register with its FSA"],"a":1,"why":"Both 2025 milestones are correct. In Japan, crypto exchanges register with the FSA. UK wallet providers must register with the FCA and follow 5MLD. China (and Saudi Arabia) ban crypto.","eq":"No calculation needed. Key rule: UK = FCA registration and 5MLD, retail promotions restricted, draft law April 2025, DP25/1 May 2025. Japan = FSA registration. China and Saudi Arabia = banned."},{"id":"CH1-NC-077","sec":"oa","t":"5.5","tl":"5.5 NFTs","calc":false,"q":"Which of the following statements about NFT risks are correct?\nI. The seller may not actually own the underlying asset\nII. NFTs have a clear legal definition\nIII. NFTs are unregulated and not protected by the FSCS\nIV. NFTs are hard to value","o":["I and II only","II, III and IV only","I, II, III and IV","I, III and IV only"],"a":3,"why":"Statements I, III and IV are all correct. Statement II is false: one of the listed NFT risks is that there is no legal definition. NFTs also give no copyright or IP rights.","eq":"No calculation needed. Key rule: NFT = unique token, proof of ownership only, no copyright. Risks: theft, fakes, seller may not own it, unregulated, hard to value, no legal definition."},{"id":"CH1-NC-078","sec":"oa","t":"5.6","tl":"5.6 Liquidity","calc":false,"q":"Compared with traditional alternatives such as art or wine, which risk is particular to liquid alternatives?","o":["They can only be sold through an auction house","They usually have hedge fund-style lock-ins of 1 to 3 years","They require specialist storage and insurance","They can carry opaque, unique risks and may close in volatile markets, even though they offer daily dealing"],"a":3,"why":"Liquid alts are funds that use alternative strategies and deal daily, but their risks can be opaque and they may close when markets are volatile. Lock-ins are a hedge fund feature, and storage and insurance costs apply to physical assets.","eq":"No calculation needed. Key rule: Traditional alts = known illiquidity. Liquid alts = daily dealing, but opaque risks and may close in volatile markets."},{"id":"CH1-NC-079","sec":"oa","t":"5.8","tl":"5.8 Valuation","calc":false,"q":"A young private company has no profits yet, but its long-term contracts give reliable, forecastable cash flows. Which valuation method is MOST appropriate?","o":["The P/E method","The asset value method","Gross rent multiplier","Discounted cash flow"],"a":3,"why":"DCF discounts future cash flows back to today, allowing for the time value of money and risk, and it works well when forecasts are reliable. P/E needs earnings, which this company doesn't have yet. The asset value method ignores future earnings, and GRM is a property measure.","eq":"No calculation needed. Key rule: Asset value = ignores future earnings. P/E = most widely used, but needs a comparable company. DCF = time value and risk, but subjective if forecasts are weak."},{"id":"CH1-NC-080","sec":"oa","t":"5.9","tl":"5.9 The 60/40 portfolio","calc":false,"q":"Which of the following statements about the 60/40 portfolio are correct?\nI. It relies on bonds rising when equities fall\nII. In 2023, equity and bond correlation was the strongest in decades\nIII. This pushed investors towards alternatives\nIV. It means 60% bonds and 40% equities","o":["I and IV only","I, II and III only","II, III and IV only","I, II, III and IV"],"a":1,"why":"Statements I to III are all correct. Statement IV is false: 60/40 means 60% equities and 40% bonds.","eq":"No calculation needed. Key rule: 60/40 = 60% equities, 40% bonds. It normally works because central banks cut rates when the economy weakens. In 2023 bonds and equities moved in lockstep."},{"id":"CH1-CALC-001","sec":"cash","t":"1.2","tl":"1.2 Compounding","calc":true,"q":"A client deposits £40,000 at 4.4% a year, with interest paid monthly and left in the account. What will the account be worth after 3 years?","o":["£45,280.00","£45,515.73","£45,633.32","£45,611.45"],"a":2,"why":"T = 40,000 × (1 + 0.044/12)^(12×3) = 40,000 × (1.0036667)^36 = £45,633.32. The distractors use simple interest (£45,280.00), annual compounding (£45,515.73) and quarterly compounding (£45,611.45).","eq":"T = C × (1 + I/N)^(N×Y), where C = capital, I = annual rate as a decimal, N = payments per year, Y = years."},{"id":"CH1-CALC-002","sec":"cash","t":"1.2","tl":"1.2 AER","calc":true,"q":"An account pays a nominal rate of 5.2% a year, with interest credited monthly. What is the AER?","o":["5.20%","5.30%","5.33%","5.27%"],"a":2,"why":"AER = (1 + 0.052/12)^12 − 1 = 5.33%. The other options are the nominal rate, the quarterly AER and the half-yearly AER. Monthly crediting gives the highest AER.","eq":"AER = (1 + I/N)^N − 1"},{"id":"CH1-CALC-003","sec":"cash","t":"1.2","tl":"1.2 AER","calc":true,"q":"Account X pays 4.90% with interest paid annually. Account Y pays 4.80% with interest paid monthly. Assuming interest is left in both accounts, which pays more?","o":["Account Y, by about 0.01% a year","Account X, by 0.10% a year","They pay exactly the same","Account X, by about 0.01% a year"],"a":0,"why":"X pays annually, so its AER equals its nominal rate of 4.90%. Y's AER = (1 + 0.048/12)^12 − 1 = 4.907%. So Y is ahead by about 0.007%, roughly 0.01%. You must compare AERs, not headline rates.","eq":"AER = (1 + I/N)^N − 1. Annual payment means AER = nominal rate."},{"id":"CH1-CALC-004","sec":"cash","t":"1.2","tl":"1.2 Compounding","calc":true,"q":"£25,000 is deposited for one year at 6%. How much MORE interest is earned if interest is paid quarterly (and left in) rather than annually?","o":["£0.00","£375.00","£34.09","£1,534.09"],"a":2,"why":"Quarterly: 25,000 × (1.015)^4 = £26,534.09. Annual: 25,000 × 1.06 = £26,500.00. The difference is £34.09, which is purely interest earned on interest.","eq":"T = C × (1 + I/N)^(N×Y). Extra interest = T(quarterly) − T(annual)."},{"id":"CH1-CALC-005","sec":"cash","t":"1.2","tl":"1.2 Real returns","calc":true,"q":"A deposit pays a nominal 3.75% while inflation is 4.60%. Using the Fisher equation, what is the real return?","o":["+0.85%","+8.35%","-0.85%","-4.60%"],"a":2,"why":"Real return = 3.75% − 4.60% = −0.85%. The return is negative, so the saver's purchasing power is falling even though their nominal balance is growing.","eq":"Real return = Nominal rate − Inflation (Fisher equation)"},{"id":"CH1-CALC-006","sec":"cash","t":"1.2","tl":"1.2 Requirement-linked accounts","calc":true,"q":"A linked saver pays 7% on £15,000. To qualify, the client must keep £5,000 in a current account paying 0.5%. What is the effective rate on the client's total cash?","o":["7.00%","5.25%","6.50%","5.38%"],"a":3,"why":"Interest = (15,000 × 7%) + (5,000 × 0.5%) = £1,050 + £25 = £1,075. Total cash = £20,000. Effective rate = 1,075 ÷ 20,000 = 5.38%. The headline 7% overstates the real return.","eq":"Effective rate = Total interest from both accounts ÷ Total cash held"},{"id":"CH1-CALC-007","sec":"cash","t":"1.2","tl":"1.2 Bid, offer and margin","calc":true,"q":"A bank lends at 7.90% and wants a margin of 3.75%. What rate can it pay savers?","o":["11.65%","3.75%","7.90%","4.15%"],"a":3,"why":"Margin = offer − bid, so bid = offer − margin = 7.90% − 3.75% = 4.15%. The bid rate is paid to savers and the offer rate is charged to borrowers.","eq":"Margin = Offer rate − Bid rate, so Bid = Offer − Margin"},{"id":"CH1-CALC-008","sec":"cash","t":"1.7","tl":"1.7 FSCS","calc":true,"q":"A client holds £120,000 in a sole account at Bank A, plus a £150,000 joint account with their spouse at Bank A. They also hold £60,000 at Bank B, which shares Bank A's banking licence. All the accounts are eligible. What is the CLIENT'S maximum FSCS compensation if the group fails?","o":["£85,000","£170,000","£255,000","£160,000"],"a":0,"why":"The client's share of the joint account is £75,000. Their total exposure to the one licence is £120,000 + £75,000 + £60,000 = £255,000. FSCS cover is £85,000 per person per authorised firm, and brands sharing a licence count as one firm, so the client receives £85,000.","eq":"FSCS = £85,000 per person per authorised firm (licence). Joint accounts = £85,000 per holder (£170,000 for two). Sole and joint balances at the same firm are combined."},{"id":"CH1-CALC-009","sec":"cash","t":"1.7","tl":"1.7 FSCS","calc":true,"q":"A client holds £100,000 at Bank A, £70,000 at Bank B and £30,000 at Bank C. Bank B and Bank C share a banking licence, and all three banks fail. What is the client's total FSCS compensation?","o":["£170,000","£185,000","£200,000","£155,000"],"a":0,"why":"Bank A: £100,000 is capped at £85,000. Banks B and C are one licence, so £70,000 + £30,000 = £100,000, which is also capped at £85,000. The total is £170,000.","eq":"Each licence: min(total deposits, £85,000). Add across licences."},{"id":"CH1-CALC-010","sec":"cash","t":"1.12","tl":"1.12 FX","calc":true,"q":"EUR/USD is quoted at 1.0845/1.0865. A client wants to BUY €250,000. How many US dollars will they pay?","o":["$271,125.00","$230,096.64","$271,625.00","$230,520.98"],"a":2,"why":"EUR is the base currency. Buying the base means dealing at the higher offer price of 1.0865. The client holds the base amount (euros), so multiply: 250,000 × 1.0865 = $271,625.00.","eq":"Buy base = offer (higher). Sell base = bid (lower). Holding the base amount: multiply. Holding the counter amount: divide."},{"id":"CH1-CALC-011","sec":"cash","t":"1.12","tl":"1.12 FX","calc":true,"q":"GBP/USD is quoted at 1.3120/1.3150. A client converts $500,000 into sterling. How much will they receive?","o":["£381,097.56","£380,228.14","£656,000.00","£657,500.00"],"a":1,"why":"The client is buying GBP (the base currency), so they deal at the offer of 1.3150, the worse rate for them. They hold dollars (the counter currency), so divide: 500,000 ÷ 1.3150 = £380,228.14.","eq":"Buy base = offer. Holding the counter currency: amount ÷ rate."},{"id":"CH1-CALC-012","sec":"cash","t":"1.12","tl":"1.12 FX","calc":true,"q":"GBP/USD is quoted at 1.2600/1.2640. A client buys £100,000 and immediately sells it back. What is the cost of the spread?","o":["$40","$400","$4,000","$0"],"a":1,"why":"The client buys at 1.2640, paying $126,400, and sells at 1.2600, receiving $126,000. The cost is $400, which equals the 0.0040 spread × £100,000.","eq":"Spread = Offer − Bid. Round-trip cost = Spread × Base amount."},{"id":"CH1-CALC-013","sec":"cash","t":"1.8","tl":"1.8 Foreign currency deposits","calc":true,"q":"A UK investor converts £20,000 into Australian dollars at GBP/AUD 1.9000 and deposits them for one year at 6%. At the end of the year they convert back at 2.0500. How much sterling do they receive? (Ignore spreads.)","o":["£19,648.78","£21,200.00","£18,536.59","£20,000.00"],"a":0,"why":"£20,000 × 1.90 = A$38,000. With 6% interest that becomes A$38,000 × 1.06 = A$40,280.00. Converting back: A$40,280.00 ÷ 2.05 = £19,648.78. Sterling strengthened, which wiped out the extra interest. That is the main risk of holding a foreign currency deposit for investment reasons.","eq":"Sterling result = (£ × opening rate × (1 + interest)) ÷ closing rate"},{"id":"CH1-CALC-014","sec":"cash","t":"1.8","tl":"1.8 Foreign currency deposits","calc":true,"q":"Sterling deposits pay 3% and US dollar deposits pay 5%. GBP/USD is currently 1.2500. At what GBP/USD rate in one year's time would a UK investor be no better or worse off holding dollars instead of sterling?","o":["1.2743","1.2262","1.2500","1.3125"],"a":0,"why":"£1 in sterling grows to £1.03. Converted to dollars, £1 = $1.25, which grows to $1.25 × 1.05 = $1.3125. Break-even is where $1.3125 ÷ rate = £1.03, so rate = 1.3125 ÷ 1.03 = 1.2743. If sterling ends stronger than that, holding dollars loses out.","eq":"Break-even rate = Opening rate × (1 + foreign rate) ÷ (1 + home rate)"},{"id":"CH1-CALC-015","sec":"cash","t":"1.2","tl":"1.2 Compounding","calc":true,"q":"A client needs £50,000 in 5 years' time. An account pays 4% a year, compounded annually. How much must they deposit today?","o":["£41,666.67","£41,096.36","£40,768.63","£40,000.00"],"a":1,"why":"Rearrange T = C × (1 + I)^Y to get C = T ÷ (1 + I)^Y = 50,000 ÷ 1.04^5 = 50,000 ÷ 1.216653 = £41,096.36.","eq":"C = T ÷ (1 + I/N)^(N×Y)"},{"id":"CH1-CALC-016","sec":"cash","t":"1.10","tl":"1.10 Money market instruments","calc":true,"q":"A 91-day Treasury bill is bought at £98.80 and repaid at £100 at maturity. What is the return over the 91 days?","o":["1.21%","1.20%","4.87%","0.00%"],"a":0,"why":"Money market instruments pay no interest. The return is the gap between the price paid and face value: (100 − 98.80) ÷ 98.80 = 1.21%. Dividing by £100 instead of the £98.80 actually paid gives 1.20%, which is wrong. 4.87% is the annualised figure, not the 91-day return.","eq":"Return = (Face value − Price paid) ÷ Price paid"},{"id":"CH1-CALC-017","sec":"fi","t":"2.8","tl":"2.8 Running yield","calc":true,"q":"A 4.25% gilt is trading at £106.40. What is its running yield?","o":["3.99%","4.25%","4.52%","3.61%"],"a":0,"why":"Running yield = 4.25 ÷ 106.40 = 3.99%. The bond is above par, so the running yield is below the coupon.","eq":"Running yield = Gross coupon ÷ Market price × 100"},{"id":"CH1-CALC-018","sec":"fi","t":"2.8","tl":"2.8 GRY","calc":true,"q":"A 2.5% gilt is trading at £88 with exactly 8 years to redemption. Using the approximation method, what is its GRY?","o":["1.14%","2.84%","4.00%","4.55%"],"a":3,"why":"Running yield = 2.5 ÷ 88 = 2.841%. HPR = (100 − 88) ÷ 88 = 13.636%. Annualised = 13.636% ÷ 8 = 1.705%. The bond is below par, so ADD the gain: GRY ≈ 2.841% + 1.705% = 4.545%, or about 4.55%.","eq":"Approx GRY = Running yield + Annualised capital gain/loss. HPR = (100 − Price) ÷ Price. Annualised = HPR ÷ Years."},{"id":"CH1-CALC-019","sec":"fi","t":"2.8","tl":"2.8 GRY","calc":true,"q":"A 6% bond is trading at £112 with exactly 5 years to redemption. Using the approximation method, what is its GRY?","o":["3.21%","7.50%","5.36%","3.60%"],"a":0,"why":"Running yield = 6 ÷ 112 = 5.36%. HPR = (100 − 112) ÷ 112 = -10.71%. Annualised = -2.14%. The bond is above par, so SUBTRACT the loss: GRY ≈ 5.36% − 2.14% = 3.21%. For a bond above par, the GRY is below the running yield.","eq":"Approx GRY = Running yield + Annualised capital gain/loss (the loss is negative for bonds above par)"},{"id":"CH1-CALC-020","sec":"fi","t":"2.8","tl":"2.8 Duration","calc":true,"q":"A bond has a Macaulay duration of 11.2 years and a GRY of 4.5%. What is its modified duration?","o":["11.20","11.70","2.49","10.72"],"a":3,"why":"Modified duration = 11.2 ÷ 1.045 = 10.72. Divide by (1 + GRY as a decimal), not by the GRY itself.","eq":"Modified duration = Macaulay duration ÷ (1 + GRY)"},{"id":"CH1-CALC-021","sec":"fi","t":"2.8","tl":"2.8 Duration","calc":true,"q":"A bond has a Macaulay duration of 7.35 years and a GRY of 5%. Yields RISE by 0.75%. What is the approximate percentage change in its price?","o":["5.25%","-5.51%","-5.25%","5.51%"],"a":2,"why":"Modified duration = 7.35 ÷ 1.05 = 7.00. Price change = −7.00 × 0.75 = -5.25%. Yields up means prices down.","eq":"% price change = −Modified duration × % change in yield"},{"id":"CH1-CALC-022","sec":"fi","t":"2.8","tl":"2.8 Duration","calc":true,"q":"A bond is priced at £96.50 and has a modified duration of 6.2. Yields FALL by 0.4%. What is the approximate new price?","o":["£98.89","£94.11","£98.98","£96.90"],"a":0,"why":"% change = −6.2 × (−0.4) = +2.48%. New price = 96.50 × 1.0248 = £98.89. Adding 2.48 as pounds (giving £98.98) is wrong, because duration gives a PERCENTAGE change.","eq":"% price change = −MD × Δyield. New price = Old price × (1 + % change)"},{"id":"CH1-CALC-023","sec":"fi","t":"2.8","tl":"2.8 Duration","calc":true,"q":"A 15-year zero coupon bond has a GRY of 3.5%. What is its modified duration?","o":["15.00","15.52","14.49","14.00"],"a":2,"why":"The Macaulay duration of a ZCB equals its maturity, so 15. Modified duration = 15 ÷ 1.035 = 14.49.","eq":"ZCB Macaulay duration = Maturity. Modified duration = Macaulay ÷ (1 + GRY)"},{"id":"CH1-CALC-024","sec":"fi","t":"2.8","tl":"2.8 Duration","calc":true,"q":"A 10-year zero coupon bond has a GRY of 4%. Yields rise by 0.5%. What is the approximate percentage change in its price?","o":["-5.00%","4.81%","-5.20%","-4.81%"],"a":3,"why":"Macaulay duration = 10 (equal to maturity). MD = 10 ÷ 1.04 = 9.615. Change = −9.615 × 0.5 = -4.81%. −5.00% wrongly uses the Macaulay duration.","eq":"ZCB Macaulay = maturity. MD = Macaulay ÷ (1 + GRY). % change = −MD × Δyield"},{"id":"CH1-CALC-025","sec":"fi","t":"2.10","tl":"2.10 Accrued interest","calc":true,"q":"A 3.5% gilt pays coupons half-yearly. At settlement, 64 days have passed since the last coupon, and the coupon period is 181 days. What is the accrued interest per £100 nominal?","o":["£1.24","£0.62","£1.13","£0.31"],"a":1,"why":"Each coupon = 3.5 ÷ 2 = £1.75. Accrued interest = 1.75 × 64/181 = £0.62. Using the full annual coupon, or the days remaining instead of days elapsed, gives the wrong answer.","eq":"Accrued interest = Coupon payment × (Days since last payment ÷ Days in coupon period)"},{"id":"CH1-CALC-026","sec":"fi","t":"2.10","tl":"2.10 Dirty price","calc":true,"q":"An investor buys £50,000 nominal of a gilt cum-dividend at a clean price of £102.30. Accrued interest is £0.62 per £100 nominal. What is the total cost, ignoring dealing costs?","o":["£51,150.00","£50,840.00","£51,460.00","£51,770.00"],"a":2,"why":"Dirty price = 102.30 + 0.62 = £102.92 per £100. £50,000 nominal = 500 lots of £100, so the cost is 500 × 102.92 = £51,460.00. Cum-div means the accrued interest is ADDED.","eq":"Dirty price = Clean price + Accrued interest. Total = Dirty price × (Nominal ÷ 100)"},{"id":"CH1-CALC-027","sec":"fi","t":"2.10","tl":"2.10 Ex-dividend","calc":true,"q":"An investor buys £100,000 nominal of a 4% gilt (paid half-yearly) ex-dividend, at a clean price of £97.40. Settlement is 5 days before the next coupon date, and the coupon period is 182 days. What is the total cost?","o":["£97,345.05","£97,454.95","£97,400.00","£95,400.00"],"a":0,"why":"Each coupon = £2.00. The seller keeps the next coupon, so the buyer deducts interest for the 5 days after settlement: 2.00 × 5/182 = £0.0549 per £100. Price = 97.40 − 0.0549 = 97.3451. × 1,000 lots = £97,345.05.","eq":"Ex-div: Interest deducted = Coupon × (Days from settlement to next payment ÷ Days in period)"},{"id":"CH1-CALC-028","sec":"fi","t":"2.1","tl":"2.1 Coupons","calc":true,"q":"An investor holds £25,000 nominal of a 5.25% corporate bond paying half-yearly, and has chosen 20% withholding tax. What net amount do they receive on each payment date?","o":["£1,050.00","£525.00","£656.25","£1,312.50"],"a":1,"why":"Annual gross coupon = 25,000 × 5.25% = £1,312.50. Half-yearly gross = £656.25. Net of 20% = 656.25 × 0.8 = £525.00. £1,050 is the ANNUAL net figure.","eq":"Payment = Nominal × Coupon ÷ Payments per year. Net = Gross × (1 − 0.20)"},{"id":"CH1-CALC-029","sec":"fi","t":"2.1","tl":"2.1 FRNs","calc":true,"q":"An FRN pays SONIA + 85 basis points, with a cap of 5.25%. SONIA rises to 4.70%. What coupon does the FRN pay for the next period?","o":["5.55%","4.70%","5.25%","13.20%"],"a":2,"why":"SONIA + margin = 4.70% + 0.85% = 5.55%. That exceeds the 5.25% cap, so the coupon is limited to 5.25%. One basis point = 0.01%.","eq":"FRN coupon = Reference rate + Quoted margin (1bp = 0.01%), limited by any cap or floor"},{"id":"CH1-CALC-030","sec":"fi","t":"2.3","tl":"2.3 Convertibles","calc":true,"q":"A convertible bond trades at £118 per £100 nominal and converts into 32 shares. The shares trade at £3.40. What is the conversion premium as a percentage of the share price?","o":["8.46%","7.80%","18.00%","-8.09%"],"a":0,"why":"Conversion price = 118 ÷ 32 = £3.6875. Premium = (3.6875 − 3.40) ÷ 3.40 = 8.46%. Divide by the share price, not the conversion price. The price paid for the bond (£118) must be used, not its nominal value.","eq":"Conversion price = Market price per £100 nominal ÷ Shares received. Premium = (Conversion price − Share price) ÷ Share price"},{"id":"CH1-CALC-031","sec":"fi","t":"2.8","tl":"2.8 Capital returns","calc":true,"q":"A bond is bought at £92 and redeemed at par in 4 years. What is its annualised capital gain?","o":["2.00%","8.70%","2.17%","8.00%"],"a":2,"why":"HPR = (100 − 92) ÷ 92 = 8.70%. Annualised = 8.70% ÷ 4 = 2.17%. Dividing the gain by £100 rather than the £92 paid gives 2.00%, which is wrong.","eq":"HPR = (Redemption − Purchase price) ÷ Purchase price. Annualised = HPR ÷ Years"},{"id":"CH1-CALC-032","sec":"fi","t":"2.8","tl":"2.8 Net redemption yield","calc":true,"q":"A 6% gilt is trading at £95 with 5 years to redemption. Using the approximation method, what is its net redemption yield for a 40% taxpayer?","o":["4.42%","7.37%","4.84%","3.79%"],"a":2,"why":"Running yield = 6 ÷ 95 = 6.32%. Net of 40% = 3.79%. Annualised gain = (5 ÷ 95) ÷ 5 = 1.05%, which is not taxed because gilts are CGT exempt. NRY ≈ 3.79% + 1.05% = 4.84%. Taxing the whole GRY is the classic mistake.","eq":"NRY = (Running yield × (1 − tax rate)) + Annualised capital gain. Only the income part is taxed."},{"id":"CH1-CALC-033","sec":"fi","t":"2.2","tl":"2.2 Government borrowing","calc":true,"q":"In a year, the CGNCR is £120bn, the LGNCR is £8bn and the PCNCR is -£3bn. What is the PSNCR, and how much of it do gilts fund?","o":["PSNCR £131bn; gilts fund £120bn","PSNCR £125bn; gilts fund £120bn","PSNCR £125bn; gilts fund £125bn","PSNCR £128bn; gilts fund £128bn"],"a":1,"why":"PSNCR = 120 + 8 + (−3) = £125bn. Gilts fund only the central government requirement (the CGNCR), which is £120bn. Adding the −£3bn as +£3bn gives £131bn, which is wrong.","eq":"PSNCR = CGNCR + LGNCR + PCNCR. Gilts fund the CGNCR only."},{"id":"CH1-CALC-034","sec":"fi","t":"2.10","tl":"2.10 Costs","calc":true,"q":"A gilt is quoted at £101.20 to £101.45. An investor buys £250,000 nominal and sells it again the same day at the same quote. What is the cost of the spread?","o":["£625","£62.50","£6,250","£2,500"],"a":0,"why":"Spread = 101.45 − 101.20 = £0.25 per £100 nominal. £250,000 nominal = 2,500 lots of £100, so the cost is 2,500 × 0.25 = £625.","eq":"Spread cost = (Offer − Bid) × (Nominal ÷ 100)"},{"id":"CH1-CALC-035","sec":"fi","t":"2.8","tl":"2.8 Duration","calc":true,"q":"Bond X has a modified duration of 8.2. Bond Y has a Macaulay duration of 9.0 and a GRY of 6%. Yields on both rise by 1%. Which bond falls more?","o":["Bond Y, by 9.00% vs 8.20% for Bond X","Bond X, by 8.20% vs 8.49% for Bond Y","They fall by the same amount","Bond Y, by about 8.49% vs 8.20% for Bond X"],"a":3,"why":"Bond Y's MD = 9.0 ÷ 1.06 = 8.49. A 1% rise in yields gives about −8.49% for Y and −8.20% for X, so Y falls more. Comparing Y's Macaulay duration (9.0) with X's modified duration mixes two different measures.","eq":"MD = Macaulay ÷ (1 + GRY). % change = −MD × Δyield"},{"id":"CH1-CALC-036","sec":"fi","t":"2.8","tl":"2.8 GRY","calc":true,"q":"A zero coupon bond is trading at £74 with 6 years to redemption. Using the approximation method, what is its GRY?","o":["4.33%","35.14%","0.00%","5.86%"],"a":3,"why":"A ZCB has no coupon, so its running yield is 0%. HPR = 26 ÷ 74 = 35.14%. Annualised = 5.86%. GRY ≈ 0% + 5.86% = 5.86%. (The approximation overstates the true compound yield, which is about 5.15%.)","eq":"Approx GRY = Running yield (0 for a ZCB) + HPR ÷ Years"},{"id":"CH1-CALC-037","sec":"fi","t":"2.9","tl":"2.9 Credit risk","calc":true,"q":"A corporate bond has a modified duration of 6.0. After a downgrade, its yield spread over gilts widens by 1.20%, while gilt yields stay the same. What is the approximate change in its price?","o":["+7.20%","-1.20%","-0.72%","-7.20%"],"a":3,"why":"The bond's yield rises by the 1.20% spread widening. Price change = −6.0 × 1.20 = −7.20%. A downgrade means the price falls and the yield rises.","eq":"% price change = −MD × Δyield (here Δyield = change in spread)"},{"id":"CH1-CALC-038","sec":"fi","t":"2.3","tl":"2.3 Convertibles","calc":true,"q":"An investor holds £10,000 nominal of a convertible that converts at 25 shares per £100 nominal. The bond trades at £112 and the shares at £4.60. What is the value of the shares received on conversion, and is converting worthwhile?","o":["£11,200 of shares vs bonds worth £11,500: converting is not worthwhile","£11,500 of shares vs bonds worth £11,200: converting is worthwhile","£2,500 of shares: converting is not worthwhile","£11,500 of shares vs bonds worth £11,500: there is no difference"],"a":1,"why":"Shares received = (10,000 ÷ 100) × 25 = 2,500. Conversion value = 2,500 × £4.60 = £11,500. Bond value = 100 × £112 = £11,200. The shares are worth more, so converting is worthwhile. Equivalently, the conversion price of 112 ÷ 25 = £4.48 is below the £4.60 share price.","eq":"Shares = (Nominal ÷ 100) × Ratio. Conversion value = Shares × Share price. Conversion price = Bond price ÷ Ratio"},{"id":"CH1-CALC-039","sec":"eq","t":"3.2","tl":"3.2 Shareholders' funds","calc":true,"q":"A company has issued 20 million ordinary shares of 10p. It has a share premium account of £6m and retained profits of £14m, and its shares trade at £3.00. What are its shareholders' funds?","o":["£22m","£2m","£60m","£20m"],"a":0,"why":"Share capital = 20m × 10p = £2m. Shareholders' funds = share capital + reserves + retained profits = £2m + £6m + £14m = £22m. £60m is the market capitalisation (20m × £3), which is a different measure.","eq":"Share capital = Par value × Shares issued. Shareholders' funds = Share capital + Reserves + Retained profits (= Assets − Liabilities)"},{"id":"CH1-CALC-040","sec":"eq","t":"3.5","tl":"3.5 Bonus issues","calc":true,"q":"A client holds 2,400 shares, and the company makes a 3-for-5 bonus issue. How many shares will the client hold afterwards?","o":["1,440","4,000","6,000","3,840"],"a":3,"why":"3-for-5 means 3 new shares for every 5 held. 2,400 ÷ 5 = 480 lots, × 3 = 1,440 new shares. Total = 2,400 + 1,440 = 3,840. 1,440 is only the new shares.","eq":"New shares = Holding ÷ Y × X (for an X-for-Y issue). Total = Holding + New shares"},{"id":"CH1-CALC-041","sec":"eq","t":"3.5","tl":"3.5 Bonus issues","calc":true,"q":"Before a 3-for-5 bonus issue, a company's shares trade at 640p. What is the theoretical share price afterwards?","o":["384p","400p","256p","640p"],"a":1,"why":"A block of 5 shares becomes 8. The block's value is 5 × 640p = 3,200p, which is spread over 8 shares: 3,200 ÷ 8 = 400p. No new money comes in, so the total value is unchanged.","eq":"Ex-bonus price = (Y × Old price) ÷ (X + Y)"},{"id":"CH1-CALC-042","sec":"eq","t":"3.5","tl":"3.5 Bonus issues","calc":true,"q":"A company has 4 million 50p shares (share capital £2m) and a share premium account of £1.5m. It makes a 1-for-2 bonus issue funded from the share premium account. What is the result?","o":["Share capital £3m, share premium £0.5m, net worth unchanged","Share capital £3m, share premium £1.5m, net worth up £1m","Share capital £2m, share premium £0.5m, net worth down £1m","Share capital £4m, share premium £0m, net worth up £0.5m"],"a":0,"why":"1-for-2 on 4m shares = 2m new shares × 50p = £1m. Share capital rises from £2m to £3m, and the share premium account falls from £1.5m to £0.5m. Reserves have simply been turned into capital, so net worth is unchanged.","eq":"New capital = New shares × Nominal value. That amount moves from reserves to share capital, and net worth is unchanged."},{"id":"CH1-CALC-043","sec":"eq","t":"3.5","tl":"3.5 Rights issues","calc":true,"q":"A shareholder holds 1,200 shares trading at 860p. The company announces a 2-for-5 rights issue at 650p. What is the TERP?","o":["755p","800p","710p","860p"],"a":1,"why":"Use a block of 5 old shares plus 2 new: (5 × 860 + 2 × 650) ÷ 7 = (4,300 + 1,300) ÷ 7 = 800p. The simple average (755p) ignores the weighting, and 710p reverses the weights.","eq":"TERP = (Old shares × Old price + New shares × Rights price) ÷ Total shares"},{"id":"CH1-CALC-044","sec":"eq","t":"3.5","tl":"3.5 Rights issues","calc":true,"q":"Using the same rights issue (TERP 800p, rights price 650p), what is the theoretical value of one nil-paid right?","o":["210p","60p","150p","800p"],"a":2,"why":"Value of a nil-paid right = TERP − subscription price = 800 − 650 = 150p. The right lets the holder buy a share worth 800p for 650p.","eq":"Value of a nil-paid right = TERP − Rights (subscription) price"},{"id":"CH1-CALC-045","sec":"eq","t":"3.5","tl":"3.5 Rights issues","calc":true,"q":"A shareholder with 1,200 shares takes up their full entitlement under a 2-for-5 rights issue at 650p. How much do they pay?","o":["£7,800","£3,120","£3,840","£1,560"],"a":1,"why":"New shares = 1,200 ÷ 5 × 2 = 480. Cost = 480 × £6.50 = £3,120. £7,800 wrongly prices all 1,200 shares at 650p.","eq":"Rights cost = (Holding ÷ Y × X) × Rights price"},{"id":"CH1-CALC-046","sec":"eq","t":"3.5","tl":"3.5 Share splits","calc":true,"q":"A company with £1 nominal shares trading at 1,250p makes a 5-for-1 share split, so each share becomes 5. What are the theoretical share price and nominal value afterwards?","o":["250p; £1 nominal","1,250p; 20p nominal","6,250p; £5 nominal","250p; 20p nominal"],"a":3,"why":"Each share becomes 5, so the price is 1,250 ÷ 5 = 250p and the nominal value is £1 ÷ 5 = 20p. Total nominal capital is unchanged and no reserves are converted.","eq":"Split: New price = Old price ÷ Split factor. New nominal = Old nominal ÷ Split factor"},{"id":"CH1-CALC-047","sec":"eq","t":"3.6","tl":"3.6 Market capitalisation","calc":true,"q":"A company has 85 million shares in issue, trading at £4.36. What is its market capitalisation?","o":["£370.6m","£37.1m","£89.36m","£19.50m"],"a":0,"why":"Market cap = 85m × £4.36 = £370.6m.","eq":"Market cap = Shares in issue × Share price"},{"id":"CH1-CALC-048","sec":"eq","t":"3.6","tl":"3.6 Gordon Growth Model","calc":true,"q":"A company has JUST paid a dividend of 40p. Dividends are expected to grow at 4% a year, and investors require a 10% return. Using the Gordon Growth Model, what is the share worth?","o":["666.67p","693.33p","400.00p","1040.00p"],"a":1,"why":"The model needs the NEXT dividend: 40 × 1.04 = 41.6p. Value = 41.6 ÷ (0.10 − 0.04) = 693.33p. Using the 40p already paid gives 666.67p, which is the trap.","eq":"Share price = Next dividend ÷ (Required return − Growth). Next dividend = Current dividend × (1 + g)"},{"id":"CH1-CALC-049","sec":"eq","t":"3.6","tl":"3.6 Gordon Growth Model","calc":true,"q":"A share trades at 500p. Its next dividend is expected to be 25p, and dividends are expected to grow at 3% a year. What return does the market require?","o":["5.00%","2.00%","3.00%","8.00%"],"a":3,"why":"Rearrange P = D ÷ (r − g) to get r = D ÷ P + g = 25 ÷ 500 + 3% = 5% + 3% = 8%.","eq":"Required return = Next dividend ÷ Price + Growth"},{"id":"CH1-CALC-050","sec":"eq","t":"3.6","tl":"3.6 Costs","calc":true,"q":"A broker charges 0.9% commission, with a minimum of £25 per trade. A client places two trades: £2,500 and £4,000. What is the total commission?","o":["£61.00","£58.50","£50.00","£36.00"],"a":0,"why":"Trade 1: 0.9% × £2,500 = £22.50, which is below the minimum, so £25.00. Trade 2: 0.9% × £4,000 = £36.00. Total = £61.00. Applying the minimum to each trade separately is the key step.","eq":"Commission = max(Rate × Trade value, Minimum), applied trade by trade"},{"id":"CH1-CALC-051","sec":"eq","t":"3.6","tl":"3.6 Costs","calc":true,"q":"A client buys £15,000 of shares in a UK company. Commission is 1.25%, stamp duty reserve tax is 0.5%, and the PTM levy applies. What are the total costs?","o":["£262.50","£264.00","£189.00","£339.00"],"a":1,"why":"Commission = £187.50. SDRT = 0.5% × 15,000 = £75.00. The PTM levy is £1.50, because the trade is over £10,000. Total = £264.00.","eq":"Total = Commission + SDRT + PTM levy (£1.50 on trades over £10,000)"},{"id":"CH1-CALC-052","sec":"eq","t":"3.8","tl":"3.8 Dividend measures","calc":true,"q":"A company has net income of £72m and pays dividends of £24m. What are its pay-out ratio and dividend cover?","o":["Pay-out 300%; cover 0.33×","Pay-out 33.3%; cover 3.0×","Pay-out 66.7%; cover 1.5×","Pay-out 33.3%; cover 0.33×"],"a":1,"why":"Pay-out ratio = 24 ÷ 72 = 33.3%. Dividend cover = 72 ÷ 24 = 3.0×. They are the inverse of each other.","eq":"Pay-out ratio = Dividends ÷ Net income. Dividend cover = Net income ÷ Dividends"},{"id":"CH1-CALC-053","sec":"eq","t":"3.2","tl":"3.2 Preference shares","calc":true,"q":"A company has 500,000 £1, 5.5% cumulative preference shares. It missed the preference dividend for the last 3 years, and this year it wants to pay an ordinary dividend. What is the total it must pay to preference shareholders first?","o":["£110,000","£82,500","£27,500","£137,500"],"a":0,"why":"Each year's preference dividend = 500,000 × 5.5p = £27,500. Cumulative means all arrears must be paid: 3 missed years + the current year = 4 × £27,500 = £110,000, before any ordinary dividend.","eq":"Cumulative pref payment = Annual pref dividend × (Years of arrears + Current year)"},{"id":"CH1-CALC-054","sec":"eq","t":"3.5","tl":"3.5 Liquidation","calc":true,"q":"A company is liquidated and its assets realise £10m. It has secured debt of £4m, unsecured debt of £5m, and £2m nominal of £1 preference shares. How much do preference shareholders receive per share, and what do ordinary shareholders get?","o":["£1 per preference share; ordinary shareholders get nothing","50p per preference share; ordinary shareholders get nothing","Nothing for preference shareholders; ordinary shareholders share £1m","25p per preference share; ordinary shareholders get 25p"],"a":1,"why":"£10m − £4m secured = £6m. £6m − £5m unsecured = £1m. £1m spread across 2m preference shares = 50p each, with nothing left for ordinary shareholders.","eq":"Order: secured, unsecured, preference (up to nominal), ordinary. Pay each in turn from what remains."},{"id":"CH1-CALC-055","sec":"eq","t":"3.6","tl":"3.6 Share premium","calc":true,"q":"A company issues 4 million shares with a nominal value of 25p at 180p each. How much is credited to the share premium account?","o":["£7.2m","£1.0m","£6.2m","£4.0m"],"a":2,"why":"Premium per share = 180p − 25p = 155p. 4m × £1.55 = £6.2m. The remaining £1m (4m × 25p) goes to share capital. Total raised = £7.2m.","eq":"Share premium = (Issue price − Nominal value) × Shares issued"},{"id":"CH1-CALC-056","sec":"eq","t":"3.7","tl":"3.7 Price-weighted index","calc":true,"q":"A price-weighted index has three shares priced at 50, 100 and 250 (total 400). If the 250 share rises 10% and the others are unchanged, by how much does the index rise?","o":["3.33%","10.00%","1.25%","6.25%"],"a":3,"why":"The 250 share rises by 25 points. 25 ÷ 400 = 6.25%. In a price-weighted index (like the Dow), the highest-priced share has the most influence. A 10% rise in the 50 share would move the index by only 1.25%.","eq":"Price-weighted index change = Change in sum of prices ÷ Original sum of prices"},{"id":"CH1-CALC-057","sec":"pr","t":"4.4","tl":"4.4 SDLT","calc":true,"q":"A client buys their only home in England for £750,000. What is the SDLT payable?","o":["£37,500","£27,500","£25,000","£30,000"],"a":1,"why":"£0 on the first £125,000. 2% on £125,001-£250,000 = £2,500. 5% on £250,001-£750,000 (£500,000) = £25,000. Total = £27,500. Charging 5% on the whole price (£37,500) is the classic mistake.","eq":"SDLT = Σ (slice × rate). Residential: 0% to £125k, 2% to £250k, 5% to £925k, 10% to £1.5m, 12% above"},{"id":"CH1-CALC-058","sec":"pr","t":"4.4","tl":"4.4 SDLT","calc":true,"q":"A client buys their only home in England for £1,800,000. What is the SDLT payable?","o":["£216,000","£93,750","£180,000","£129,750"],"a":3,"why":"2% × £125,000 = £2,500. 5% × £675,000 = £33,750. 10% × £575,000 = £57,500. 12% × £300,000 = £36,000. Total = £129,750.","eq":"SDLT = Σ (slice × rate) across all five residential bands"},{"id":"CH1-CALC-059","sec":"pr","t":"4.4","tl":"4.4 SDLT","calc":true,"q":"A UK resident who already owns a home buys a second residential property in England for £450,000. What is the total SDLT, including the 5% surcharge?","o":["£12,500","£22,500","£35,000","£57,500"],"a":2,"why":"Standard SDLT: £2,500 + (5% × £200,000 = £10,000) = £12,500. The surcharge is +5% on every slice, which equals 5% × £450,000 = £22,500. Total = £35,000.","eq":"SDLT with surcharge = Standard SDLT + (Surcharge % × Whole price)"},{"id":"CH1-CALC-060","sec":"pr","t":"4.4","tl":"4.4 SDLT","calc":true,"q":"A non-UK resident buys their only residential property in England for £500,000. What is the total SDLT?","o":["£15,000","£40,000","£10,000","£25,000"],"a":3,"why":"Standard SDLT = £2,500 + £12,500 = £15,000. The non-resident surcharge is +2% × £500,000 = £10,000. Total = £25,000.","eq":"Non-resident SDLT = Standard SDLT + 2% × Price"},{"id":"CH1-CALC-061","sec":"pr","t":"4.4","tl":"4.4 SDLT","calc":true,"q":"An investor buys a commercial property in England for £1,200,000. What is the SDLT payable?","o":["£49,500","£60,000","£63,750","£47,500"],"a":0,"why":"Non-residential bands: 0% on the first £150,000. 2% on £150,001-£250,000 = £2,000. 5% on the remaining £950,000 = £47,500. Total = £49,500. Using the residential bands gives £63,750, which is wrong.","eq":"Non-residential SDLT: 0% to £150k, 2% to £250k, 5% above"},{"id":"CH1-CALC-062","sec":"pr","t":"4.4","tl":"4.4 SDLT","calc":true,"q":"A company buys a residential property in England for £800,000. Using the rates in your notes, what is the SDLT?","o":["£30,000","£40,000","£120,000","£70,000"],"a":2,"why":"Residential property over £500,000 bought by a company is charged at a flat 15% on the whole price: 15% × £800,000 = £120,000. The banded calculation does not apply.","eq":"Company purchase of residential property over £500k = 15% × Price"},{"id":"CH1-CALC-063","sec":"pr","t":"4.2","tl":"4.2 Rental yield","calc":true,"q":"A flat costs £275,000 plus £12,500 of purchase costs. Rent is £1,450 a month. The investor allows for a 2-month void each year, and annual expenses are £2,900. What is the rental yield?","o":["6.05%","4.22%","5.04%","4.03%"],"a":3,"why":"Gross rent = 1,450 × 12 = £17,400. Less the void (2 × £1,450 = £2,900) and expenses (£2,900) = £11,600. Cost including purchase costs = £287,500. Yield = 11,600 ÷ 287,500 = 4.03%.","eq":"Rental yield = (Gross rent − Voids − Expenses) ÷ (Price + Purchase costs)"},{"id":"CH1-CALC-064","sec":"pr","t":"4.7","tl":"4.7 Initial yield","calc":true,"q":"An investor buys a property for £1,500,000 plus purchase costs of 6.8%. The current annual rent is £96,000. What is the initial yield?","o":["6.40%","5.99%","-0.40%","6.84%"],"a":1,"why":"Value including costs = 1,500,000 × 1.068 = £1,602,000. Initial yield = 96,000 ÷ 1,602,000 = 5.99%.","eq":"Initial yield = Current annual rent ÷ Value including costs"},{"id":"CH1-CALC-065","sec":"pr","t":"4.7","tl":"4.7 GRM and cap rate","calc":true,"q":"An office costs £2,700,000 and earns gross rent of £180,000 a year, with operating costs of £45,000. What are its GRM and cap rate?","o":["GRM 15.0; cap rate 6.67%","GRM 20.0; cap rate 5.00%","GRM 15.0; cap rate 5.00%","GRM 6.67; cap rate 15.0%"],"a":2,"why":"GRM = 2,700,000 ÷ 180,000 = 15.0 (gross, ignoring costs). Cap rate = (180,000 − 45,000) ÷ 2,700,000 = 135,000 ÷ 2,700,000 = 5.00%. 6.67% wrongly uses gross rent.","eq":"GRM = Price ÷ Gross annual rent. Cap rate = Net operating income ÷ Price"},{"id":"CH1-CALC-066","sec":"pr","t":"4.7","tl":"4.7 Cap rate and value","calc":true,"q":"A property has a net operating income of £210,000. Market cap rates for similar properties rise from 5.25% to 6.00%. What happens to its value?","o":["It rises from £3.5m to £4.0m","It falls from £4.0m to £3.5m","It is unchanged at £4.0m","It falls from £4.0m to £3.75m"],"a":1,"why":"Value = NOI ÷ cap rate. At 5.25%: 210,000 ÷ 0.0525 = £4.0m. At 6.00%: 210,000 ÷ 0.06 = £3.5m. Value falls by £500,000 (12.5%). A higher cap rate means a lower value.","eq":"Value = NOI ÷ Cap rate. Cap rate up → value down"},{"id":"CH1-CALC-067","sec":"pr","t":"4.7","tl":"4.7 Cap rate and value","calc":true,"q":"A property's NOI is £60,000 and its cap rate is 6%. The NOI rises by 10% and the cap rate falls to 5.5%. By what percentage does its value change?","o":["+10%","+8.3%","-20%","+20%"],"a":3,"why":"Before: 60,000 ÷ 0.06 = £1,000,000. After: 66,000 ÷ 0.055 = £1,200,000. That is a +20% change. Higher income and a lower cap rate both push the value up.","eq":"Value = NOI ÷ Cap rate. % change = (New − Old) ÷ Old"},{"id":"CH1-CALC-068","sec":"pr","t":"4.8","tl":"4.8 REITs","calc":true,"q":"A UK REIT makes qualifying profits of £84m. What is the minimum it must distribute?","o":["£63.0m","£84.0m","£75.6m","£8.4m"],"a":2,"why":"A REIT must distribute at least 90% of its profits: 90% × £84m = £75.6m. £63m (75%) confuses this with the 75% income and asset tests.","eq":"REIT minimum distribution = 90% × Qualifying profits"},{"id":"CH1-CALC-069","sec":"pr","t":"4.8","tl":"4.8 REITs","calc":true,"q":"A REIT has rental income of £36m. What is the MAXIMUM annual interest it can pay without breaching the interest cover condition?","o":["£28.8m","£45.0m","£27.0m","£32.4m"],"a":0,"why":"Rental income must be at least 1.25 × interest, so maximum interest = 36 ÷ 1.25 = £28.8m. Multiplying by 1.25 (£45m) gets the condition the wrong way round.","eq":"Interest cover: Rental income ≥ 1.25 × Interest, so Max interest = Rental income ÷ 1.25"},{"id":"CH1-CALC-070","sec":"pr","t":"4.8","tl":"4.8 REITs","calc":true,"q":"A REIT has total assets of £500m. What is the maximum it can hold in a single property, and the minimum it must hold in property overall?","o":["Max single property £75m; min property assets £450m","Max single property £200m; min property assets £450m","Max single property £200m; min property assets £375m","Max single property £375m; min property assets £200m"],"a":2,"why":"No single property can exceed 40%: 40% × £500m = £200m. At least 75% must be in property: 75% × £500m = £375m.","eq":"REIT: Single property ≤ 40% of assets. Property assets ≥ 75% of assets"},{"id":"CH1-CALC-071","sec":"pr","t":"4.8","tl":"4.8 / 4.12 Property funds","calc":true,"q":"A direct property unit trust has assets of £600m. What is the maximum it can hold in one property, and what value of assets that cannot be valued would force it to suspend under FCA rules?","o":["£120m; £90m","£90m; £60m","£90m; £120m","£240m; £120m"],"a":2,"why":"Maximum in one property = 15% × £600m = £90m. The fund must suspend if a valuer cannot value at least 20% of its assets: 20% × £600m = £120m.","eq":"Single property limit = 15% × Fund. FCA suspension trigger = 20% of assets cannot be valued"},{"id":"CH1-CALC-072","sec":"pr","t":"4.4","tl":"4.4 Borrowing","calc":true,"q":"An investor buys a property for £320,000 with an 85% loan-to-value mortgage. The property then falls 18% in value, and the loan is unchanged. What is the investor's position?","o":["Equity of £214,400","Negative equity of £9,600","Negative equity of £57,600","Equity of £48,000"],"a":1,"why":"Loan = 85% × £320,000 = £272,000. New value = £320,000 × 0.82 = £262,400. The loan exceeds the value by £9,600, so the investor is in negative equity. Gearing magnifies losses.","eq":"Equity = Property value − Loan. Negative equity = Loan > Value"},{"id":"CH1-CALC-073","sec":"oa","t":"5.7","tl":"5.7 Hedge fund fees","calc":true,"q":"An investor puts £750,000 into a '2 and 20' hedge fund, and the fund makes 12% (£90,000). Using the method in your notes, what is the investor's net return?","o":["12.00%","9.60%","7.60%","10.00%"],"a":2,"why":"Management fee = 2% × £750,000 = £15,000. Performance fee = 20% × £90,000 = £18,000. Total fees = £33,000. Net gain = £90,000 − £33,000 = £57,000. Net return = 7.60%.","eq":"Management fee = 2% × Amount invested. Performance fee = 20% × Gain. Net return = (Gain − Fees) ÷ Amount invested"},{"id":"CH1-CALC-074","sec":"oa","t":"5.7","tl":"5.7 Hedge fund fees","calc":true,"q":"An investor puts £1,000,000 into a '2 and 20' hedge fund, and the fund LOSES 5% in the year. What is the investor's total loss after fees?","o":["-7.00%","-5.00%","-6.00%","-3.00%"],"a":0,"why":"There is no gain, so there is no performance fee. The management fee of 2% × £1,000,000 = £20,000 is still charged. Total loss = £50,000 + £20,000 = £70,000, or −7%.","eq":"Management fee always applies. Performance fee = 20% × Gain (zero if there is no gain)"},{"id":"CH1-CALC-075","sec":"oa","t":"5.1","tl":"5.1 Art auction costs","calc":true,"q":"A collector buys a painting at a hammer price of £80,000 and pays a 15% buyer's fee. When they sell, they will pay a 10% seller's fee. What hammer price must they achieve to break even?","o":["£101,200.00","£92,000.00","£100,000.00","£102,222.22"],"a":3,"why":"Total cost = £80,000 × 1.15 = £92,000. The seller keeps 90% of the hammer price, so price = £92,000 ÷ 0.90 = £102,222.22. Multiplying by 1.10 (£101,200) is wrong, because the seller's fee comes out of a larger number.","eq":"Break-even hammer price = Total cost ÷ (1 − Seller's fee %)"},{"id":"CH1-CALC-076","sec":"oa","t":"5.8","tl":"5.8 Private company valuation","calc":true,"q":"A private company reports profits of £3.2m, including a one-off gain of £0.4m. A comparable listed company trades on a P/E of 14. Using the P/E method, what is the private company worth?","o":["£44.8m","£50.4m","£2.8m","£39.2m"],"a":3,"why":"The P/E method uses NORMALISED profit, which strips out the one-off gain: £3.2m − £0.4m = £2.8m. Value = 14 × £2.8m = £39.2m. Using the reported £3.2m gives £44.8m, which is wrong.","eq":"Value = Comparable P/E × Normalised profit"},{"id":"CH1-CALC-077","sec":"oa","t":"5.8","tl":"5.8 Private company valuation","calc":true,"q":"A private company has total assets of £18m and total liabilities of £7.5m. What is its value using the asset value method, and what is the main weakness of that method?","o":["£25.5m; it ignores future earnings","£10.5m; it ignores future earnings","£10.5m; it needs a comparable listed company","£18m; it is subjective if forecasts are weak"],"a":1,"why":"Asset value = £18m − £7.5m = £10.5m. Its main weakness is that it ignores future earnings. Needing a comparable company is the P/E method's weakness, and subjective forecasts are DCF's.","eq":"Asset value = Assets − Liabilities"},{"id":"CH1-CALC-078","sec":"oa","t":"5.3","tl":"5.3 Spread betting","calc":true,"q":"An investor spread bets £10 a point on a commodity index, buying at 3,250. They put up a £1,000 margin. The index falls to 3,020. What is their loss?","o":["£1,000","£230","£23,000","£2,300"],"a":3,"why":"The index fell 230 points, so the loss is 230 × £10 = £2,300. That is more than the £1,000 margin. Spread betting losses are unlimited and can exceed the stake.","eq":"Spread bet P/L = Points moved × Stake per point"},{"id":"CH1-CALC-079","sec":"oa","t":"5.5","tl":"5.5 Crypto tax","calc":true,"q":"An investor bought 1.5 Bitcoin for a total of £45,000. They later sell 1 Bitcoin for £52,000. Using the average cost of the coins, what is the chargeable gain?","o":["£7,000","£52,000","£37,000","£22,000"],"a":3,"why":"Average cost = £45,000 ÷ 1.5 = £30,000 per coin. Gain = £52,000 − £30,000 = £22,000. Most crypto gains are subject to CGT, and losses are allowable. Deducting the full £45,000 cost (giving £7,000) is wrong, because only 1 of the 1.5 coins was sold.","eq":"Gain = Sale proceeds − (Total cost ÷ Total coins × Coins sold)"},{"id":"CH1-CALC-080","sec":"oa","t":"5.9","tl":"5.9 The 60/40 portfolio","calc":true,"q":"In a year when equities return -18% and bonds return -13%, what is the return on a 60/40 portfolio?","o":["-15.5%","-16.0%","-31.0%","-16.6%"],"a":1,"why":"60/40 means 60% equities and 40% bonds: (0.6 × −18%) + (0.4 × −13%) = −10.8% − 5.2% = −16.0%. When both asset classes fall together, as they did when correlation was high, the portfolio offers little protection.","eq":"Portfolio return = (Equity weight × Equity return) + (Bond weight × Bond return)"}];

/* ============================================================
   STATE + SAVING (account storage via db, with browser fallback)
   ============================================================ */
const blankProgress = () => ({v:1, topicsDone:{}, q:{}, cards:{}, nums:{}, history:[]});
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let P = Object.assign(blankProgress(), lsGet("irt.progress")||{});
let CUSTOM = Object.assign({items:[]}, lsGet("irt.custom")||{});
let dbRefs = null;
const dirty = {}, timers = {}, busy = {};
function setSave(t){const el=document.getElementById("savestate"); if(el) el.textContent=t}
function persist(which){
  lsSet(which==="progress"?"irt.progress":"irt.custom", which==="progress"?P:CUSTOM);
  if(window.IRT_REMOTE){ window.IRT_REMOTE.changed(); return }
  if(!dbRefs){ setSave("Saved in this browser"); return }
  dirty[which]=true; clearTimeout(timers[which]); timers[which]=setTimeout(()=>flush(which),800);
}
async function flush(which){
  if(busy[which]||!dirty[which]) return;
  busy[which]=true; dirty[which]=false;
  const data = JSON.parse(JSON.stringify(which==="progress"?P:CUSTOM));
  try{ await dbRefs[which].set(data); setSave("Saved to your account") }
  catch(e){ setSave("Saved in this browser only") }
  busy[which]=false;
  if(dirty[which]) flush(which);
}
(async function connect(){
  try{
    // Hosted copies (e.g. Streamlit) can supply their own cross-device sync.
    if(window.IRT_REMOTE){
      window.IRT_REMOTE.attach({
        get:()=>({progress:P, custom:CUSTOM}),
        set:d=>{ P=Object.assign(blankProgress(), d.progress||{}); CUSTOM=Object.assign({items:[]}, d.custom||{}); lsSet("irt.progress",P); lsSet("irt.custom",CUSTOM); if(!QZ) render() },
        status:setSave
      });
      return;
    }
    if(!window.claude || !window.claude.use){ setSave("Saved in this browser"); return }
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    const uid = user ? await user.id() : null;
    if(!db || !uid){ setSave("Saved in this browser"); return }
    const base = "data/users/"+uid;
    const refs = {progress:db.doc(base+"/progress"), custom:db.doc(base+"/questions")};
    const [ps, cs] = await Promise.all([refs.progress.get(), refs.custom.get()]);
    dbRefs = refs;
    if(ps.exists){ P = Object.assign(blankProgress(), JSON.parse(JSON.stringify(ps.data()))) } else if(hasAnything(P)){ dirty.progress=true; flush("progress") }
    if(cs.exists){ CUSTOM = Object.assign({items:[]}, JSON.parse(JSON.stringify(cs.data()))) } else if(CUSTOM.items.length){ dirty.custom=true; flush("custom") }
    lsSet("irt.progress",P); lsSet("irt.custom",CUSTOM);
    setSave("Saved to your account");
    if(!QZ) render();
  }catch(e){ setSave("Saved in this browser") }
})();
function hasAnything(p){return Object.keys(p.q).length||Object.keys(p.cards).length||Object.keys(p.nums).length||p.history.length||Object.keys(p.topicsDone).length}

function bump(map,id,ok){const s=map[id]||(map[id]={r:0,w:0}); ok?s.r++:s.w++; s.t=Date.now()}

   ============================================================ */
function allQuestions(){return QUESTIONS.concat(CUSTOM.items)}
function statFor(tid){
  let r=0,w=0;
  for(const q of allQuestions().concat(EXAM)) if(q.topic===tid){const s=P.q[q.id]; if(s){r+=s.r;w+=s.w}}
  for(const c of CARDS) if(c.topic===tid){const s=P.cards[c.id]; if(s){r+=s.r;w+=s.w}}
  for(const [k,v] of Object.entries(NUM_TYPES)) if(v.topic===tid){const s=P.nums[k]; if(s){r+=s.r;w+=s.w}}
  const n=r+w; return {r,w,n,acc:n?r/n:null};
}
function overall(){
  let r=0,w=0; for(const m of [P.q,P.cards,P.nums]) for(const s of Object.values(m)){r+=s.r;w+=s.w}
  return {r,w,n:r+w,acc:(r+w)?r/(r+w):null};
}
function weakSpots(){
  const out=[];
  for(const t of TOPICS.concat([{id:"mine"}])){const s=statFor(t.id); if(s.n>=2&&s.acc<0.7) out.push({kind:"topic",id:t.id,sec:t.sec,label:(t.id==="mine"?"":t.id+" ")+TOPIC_TITLE[t.id],acc:s.acc,n:s.n})}
  for(const [k,v] of Object.entries(NUM_TYPES)){const s=P.nums[k]; if(s&&s.r+s.w>=2&&s.r/(s.r+s.w)<0.7) out.push({kind:"num",id:k,sec:v.sec,label:"Numbers: "+v.label,acc:s.r/(s.r+s.w),n:s.r+s.w})}
  return out.sort((a,b)=>a.acc-b.acc);
}
function missedQuestions(){return allQuestions().filter(q=>{const s=P.q[q.id];return s&&s.w>0&&s.w>=s.r})}
const pct = x => x==null?"–":Math.round(x*100)+"%";
const accChip = s => s.n? `<span class="chip ${s.acc>=0.8?"good":s.acc>=0.6?"mid":"bad"}">${pct(s.acc)} of ${s.n}</span>` : `<span class="chip">Not tried</span>`;
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (x,c="£") => (x<0?"−":"")+c+Math.abs(x).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2});

}

function secStat(sec){let r=0,w=0;for(const t of sec.topics){const x=statFor(t.id);r+=x.r;w+=x.w}return {r,w,n:r+w,acc:(r+w)?r/(r+w):null}}
function chapterStat(ch){let r=0,w=0;for(const sec of ch.sections){const x=secStat(sec);r+=x.r;w+=x.w}return {r,w,n:r+w,acc:(r+w)?r/(r+w):null}}
function secCardHTML(sec){

}

const chHas = (ch,key) => ch.sections.some(x=>x.key===key) || (ch.exams||[]).some(x=>x.key===key);
const sibsHTML = (ch,cur) => ch.sections.concat(ch.exams||[]).map(x=>`<a href="#${x.hash}" class="${x.exam||x.calc!=null?"x":""}" aria-current="${x===cur?"page":"false"}">${esc(x.nav)}</a>`).join("");
function examStat(x){
  const pool=EXAM.filter(q=>q.exam===x.key); let r=0,w=0,tried=0,missed=0;
  for(const q of pool){const s=P.q[q.id]; if(s){tried++; r+=s.r; w+=s.w; if(isMissed(q)) missed++}}
  return {total:pool.length,tried,missed,r,w,n:r+w,acc:(r+w)?r/(r+w):null};
}

/* ============================================================
   EXAM-STYLE QUESTION PAGES
   ============================================================ */
function examPool(x, sec, which){
  let pool=EXAM.filter(q=>q.exam===x.key);
  if(sec && sec!=="all") pool=pool.filter(q=>q.sec===sec);
  if(which==="new") pool=pool.filter(q=>!P.q[q.id]);
  if(which==="missed") pool=pool.filter(isMissed);
  return pool;
}
function examStart(ids){
  const x=CUR_X; let pool;
  if(ids) pool=EXAM.filter(q=>ids.includes(q.id)); else pool=examPool(x,XSET.sec,XSET.which);
  if(!pool.length){ toast(XSET.which==="missed"?"Nothing to retry here yet.":XSET.which==="new"?"You've tried them all. Pick another filter.":"No questions match."); return }
  const n = ids || XSET.n==="all" ? pool.length : Math.min(+XSET.n, pool.length);
  const where = XSET.sec==="all" ? "Chapter "+CH[x.ch].num : SEC[XSET.sec].nav;
  QZ={mode:"exam", exam:x.key, sec:x.key, label:ids?`${x.nav} · retry misses`:`${x.nav} · ${where}`,
    items:shuffle(pool).slice(0,n).map(q=>({id:q.id,order:[0,1,2,3]})), i:0, score:0, picked:null, revealed:false, wrong:[]};
  XTAB="practice"; render(); window.scrollTo(0,0);
}

      <div class="xlist">${list.map((q,i)=>{const s=P.q[q.id];return `<details class="xq"><summary><span class="num muted">${i+1}</span><span>${esc(q.q)}</span>${s?`<span class="chip ${isMissed(q)?"bad":"good"}">${s.r}/${s.r+s.w}</span>`:""}</summary>
        <div class="stack" style="gap:10px;padding-top:10px">

          <div class="xopts">${q.options.map((o,k)=>`<div class="${k===q.a?"right":""}"><b>${"ABCD"[k]})</b> ${esc(o)}${k===q.a?" ✓":""}</div>`).join("")}</div>

  <div class="tabs" role="tablist">${[["practice","Practice"],["list","All questions"]].map(([k,l])=>`<button role="tab" aria-selected="${XTAB===k}" data-act="xtab" data-tab="${k}">${l}</button>`).join("")}</div>
  ${body}`;
}

/* ---------- flashcards ---------- */
function startFlash(deck){
  let cards = CUR.cards.slice();
  if(deck==="Numbers"||deck==="Pairs") cards=cards.filter(c=>c.kind===deck);
  if(deck==="Weak") cards=cards.filter(c=>{const s=P.cards[c.id];return !s||s.w>=s.r});
  cards.sort(()=>Math.random()-0.5);
  FC={deck,cards,i:0,flipped:false,known:0};
}
function flashHTML(){
  if(!FC) startFlash("All");
  const decks=["All","Numbers","Pairs","Weak"];
  const head=`<div class="row" style="justify-content:center;margin-bottom:16px">${decks.map(d=>`<button class="btn small ${FC.deck===d?"primary":""}" data-act="deck" data-deck="${d}">${d==="Weak"?"Not yet known":d==="Numbers"?"Numbers to memorise":d==="Pairs"?"Confused pairs":"All cards"}</button>`).join("")}</div>`;
  if(!FC.cards.length) return head+`<div class="empty">No cards in this deck yet. Cards you mark "Didn't know" land here.</div>`;
  if(FC.i>=FC.cards.length) return head+`<div class="qbox"><div class="panel" style="text-align:center;display:grid;gap:10px"><h2>Deck done</h2><p class="muted">You knew <b class="num">${FC.known}</b> of <b class="num">${FC.cards.length}</b>.</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="deck" data-deck="${FC.deck}">Go again</button><button class="btn" data-act="deck" data-deck="Weak">Just the ones I missed</button></div></div></div>`;
  const c=FC.cards[FC.i];
  return head+`<div class="qbox">
    <div class="progressline"><span>Card ${FC.i+1} of ${FC.cards.length} · ${c.kind==="Numbers"?"Number to memorise":"Confused pair"}</span><span class="num">${c.topic} ${esc(TOPIC_TITLE[c.topic])}</span></div>
    <div class="flash ${FC.flipped?"flipped":""}" data-act="flip" role="button" tabindex="0" aria-label="Flip card">
      <div class="flash-inner"><div class="face"><div class="big">${esc(c.front)}</div><span class="muted" style="font-size:13px">Tap to reveal</span></div>
      <div class="face back"><div class="big">${esc(c.back)}</div></div></div>
    </div>
    <div class="row" style="justify-content:center">${FC.flipped?`<button class="btn bad" data-act="card" data-ok="0">Didn't know</button><button class="btn good" data-act="card" data-ok="1">Knew it</button>`:`<button class="btn primary" data-act="flip">Reveal answer</button>`}</div>
  </div>`;
}

/* ---------- quiz ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function secQuestions(key){return allQuestions().filter(q=>secOfQ(q)===key)}
function startQuiz(mode,id,secKey){
  const sec = SEC[secKey] || (id && TOPICS.find(t=>t.id===id) ? SEC[TOPICS.find(t=>t.id===id).sec] : CUR);
  let pool=secQuestions(sec.key), label=sec.nav+": mixed";
  if(mode==="topic"){pool=pool.filter(q=>q.topic===id);label=id+" "+TOPIC_TITLE[id]}
  if(mode==="selftest"){pool=sec.questions.filter(q=>q.src==="Self-test");label=sec.nav+": your self-test"}
  if(mode==="mine"){pool=CUSTOM.items.filter(q=>secOfQ(q)===sec.key);label=sec.nav+": my questions"}
  if(mode==="weak"){
    const weakTopics=new Set(weakSpots().filter(w=>w.kind==="topic").map(w=>w.id));
    const missed=new Set(missedQuestions().map(q=>q.id));
    pool=pool.filter(q=>missed.has(q.id)||weakTopics.has(q.topic)); label=sec.nav+": weak spots";
  }
  const n = mode==="selftest"?pool.length:Math.min(10,pool.length);
  if(!pool.length){toast(mode==="weak"?"No weak spots yet. Take a quiz first.":"No questions here yet.");return}
  QZ={mode,label,sec:sec.key,items:shuffle(pool).slice(0,n).map(q=>({id:q.id,order:q.kind==="mcq"?shuffle(q.options.map((_,i)=>i)):null})),i:0,score:0,picked:null,revealed:false,wrong:[]};
  OPEN_TOPIC=null; TAB="quiz"; if(!goSection(sec.key)) render(); window.scrollTo(0,0);
}

  if(!QZ){

    return `<div class="stack">
      <div class="modes">
        <button class="mode" data-act="startquiz" data-mode="all"><b>Mixed quiz</b><span class="muted">10 random questions from all ${secQuestions(CUR.key).length}</span></button>

        <button class="mode" data-act="startquiz" data-mode="weak" ${weak||missed?"":"disabled"}><b>Weak spots</b><span class="muted">${weak||missed?`${missed} missed question${missed===1?"":"s"}, ${weak} weak area${weak===1?"":"s"}`:"Unlocks once you've missed something"}</span></button>
        <button class="mode" data-act="startquiz" data-mode="mine" ${mine?"":"disabled"}><b>My questions</b><span class="muted">${mine? mine+" you've added":"Add some in the My questions tab"}</span></button>

    :`<p class="muted">Answer it in your head (or out loud), then reveal.</p><div class="row"><button class="btn primary" data-act="reveal">Show answer</button></div>`}
  </div>`;
}
function answerQ(ok){
  const it=QZ.items[QZ.i]; bump(P.q,it.id,ok); if(ok) QZ.score++; else QZ.wrong.push(it.id); persist("progress");
}
function finishQuiz(){
  P.history.push({at:Date.now(),section:QZ.sec,mode:QZ.mode,label:QZ.label,score:QZ.score,total:QZ.items.length});
  if(P.history.length>200) P.history=P.history.slice(-200);
  persist("progress");
}

function sdltSlices(price, bands){
  let tax=0, lines=[], lo=0;
  for(const [top,rate] of bands){
    if(price<=lo) break;
    const slice=Math.min(price,top)-lo;
    if(slice>0){ const t=slice*rate/100; tax+=t; lines.push(`${gbp0(slice)} × ${rate}% = ${money(t)}`) }
    lo=top;
  }
  return {tax, lines};
}
