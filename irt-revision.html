{id:"3.2", title:"Ordinary and Preference Shares", blurb:"Share classes, preference share types and their rights.",
html:`<ul><li><b>Shareholders' funds</b> = assets − liabilities = share capital + reserves + retained profits. <b>Share capital</b> = par value × shares issued.</li>
<li><b>Primary market</b>: IPO, company gets the money. <b>Secondary</b>: existing shares, company gets nothing.</li>
<li>Share capital is <b>permanent</b>. Returns: capital growth, dividends (interim and final), buybacks.</li>
<li>Votes on directors, auditors and pay. Only <b>indirect</b> influence. Hold for <b>5+ years</b>. <b>Last in line</b> on liquidation, <b>unlimited upside</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Class</th><th>Key features</th></tr>
<tr><td><b>Straight ordinary</b></td><td>Full votes and all declared dividends</td></tr>
<tr><td><b>Redeemable</b></td><td>Bought back on a set date. Must be issued <b>alongside non-redeemables</b>, allowed by the <b>articles</b>. Redeemed shares are retired</td></tr>
<tr><td><b>Dual-class</b></td><td>Public get limited or no votes ('A' shares); founders get more</td></tr>
<tr><td><b>Deferred dividend</b></td><td>Full votes but <b>no dividend until a condition is met</b>. Suit growth investors</td></tr>
<tr><td><b>Founder shares</b></td><td>Little or no dividend until others get a minimum</td></tr></table></div>
<h3>Preference shares</h3>
<ul><li><b>Priority over ordinary</b> holders for dividends and capital (but only <b>nominal value</b> back). <b>Not classed as equity.</b> Dividend usually <b>fixed</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Type</th><th>Key features</th></tr>
<tr><td><b>Cumulative</b></td><td>Missed dividends <b>build up</b>. <b>The default</b> unless it says "non-cum"</td></tr>
<tr><td><b>Non-cumulative</b></td><td>Missed dividends are <b>lost</b></td></tr>
<tr><td><b>Participating</b></td><td>Fixed dividend <b>plus</b> a share of surplus profits</td></tr>
<tr><td><b>Redeemable</b></td><td>Bought back on a set date</td></tr>
<tr><td><b>Convertible</b></td><td>Converts into a set number of ordinary shares</td></tr></table></div>
<p class="muted">Features combine, e.g. "XYZ plc £1 Cum. Red. Pref."</p>`,
traps:["Preference shares are <b>cumulative unless stated otherwise</b>.","On liquidation preference holders get <b>nominal</b>, not market, value.","Redeemable ordinary shares must be issued <b>alongside</b> non-redeemables."]},

{id:"3.3", title:"Private Equity", blurb:"Buy-outs, venture, growth, distressed and mezzanine capital.",
html:`<ul><li>Capital for <b>unquoted</b> companies, or public ones that <b>delist</b>. <b>Buy-out</b> = existing shares; <b>development capital</b> = new shares.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Strategy</th><th>Key points</th></tr>
<tr><td><b>LBO</b></td><td>Bought with <b>acquisition debt</b> repaid from the <b>target's cash flows</b>. Usually <b>non-recourse</b></td></tr>
<tr><td><b>Venture capital</b></td><td><b>Early stage</b>: launch, development, expansion. Tech, biotech. <b>Expensive</b> capital</td></tr>
<tr><td><b>Growth capital</b></td><td>Often <b>minority</b> stakes in <b>mature</b>, profitable firms. <b>No change of control</b></td></tr>
<tr><td><b>Distressed</b></td><td>Firms in distress. Grew in the <b>1980s to early 1990s</b></td></tr>
<tr><td><b>Mezzanine</b></td><td>Subordinated debt or preferred equity. <b>Junior to senior debt, senior to common equity</b></td></tr></table></div>
<p><b>Bridge financing</b> (mezzanine): short term, <b>6 to 12 months</b>, more expensive.</p>
<p>Ranking, safest first: senior secured debt, mezzanine, preferred equity, <b>common equity</b> (riskiest).</p>`,
traps:["VC = <b>early</b> stage, often no profits. Growth capital = <b>mature</b>, already profitable.","LBO debt is repaid from the <b>target's</b> cash flows."]},

{id:"3.4", title:"Investment Risk and Shares", blurb:"Capital and income risk, liquidity, and the reward for risk.",
html:`<ul><li><b>Capital risk</b>: price falls or lags inflation. <b>Income risk</b>: dividends fall or stop. Not paying = <b>"passing a dividend"</b>.</li>
<li>Key factors: <b>liquidity, growth, volatility, issuing institution</b>.</li>
<li><b>Blue chips</b> trade heavily. <b>Private company shares</b> are very hard to sell: the articles may force you to offer them to <b>existing shareholders first</b>, and there's no market price.</li>
<li>Reward: potentially unlimited gains. But <b>no legal obligation to pay dividends</b>, and ordinary holders <b>rank last</b>.</li></ul>`,
traps:[]},

{id:"3.5", title:"Corporate Actions", blurb:"Bonus issues, splits, rights issues, liquidation, engagement.",
html:`<h3>Bonus (scrip / capitalisation) issues</h3>
<ul><li>Free new shares <b>pro rata</b>. <b>No new money.</b> <b>Reserves become share capital</b>; net worth <b>unchanged</b>. Price falls in proportion (<b>ex-cap</b>).</li>
<li>Why: tidies the balance sheet, more <b>marketable</b> price, signals success. Holders get a <b>renounceable certificate</b>.</li></ul>
<div class="worked"><b class="lab">Worked example</b>5-for-2: 200 shares get 500 new, so <b>700</b>. 1-for-4 at 250p: 400,000 × 250p = £1m over 500,000 shares = <b>200p</b>.</div>
<h3>Share splits</h3><p>Cuts the <b>nominal value</b> per share. <b>No reserves are converted.</b></p>
<h3>Rights issues</h3>
<ul><li><b>Raises new money</b>. Existing holders have a <b>statutory right</b> to subscribe (protects against <b>dilution</b>). New shares rank <b>pari passu</b>, priced <b>below market</b>.</li>
<li><b>Underwriting</b> fee is paid <b>whether or not</b> it succeeds.</li></ul>
<p><span class="formula">TERP = Value of old + new shares ÷ Total shares</span></p>
<div class="worked"><b class="lab">Worked example</b>40 shares at ¥450 = ¥18,000. 1-for-2 at ¥300: 20 new cost ¥6,000. ¥24,000 ÷ 60 = <b>TERP ¥400</b>.</div>
<p>Options: take up, sell the rights, <b>split</b>, or lapse. Deadline usually <b>2 to 3 weeks</b>.</p>
<h3>Liquidation</h3>
<p>Order: secured bondholders, unsecured bondholders, <b>preference</b> shareholders, <b>ordinary</b> shareholders (last). Listed shares are often <b>suspended</b>.</p>
<h3>Engagement vs activism</h3>
<div class="tw"><table class="tbl"><tr><th></th><th>Engagement</th><th>Activism</th></tr>
<tr><td>Approach</td><td><b>Long term</b> dialogue</td><td><b>Short-term</b>: resolutions, proxy battles, litigation</td></tr>
<tr><td>Goals</td><td>Financial and ESG</td><td>Often financial</td></tr></table></div>
<p>In <b>2024, 18.5%</b> of the top 1% of <b>Russell 3000</b> companies were targeted by activists.</p>`,
traps:["Bonus issue = <b>no</b> new money. Rights issue = <b>new money</b>.","Underwriting fee is paid <b>even if</b> the issue succeeds.","Share split converts <b>no</b> reserves."]},

{id:"3.6", title:"Dealing and Share Prices", blurb:"Broker services, UK trading systems, settlement, valuation, dividend dates, costs.",
html:`<p>Crashes: 1987, dot-com, GFC (2007–08), euro debt (2011), 2016 and 2018 corrections, COVID (2020), energy crisis (2022).</p>
<div class="tw"><table class="tbl"><tr><th>Service</th><th>Meaning</th></tr>
<tr><td><b>Discretionary</b></td><td>Broker manages <b>without asking</b> first</td></tr>
<tr><td><b>Advisory</b></td><td>Broker advises, client decides</td></tr>
<tr><td><b>Execution-only</b></td><td>No advice</td></tr></table></div>
<p>Brokers act as agent and owe <b>best execution</b>. Market makers quote two-way prices.</p>
<div class="tw"><table class="tbl"><tr><th>UK system</th><th>What it does</th></tr>
<tr><td><b>SETS</b></td><td>Electronic <b>order-driven</b> book: FTSE All-Share, ETFs</td></tr>
<tr><td><b>SETSqx</b></td><td>Less liquid shares</td></tr>
<tr><td><b>SEAQ</b></td><td><b>Quote-driven</b>: fixed interest and AIM shares not on SETS</td></tr>
<tr><td><b>IOB</b></td><td><b>Depositary receipts</b> from 30+ countries</td></tr></table></div>
<ul><li>Settlement via <b>CREST</b> (CDIs). UK <b>T+2</b>; <b>rights issues T+1</b>. US, Canada, Mexico, Argentina moved to <b>T+1 in 2024</b>.</li>
<li>Nominal value and market price are <b>unrelated</b>. <b>Market cap = shares × price</b>.</li></ul>
<p><span class="formula">Gordon Growth: Price = Next dividend ÷ (Required return − Growth)</span></p>
<div class="worked"><b class="lab">Worked example</b>$0.20 ÷ (0.10 − 0.05) = <b>$4.00</b>.</div>
<div class="tw"><table class="tbl"><tr><th>Date</th><th>Meaning</th></tr>
<tr><td><b>Declaration</b></td><td>At least <b>3 clear business days</b> before xd</td></tr>
<tr><td><b>Ex-dividend</b></td><td>Own <b>before</b> this to get the dividend. Price drops by the dividend</td></tr>
<tr><td><b>Record</b></td><td>On the register. <b>After</b> the xd date</td></tr>
<tr><td><b>Payment</b></td><td>About <b>3 weeks</b> after record</td></tr></table></div>
<p><b>Special cum</b>: buy in the xd period but get the dividend. <b>Special ex</b>: buy cum but don't get it, only in the <b>10 business days</b> before xd.</p>
<p>Costs: commission (typically <b>1%–2%</b>, often with a minimum), stamp duty/SDRT, <b>PTM levy £1.50</b> on trades <b>over £10,000</b>.</p>
<div class="worked"><b class="lab">Worked example</b>1.5% of €1,000 = €15, but the minimum is €25, so you pay <b>€25</b>.</div>`,
traps:["SETS = <b>order</b>-driven. SEAQ = <b>quote</b>-driven.","Record date is <b>after</b> the xd date.","Rights issues settle <b>T+1</b>, normal trades <b>T+2</b>.","PTM levy only on trades <b>over £10,000</b>."]},

{id:"3.7", title:"Equity Indices", blurb:"Global and national indices, return versions and weighting methods.",
html:`<ul><li><b>MSCI World</b>: <b>23 developed</b> markets. <b>MSCI ACWI</b>: about <b>50 developed and emerging</b>.</li>
<li>FTSE 100 is full of multinationals, so the <b>FTSE 250 is a better gauge of the UK economy</b>.</li>
<li>S&amp;P 500 versions: price return, total return, <b>net total return</b> (after withholding tax).</li></ul>
<div class="tw"><table class="tbl"><tr><th>Weighting</th><th>How it works</th><th>Example</th></tr>
<tr><td><b>Price-weighted</b></td><td>Higher share price = more influence</td><td><b>Dow Jones Industrial Average</b></td></tr>
<tr><td><b>Market cap</b></td><td>Bigger companies count more</td><td>FTSE 100, S&amp;P 500, Hang Seng</td></tr>
<tr><td><b>Equal</b></td><td>Same amount in each</td><td>MSCI USA Equal Weighted</td></tr>
<tr><td><b>Free float</b></td><td>Only freely tradable shares count</td><td>Most major indices</td></tr></table></div>
<p><b>Capped</b> indices limit any one stock or sector. FTSE 100 is reviewed <b>quarterly</b>.</p>`,
traps:["The <b>Dow</b> is <b>price</b>-weighted.","Free float shows what managers can <b>actually buy</b>."]},

{id:"3.8", title:"Selecting Equities and Funds", blurb:"Active and passive strategies, replication methods, diversification.",
html:`<p>Passive investing rests on the <b>Efficient Market Hypothesis</b>. For passive funds look at <b>tracking error</b>.</p>
<div class="tw"><table class="tbl"><tr><th>Active strategy</th><th>What it does</th></tr>
<tr><td><b>Growth</b></td><td>Above-average earnings growth</td></tr>
<tr><td><b>GARP</b></td><td>Growth <b>not yet priced in</b>; less aggressive</td></tr>
<tr><td><b>Income</b></td><td>High steady dividends from mature firms</td></tr>
<tr><td><b>Value</b></td><td><b>Undervalued</b> firms; hopes for <b>reversion to the mean</b></td></tr>
<tr><td><b>Contrarian</b></td><td>Believes the <b>market has overreacted</b></td></tr>
<tr><td><b>Absolute return</b></td><td>Positive in <b>all</b> conditions</td></tr>
<tr><td><b>Quantitative</b></td><td>Computer-found patterns</td></tr>
<tr><td><b>Long/short</b></td><td>Buy risers, <b>short</b> fallers</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Passive strategy</th><th>What it does</th></tr>
<tr><td><b>Buy and hold</b></td><td>Hold indefinitely</td></tr>
<tr><td><b>Indexation</b></td><td>Full replication, stratified sampling, factor matching, optimisation, <b>synthetic (swaps)</b></td></tr>
<tr><td><b>Rebalancing</b></td><td><b>Calendar</b> or <b>contingent</b> (when weights drift)</td></tr></table></div>
<p>Diversify by region, sector and size. Growth metrics: P/E, PEG, ROE. Dividend metrics: cover, growth, <b>pay-out ratio = dividends ÷ net income</b>.</p>`,
traps:["GARP is the <b>less aggressive</b> growth style.","Contrarian thinks the market <b>overreacted</b>. Value hopes for <b>reversion to the mean</b>.","Synthetic replication uses <b>swaps</b>."]},

{id:"3.9", title:"Pros and Cons of Equities", blurb:"Advantages, disadvantages and market history.",
html:`<div class="tw"><table class="tbl"><tr><th>Advantages</th><th>Disadvantages</th></tr>
<tr><td>Higher long-term returns; traditional <b>inflation hedge</b>; wide access; large caps <b>more liquid</b> than property; part-ownership rights; funds can compound dividends</td><td>Short-term swings; companies can fail; dividends <b>not guaranteed</b>; foreign political and currency risk; individual shares <b>don't compound</b></td></tr></table></div>
<ul><li><b>Portfolio turnover</b> = how often holdings trade. High turnover means more costs.</li>
<li>First exchange: <b>Euronext Amsterdam (1600s)</b>. LSE's first rule book: <b>1812</b>.</li>
<li><b>FTSE 100</b> launched <b>1984 at 1,000</b>. Fewer than 30 originals remain.</li>
<li><b>Smart beta ETFs</b> (first <b>2003</b>) seek alpha passively using alternative weightings.</li></ul>`,
traps:[]},

{id:"3.10", title:"ESG Factors", blurb:"ESG alongside other factors, voting and engagement.",
html:`<ul><li>ESG is weighed alongside value, size, momentum and volatility.</li>
<li>Ordinary shareholders usually have <b>one vote per share</b> and can vote on ESG matters.</li>
<li><b>Engagement</b> is a key tool; it must be relevant or can backfire.</li>
<li>Main problem: <b>no standardised method</b> for measuring ESG risk or impact.</li></ul>`,
traps:[]},

{id:"3.11", title:"Listing and Trading", blurb:"UK and overseas listing, MTFs, OTFs, SIs, dark pools.",
html:`<p>Why list: raise capital, objective value, liquidity, acquisitions, credibility, employee schemes, better controls.</p>
<p><b>Listed</b> = meets the criteria. <b>Admitted to trading</b> = allowed to trade (possible without listing). <b>Quoted</b> = actually trading.</p>
<ul><li>The <b>FCA</b> is the UK listing authority. The <b>LSE</b> is a <b>Recognised Investment Exchange</b> under <b>FSMA 2000</b>. News goes out via the <b>RNS</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>LSE market</th><th>Key details</th></tr>
<tr><td><b>Main Market</b></td><td><b>Min £30m</b> market cap, <b>10% free float</b>, <b>3 years</b> history</td></tr>
<tr><td><b>AIM</b></td><td><b>1995</b>. <b>No minimum size or track record</b></td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Country</th><th>Key facts</th></tr>
<tr><td>Germany</td><td><b>Frankfurt</b> (~90% of turnover). <b>BaFin</b>. Official, Regulated, Open segments</td></tr>
<tr><td>US</td><td><b>NYSE</b> (largest by cap, <b>1792</b> Buttonwood). <b>Nasdaq</b> (bigger by volume, ~3,700 firms). List on <b>one</b> US exchange only</td></tr>
<tr><td>China</td><td><b>Shanghai</b> (A shares in renminbi, B in dollars), Shenzhen, Hong Kong (Hang Seng = top 80, ~70% of value). <b>CSRC</b></td></tr>
<tr><td>Japan</td><td><b>TSE</b>: Prime, Standard, Growth</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th></th><th>NYSE</th><th>Nasdaq</th></tr>
<tr><td>Min public shares</td><td>1.1m</td><td>1.25m</td></tr><tr><td>Min market value</td><td>$100m</td><td>$45m</td></tr><tr><td>Min bid price</td><td>$4</td><td>$4</td></tr></table></div>
<ul><li><b>1998</b>: SEC authorised <b>ECNs</b>. <b>MiFID (2007)</b> brought MTFs, OTFs, SIs; <b>MiFID II (2018)</b> extended venues.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Venue</th><th>Key features</th></tr>
<tr><td><b>MTF</b></td><td>Many buyers and sellers; operator has <b>no discretion</b></td></tr>
<tr><td><b>OTF</b></td><td>Bonds, structured products, derivatives. <b>No equities</b></td></tr>
<tr><td><b>SI</b></td><td>Deals on <b>own account</b> frequently. <b>Can't also run an OTF</b></td></tr></table></div>
<p><b>Dark pools</b>: prices shown only <b>after</b> trades. <b>Agent</b> earns a <b>fee</b>; <b>principal</b> trades from inventory for a <b>mark-up</b>.</p>`,
traps:["OTFs <b>cannot</b> trade equities.","An SI <b>cannot</b> also run an OTF.","AIM has <b>no</b> minimum size or track record."]}
];

{id:"4.1", title:"Types of Property", blurb:"Residential, commercial and agricultural property compared.",
html:`<div class="tw"><table class="tbl"><tr><th></th><th>Residential</th><th>Commercial</th><th>Agricultural</th></tr>
<tr><td>Tenancies</td><td><b>Short</b></td><td><b>Long</b>, often 10+ years</td><td>Wide range</td></tr>
<tr><td>Repairs</td><td><b>Landlord</b></td><td><b>Tenant</b> usually</td><td>Agreed at the outset</td></tr>
<tr><td>Returns</td><td>Mainly <b>house prices</b></td><td>Big part from <b>rent</b></td><td>Rent + land value</td></tr></table></div>
<ul><li><b>Residential</b>: mainly buy-to-let. A sale takes <b>3 to 6 months</b>.</li>
<li><b>Commercial</b>: retail, offices, industrial. Leases up to <b>25 years</b> with <b>3 or 5-year</b> reviews. <b>Offices, factories and warehouses yield most; retail yields least.</b> Agents match buyers and sellers.</li>

traps:[]},

{id:"4.2", title:"Returns from Property", blurb:"Rental yield, rent tax, capital returns and the key drivers.",
html:`<p>Long term, property <b>beats cash and gilts</b> but <b>slightly lags equities</b>. Strategies: <b>buy and hold</b> or <b>fix and flip</b>.</p>
<p><span class="formula">Rental yield = (Gross rent − Expenses) ÷ Cost incl. purchase costs</span></p>
<ul><li>Allow for <b>voids</b>. Purchase costs include legal fees, surveys, <b>SDLT</b>, agent fees.</li><li><b>Upward-only rent reviews</b> hedge inflation.</li></ul>
<div class="worked"><b class="lab">Worked example</b>£240,000 + £10,000 costs = £250,000. Rent £15,000 − £1,250 void − £2,750 expenses = £11,000. £11,000 ÷ £250,000 = <b>4.4%</b>.</div>
<div class="tw"><table class="tbl"><tr><th>Tax on rent</th><th>Detail</th></tr>
<tr><td>Treatment</td><td>Business income; losses on one property offset another</td></tr>
<tr><td>Rent-a-room</td><td>Tax free up to <b>£7,500</b> (2025/26)</td></tr>
<tr><td>Commercial</td><td>Annual Investment Allowance and Writing Down Allowance</td></tr></table></div>
<ul><li><b>Higher interest rates hurt all property.</b> Neglected buildings depreciate to land value.</li>
<li>Drivers in order: <b>position in the cycle</b>, <b>GDP growth</b>, <b>inflation</b>. Income is the main source of real return.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Scenario</th><th>Effect</th></tr>
<tr><td><b>Best</b></td><td>High growth, low inflation (<b>NICE</b>)</td></tr>
<tr><td><b>Worst</b></td><td>High inflation, low growth (<b>stagflation</b>)</td></tr></table></div>
<p>Rule: property preferred to equities when <b>low inflation</b> is expected, <b>unless</b> growth is also low. Direct property has <b>low</b> measured volatility because it's valued infrequently. Commercial is more vulnerable to downturns.</p>`,
traps:[]},

{id:"4.3", title:"Key Risks", blurb:"Locked-in capital, liquidity, tenants, maintenance and rates.",
html:`<div class="tw"><table class="tbl"><tr><th>Risk</th><th>Detail</th></tr>
<tr><td>Capital locked in</td><td>Years without a return</td></tr>
<tr><td>Liquidity</td><td>Hard to sell, funds may suspend</td></tr>
<tr><td>No tenants / tenant risk</td><td>Costs during voids; unpaid rent, damage</td></tr>
<tr><td>Maintenance</td><td>Safety checks and repairs</td></tr>
<tr><td>Falling prices</td><td>Especially when <b>rates rise</b></td></tr></table></div>
<ul><li><b>LTAFs</b> were introduced to improve liquidity management.</li>
<li>Crashes: <b>UK 1989–92</b> (London office rents <b>halved</b>), <b>subprime from 2006</b>.</li></ul>`,
traps:[]},

{id:"4.4", title:"Direct Ownership", blurb:"Leases, borrowing, SDLT, conveyancing, tenants and voids.",
html:`<div class="tw"><table class="tbl"><tr><th>Interest</th><th>Detail</th></tr>
<tr><td><b>Freehold</b></td><td>Full right to use and sell</td></tr>
<tr><td><b>Leasehold</b></td><td>Use for a set period</td></tr>
<tr><td><b>Commonhold</b></td><td><b>England and Wales only.</b> Each flat freehold; common areas run by a <b>Commonhold Association</b></td></tr></table></div>
<ul><li>A <b>tenant's</b> break clause is assumed to be used (<b>negative</b>). A <b>landlord's</b> break is <b>positive</b>.</li>
<li>Most property is <b>geared</b>: risk of <b>negative equity</b>. <b>Help to Buy</b> (closed 2023): up to <b>20% (40% London)</b>.</li></ul>
<h3>SDLT</h3>
<p>England and NI. Wales has <b>LTT</b>, Scotland <b>LBTT</b>. Charged on <b>each slice</b>.</p>
<div class="tw"><table class="tbl"><tr><th>Residential slice</th><th>Rate</th></tr>
<tr><td>Up to £125,000</td><td>0%</td></tr><tr><td>£125,001–£250,000</td><td>2%</td></tr><tr><td>£250,001–£925,000</td><td>5%</td></tr><tr><td>£925,001–£1.5m</td><td>10%</td></tr><tr><td>Above £1.5m</td><td>12%</td></tr><tr><td>Over £500,000 bought by companies</td><td>15%</td></tr></table></div>
<div class="worked"><b class="lab">Worked example</b>£500,000: £2,500 + £12,500 = <b>£15,000</b>. £930,000: £2,500 + £33,750 + £500 = <b>£36,750</b>.</div>
<ul><li><b>+5%</b> for additional homes (refund if old home sold within <b>3 years</b>). <b>+2%</b> for <b>non-UK residents</b>. First-time buyer relief.</li>
<li>Non-residential: 0% to £150,000, 2% to £250,000, 5% above.</li>
<li>Letting agents charge <b>10–20%</b> of rent.</li></ul>
<h3>Conveyancing</h3>
<p>Searches, contract, queries, then <b>exchange of contracts (legally binding)</b>, then <b>completion</b> (money and keys).</p>
<p><b>Guaranteed rent</b>: stable but below market (fees <b>10–50%</b>). <b>Rent guarantee insurance</b> covers voids, arrears and eviction.</p>`,
traps:["A <b>tenant's</b> break clause is negative. A <b>landlord's</b> is positive.","SDLT is charged on <b>each slice</b>, not the whole price.","Exchange of contracts is the <b>point of no return</b>, not completion."]},

{id:"4.5", title:"AREF and the Red Book", blurb:"The AREF quality mark and RICS valuation standards.",
html:`<ul><li><b>AREF</b>: UK body for property funds. Its <b>quality mark</b> covers <b>three areas</b>: governance, operation, and unit dealing and performance reporting.</li>
<li>Code of Practice: <b>minimum compliance</b> and <b>best practice</b>. Members confirm <b>annually</b>.</li>
<li><b>Red Book</b> = RICS standards. First <b>1976</b>, used in <b>146 countries</b>. Updated <b>January 2024</b> to align with International Valuation Standards.</li></ul>`,
traps:[]},

{id:"4.7", title:"Valuation and Performance", blurb:"Initial yield, GRM, cap rate, rent reviews and property indices.",
html:`<div class="tw"><table class="tbl"><tr><th>Measure</th><th>Formula</th><th>Key points</th></tr>
<tr><td><b>Initial yield</b></td><td>Annual rent ÷ Value</td><td>Simplest snapshot</td></tr>
<tr><td><b>GRM</b></td><td>Price ÷ Gross annual rent</td><td>Lower = more affordable. <b>Ignores expenses</b></td></tr>
<tr><td><b>Cap rate</b></td><td>Net operating income ÷ Price</td><td><b>More reliable</b> than GRM</td></tr></table></div>
<div class="worked"><b class="lab">Worked example</b>£2m office, £160,000 rent, £40,000 costs. GRM = <b>12.5</b>. Cap rate = 120,000 ÷ 2,000,000 = <b>6%</b>.</div>
<ul><li>Sellers want the <b>lowest</b> cap rate (highest price); buyers the highest. Riskier property = <b>higher</b> cap rate.</li>
<li>Rents reviewed every <b>3 to 5 years</b>, often upward-only; disputes go to an <b>independent expert</b>.</li>
<li><b>Reversionary value</b> = value at lease end. Leasehold value falls as the lease runs down. <b>Leaseholder improvements are ignored.</b></li></ul>
<div class="tw"><table class="tbl"><tr><th>Index</th><th>Covers</th></tr>
<tr><td>MSCI Property</td><td>Many sectors; monthly or quarterly</td></tr>
<tr><td>AREF</td><td>Quarterly, collective schemes</td></tr>
<tr><td>Investment Association</td><td>"UK Direct Property" and "Property Other"</td></tr>
<tr><td>AIC</td><td>Investment trusts, <b>8</b> property sectors</td></tr>
<tr><td>Nationwide / Halifax</td><td>House prices, seasonally adjusted</td></tr></table></div>
<p>Indices use <b>valuations, not sale prices</b>, so they <b>understate volatility</b>.</p>`,
traps:["GRM ignores <b>expenses</b>. Cap rate includes them.","Sellers like a <b>low</b> cap rate.","Leaseholder improvements are <b>disregarded</b>."]},

{id:"4.8", title:"Indirect Property", blurb:"Property shares, unit trusts, PAIFs, LTAFs, REITs and other vehicles.",
html:`<ul><li><b>Property shares</b>: main advantage is <b>liquidity</b>; gearing adds volatility.</li>
<li><b>Unit trusts/OEICs</b>: max <b>15%</b> in one property; limits on leases under <b>60 years</b>. Priced at NAV; can <b>postpone</b> redemptions. <b>No CGT inside the fund.</b></li></ul>
<h3>PAIFs</h3>
<p>Must be an <b>OEIC</b>. Rental profits tax-exempt in the fund; other taxable income at <b>20%</b>. Three distribution streams. Conditions: <b>60%+</b> income and <b>60%+</b> assets from property; no corporate holder with <b>10%+</b>.</p>
<h3>LTAFs</h3><p>Introduced <b>2021</b> for open-ended liquidity problems. Allow <b>longer notice periods</b>.</p>
<h3>REITs</h3>
<p>Tax-transparent, <b>closed-ended</b>, listed. UK launch <b>2007</b>. <b>Can borrow</b>. No corporation tax on property income if conditions met; investors still pay income tax and CGT.</p>
<div class="tw"><table class="tbl"><tr><th>REIT condition</th><th>Requirement</th></tr>
<tr><td>Residence</td><td><b>UK only</b></td></tr><tr><td>Listing</td><td>Recognised exchange (<b>AIM counts</b>)</td></tr>
<tr><td>Shareholders</td><td>At least <b>100</b>; none with <b>10%+</b>; not a close company</td></tr>
<tr><td>Income</td><td><b>75%+</b> from rent</td></tr><tr><td>Distribution</td><td><b>90%+</b> paid out</td></tr>
<tr><td>Assets</td><td><b>75%+</b> property; no single property over <b>40%</b></td></tr><tr><td>Interest cover</td><td><b>1.25×</b></td></tr></table></div>
<p><b>Finance Act 2024</b>: one commercial property worth <b>£20m+</b> is enough (no longer need 3).</p>
<div class="tw"><table class="tbl"><tr><th>Other vehicle</th><th>Key points</th></tr>
<tr><td>Property ETFs</td><td>Hold <b>housebuilders and REITs</b>, not buildings</td></tr>
<tr><td>Life assurance property bonds</td><td>A life policy. <b>Can't borrow</b>. Taxed <b>20% in the fund</b>; non-taxpayers <b>can't reclaim</b></td></tr>
<tr><td>Offshore funds</td><td>Lighter regulation</td></tr>
<tr><td>Limited partnerships</td><td>Tax authorities <b>look through</b></td></tr></table></div>`,
traps:["PAIF = <b>OEIC</b>, 60/60/10. REIT = 75% income, <b>90% paid out</b>, 75% assets, 40% single property, 1.25× cover, 100 holders.","REITs <b>can</b> borrow. Life property bonds <b>can't</b>.","Property ETFs usually <b>don't</b> own buildings."]},

{id:"4.9", title:"Strategies, Direct vs Indirect", blurb:"Fund styles, direct vs indirect, pros and cons, open vs closed-ended.",
html:`<ul><li>Indirect funds: active <b>or passive</b> (passive only holds listed shares). Direct funds: <b>active only</b>.</li>
<li>Direct funds follow the <b>economy</b>; indirect follow <b>company results</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th></th><th>Direct</th><th>Indirect</th></tr>
<tr><td>Capital</td><td>Large</td><td>Much lower</td></tr><tr><td>Liquidity</td><td>Illiquid</td><td>Better</td></tr>
<tr><td>Costs</td><td>Higher</td><td>Lower</td></tr><tr><td>Tax reliefs</td><td><b>May be available</b></td><td>Not available</td></tr>
<tr><td>Active/passive</td><td>Active only</td><td>Both</td></tr></table></div>
<p>Pros: cash flow, stable income, inflation hedge, low correlation, tangible. Cons: location, tenants, illiquidity, property <b>shares</b> move with equities, admin, rate sensitivity.</p>
<h3>Open vs closed-ended</h3>
<ul><li>FCA rule: open-ended funds must <b>suspend</b> if a valuer <b>can't value at least 20%</b> of assets.</li>
<li>Funds may switch from <b>offer to bid pricing</b> to protect remaining investors.</li>
<li>Closed-ended funds <b>never have to sell</b>; illiquidity shows as wider discounts.</li></ul>`,
traps:["Direct property funds are <b>active only</b>.","Tax reliefs are only on <b>direct</b> property.","FCA suspension trigger: <b>20%</b> can't be valued."]},

{id:"4.13", title:"Pricing, ESG and Trends", blurb:"Valuers, building emissions, retail decline, offices and logistics.",
html:`<ul><li>Most commercial property isn't exchange traded, so <b>valuers</b> estimate prices using the <b>Red Book</b>.</li>
<li><b>ESG</b>: buildings and construction cause about <b>37%</b> of global operational energy and process CO₂. Links to <b>UN SDG 11</b>. Green certifications.</li>
<li><b>Retail</b>: high street decline began <b>before COVID</b>; the pandemic <b>accelerated</b> it. E-commerce <b>$6.3 trillion in 2024 (3.7× 2014)</b>, driving demand for <b>warehouses and logistics</b>.</li>
<li><b>Offices</b>: remote working. <b>Agriculture</b>: mostly insulated from COVID.</li></ul>`,
traps:[]}
];

{id:"5.3", title:"Commodities and Gold", blurb:"Hard vs soft commodities, routes in, and the five ways into gold.",
html:`<div class="tw"><table class="tbl"><tr><th></th><th>Hard</th><th>Soft</th></tr>
<tr><td>Examples</td><td>Metals</td><td>Wool, cotton, cocoa, coffee, sugar</td></tr>
<tr><td>Supply</td><td><b>Finite</b></td><td><b>Renewable</b></td></tr>
<tr><td>Other</td><td>Industrial demand</td><td><b>Perishable</b>, volatile</td></tr></table></div>
<p>3 ways in: <b>spread betting</b> (losses <b>unlimited</b>), <b>mining shares</b>, <b>commodity funds</b> (best for most).</p>
<h3>Gold</h3>
<ul><li>Attractive when <b>inflation soars, currencies weaken and stocks fall</b>. Demand tracks <b>fear</b>.</li>
<li><b>No dividends.</b> Only makes money if the price per ounce rises. Keep it a <b>small</b> part of a portfolio.</li>
<li><b>Most conservative route:</b> a <b>unit trust, OEIC or investment trust</b>.</li></ul>
<div class="worked"><b class="lab">The 5 ways into gold</b>1. Coins and bars · 2. Certificates · 3. Precious metals mutual funds · 4. Mining company shares · 5. Futures</div>`,
traps:["Soft = <b>renewable and perishable</b>. Hard = <b>finite</b>.","Spread betting losses are <b>unlimited</b>.","Gold pays <b>no</b> income."]},

{id:"5.4", title:"Land", blurb:"Four ways to invest in agricultural and development land.",
html:`<div class="tw"><table class="tbl"><tr><th>Method</th><th>Detail</th></tr>
<tr><td>Rent to farmers</td><td>Income from crops, trees or livestock</td></tr>
<tr><td>Planning permission</td><td>Buy and seek permission to raise value</td></tr>
<tr><td>Sell to a developer</td><td>For a capital sum</td></tr>
<tr><td>Keep the freehold</td><td>Income from <b>ground rents</b></td></tr></table></div>
<p>Lower liquidity, <b>much higher</b> transaction costs, different drivers from bonds and equities.</p>`,
traps:[]},

{id:"5.5", title:"Crypto and NFTs", blurb:"Cryptocurrencies, their risks, regulation and tax, and NFTs.",
html:`<ul><li>Created after the <b>financial crisis</b>. First: <b>Bitcoin, 2009</b>. <b>9,000–20,000</b> exist; total about <b>$3.2 trillion</b>, top 10 about <b>90%</b>.</li>
<li>Use <b>encryption</b>. You need a <b>digital wallet</b>.</li></ul>
<div class="worked"><b class="lab">The 3 ways to get crypto</b>1. Buying with fiat · 2. Earning it · 3. Mining</div>
<div class="tw"><table class="tbl"><tr><th>Risk</th><th>Detail</th></tr>
<tr><td>Volatility</td><td>Huge swings</td></tr><tr><td>Decentralised</td><td>Low volume and liquidity</td></tr>
<tr><td>Unregulated</td><td>Outside central bank control</td></tr><tr><td>Not reserve-backed</td><td>No tangible assets</td></tr>
<tr><td>Scalability</td><td>Mining uses huge energy</td></tr><tr><td>Hacking / error</td><td><b>Not FSCS covered</b></td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Regulation</th><th>Detail</th></tr>
<tr><td>UK</td><td>Wallet providers register with the <b>FCA</b>, follow <b>5MLD</b>. Promotions restricted</td></tr>
<tr><td>Japan</td><td>Exchanges register with the <b>FSA</b></td></tr>
<tr><td>China, Saudi Arabia</td><td><b>Banned</b></td></tr>
<tr><td>April 2025 / May 2025</td><td>Draft law to bring crypto in; FCA <b>DP25/1</b></td></tr></table></div>
<p><b>Tax:</b> gains subject to <b>CGT</b>; <b>losses allowable</b> (with proof if from a lost key or fraud).</p>
<h3>NFTs</h3>
<p><b>Unique</b> tokens on a blockchain: proof of ownership, like a cyber deed. <b>No copyright or IP rights.</b> Risks: theft, fakes, unregulated, no legal definition.</p>`,
traps:["Crypto is <b>not</b> FSCS-protected.","Crypto gains = <b>CGT</b>, losses <b>allowable</b>.","NFTs give <b>no copyright</b>."]},

{id:"5.6", title:"Liquidity and Time Horizon", blurb:"Illiquidity, hedge fund lock-ins and liquid alts.",
html:`<ul><li>Often illiquid: transfer restrictions, <b>no secondary market</b>.</li>
<li><b>Hedge funds</b>: lock-in of <b>1 to 3 years</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th></th><th>Traditional alternatives</th><th>Liquid alts</th></tr>
<tr><td>What</td><td>Art, wine, hedge funds</td><td>Funds using alternative strategies</td></tr>
<tr><td>Trading</td><td>Hard to sell</td><td><b>Daily</b></td></tr>
<tr><td>Risks</td><td>Known illiquidity</td><td><b>Opaque</b>; may close in volatile markets</td></tr></table></div>`,
traps:[]},

{id:"5.7", title:"Costs", blurb:"Physical asset costs, AIFs and hedge fund 2 and 20.",
html:`<div class="worked"><b class="lab">The 4 physical asset costs</b>1. Storage · 2. Insurance · 3. Delivery · 4. Dealers' charges</div>
<ul><li><b>AIFs</b>: high fees and high minimums.</li>
<li>Hedge funds: minimum usually <b>£50,000+</b> (some £1m+). <b>2% management, 20% performance</b>: "2 and 20".</li>
<li><b>Transaction costs are lower</b> because of long horizons and <b>low turnover</b>.</li></ul>
<div class="worked"><b class="lab">Worked example</b>£1m fund makes 10%. 2% × £1m = £20,000; 20% × £100,000 = £20,000. Fees <b>£40,000</b>.</div>`,
traps:["Hedge fund fees = <b>2% management, 20% performance</b>.","Alternatives have <b>higher</b> running costs but <b>lower</b> transaction costs."]},

{id:"5.8", title:"Pricing and Fair Value", blurb:"Valuing collectibles and the three private company methods.",
html:`<p>Driven by <b>demand</b> and <b>supply</b> (scarcity). Until sold, value is the <b>valuer's opinion</b>. AIF managers follow <b>Fair Value Measurement</b>.</p>
<div class="tw"><table class="tbl"><tr><th>Asset</th><th>Valuation factors</th></tr>
<tr><td>Fine wine</td><td>Region, vintage, age, producer, critic scores</td></tr>
<tr><td>Antiques</td><td>Rarity, age, condition, <b>provenance</b></td></tr>
<tr><td>Classic cars</td><td>Make, spec, history, mileage</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Private company method</th><th>How</th><th>Weakness</th></tr>
<tr><td>1. Asset value</td><td>Assets − liabilities</td><td><b>Ignores future earnings</b></td></tr>
<tr><td>2. P/E</td><td>Comparable multiple × profit. <b>Most widely used</b></td><td>Hard to find a comparable</td></tr>
<tr><td>3. DCF</td><td>Future cash flows discounted</td><td><b>Subjective</b></td></tr></table></div>`,
traps:["P/E is the <b>most widely used</b> method for private companies.","Asset value <b>ignores</b> future earnings."]},

{id:"5.9", title:"Direct vs Indirect and 60/40", blurb:"The 60/40 portfolio and why 2023 pushed investors to alternatives.",
html:`<ul><li><b>60/40</b> = 60% equities, 40% bonds: the neutral allocation.</li>
<li>Works because when the economy weakens, rates are cut: <b>bonds rise while shares fall</b>.</li>
<li><b>2023</b>: equities and bonds had their <b>strongest correlation in decades</b>, so investors moved into <b>alternatives</b>.</li>
<li>Access alternatives directly, indirectly or both, based on objectives and risk profile.</li></ul>`,
traps:["The 60/40 problem in <b>2023</b> = bonds and equities became highly <b>correlated</b>."]}
];

const EXAM_RAW = [{"id":"CH1-NC-001","sec":"cash","t":"1.2","tl":"1.2 Interest rates","calc":false,"q":"Assuming normal market conditions, which of the following would typically earn the HIGHEST rate of interest?","o":["£250,000 in an instant access account","£5,000 in a 3-year fixed-term deposit","£250,000 in a current account","£250,000 in a 3-year fixed-term deposit"],"a":3,"why":"Three factors normally push the rate up: a bigger deposit (tiered rates), a longer term, and less access. The £250,000 3-year fixed deposit has all three. The £5,000 fixed deposit is smaller, the instant access account gives up rate for liquidity, and current accounts usually pay no interest.","eq":"No calculation needed. Key rule: Bigger deposit + longer term + less access = higher rate."},{"id":"CH1-NC-002","sec":"cash","t":"1.2","tl":"1.2 Interest rates","calc":false,"q":"A bank's 5-year fixed-rate deposit pays less than its 1-year fixed-rate deposit. Which is the MOST likely explanation?","o":["The bank has a low credit rating","The 5-year deposit is FSCS protected but the 1-year deposit is not","The market expects short-term interest rates to fall in future","The 5-year rate is quoted as an AER, but the 1-year rate is not"],"a":2,"why":"This is an inverse cash rate: long-term deposit rates below short-term rates. Banks will not lock in a high rate for 5 years if they expect rates to fall, so they offer less on the longer term. A low credit rating would push all of the bank's rates up, not just the short ones. FSCS cover does not depend on the term, and AER does not reverse the normal term structure.","eq":"No calculation needed. Key rule: Inverse cash rate = long-term rates below short-term rates, usually because rates are expected to fall."},{"id":"CH1-NC-003","sec":"cash","t":"1.2","tl":"1.2 Interest rates","calc":false,"q":"Which of the following statements about the AER are correct?\nI. It is normally quoted gross\nII. Its standard basis is 365 days\nIII. It equals the nominal rate when interest is paid once a year\nIV. It is quoted net of basic rate tax","o":["I, II and III only","I and IV only","II, III and IV only","I, II, III and IV"],"a":0,"why":"The AER is normally quoted gross (before tax) on a 365-day basis. When interest is paid only once a year there is no compounding within the year, so the AER equals the nominal rate. Statement IV is false: the AER is quoted gross, not net.","eq":"No calculation needed. Key rule: AER = gross, 365-day basis, shows compounding as if paid once a year. Annual payment means AER = nominal rate."},{"id":"CH1-NC-004","sec":"cash","t":"1.4","tl":"1.4 Risks","calc":false,"q":"UK CPI inflation moves from +2.1% to -0.4% over a year. Which of the following is correct?","o":["This is disinflation, because the inflation rate has fallen","This is deflation, and consumers will bring spending forward before prices rise","This is deflation. The real value of cash rises, but deposit rates are likely to fall","This is disinflation, and the real value of cash falls"],"a":2,"why":"Prices are now falling (negative inflation), so this is deflation, not disinflation. Disinflation means inflation is still positive but slowing. In deflation each £1 buys more, so cash gains purchasing power, but interest rates are likely to fall too. Consumers tend to delay spending, not bring it forward, because they expect lower prices later.","eq":"No calculation needed. Key rule: Deflation = prices falling. Disinflation = inflation positive but slowing. Deflation means people delay spending."},{"id":"CH1-NC-005","sec":"cash","t":"1.4","tl":"1.4 Risks","calc":false,"q":"Shortly after a client opens a 5-year fixed-rate bond, both inflation and market interest rates rise sharply. The bank is sound and makes no errors. Which risks has the client experienced?","o":["Default risk only","Operational risk and institutional risk","Inflation risk and interest rate risk","Deflation risk and default risk"],"a":2,"why":"Rising inflation erodes the fixed return, possibly making it negative in real terms (inflation risk). Being locked into a fixed rate while market rates rise is interest rate risk. Default, operational and institutional risks are ruled out because the bank is sound and makes no errors.","eq":"No calculation needed. Key rule: Fixed-rate accounts are most exposed to inflation risk and to the interest rate risk of being locked in."},{"id":"CH1-NC-006","sec":"cash","t":"1.4","tl":"1.4 Risks","calc":false,"q":"A bank's staff repeatedly fail to carry out anti-money laundering checks. The bank is fined by the regulator and suffers serious reputational damage. Which risk does this illustrate?","o":["Operational risk","Credit risk","Institutional risk","Interest rate risk"],"a":2,"why":"Institutional risk is the risk that a bank fails to manage its regulatory obligations, such as anti-money laundering, which leads to penalties and reputational damage. Operational risk in the notes refers to poor service that causes a loss to the customer, such as failing to move money as instructed.","eq":"No calculation needed. Key rule: Institutional risk = regulatory failure leading to fines and reputational damage. Operational risk = poor service causing a customer loss."},{"id":"CH1-NC-007","sec":"cash","t":"1.6","tl":"1.6 Regulation","calc":false,"q":"Which of the following firms would be regulated by the FCA for BOTH conduct and prudential matters?","o":["A building society","A discretionary investment management firm","An insurance company","A credit union"],"a":1,"why":"The PRA is the prudential regulator for banks, building societies, insurers, credit unions and major investment firms. The FCA regulates the conduct of all firms, and also handles prudential regulation for firms the PRA doesn't cover, such as asset managers and IFAs. So the asset manager is FCA-only, while the other three are dual-regulated.","eq":"No calculation needed. Key rule: PRA = prudential regulation of deposit takers, insurers and major investment firms. FCA = conduct for all firms, plus prudential for everyone else."},{"id":"CH1-NC-008","sec":"cash","t":"1.6","tl":"1.6 Regulation","calc":false,"q":"Which of the following correctly pairs US regulators with their responsibilities?","o":["FSOC: consumer protection. CFPB: systemic risk","OCC: national banks. FDIC: banks not in the Federal Reserve system","Fed: national banks only. OCC: systemically important financial institutions","FDIC: systemic risk. FSOC: deposit insurance"],"a":1,"why":"The OCC supervises national banks, and the FDIC covers banks that are not in the Fed system. The other options swap the roles: the CFPB handles consumer protection, the FSOC handles systemic risk, and the Fed supervises large deposit takers and SIFIs.","eq":"No calculation needed. Key rule: Fed = central bank, large banks and SIFIs. FDIC = non-Fed banks. OCC = national banks. CFPB = consumers. FSOC = systemic risk."},{"id":"CH1-NC-009","sec":"cash","t":"1.6","tl":"1.6 Regulation","calc":false,"q":"Which of the following statements about international bank regulation is correct?","o":["The EBA was set up in 2014 and cannot overrule national regulators","France's ACPR is part of the Banque de France, and eurozone supervision is coordinated through the Single Supervisory Mechanism","Japan's current Banking Act dates from 1927","Italian banks are supervised by BaFin"],"a":1,"why":"The ACPR sits within the Banque de France, and the SSM coordinates eurozone supervision. The EBA was set up in 2011 and can overrule national regulators. Japan's current Banking Act is from 1981 (the first was 1927). BaFin is German; Italy's supervisor is the Bank of Italy.","eq":"No calculation needed. Key rule: EBA = 2011, can overrule national regulators. Japan Banking Act = 1981 (first 1927). Germany = Bundesbank + BaFin. France = ACPR."},{"id":"CH1-NC-010","sec":"cash","t":"1.7","tl":"1.7 Deposit protection","calc":false,"q":"Which of the following deposits would be protected by the UK FSCS?","o":["A deposit held in the Guernsey branch of a UK bank","A deposit held by a large multinational company","A US dollar deposit held by a UK individual with a UK-authorised bank","Bitcoin held with a UK-based crypto exchange"],"a":2,"why":"Foreign currency deposits with a UK-authorised firm are covered, and any compensation is paid in sterling. Deposits in the Channel Islands and Isle of Man are outside the FSCS (they have their own £50,000 schemes). Large businesses are excluded, and crypto is not covered.","eq":"No calculation needed. Key rule: FSCS covers individuals and small businesses at UK-authorised firms. It excludes the Channel Islands, the Isle of Man, large businesses and crypto. Foreign currency claims are paid in sterling."},{"id":"CH1-NC-011","sec":"cash","t":"1.7","tl":"1.7 Deposit protection","calc":false,"q":"Which of the following P2P investors could potentially claim compensation from the FSCS?","o":["An investor who invested on an execution-only basis in 2020, and the platform has collapsed","An investor who received unsuitable advice in January 2016 from a firm that has since failed","Any P2P investor whose loans default, up to £85,000","An investor who invested in 2019 after unsuitable advice from an authorised firm that has since failed"],"a":3,"why":"P2P is only covered (up to £85,000) where an authorised firm gave unsuitable advice on or after 6 April 2016 and cannot pay. Execution-only investments are not covered. January 2016 advice predates the cut-off. A borrower defaulting is simply investment risk, not an FSCS event.","eq":"No calculation needed. Key rule: P2P FSCS cover only applies to unsuitable advice given on or after 6 April 2016 by an authorised firm that has failed."},{"id":"CH1-NC-012","sec":"cash","t":"1.10","tl":"1.10 Money market funds","calc":false,"q":"Which of the following statements about money market fund structures are correct?\nI. A CNAV fund keeps its NAV constant, with income accrued daily\nII. An ANAV fund pays no income, and its unit price rises instead\nIII. An LVNAV fund can keep a constant NAV only while its assets stay within 0.2% of face value\nIV. A VNAV fund keeps its NAV fixed at £1","o":["I and IV only","I, II and III only","II, III and IV only","I, II, III and IV"],"a":1,"why":"CNAV funds keep a stable NAV and accrue income daily. ANAV (roll-up) funds pay no income, so their price rises. LVNAV funds keep a constant NAV only within the 0.2% band. A VNAV fund's NAV moves with mark-to-market valuation, so statement IV is false.","eq":"No calculation needed. Key rule: CNAV = constant NAV, income paid. ANAV = price rises. LVNAV = constant within 0.2%, max 5 years. VNAV = NAV moves."},{"id":"CH1-NC-013","sec":"cash","t":"1.10","tl":"1.10 Money market funds","calc":false,"q":"Which of the following BEST describes the amortised cost valuation method used by most money market funds?","o":["Instruments are marked to market daily using quoted prices","Instruments are valued at face value from the day they are bought","Instruments are assumed to be held to maturity, and the gap between the purchase price and face value is released on a straight-line basis","Instruments are valued at the present value of their cash flows, discounted at SONIA"],"a":2,"why":"Under amortised cost, each instrument is assumed to be held to maturity, and the discount to face value is released evenly over time. The alternative method is the quoted price, which is the present value of the cash flows. Valuing at face value from day one would ignore the discount entirely.","eq":"No calculation needed. Key rule: Amortised cost = assume held to maturity, release the discount on a straight-line basis. It is the usual MMF method."},{"id":"CH1-NC-014","sec":"cash","t":"1.10","tl":"1.10 Money market funds","calc":false,"q":"Which of the following correctly pairs an overnight benchmark with its features?","o":["SONIA: secured on gilts and run by the New York Fed","€STR: secured on Bunds, with a minimum trade size of £25m","SOFR: unsecured, launched in 1997","TONA: JPY, unsecured interbank overnight rate"],"a":3,"why":"TONA is the unsecured JPY overnight rate. SONIA is unsecured and run by the Bank of England (since 2018), with a £25m minimum. €STR is unsecured and covers trades over €1m. SOFR is the secured one (on US Treasuries), run by the New York Fed.","eq":"No calculation needed. Key rule: SOFR is the only secured benchmark. SONIA = GBP, BoE, 1997, £25m. €STR = EUR, over €1m. TONA = JPY."},{"id":"CH1-NC-015","sec":"cash","t":"1.9","tl":"1.9 NS&I","calc":false,"q":"A client wants to invest £60,000 at a fixed rate for 3 years, will not need access to it, and wants the money to fund environmental projects. Which NS&I product fits, and how is the interest taxed?","o":["Green Savings Bond; the interest is tax free","Green Savings Bond; the interest is taxable","British Savings Bond; the interest is tax free","Income Bonds; the interest is taxable"],"a":1,"why":"The Green Savings Bond pays a fixed rate, has a 3-year term with no withdrawals, accepts £100 to £100,000, and funds green projects. It is one of NS&I's taxable products. Income Bonds are variable rate with monthly payments, and British Savings Bonds are taxable, not tax free.","eq":"No calculation needed. Key rule: NS&I tax-free products = Premium Bonds, Direct ISA, Junior ISA. Everything else is taxable. No NS&I product is subject to CGT."},{"id":"CH1-NC-016","sec":"cash","t":"1.9","tl":"1.9 NS&I","calc":false,"q":"Which of the following children could open an NS&I Junior ISA (2025/26)?","o":["A 15-year-old who holds a Child Trust Fund","An 18-year-old student","A 12-year-old who has never held a Child Trust Fund","A 10-year-old who wants to save £12,000 in it this year"],"a":2,"why":"A Junior ISA is for under-18s without a Child Trust Fund. An 18-year-old is too old (the account becomes an adult cash ISA at 18), and the annual limit is £9,000, not £12,000.","eq":"No calculation needed. Key rule: Junior ISA = under 18, no Child Trust Fund, £9,000 a year (2025/26), no withdrawals before 18."},{"id":"CH1-NC-017","sec":"cash","t":"1.11","tl":"1.11 P2P lending","calc":false,"q":"Which of the following statements about P2P lending are correct?\nI. Interest is paid gross and must be declared to HMRC\nII. Interest is tax free within an Innovative Finance ISA\nIII. The quoted rate already allows for expected defaults\nIV. Platforms guarantee to buy back loans at par if a lender wants to leave early","o":["I, II and III only","I and IV only","II, III and IV only","I, II, III and IV"],"a":0,"why":"Statements I to III are all correct. Statement IV is false: to leave early a lender must sell the loan to another lender, a sale is not guaranteed, and there is usually a fee.","eq":"No calculation needed. Key rule: P2P = debt, paid gross, IFISA tax free, quoted rate allows for defaults, no guaranteed early exit, no FSCS cover (unless advised)."},{"id":"CH1-NC-018","sec":"cash","t":"1.12","tl":"1.12 FX","calc":false,"q":"Which of the following statements about the FX market are correct?\nI. It trades 24 hours a day, 5 days a week\nII. It is busiest when trading sessions overlap\nIII. Yen pairs are quoted to 4 decimal places, like other pairs\nIV. In the US it is regulated by the CFTC and the NFA","o":["I and III only","II, III and IV only","I, II, III and IV","I, II and IV only"],"a":3,"why":"FX trades 24/5 and is busiest when sessions overlap, such as London and New York. It is regulated in the US by the CFTC and NFA. Statement III is false: pairs are quoted to 4 decimal places except yen pairs.","eq":"No calculation needed. Key rule: FX = OTC, 24/5, about $7.5trn a day. Sessions: Sydney, Tokyo, London, New York. 4 decimal places except yen pairs."},{"id":"CH1-NC-019","sec":"fi","t":"2.1","tl":"2.1 Bond basics","calc":false,"q":"A US company issues a US dollar bond that is offered at the same time in London and in the United States. This is BEST described as:","o":["A global bond","A eurobond","A Yankee bond","A domestic bond"],"a":0,"why":"A dollar bond issued in London would be a eurobond (its currency differs from that of the country of issue). Because it is also issued and traded in the currency's home country (the US) at the same time, it is a global bond.","eq":"No calculation needed. Key rule: Eurobond = currency different from the country of issue. Global bond = a eurobond also issued in the currency's home country at the same time."},{"id":"CH1-NC-020","sec":"fi","t":"2.1","tl":"2.1 Bond basics","calc":false,"q":"A Japanese company issues a US dollar bond in the United States, aimed at US investors. This is BEST described as:","o":["A eurobond","A global bond","A domestic bond","A Yankee bond, which is a foreign bond"],"a":3,"why":"A foreign issuer borrowing in the domestic market, in that market's currency, is issuing a foreign bond. In the US these are called Yankees (Bulldogs in the UK). It is not a eurobond, because the currency matches the country of issue.","eq":"No calculation needed. Key rule: Foreign bond = foreign issuer, domestic market, domestic currency. UK = Bulldog, US = Yankee."},{"id":"CH1-NC-021","sec":"fi","t":"2.1","tl":"2.1 Bond basics","calc":false,"q":"A double-dated UK bond can be redeemed at any time between 4 and 8 years from today. How is it classified?","o":["FT: short. DMO: short","FT: medium. DMO: short","FT: short. DMO: medium","FT: medium. DMO: medium"],"a":3,"why":"Double-dated bonds are classified by the later date, which here is 8 years. Under the FT system mediums are 5 to 15 years, and under the DMO system mediums are 7 to 15 years. So the bond is a medium under both.","eq":"No calculation needed. Key rule: Use the LATER date. FT: short under 5, medium 5-15, long over 15. DMO: short under 7, medium 7-15, long over 15."},{"id":"CH1-NC-022","sec":"fi","t":"2.1","tl":"2.1 / 2.8 Callable bonds","calc":false,"q":"Market interest rates fall sharply. What is the MOST likely outcome for the holder of a callable bond?","o":["The holder puts the bond back to the issuer at par","The issuer calls the bond and the holder must reinvest at lower rates. Option-adjusted duration should be used to measure its rate sensitivity","The bond's price rises without limit as yields fall","The coupon resets lower at the next reset date"],"a":1,"why":"A call option belongs to the issuer, who will repay early when it can borrow more cheaply. That leaves the holder reinvesting at lower rates. Because of the embedded option, option-adjusted duration is the right measure. A put option belongs to the holder, and coupon resets apply to FRNs.","eq":"No calculation needed. Key rule: Callable = issuer's choice, used when rates fall. Puttable = holder's choice. Embedded options = option-adjusted duration."},{"id":"CH1-NC-023","sec":"fi","t":"2.2","tl":"2.2 Government bonds","calc":false,"q":"An index-linked gilt was first issued in 2002. Which indexation lag applies, and what happens if there is deflation?","o":["8 months; repayment can fall below £100, because there is no deflation floor","3 months; repayment cannot fall below £100","8 months; repayment cannot fall below £100","3 months; there is no deflation floor"],"a":0,"why":"ILGs issued before September 2005 have an 8-month lag (3 months for later issues). UK ILGs have no deflation floor, so repayment can fall below £100. US TIPS do have a floor.","eq":"No calculation needed. Key rule: ILG lag: 3 months if issued after Sept 2005, 8 months if older. UK ILGs have no deflation floor; TIPS do."},{"id":"CH1-NC-024","sec":"fi","t":"2.2","tl":"2.2 Government bonds","calc":false,"q":"Which of the following statements about overseas government bonds are correct?\nI. German government bonds pay interest annually\nII. US Treasuries are priced in fractions (1/32)\nIII. Swiss government bonds are sold to bank syndicates\nIV. UK gilts pay interest annually","o":["I and IV only","II, III and IV only","I, II, III and IV","I, II and III only"],"a":3,"why":"Germany pays annually, US Treasuries are priced in 32nds, and Switzerland sells to bank syndicates. Statement IV is false: UK gilts pay semi-annually, like the US, Italy and Japan.","eq":"No calculation needed. Key rule: Semi-annual: US, UK, Italy, Japan. Annual: France, Germany, Netherlands, Spain, Belgium. US is priced in 1/32."},{"id":"CH1-NC-025","sec":"fi","t":"2.3","tl":"2.3 Corporate bonds","calc":false,"q":"A UK investor makes a gain on a sterling-denominated convertible corporate bond. Which of the following is correct?","o":["The bond is not a QCB because it is convertible, so the gain is within the scope of CGT","The gain is exempt, because all sterling corporate bonds are QCBs","The gain is exempt, because convertibles are treated like gilts","The gain is taxed as savings income"],"a":0,"why":"A Qualifying Corporate Bond must meet both tests: it must pay interest without being convertible, and it must be in sterling. This bond is convertible, so it fails the first test and is not a QCB. That means the gain falls within CGT.","eq":"No calculation needed. Key rule: QCB = non-convertible AND sterling. QCBs and gilts are CGT exempt."},{"id":"CH1-NC-026","sec":"fi","t":"2.3","tl":"2.3 Corporate bonds","calc":false,"q":"Which of the following statements about PIBS are correct?\nI. Holders are society members and may share in a demutualisation windfall\nII. On demutualisation they become PSBs, which rank lower than PIBS\nIII. Their interest is cumulative\nIV. They trade in round amounts of 1,000 to 50,000 shares","o":["I, II and IV only","I and III only","II, III and IV only","I, II, III and IV"],"a":0,"why":"Statements I, II and IV are all correct. Statement III is false: PIBS are non-cumulative, so missed interest is lost for good.","eq":"No calculation needed. Key rule: PIBS = building society, irredeemable, non-cumulative, CGT exempt, illiquid. On demutualisation they become PSBs, which rank lower."},{"id":"CH1-NC-027","sec":"fi","t":"2.3","tl":"2.3 Corporate bonds","calc":false,"q":"Why do CoCos pay a higher yield than senior bonds from the same bank?","o":["Holders can choose to convert when the share price rises","They are secured on the bank's assets","Conversion happens automatically when a trigger is hit and favours the issuer, so investors need compensating. Their spreads behave more like subordinated debt","They are guaranteed by the central bank"],"a":2,"why":"A CoCo converts automatically when, for example, the capital ratio breaches a trigger, which works in the issuer's favour. Investors therefore demand a higher yield, and CoCo spreads move more like subordinated debt than equity. Choosing to convert is a feature of ordinary convertibles, not CoCos.","eq":"No calculation needed. Key rule: CoCo = automatic conversion on a trigger, favours the issuer, higher yield, behaves like subordinated debt."},{"id":"CH1-NC-028","sec":"fi","t":"2.6","tl":"2.6 Sukuk","calc":false,"q":"Which of the following BEST describes an Ijarah sukuk?","o":["Investors receive fixed interest on a loan to the issuer","Investors own a share of a tangible asset that is sold and leased back to the originator for a set period, and their returns come from the lease","A perpetual instrument that is redeemed only if the issuer becomes insolvent","An equity instrument that converts automatically on a capital trigger"],"a":1,"why":"Ijarah is a sale and lease-back of a tangible asset. Sukuk holders own a share of the asset and earn from it, because Shariah law forbids interest. Perpetual sukuk are redeemed at the issuer's discretion, not only on insolvency.","eq":"No calculation needed. Key rule: Sukuk = ownership share of an asset, no interest, based on risk sharing. Ijarah = sale and lease-back."},{"id":"CH1-NC-029","sec":"fi","t":"2.7","tl":"2.7 ESG bonds","calc":false,"q":"Which of the following statements about the UK green gilt programme is correct?","o":["The Green Gilt Framework (2021) is aligned with the ICMA Green Bond Principles and excludes fossil fuel exploration, weapons, tobacco, gambling and palm oil","The Green Bond Principles are mandatory under UK law","The first green gilt raised £15bn in 2020","Green gilt proceeds may be used for fossil fuel exploration if the carbon is offset"],"a":0,"why":"The 2021 Framework follows the voluntary ICMA Green Bond Principles and lists those exclusions. The first green gilt was issued in September 2021, matures in July 2033 and raised £16.1bn. The £15bn figure was the 2020 pledge in the Ten-Point Plan, not an actual issue.","eq":"No calculation needed. Key rule: GBP = voluntary, created by the ICMA. First green gilt = Sept 2021, matures July 2033, raised £16.1bn."},{"id":"CH1-NC-030","sec":"fi","t":"2.8","tl":"2.8 Duration","calc":false,"q":"Which of the following bonds has the HIGHEST Macaulay duration?","o":["A 20-year bond with an 8% coupon","A 5-year bond with a 1% coupon","A 5-year zero coupon bond","A 20-year bond with a 1% coupon"],"a":3,"why":"Duration rises with maturity and falls as the coupon rises. The 20-year 1% bond has a long maturity and very small coupons, so most of its value comes from the distant redemption payment. The 5-year zero coupon bond has a duration of exactly 5, far below a 20-year bond.","eq":"No calculation needed. Key rule: Longer maturity and lower coupon mean higher duration and more price volatility. ZCB duration = maturity."},{"id":"CH1-NC-031","sec":"fi","t":"2.8","tl":"2.8 Yields","calc":false,"q":"A bond is bought with a GRY of 6%, but over its life the coupons can only be reinvested at 3%. What is the MOST likely result?","o":["The realised return will be below 6%, because the GRY assumes coupons are reinvested at the GRY","The realised return will be exactly 6%","The realised return will be above 6%","The GRY becomes equal to the running yield"],"a":0,"why":"The GRY assumes the bond is held to redemption and every coupon is reinvested at the GRY itself. Reinvesting at only 3% produces less interest on interest, so the realised return falls below 6%.","eq":"No calculation needed. Key rule: GRY assumes holding to redemption and reinvesting all coupons at the GRY."},{"id":"CH1-NC-032","sec":"fi","t":"2.9","tl":"2.9 Risks","calc":false,"q":"Which of the following statements about bond risks are correct?\nI. FRNs protect against interest rate risk\nII. Index-linked bonds protect against inflation risk\nIII. With credit enhancement, the investor's credit exposure moves to the guarantor\nIV. On-the-run bonds are less liquid than off-the-run bonds","o":["I and IV only","II, III and IV only","I, II and III only","I, II, III and IV"],"a":2,"why":"Statements I to III are all correct. Statement IV is false: on-the-run bonds (the newest issues) are the most liquid.","eq":"No calculation needed. Key rule: FRN = interest rate protection. ILB = inflation protection. On-the-run = newest and most liquid."},{"id":"CH1-NC-033","sec":"fi","t":"2.10","tl":"2.10 Primary and secondary markets","calc":false,"q":"A gilt auction is oversubscribed. Which of the following is correct?","o":["All bids are scaled back equally","Non-competitive bids are filled in full at the weighted average accepted price, and competitive bids go to the highest bidders, pro rata where needed","Non-competitive bids are scaled back first","Competitive bids at the lowest prices are filled first"],"a":1,"why":"Non-competitive bids (£1,000 to £500,000) are always filled in full, at the weighted average of successful competitive bids. Competitive bids are filled from the highest price down, and when there is oversubscription they are allocated pro rata among the highest bidders.","eq":"No calculation needed. Key rule: Non-competitive = always filled, price unknown in advance. Competitive = via a GEMM, minimum £1m, may get nothing if bid too low."},{"id":"CH1-NC-034","sec":"fi","t":"2.10","tl":"2.10 ORB","calc":false,"q":"Which of the following statements about the LSE's Order Book for Retail Bonds (ORB) are correct?\nI. Issue sizes are usually £20m to £300m\nII. Bonds trade on clean prices\nIII. Corporate bonds settle T+2\nIV. It is purely quote-driven, with no order book","o":["I, II and III only","I and IV only","II, III and IV only","I, II, III and IV"],"a":0,"why":"Statements I to III are all correct. Statement IV is false: ORB is order-driven, with market makers providing two-way prices.","eq":"No calculation needed. Key rule: ORB = £20m-£300m issues, 08:45-16:30, tick size £0.01, clean prices. Gilts T+1, corporates T+2."},{"id":"CH1-NC-035","sec":"fi","t":"2.10","tl":"2.10 Accrued interest","calc":false,"q":"An investor sells a gilt during its ex-dividend period. Which of the following is correct?","o":["The seller still receives the full coupon, so interest from settlement to the next payment date is deducted from the sale proceeds","The buyer receives the coupon, so interest is added to the sale proceeds","No adjustment is made, because the price is clean","The registrar splits the coupon equally between buyer and seller"],"a":0,"why":"Whoever is on the register at the ex-dividend date gets the full coupon. Here that is the seller, so the seller must give back the interest for the days after settlement by having it deducted from the proceeds.","eq":"No calculation needed. Key rule: Cum-div = accrued interest is ADDED. Ex-div = interest to the next payment is DEDUCTED. The same rule applies whether buying or selling. Gilts go ex-div 7 working days before payment."},{"id":"CH1-NC-036","sec":"fi","t":"2.11","tl":"2.11 Bond indices","calc":false,"q":"A bond is rated only by Fitch, at BBB-. Is it eligible for the Bloomberg Global Aggregate Index?","o":["No, because at least two ratings are needed","No, because BBB- is below investment grade","Yes. With only one rating, that rating is used, and BBB- meets the Baa/BBB minimum","Yes, but only if S&P also rates it A or better"],"a":2,"why":"The Bloomberg rule uses the middle of three ratings, the lower of two, or the only one if there is just one. BBB- is the lowest investment grade rating, so it meets the Baa/BBB minimum.","eq":"No calculation needed. Key rule: Bloomberg: 3 ratings = middle, 2 = lower, 1 = that one. The minimum is Baa/BBB."},{"id":"CH1-NC-037","sec":"fi","t":"2.12","tl":"2.12 Strategies","calc":false,"q":"A manager switches from a 3-year gilt into a 25-year gilt, expecting the yield curve to flatten. This is BEST described as:","o":["An anomaly switch","An intermarket spread switch","Riding the yield curve","A policy switch"],"a":3,"why":"A policy switch moves between dissimilar bonds (here, very different maturities) to profit from expected changes in rates, the shape of the curve, or ratings. An anomaly switch is between two similar bonds. An intermarket spread switch is between government and corporate bonds.","eq":"No calculation needed. Key rule: Anomaly = similar bonds, pricing anomaly. Policy = dissimilar bonds, expected changes. Intermarket = government vs corporate."},{"id":"CH1-NC-038","sec":"fi","t":"2.13","tl":"2.13 ESG bond types","calc":false,"q":"Which of the following statements about ESG bond types are correct?\nI. The proceeds of a sustainability-linked bond can be used for general corporate purposes\nII. Social impact bond investors are paid only if set outcomes are met\nIII. A social bond pays a fixed coupon and funds social projects\nIV. The ICMA's principles are legally binding","o":["I and IV only","II, III and IV only","I, II and III only","I, II, III and IV"],"a":2,"why":"Statements I to III are all correct. Statement IV is false: all four sets of ICMA guidance (GBP, SBP, SBG and SLBP) are voluntary.","eq":"No calculation needed. Key rule: SLB = not ring-fenced, KPI-linked coupon. SIB = paid only on outcomes, risk like equity. ICMA guidance is voluntary."},{"id":"CH1-NC-039","sec":"eq","t":"3.2","tl":"3.2 Preference shares","calc":false,"q":"Why are preference shares not usually classed as equity?","o":["They never carry voting rights","They rank behind ordinary shares on liquidation","Their returns are limited, and holders do not share fully in the company's risk","They cannot be listed"],"a":2,"why":"Preference holders get a fixed dividend (usually a percentage of nominal value) and only nominal value back on liquidation. Because their returns are capped and they rank ahead of ordinary shareholders, they don't fully share in the risk. They rank AHEAD of ordinary shares, not behind.","eq":"No calculation needed. Key rule: Preference shares rank ahead of ordinary shares for dividends and capital, but their returns are limited, so they are not equity."},{"id":"CH1-NC-040","sec":"eq","t":"3.2","tl":"3.2 Ordinary shares","calc":false,"q":"Which of the following statements about redeemable ordinary shares is correct?","o":["When redeemed, the shares are retired and share capital falls. They can only be issued alongside non-redeemable shares","They can be redeemed out of any capital, at the shareholder's choice","Redeemed shares are held in treasury for reissue","They can be the company's only class of share"],"a":0,"why":"Redeemable shares must be issued alongside non-redeemable shares and allowed by the articles. They are paid for out of distributable profits or a new issue. Once redeemed, they are retired, which reduces share capital.","eq":"No calculation needed. Key rule: Redeemable ordinary = needs non-redeemables alongside, articles must allow it, paid from distributable profits or a new issue, retired on redemption."},{"id":"CH1-NC-041","sec":"eq","t":"3.2","tl":"3.2 Share classes","calc":false,"q":"A growth investor wants full voting rights and equal ranking on liquidation. They will accept no dividend until a set condition is met, in return for paying less per share. Which class of share fits?","o":["Deferred dividend shares","Deferred ordinary (founder) shares","Dual-class 'A' shares","Participating preference shares"],"a":0,"why":"Deferred dividend shares carry full votes and rank equally, but pay no dividend until a condition is met, which makes them cheaper and suits growth investors. Founder shares are for the company's founders, 'A' shares usually carry limited or no votes, and participating preference shares pay a fixed dividend plus extra.","eq":"No calculation needed. Key rule: Deferred dividend = full votes, equal ranking, no dividend until a condition is met, cheaper. Founder shares = for founders, paid last but take a bigger share later."},{"id":"CH1-NC-042","sec":"eq","t":"3.2","tl":"3.2 Preference shares","calc":false,"q":"What does a share described as '6% £1 Non-Cum. Part. Pref.' give the holder?","o":["Missed dividends build up, and the holder can convert into ordinary shares","Missed dividends are lost, but the holder gets a 6% fixed dividend plus a share of surplus profits","Missed dividends build up, and the share will be redeemed on a set date","Missed dividends are lost, and the share will be redeemed on a set date"],"a":1,"why":"'Non-Cum.' means non-cumulative, so missed dividends are lost for good. 'Part.' means participating, so the holder gets the fixed dividend plus a share of surplus profits. Note that preference shares are cumulative unless they say 'non-cum'.","eq":"No calculation needed. Key rule: Cum = arrears carried forward (the default). Non-cum = arrears lost. Part. = fixed dividend plus surplus. Red. = redeemable. Conv. = convertible."},{"id":"CH1-NC-043","sec":"eq","t":"3.3","tl":"3.3 Private equity","calc":false,"q":"Why might a sponsor use mezzanine finance in a leveraged buy-out?","o":["Because mezzanine ranks ahead of senior secured debt","Because it is the cheapest form of finance","To reduce the amount of equity needed, accepting a higher cost because mezzanine ranks below senior debt","Because it must be repaid within 6 to 12 months"],"a":2,"why":"Mezzanine is subordinated debt or preferred equity: junior to senior debt but senior to common equity. It reduces the equity cheque needed in an LBO, but lenders demand a higher return. Only bridge financing, a short-term type of mezzanine, lasts 6 to 12 months.","eq":"No calculation needed. Key rule: Ranking: senior secured, then mezzanine, then preferred equity, then common equity. Mezzanine = less equity needed, higher cost."},{"id":"CH1-NC-044","sec":"eq","t":"3.3","tl":"3.3 Private equity","calc":false,"q":"Which of the following statements about private equity are correct?\nI. LBO acquisition debt is usually non-recourse to the sponsor\nII. Growth capital usually involves a change of control\nIII. Bridge financing comes from investment banks or VC firms\nIV. Distressed investing grew as banks sold bad loans at a discount","o":["I, III and IV only","I and II only","II, III and IV only","I, II, III and IV"],"a":0,"why":"Statements I, III and IV are all correct. Statement II is false: growth capital usually means minority stakes in mature, profitable firms, with no change of control.","eq":"No calculation needed. Key rule: LBO = debt repaid from the target's cash flows, non-recourse. Growth capital = minority stake, no change of control. Distressed = grew in the 1980s to early 1990s."},{"id":"CH1-NC-045","sec":"eq","t":"3.4","tl":"3.4 Risk","calc":false,"q":"A company stops paying ordinary dividends but keeps paying its preference dividends. Which of the following is correct?","o":["This is illegal, because ordinary shareholders must be paid first","This is allowed, because ordinary shareholders have no legal right to a dividend and preference dividends must be paid before any ordinary dividend","The company is in default to its ordinary shareholders","Ordinary shareholders can sue to recover the missed dividend"],"a":1,"why":"There is no legal obligation to pay ordinary dividends. Not paying is called 'passing' a dividend. Preference holders have priority, so ordinary holders get nothing until preference dividends have been paid.","eq":"No calculation needed. Key rule: There is no legal right to an ordinary dividend. Preference dividends are paid first, and ordinary holders rank last."},{"id":"CH1-NC-046","sec":"eq","t":"3.5","tl":"3.5 Corporate actions","calc":false,"q":"Which of the following statements about corporate actions are correct?\nI. A bonus issue raises no new money\nII. In a rights issue, shareholders have a statutory right to subscribe, which protects them against dilution\nIII. A bonus issue converts reserves into share capital\nIV. All shareholders must take up their rights","o":["I and IV only","I, II and III only","II, III and IV only","I, II, III and IV"],"a":1,"why":"Statements I to III are all correct. Statement IV is false: shareholders have the right to subscribe, not an obligation. They can take up their rights, sell them, split them, or let them lapse.","eq":"No calculation needed. Key rule: Bonus = no cash, reserves become capital, net worth unchanged. Rights = new cash, offered below market price, rank pari passu."},{"id":"CH1-NC-047","sec":"eq","t":"3.5","tl":"3.5 Corporate actions","calc":false,"q":"Which of the following statements is correct?","o":["A share split converts reserves into share capital, whereas a bonus issue does not","Both a share split and a bonus issue raise new money","A share split increases total nominal capital","A share split divides the nominal value of each share and converts no reserves, whereas a bonus issue converts reserves into share capital"],"a":3,"why":"A split cuts the nominal value per share and increases the number of shares, but total nominal capital stays the same and no reserves are used. A bonus issue capitalises reserves. In theory the price effect of the two is the same.","eq":"No calculation needed. Key rule: Split = nominal value divided, no reserves used. Bonus = reserves converted into share capital."},{"id":"CH1-NC-048","sec":"eq","t":"3.5","tl":"3.5 Rights issues","calc":false,"q":"A shareholder sells just enough of their rights to pay for taking up the rest. What is this called?","o":["Letting the rights lapse","Taking up the rights in full","Underwriting the issue","Splitting the rights (also known as 'tail swallowing')"],"a":3,"why":"With a provisional letter of allotment there are four choices: take up in full, sell the rights, split (sell some to fund the rest), or let them lapse. Selling part to fund the remainder is a split.","eq":"No calculation needed. Key rule: Rights options: take up, sell, split, or lapse. The deadline is usually 2 to 3 weeks."},{"id":"CH1-NC-049","sec":"eq","t":"3.5","tl":"3.5 Engagement","calc":false,"q":"Over several years, a pension fund holds regular private meetings with a company's board to improve its climate disclosure and board diversity. This is BEST described as:","o":["Activism","Engagement","A proxy battle","Short selling"],"a":1,"why":"Engagement is long-term dialogue built on trust, often with financial and non-financial (ESG) goals. Activism uses resolutions, proxy battles, litigation and publicity to push for short-term gains, usually financial ones.","eq":"No calculation needed. Key rule: Engagement = long term, dialogue, ESG goals. Activism = short term, confrontational, financial goals."},{"id":"CH1-NC-050","sec":"eq","t":"3.6","tl":"3.6 Dividends","calc":false,"q":"When can a 'special ex' trade take place, and what does it involve?","o":["The buyer purchases in the ex-dividend period but still receives the dividend. It is allowed until the payment date","The buyer purchases cum-dividend and receives a double dividend","The buyer purchases cum-dividend but does not receive the dividend. It is only allowed in the 10 business days before the ex-dividend date","It can take place at any time after the record date"],"a":2,"why":"Special ex means buying during the cum-div period but giving up the dividend, and it is only possible in the 10 business days before the ex-dividend date. The reverse, special cum, means buying during the ex-div period and still getting the dividend, which is allowed up to the day before payment.","eq":"No calcul
