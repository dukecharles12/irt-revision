      work:`${sh.toLocaleString("en-GB")}m × £${(P/100).toFixed(2)} = <b>£${ans.toLocaleString("en-GB",{maximumFractionDigits:1})}m</b>.${ans>=4000?" A company that size could be in the FTSE 100.":""}`};
  },
  eq_costs(){
    const rate=pick([1,1.25,1.5,2]); const min=pick([10,15,20,25]); const small=Math.random()<0.3;
    const n=small?R(5,60):R(500,6000); const P=R(80,1200)/100; const V=n*P;
    const com=Math.max(min,V*rate/100); const ptm=V>10000?1.5:0; const ans=com+ptm;
    return {q:`Your broker charges <b>${rate}%</b> commission with a <b>£${min} minimum</b>. You buy <b>${n.toLocaleString("en-GB")} shares</b> in a UK company at <b>£${f2(P)}</b>. What are commission plus PTM levy? (Ignore stamp duty.)`,ans,unit:"£",tol:0.011,
      work:`Trade value = ${n.toLocaleString("en-GB")} × £${f2(P)} = ${money(V)}. Commission = ${rate}% = ${money(V*rate/100)}${V*rate/100<min?`, below the minimum, so <b>£${min}</b>`:""}. PTM levy: ${ptm?"trade is over £10,000, so <b>£1.50</b>":"trade is not over £10,000, so <b>none</b>"}. Total <b>${money(ans)}</b>.`};
  },
  eq_payout(){
    const eps=R(10,120); const dps=Math.round(eps*R(20,80)/100*10)/10; const askCover=Math.random()<0.35;
    const ans=askCover?eps/dps:dps/eps*100;
    return askCover
      ? {q:`Earnings per share are <b>${eps}p</b> and the dividend per share is <b>${dps}p</b>. What is the dividend cover (times)?`,ans,unit:"x",tol:0.015,work:`Cover = EPS ÷ DPS = ${eps} ÷ ${dps} = <b>${ans.toFixed(2)} times</b>. It's the flip side of the pay-out ratio (${(dps/eps*100).toFixed(1)}%).`}
      : {q:`Earnings per share are <b>${eps}p</b> and the dividend per share is <b>${dps}p</b>. What is the pay-out ratio?`,ans,unit:"%",work:`Pay-out = dividends ÷ net income = ${dps} ÷ ${eps} = <b>${ans.toFixed(2)}%</b>. The rest (${(100-ans).toFixed(2)}%) is retained.`};
  },

  pr_sdlt(){
    const where=pick([["england","an average home in England",XREAL.housePrice.england],["london","an average London home",XREAL.housePrice.london],["england","a home in England",roundTo(R(150,1800)*1000,5000)]]);
    const price=where[2]; const kind=pick(["std","std","add","nr"]);
    const s=sdltSlices(price,SDLT_RES); const extra=kind==="add"?price*0.05:kind==="nr"?price*0.02:0; const ans=s.tax+extra;
    const who={std:"You're buying it as your only home (standard rates, not a first-time buyer).",add:"You already own a home, so the <b>5% additional-home surcharge</b> applies.",nr:"You're a <b>non-UK resident</b> buying your only home."}[kind];
    return {q:`You buy ${where[1]} for <b>${gbp0(price)}</b>${where[1].includes("average")?` (ONS/HMLR average, ${XREAL.housePrice.note.split(",")[0]})`:""}. ${who} How much SDLT?`,ans,unit:"£",
      work:`Slices: ${s.lines.join("; ")}. Standard SDLT = ${money(s.tax)}.${extra?` Surcharge ${kind==="add"?"5%":"2%"} × ${gbp0(price)} = ${money(extra)}.`:""} Total <b>${money(ans)}</b>.`};
  },
  pr_sdltnr(){
    const price=roundTo(R(12,250)*10000,5000); const s=sdltSlices(price,SDLT_NR);
    return {q:`A business buys a shop for <b>${gbp0(price)}</b> (illustrative). How much non-residential SDLT is due?`,ans:s.tax,unit:"£",
      work:`Non-residential bands 0% to £150k, 2% to £250k, 5% above. ${s.lines.join("; ")}. Total <b>${money(s.tax)}</b>.`};
  },
  pr_yield(){
    const reg=pick([["england","England"],["london","London"],["uk","the UK"]]);
    const price=XREAL.housePrice[reg[0]]; const rent=XREAL.rent[reg[0]];
    const sd=sdltSlices(price,SDLT_RES).tax+price*0.05; const fees=R(3,8)*500; const cost=price+sd+fees;
    const voidM=pick([0,1,1,2]); const gross=rent*(12-voidM); const agent=pick([10,12,15]); const other=R(8,30)*100;
    const exp=gross*agent/100+other; const ans=(gross-exp)/cost*100;
    return {q:`You buy an average home in ${reg[1]} as a buy-to-let for <b>${gbp0(price)}</b>. SDLT with the 5% surcharge is ${money(sd)} and other purchase costs are ${gbp0(fees)}. Average rent there is <b>${gbp0(rent)} a month</b> (ONS, Aug 2026). Allow for <b>${voidM} void month${voidM===1?"":"s"}</b>, a letting agent at <b>${agent}%</b> of rent collected and <b>${gbp0(other)}</b> of other costs. Net rental yield?`,ans,unit:"%",tol:0.02,
      work:`Cost = ${gbp0(price)} + ${money(sd)} + ${gbp0(fees)} = ${money(cost)}. Rent = ${gbp0(rent)} × ${12-voidM} = ${gbp0(gross)}. Expenses = ${agent}% × ${gbp0(gross)} + ${gbp0(other)} = ${money(exp)}. Yield = ${money(gross-exp)} ÷ ${money(cost)} = <b>${ans.toFixed(2)}%</b>.`};
  },
  pr_grm(){
    const useReal=Math.random()<0.5;
    if(useReal){const reg=pick([["england","England"],["london","London"],["uk","the UK"]]); const price=XREAL.housePrice[reg[0]], ann=XREAL.rent[reg[0]]*12; const ans=price/ann;
      return {q:`The average home in ${reg[1]} costs <b>${gbp0(price)}</b> and average rent is <b>${gbp0(XREAL.rent[reg[0]])} a month</b> (ONS). What is the gross rent multiplier?`,ans,unit:"x",tol:0.06,work:`Annual rent = ${gbp0(XREAL.rent[reg[0]])} × 12 = ${gbp0(ann)}. GRM = ${gbp0(price)} ÷ ${gbp0(ann)} = <b>${ans.toFixed(2)}</b>. Lower = more affordable. GRM ignores expenses.`}}
    const price=R(20,600)*10000; const rent=roundTo(price*R(50,110)/1000,1000); const ans=price/rent;
    return {q:`A commercial property is priced at <b>${gbp0(price)}</b> with gross annual rent of <b>${gbp0(rent)}</b> (illustrative). Gross rent multiplier?`,ans,unit:"x",tol:0.06,work:`GRM = price ÷ gross annual rent = ${gbp0(price)} ÷ ${gbp0(rent)} = <b>${ans.toFixed(2)}</b>.`};
  },
  pr_cap(){
    const askValue=Math.random()<0.4;
    if(askValue){const noi=R(20,400)*1000; const cr=pick([4,4.5,5,5.5,6,6.5,7,8]); const ans=noi/(cr/100);
      return {q:`An office block makes net operating income of <b>${gbp0(noi)}</b>. Comparable sales suggest a cap rate of <b>${cr}%</b> (illustrative). What is it worth?`,ans,unit:"£",work:`Value = NOI ÷ cap rate = ${gbp0(noi)} ÷ ${cr/100} = <b>${money(ans)}</b>. A higher cap rate would mean a lower value.`}}
    const price=R(30,800)*10000; const gross=roundTo(price*R(55,100)/1000,1000); const exp=roundTo(gross*R(15,35)/100,500); const ans=(gross-exp)/price*100;
    return {q:`A property costs <b>${gbp0(price)}</b>. Gross rent is <b>${gbp0(gross)}</b> a year and operating costs and vacancies come to <b>${gbp0(exp)}</b> (illustrative). Cap rate?`,ans,unit:"%",tol:0.02,work:`NOI = ${gbp0(gross)} − ${gbp0(exp)} = ${gbp0(gross-exp)}. Cap rate = ${gbp0(gross-exp)} ÷ ${gbp0(price)} = <b>${ans.toFixed(2)}%</b>.`};
  },
  pr_initial(){
    const reg=pick([["england","England"],["london","London"],["uk","the UK"]]); const price=XREAL.housePrice[reg[0]]; const costs=roundTo(price*R(2,6)/100,500); const ann=XREAL.rent[reg[0]]*12; const ans=ann/(price+costs)*100;
    return {q:`An average ${reg[1]==="the UK"?"UK":reg[1]} home costs <b>${gbp0(price)}</b> plus <b>${gbp0(costs)}</b> of purchase costs. It's let at the average rent of <b>${gbp0(XREAL.rent[reg[0]])} a month</b> (ONS). Initial yield?`,ans,unit:"%",tol:0.02,work:`Annual rent = ${gbp0(ann)}. Value incl. costs = ${gbp0(price+costs)}. Initial yield = ${gbp0(ann)} ÷ ${gbp0(price+costs)} = <b>${ans.toFixed(2)}%</b>. It ignores expenses and voids.`};
  },

  oa_fees(){
    const C=R(1,20)*50000; const gp=pick([-8,-3,4,6,8,10,12,15,20,25]); const gain=C*gp/100; const askNet=Math.random()<0.35;
    const mgmt=C*0.02, perf=Math.max(0,gain)*0.2, fees=mgmt+perf; const ans=askNet?gain-fees:fees;
    return {q:`You put <b>${gbp0(C)}</b> into a hedge fund charging <b>2 and 20</b>. This year it ${gp>=0?"makes":"loses"} <b>${Math.abs(gp)}%</b> before fees. ${askNet?"What is your gain after fees? (Use a minus sign for a loss.)":"What are the total fees?"} (Simplified: fees on starting capital and gross gain, no hurdle.)`,ans,unit:"£",
      work:`Management = 2% × ${gbp0(C)} = ${money(mgmt)}. Performance = 20% × ${gp>=0?gbp0(gain):"£0 (no gain)"} = ${money(perf)}. Fees = ${money(fees)}.${askNet?` Gain after fees = ${money(gain)} − ${money(fees)} = <b>${money(ans)}</b>.`:` Total <b>${money(fees)}</b>.`}`};
  },
  oa_gold(){
    const g=XREAL.gold.gbp; const v=pick(["value","move","cost"]);
    if(v==="value"){const oz=pick([0.25,0.5,1,2,5,10,20]); const ans=oz*g;
      return {q:`Gold was <b>£${g.toLocaleString("en-GB",{minimumFractionDigits:2})}</b> per troy ounce on ${XREAL.gold.note}. What were <b>${oz} oz</b> worth?`,ans,unit:"£",work:`${oz} × ${money(g)} = <b>${money(ans)}</b>.`}}
    if(v==="move"){const oz=pick([1,2,5,10]); const ch=pick([-15,-10,-5,5,8,10,12,20]); const ans=oz*g*ch/100;
      return {q:`You hold <b>${oz} oz</b> of gold bought at <b>${money(g)}</b>/oz (${XREAL.gold.note}). The price ${ch>0?"rises":"falls"} <b>${Math.abs(ch)}%</b>. Your gain or loss in £? (Minus for a loss.)`,ans,unit:"£",work:`${oz} × ${money(g)} × ${ch}% = <b>${money(ans)}</b>. Gold pays no income, so the price move is your whole return.`}}
    const prem=pick([2,3,4,5,6]); const sp=pick([1,2,3]); const ans=((1+prem/100)/(1-sp/100)-1)*100;
    return {q:`Gold is <b>${money(g)}</b>/oz (${XREAL.gold.note}). A dealer sells coins at <b>${prem}%</b> over spot and buys back at <b>${sp}%</b> under spot (illustrative). By what % must spot rise for you to break even?`,ans,unit:"%",tol:0.02,
      work:`You pay ${money(g)} × ${1+prem/100} = ${money(g*(1+prem/100))}. To get that back selling at ${100-sp}% of spot, spot must reach ${money(g*(1+prem/100)/(1-sp/100))}. Rise = <b>${ans.toFixed(2)}%</b>. Physical holding costs bite before any gain.`};
  },
  oa_auction(){
    const H=R(2,80)*1000; const b=pick([10,12,15,20]); const s=pick([10,12,15]); const askPct=Math.random()<0.6;
    const paid=H*(1+b/100); const need=paid/(1-s/100); const ans=askPct?(need/H-1)*100:need;
    return {q:`You buy a painting at auction for a hammer price of <b>${gbp0(H)}</b> and pay a <b>${b}% buyer's premium</b>. When you sell, the auction house takes <b>${s}%</b> seller's commission (illustrative rates). ${askPct?"By what % must the hammer price rise for you to break even?":"What hammer price do you need to break even?"}`,ans,unit:askPct?"%":"£",tol:askPct?0.02:1,
      work:`Cost = ${gbp0(H)} × ${1+b/100} = ${money(paid)}. You keep ${100-s}% of the sale, so you need ${money(paid)} ÷ ${(1-s/100).toFixed(2)} = ${money(need)}.${askPct?` Rise = <b>${((need/H-1)*100).toFixed(2)}%</b>.`:` Break-even hammer = <b>${money(need)}</b>.`} Fees on both sides make art slow to profit.`};
  },
  oa_6040(){
    const sc=pick([[12,4,"a good year"],[-15,-12,"a 2022-style year when both fell"],[-20,8,"a recession, when rate cuts lift bonds"],[8,XREAL.gilt,"bonds just earn their yield"],[R(-10,20),R(-5,10),"an illustrative year"]]);
    const ans=0.6*sc[0]+0.4*sc[1]; const C=R(2,50)*5000; const askCash=Math.random()<0.35;
    return {q:`A <b>60/40</b> portfolio of <b>${gbp0(C)}</b>. Equities return <b>${sc[0]}%</b> and bonds return <b>${sc[1]}%</b> (${sc[2]}). ${askCash?"What is the gain or loss in £? (Minus for a loss.)":"What is the portfolio return?"}`,ans:askCash?C*ans/100:ans,unit:askCash?"£":"%",
      work:`0.6 × ${sc[0]}% + 0.4 × ${sc[1]}% = ${(0.6*sc[0]).toFixed(2)}% + ${(0.4*sc[1]).toFixed(2)}% = ${askCash?ans.toFixed(2)+"%. On "+gbp0(C)+": <b>"+money(C*ans/100)+"</b>.":"<b>"+ans.toFixed(2)+"%</b>."}${sc[0]<0&&sc[1]<0?" When bonds and shares fall together, the 60/40 cushion fails.":""}`};
  }
});

function checkNP(raw){

function parsePasted(text, defTopic){
  const out=[]; const lines=String(text).replace(/\r/g,"").split("\n");
  // 1) table rows: "question<TAB>answer" or "question | answer" (optional leading number column)
  const blocks=[]; let cur=[];
  for(const ln of lines){ if(!ln.trim()){ if(cur.length){blocks.push(cur);cur=[]} } else cur.push(ln) }
  if(cur.length) blocks.push(cur);
  for(const b of blocks){
    const isRowBlock=b.every(l=>/\t| \| /.test(l)) && !b.some(l=>/^\s*\(?[A-Da-d][\).:]\s+/.test(l));
    if(isRowBlock){
      for(const l of b){
        let parts=l.split(/\t| \| /).map(s=>s.trim()).filter(Boolean);
        if(parts.length>=3 && /^#?\d+\.?$/.test(parts[0])) parts=parts.slice(1);
        if(parts.length<2) continue;
        if(/^question$/i.test(parts[0])) continue;
        out.push({kind:"recall",q:parts[0],answer:parts.slice(1).join(" — "),topic:defTopic});
      }
      continue;
    }
    let q="",opts=[],ans="",why="",topic=defTopic;
    for(let l of b){
      l=l.trim(); let m;
      if((m=l.match(/^(?:answer|ans|correct(?: answer)?)\s*[:\-–]\s*(.+)$/i))){ans=m[1].trim();continue}
      if((m=l.match(/^(?:topic|section)\s*[:\-–]\s*(.+)$/i))){const t=m[1].trim().match(/[1-5]\.\d{1,2}/);if(t&&TOPIC_TITLE[t[0]])topic=t[0];continue}
      if((m=l.match(/^(?:why|explanation|reason)\s*[:\-–]\s*(.+)$/i))){why=m[1].trim();continue}
      if((m=l.match(/^\(?([A-Fa-f])[\).:]\s+(.+)$/)) && q){opts.push(m[2].trim());continue}
      if((m=l.match(/^(?:q(?:uestion)?\s*\d*\s*[:.)\-–]\s*)(.+)$/i))){q=(q?q+" ":"")+m[1].trim();continue}
      if(opts.length===0){ q=(q?q+" ":"")+l.replace(/^\d+[.)]\s*/,"") ; continue }
      if(!ans && opts.length) {why=(why?why+" ":"")+l}
    }
    if(!q) continue;
    if(opts.length>=2){
      let a=-1; const L=ans.match(/^\(?([A-Fa-f])\)?(?:[\s.):]|$)/);
      if(L) a="abcdef".indexOf(L[1].toLowerCase());
      if(a<0&&ans) a=opts.findIndex(o=>o.toLowerCase()===ans.toLowerCase());
      if(a<0||a>=opts.length){ out.push({kind:"error",q,msg:"Couldn't tell which option is correct. Add a line like \"Answer: B\"."}); continue }
      out.push({kind:"mcq",q,options:opts,a,why,topic});
    } else if(ans){
      out.push({kind:"recall",q,answer:ans,why,topic});
    } else {
      const qa=q.match(/^(.+\?)\s+(.+)$/);
      if(qa) out.push({kind:"recall",q:qa[1],answer:qa[2],why,topic});
      else out.push({kind:"error",q,msg:"No answer found. Add a line like \"Answer: …\"."});
    }
  }
  return out;
}

    case "parse": { const t=document.getElementById("mq-text").value; if(!t.trim()){toast("Paste some questions first");break} PASTE_PREVIEW=parsePasted(t,document.getElementById("mq-topic").value); PASTE_PREVIEW._text=t; PASTE_PREVIEW._topic=document.getElementById("mq-topic").value; render(); document.getElementById("mq-text").value=t; document.getElementById("mq-topic").value=PASTE_PREVIEW._topic; break }
    case "clearpaste": PASTE_PREVIEW=null; render(); break;
    case "addparsed": { const ok=PASTE_PREVIEW.filter(x=>x.kind!=="error"); const now=Date.now(); ok.forEach((q,i)=>{q.id="my"+now.toString(36)+i; q.src="Mine"; q.sec=(q.topic!=="mine"&&TOPICS.find(t=>t.id===q.topic))?TOPICS.find(t=>t.id===q.topic).sec:CUR.key; CUSTOM.items.push(q)}); PASTE_PREVIEW=null; persist("custom"); toast(`Added ${ok.length} question${ok.length===1?"":"s"}`); render(); break }
    case "delq": CUSTOM.items=CUSTOM.items.filter(q=>q.id!==d.id); delete P.q[d.id]; persist("custom"); persist("progress"); render(); break;
  }
});
render();
</script>
</body></html>
