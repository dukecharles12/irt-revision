 its current and quick ratios?", "o": ["Current 1.00x; quick 0.50x", "Current 1.50x; quick 0.75x", "Current 1.25x; quick 1.00x", "Current 1.50x; quick 1.00x"], "a": 3, "why": "Current assets = 6 + 9 + 3 = £18m. Current ratio = 18 ÷ 12 = 1.50x. Quick ratio = (18 − 6) ÷ 12 = 1.00x.", "eq": "Current = CA ÷ CL. Quick = (CA − Inventory) ÷ CL"}, {"id": "CH2S1-CALC-028", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": true, "q": "A company has current assets of £40m (including inventory of £18m) and current liabilities of £25m. It wants a quick ratio of exactly 1.0x by raising cash through a LONG-term loan. How much cash must it raise?", "o": ["£25m", "£18m", "£7m", "£3m"], "a": 3, "why": "Current quick assets = 40 − 18 = £22m, so the quick ratio is 22 ÷ 25 = 0.88x. A long-term loan adds cash (a current asset) without adding current liabilities. It needs quick assets of £25m, so it must raise 25 − 22 = £3m.", "eq": "Quick ratio = (CA − Inventory) ÷ CL. Required quick assets = Target × CL"}, {"id": "CH2S1-CALC-029", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": true, "q": "A company has current assets of £36m and current liabilities of £20m. What is its working capital (net current assets)?", "o": ["£56m", "£16m", "£1.8m", "£-16m"], "a": 1, "why": "Working capital = Current assets − Current liabilities = 36 − 20 = £16m. If current liabilities exceeded current assets, working capital would be negative.", "eq": "Working capital = Current assets − Current liabilities"}, {"id": "CH2S1-CALC-030", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": true, "q": "A company has current assets of £30m and current liabilities of £20m. It uses £4m of cash to pay suppliers. What is its new current ratio?", "o": ["1.500x", "1.625x", "1.300x", "1.875x"], "a": 1, "why": "Both sides fall by £4m: (30 − 4) ÷ (20 − 4) = 26 ÷ 16 = 1.625x. When a ratio is above 1, taking the same amount off both sides raises it.", "eq": "New ratio = (CA − payment) ÷ (CL − payment)"}, {"id": "CH2S1-CALC-031", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": true, "q": "A company has current assets of £9m and current liabilities of £12m. It uses £3m of cash to pay suppliers. What happens to its current ratio?", "o": ["It falls from 0.75x to 0.67x", "It rises from 0.75x to 0.82x", "It stays at 0.75x", "It rises from 0.75x to 1.00x"], "a": 0, "why": "Before: 9 ÷ 12 = 0.75x. After: 6 ÷ 9 = 0.67x. When a ratio is below 1, taking the same amount off both sides lowers it.", "eq": "New ratio = (CA − payment) ÷ (CL − payment)"}, {"id": "CH2S1-CALC-032", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": true, "q": "A company has current assets of £30m (including inventory of £10m) and current liabilities of £20m. It buys £5m of inventory on credit. What are its new current and quick ratios?", "o": ["Current 1.50x; quick 1.00x", "Current 1.75x; quick 1.00x", "Current 1.40x; quick 1.00x", "Current 1.40x; quick 0.80x"], "a": 3, "why": "CA = 35, inventory = 15, CL = 25. Current ratio = 35 ÷ 25 = 1.40x (down from 1.50x). Quick ratio = (35 − 15) ÷ 25 = 0.80x (down from 1.00x).", "eq": "Current = CA ÷ CL. Quick = (CA − Inventory) ÷ CL"}, {"id": "CH2S1-CALC-033", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": true, "q": "A company has current assets of £30m (including inventory of £10m) and current liabilities of £20m. It sells £4m of inventory for £4m in cash. What happens to its ratios?", "o": ["Both ratios rise", "The current ratio stays at 1.50x and the quick ratio rises from 1.00x to 1.20x", "Both ratios fall", "The current ratio rises and the quick ratio stays the same"], "a": 1, "why": "Total current assets are unchanged (inventory −4, cash +4), so the current ratio stays at 1.50x. Inventory falls to £6m, so the quick ratio = (30 − 6) ÷ 20 = 1.20x.", "eq": "Current = CA ÷ CL. Quick = (CA − Inventory) ÷ CL"}, {"id": "CH2S1-CALC-034", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": true, "q": "A company has current assets of £30m and current liabilities of £20m. It draws £5m on a short-term overdraft and holds the money as cash. What is its new current ratio?", "o": ["1.50x", "1.75x", "1.40x", "1.25x"], "a": 2, "why": "Both sides rise by £5m: 35 ÷ 25 = 1.40x (down from 1.50x). When a ratio is above 1, adding the same amount to both sides lowers it.", "eq": "New ratio = (CA + cash) ÷ (CL + overdraft)"}, {"id": "CH2S1-CALC-035", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": true, "q": "Which company is MOST likely to need an overdraft facility?\nP: CA £45m, CL £30m\nQ: CA £28m, CL £32m\nR: CA £60m, CL £25m\nS: CA £40m, CL £20m", "o": ["Company Q (current ratio 0.875x)", "Company P (current ratio 1.50x)", "Company R (current ratio 2.40x)", "Company S (current ratio 2.00x)"], "a": 0, "why": "Q's current ratio is 28 ÷ 32 = 0.875x, which is below 1, so it has negative working capital and may need an overdraft. R (2.40x) is above 2, suggesting idle assets.", "eq": "Current ratio = CA ÷ CL. Below 1 = negative working capital, may need an overdraft"}, {"id": "CH2S1-CALC-036", "ch": 2, "sec": "ca", "t": "C2-1.3.2", "tl": "1.3.2 Liquidity", "calc": true, "q": "A company has current assets of £30m and current liabilities of £20m. It raises a £5m long-term loan and uses it to pay off £5m of current liabilities. What is its new current ratio?", "o": ["2.00x", "1.50x", "1.20x", "1.40x"], "a": 0, "why": "Current assets are unchanged at £30m, and current liabilities fall to £15m. Current ratio = 30 ÷ 15 = 2.00x. The debt has moved from current to non-current.", "eq": "Current ratio = CA ÷ CL"}, {"id": "CH2S1-CALC-037", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": true, "q": "A company has long-term liabilities of £45m and capital employed of £150m. What is its gearing ratio?", "o": ["42.9%", "333.3%", "30.0%", "23.1%"], "a": 2, "why": "Gearing = 45 ÷ 150 = 30.0%.", "eq": "Gearing = Long-term liabilities ÷ Capital employed"}, {"id": "CH2S1-CALC-038", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": true, "q": "A company has equity of £120m and non-current liabilities of £80m. What is its gearing ratio?", "o": ["40.0%", "66.7%", "60.0%", "33.3%"], "a": 0, "why": "Capital employed = 120 + 80 = £200m. Gearing = 80 ÷ 200 = 40.0%. 66.7% divides by equity instead of capital employed.", "eq": "Gearing = Long-term liabilities ÷ (Equity + Non-current liabilities)"}, {"id": "CH2S1-CALC-039", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": true, "q": "A company has EBIT of £36m and interest payable of £9m. What is its times interest earned?", "o": ["4.0x", "0.25x", "3.0x", "5.0x"], "a": 0, "why": "Times interest earned = 36 ÷ 9 = 4.0x.", "eq": "Times interest earned = EBIT ÷ Interest payable"}, {"id": "CH2S1-CALC-040", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": true, "q": "A company has debt of £50m, preference share capital of £10m and shareholders' equity of £120m. What is its debt/equity ratio?", "o": ["41.7%", "50.0%", "33.3%", "29.4%"], "a": 1, "why": "Debt/equity = (50 + 10) ÷ 120 = 50.0%. Preference share capital is added to debt.", "eq": "Debt/equity = (Debts + Preference share capital) ÷ Shareholders' equity"}, {"id": "CH2S1-CALC-041", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": true, "q": "A company has debt of £50m, preference share capital of £10m, cash of £18m and shareholders' equity of £120m. What is its net debt/equity ratio?", "o": ["50.0%", "26.7%", "35.0%", "30.4%"], "a": 2, "why": "Net debt/equity = (50 + 10 − 18) ÷ 120 = 42 ÷ 120 = 35.0%.", "eq": "Net debt/equity = (Debts + Pref capital − Cash) ÷ Shareholders' equity"}, {"id": "CH2S1-CALC-042", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": true, "q": "A company has operating profit of £24m, interest receivable of £2m, other income receivable of £1m and interest payable of £6m. Using the formula in your notes, what is its interest cover?", "o": ["4.5x", "4.0x", "4.33x", "5.0x"], "a": 0, "why": "Interest cover = (24 + 2 + 1) ÷ 6 = 27 ÷ 6 = 4.5x. Using operating profit alone gives 4.0x, which is the times interest earned figure.", "eq": "Interest cover = (Operating profit + Interest receivable + Other income receivable) ÷ Interest payable"}, {"id": "CH2S1-CALC-043", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": true, "q": "A company has fixed interest of £10m. Its EBIT rises 25%, from £20m to £25m. By what percentage does its profit before tax rise?", "o": ["25%", "50%", "20%", "100%"], "a": 1, "why": "PBT rises from 20 − 10 = £10m to 25 − 10 = £15m, which is +50%. Fixed interest magnifies the change: this is the upside of gearing in good times.", "eq": "PBT = EBIT − Interest. % change = (New − Old) ÷ Old"}, {"id": "CH2S1-CALC-044", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": true, "q": "A company has EBIT of £20m, and its interest rises from £8m to £12m because rates have gone up. By what percentage does its profit before tax fall?", "o": ["50.0%", "33.3%", "20.0%", "40.0%"], "a": 1, "why": "PBT falls from 20 − 8 = £12m to 20 − 12 = £8m, which is a fall of 4 ÷ 12 = 33.3%. Rising rates cause a disproportionate fall in profit for a geared company.", "eq": "PBT = EBIT − Interest"}, {"id": "CH2S1-CALC-045", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": true, "q": "A company has debt of £40m and equity of £90m (capital employed £130m). How much NEW long-term debt can it add before its gearing exceeds 40%?", "o": ["£20m", "£12m", "£52m", "£16m"], "a": 0, "why": "Solve (40 + D) ÷ (130 + D) = 0.40. That gives 40 + D = 52 + 0.4D, so 0.6D = 12 and D = £20m. Check: 60 ÷ 150 = 40%.", "eq": "Gearing = Debt ÷ Capital employed. New debt increases both the top and the bottom"}, {"id": "CH2S1-CALC-046", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": true, "q": "Company A has EBIT of £50m and interest of £10m. Company B has EBIT of £30m and interest of £4m. Which has the lower interest risk, based on times interest earned?", "o": ["Company A (5.0x vs 7.5x)", "Company B (7.5x vs 5.0x)", "They are the same", "Company A, because its EBIT is larger"], "a": 1, "why": "A = 50 ÷ 10 = 5.0x. B = 30 ÷ 4 = 7.5x. Higher cover means less risk, so B is safer even though its profit is smaller.", "eq": "Times interest earned = EBIT ÷ Interest. Higher = less risk"}, {"id": "CH2S1-CALC-047", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": true, "q": "A company has debt of £30m, preference share capital of £15m and shareholders' equity of £75m. What is its debt/equity ratio?", "o": ["40.0%", "50.0%", "60.0%", "37.5%"], "a": 2, "why": "Debt/equity = (30 + 15) ÷ 75 = 60.0%. Leaving out the preference shares gives 40.0%, which is the trap.", "eq": "Debt/equity = (Debts + Pref capital) ÷ Shareholders' equity"}, {"id": "CH2S1-CALC-048", "ch": 2, "sec": "ca", "t": "C2-1.3.3", "tl": "1.3.3 Gearing", "calc": true, "q": "A company has long-term debt of £60m and capital employed of £200m. It issues £40m of new shares. What is its new gearing?", "o": ["30.0%", "37.5%", "25.0%", "41.7%"], "a": 2, "why": "Capital employed rises to 200 + 40 = £240m, and debt is unchanged. Gearing = 60 ÷ 240 = 25.0% (down from 30.0%).", "eq": "Gearing = Long-term liabilities ÷ Capital employed"}, {"id": "CH2S1-CALC-049", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company's profit attributable to ordinary shareholders is £36m. The weighted average number of shares in the year was 120m, and 150m shares were in issue at the year end. What is its EPS?", "o": ["24.0p", "41.7p", "30.0p", "33.3p"], "a": 2, "why": "EPS = 36 ÷ 120 = 30.0p. Use the WEIGHTED AVERAGE number of shares, not the year-end number (which gives 24p).", "eq": "EPS = Profit attributable to ordinary shareholders ÷ Weighted average ordinary shares"}, {"id": "CH2S1-CALC-050", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company had 100m shares at the start of the year and issued 20m more exactly halfway through. Profit attributable to ordinary shareholders was £22m. What is its EPS?", "o": ["20.0p", "22.0p", "18.3p", "16.7p"], "a": 0, "why": "Weighted average = 100m + (20m × 6/12) = 110m. EPS = 22 ÷ 110 = 20.0p.", "eq": "Weighted average shares = Opening shares + New shares × (months in issue ÷ 12). EPS = Profit ÷ Weighted average"}, {"id": "CH2S1-CALC-051", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company has net profit of £50m and pays preference dividends of £5m. It has 150m ordinary shares (weighted average). What is its EPS?", "o": ["30.0p", "33.3p", "36.7p", "3.3p"], "a": 0, "why": "Profit attributable to ordinary shareholders = 50 − 5 = £45m. EPS = 45 ÷ 150 = 30.0p.", "eq": "EPS = (Net profit − Preference dividends) ÷ Weighted average ordinary shares"}, {"id": "CH2S1-CALC-052", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company has profit attributable to ordinary shareholders of £45m and 150m shares (weighted average). Options would create 30m more shares. What is its diluted EPS?", "o": ["30.0p", "37.5p", "15.0p", "25.0p"], "a": 3, "why": "Diluted EPS = 45 ÷ (150 + 30) = 25.0p, compared with basic EPS of 30p. Diluted EPS is the more conservative, worst-case figure.", "eq": "Diluted EPS = Profit ÷ (Weighted average shares + Dilutive shares)"}, {"id": "CH2S1-CALC-053", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A share trades at 540p and its EPS is 36p. What is its P/E ratio?", "o": ["6.7", "19.4", "15.0", "1.5"], "a": 2, "why": "P/E = 540 ÷ 36 = 15.0.", "eq": "P/E = Market price per share ÷ EPS"}, {"id": "CH2S1-CALC-054", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "Similar companies trade on a P/E of 18. A company has EPS of 25p. What share price does this imply?", "o": ["72p", "450p", "43p", "139p"], "a": 1, "why": "Price = P/E × EPS = 18 × 25 = 450p.", "eq": "Price = P/E × EPS"}, {"id": "CH2S1-CALC-055", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A share has a P/E of 24 and expected EPS growth of 16% a year. What is its PEG ratio, and what does it suggest?", "o": ["1.5, which suggests undervalued", "0.67, which suggests undervalued", "3.84, which suggests overvalued", "1.5, which suggests overvalued"], "a": 3, "why": "PEG = 24 ÷ 16 = 1.5. A PEG above 1 suggests the shares are overvalued compared with their growth.", "eq": "PEG = P/E ÷ EPS growth rate (as a whole number). <1 undervalued, >1 overvalued"}, {"id": "CH2S1-CALC-056", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A share has a P/E of 12 and expected EPS growth of 15% a year. What is its PEG ratio, and what does it suggest?", "o": ["0.8, which suggests overvalued", "1.25, which suggests overvalued", "1.8, which suggests fairly valued", "0.8, which suggests undervalued"], "a": 3, "why": "PEG = 12 ÷ 15 = 0.8, which is below 1, so the shares may be undervalued. This is a favourable reading.", "eq": "PEG = P/E ÷ Growth rate"}, {"id": "CH2S1-CALC-057", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "Share A has a P/E of 30 and growth of 25%. Share B has a P/E of 14 and growth of 7%. Based on PEG, which looks more attractive?", "o": ["Share B (PEG 2.0 vs 1.2)", "Share B, because it has the lower P/E", "Share A (PEG 1.2 vs 2.0)", "They are equally attractive"], "a": 2, "why": "PEG A = 30 ÷ 25 = 1.2. PEG B = 14 ÷ 7 = 2.0. A is cheaper once growth is taken into account, even though its P/E is higher.", "eq": "PEG = P/E ÷ Growth. A lower PEG is more favourable"}, {"id": "CH2S1-CALC-058", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company has EPS of 40p and pays a net dividend of 16p per share. What is its dividend cover?", "o": ["0.4x", "4.0x", "2.5x", "1.6x"], "a": 2, "why": "Dividend cover = 40 ÷ 16 = 2.5x. That is at least 2x, so it is prudent.", "eq": "Dividend cover = EPS ÷ Net dividend per share"}, {"id": "CH2S1-CALC-059", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company has EPS of 18p and pays a dividend of 24p per share. What is its dividend cover, and what does it mean?", "o": ["0.75x; the dividend is uncovered and is partly paid from past reserves", "1.33x; the dividend is prudent", "0.75x; the dividend is well covered", "1.33x; the dividend is uncovered"], "a": 0, "why": "Cover = 18 ÷ 24 = 0.75x. That is below 1, so the dividend is uncovered and is being paid partly from past reserves, which is a concern for investors.", "eq": "Dividend cover = EPS ÷ DPS. <1x = uncovered"}, {"id": "CH2S1-CALC-060", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company has EPS of 50p and wants dividend cover of at least 2x. What is the MAXIMUM dividend per share it can pay?", "o": ["100p", "25p", "48p", "52p"], "a": 1, "why": "DPS = EPS ÷ Cover = 50 ÷ 2 = 25p.", "eq": "Maximum DPS = EPS ÷ Required cover"}, {"id": "CH2S1-CALC-061", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A share trades at 600p and pays a gross dividend of 15p. What is its dividend yield?", "o": ["40.00%", "2.50%", "4.00%", "0.25%"], "a": 1, "why": "Dividend yield = 15 ÷ 600 = 2.50%. It is a historical measure and does not guarantee future dividends.", "eq": "Gross dividend yield = Gross DPS ÷ Market price"}, {"id": "CH2S1-CALC-062", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A share pays a gross dividend of 18p, and investors require a dividend yield of 4%. What share price does this imply?", "o": ["450p", "72p", "22p", "4.5p"], "a": 0, "why": "Price = DPS ÷ Yield = 18 ÷ 0.04 = 450p.", "eq": "Price = DPS ÷ Dividend yield"}, {"id": "CH2S1-CALC-063", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A share trades at 750p and has gross EPS of 45p. What is its earnings yield?", "o": ["16.67%", "6.00%", "4.50%", "60.00%"], "a": 1, "why": "Earnings yield = 45 ÷ 750 = 6.00%. That equals 1 ÷ P/E (P/E = 16.67).", "eq": "Earnings yield = Gross EPS ÷ Market price (= 1 ÷ P/E)"}, {"id": "CH2S1-CALC-064", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A share has a P/E ratio of 20. What is its earnings yield?", "o": ["5.00%", "20.00%", "2.00%", "0.50%"], "a": 0, "why": "Earnings yield = 1 ÷ P/E = 1 ÷ 20 = 5.00%.", "eq": "Earnings yield = EPS ÷ Price = 1 ÷ P/E"}, {"id": "CH2S1-CALC-065", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company has 200m shares trading at 480p and operating cash flow of £96m. What is its P/CF ratio?", "o": ["10.0x", "5.0x", "20.0x", "2.0x"], "a": 0, "why": "Operating cash flow per share = 96 ÷ 200 = 48p. P/CF = 480 ÷ 48 = 10.0x.", "eq": "P/CF = Market price ÷ (Operating cash flow ÷ Shares)"}, {"id": "CH2S1-CALC-066", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A bank's shares trade at 180p. It has shareholders' equity of £600m and 400m shares in issue. What is its P/B ratio?", "o": ["0.83x", "1.2x", "3.0x", "0.3x"], "a": 1, "why": "Book value per share = 600 ÷ 400 = 150p. P/B = 180 ÷ 150 = 1.2x. P/B is mainly used in the banking sector.", "eq": "P/B = Market price ÷ (Equity ÷ Shares)"}, {"id": "CH2S1-CALC-067", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "An investment trust has assets of £900m, liabilities of £360m and 300m shares in issue. Its shares trade at 150p. What is its NAV per share, and what buffer does it give?", "o": ["NAV 300p; a 150p buffer", "NAV 120p; no buffer", "NAV 180p; the shares are at a premium of 30p", "NAV 180p; a 30p buffer above the share price"], "a": 3, "why": "NAV = (900 − 360) ÷ 300 = 180p. The share price of 150p is below NAV, which gives a 30p buffer if the trust were liquidated. That is why NAV matters to investment trust investors.", "eq": "NAV per share = (Assets − Liabilities) ÷ Shares in issue"}, {"id": "CH2S1-CALC-068", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "An investment trust has a NAV of 180p per share and a share price of 150p. What is its discount to NAV as a percentage of NAV?", "o": ["20.0%", "83.3%", "30.0%", "16.7%"], "a": 3, "why": "Discount = (180 − 150) ÷ 180 = 16.7%. Measure the discount against NAV, not the share price.", "eq": "Discount = (NAV − Price) ÷ NAV"}, {"id": "CH2S1-CALC-069", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company has 250m shares trading at 320p, debt of £300m and cash of £120m. What is its enterprise value?", "o": ["£800m", "£1,220m", "£980m", "£620m"], "a": 2, "why": "Market cap = 250m × £3.20 = £800m. EV = 800 + 300 − 120 = £980m.", "eq": "EV = Market cap + Debt − Cash − Cash equivalents"}, {"id": "CH2S1-CALC-070", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company has a market capitalisation of £1,200m, debt of £400m, cash of £50m and cash equivalents of £70m. What is its enterprise value?", "o": ["£1,480m", "£1,550m", "£1,600m", "£1,720m"], "a": 0, "why": "EV = 1,200 + 400 − 50 − 70 = £1,480m. Deduct BOTH cash and cash equivalents.", "eq": "EV = Market cap + Debt − Cash − Cash equivalents"}, {"id": "CH2S1-CALC-071", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company has an enterprise value of £900m, debt of £250m and cash of £100m (no cash equivalents). What is its market capitalisation?", "o": ["£1,050m", "£1,250m", "£750m", "£550m"], "a": 2, "why": "Rearranging EV = Market cap + Debt − Cash gives Market cap = EV − Debt + Cash = 900 − 250 + 100 = £750m.", "eq": "Market cap = EV − Debt + Cash"}, {"id": "CH2S1-CALC-072", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company's EPS rises from 30p to 36p and its P/E stays at 15. What happens to its share price?", "o": ["It stays at 450p", "It rises from 450p to 600p", "It falls from 540p to 450p", "It rises from 450p to 540p"], "a": 3, "why": "Price = P/E × EPS. Before: 15 × 30 = 450p. After: 15 × 36 = 540p, a rise of 20%, in line with EPS.", "eq": "Price = P/E × EPS"}, {"id": "CH2S1-CALC-073", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company has EPS of 60p and dividend cover of 3x. What is its dividend per share?", "o": ["180p", "20p", "57p", "30p"], "a": 1, "why": "DPS = EPS ÷ Cover = 60 ÷ 3 = 20p.", "eq": "DPS = EPS ÷ Dividend cover"}, {"id": "CH2S1-CALC-074", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A share trades at 500p with EPS of 20p, and EPS is expected to grow 25% a year. What is its PEG ratio?", "o": ["0.8, so undervalued", "1.0, so market value and projected growth are perfectly matched", "1.25, so overvalued", "25.0, so overvalued"], "a": 1, "why": "P/E = 500 ÷ 20 = 25. PEG = 25 ÷ 25 = 1.0, which means market value and projected earnings growth are perfectly matched.", "eq": "P/E = Price ÷ EPS. PEG = P/E ÷ Growth"}, {"id": "CH2S1-CALC-075", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "A company has profit of £60m and 200m shares (weighted average). Convertible bonds would add 50m shares. By what percentage does diluted EPS fall below basic EPS?", "o": ["25.0%", "20.0%", "16.7%", "50.0%"], "a": 1, "why": "Basic EPS = 60 ÷ 200 = 30p. Diluted EPS = 60 ÷ 250 = 24p. The fall is (30 − 24) ÷ 30 = 20.0%.", "eq": "Diluted EPS = Profit ÷ (Shares + Dilutive shares). % dilution = (Basic − Diluted) ÷ Basic"}, {"id": "CH2S1-CALC-076", "ch": 2, "sec": "ca", "t": "C2-1.3.4", "tl": "1.3.4 Investors' ratios", "calc": true, "q": "Share A trades at 300p with EPS of 20p. Share B trades at 420p with EPS of 35p. Which is cheaper on a P/E basis?", "o": ["Share B (P/E 12 vs 15)", "Share A (P/E 15 vs 12)", "Share A, because its price is lower", "They are the same"], "a": 0, "why": "P/E A = 300 ÷ 20 = 15. P/E B = 420 ÷ 35 = 12. B is cheaper relative to its earnings, even though its share price is higher.", "eq": "P/E = Price ÷ EPS"}, {"id": "CH2S1-CALC-077", "ch": 2, "sec": "ca", "t": "C2-1.3.5", "tl": "1.3.5 Past performance", "calc": true, "q": "An investor buys a share at 250p. A year later it trades at 270p, and the investor has received dividends of 10p. What is the total return?", "o": ["8.0%", "4.0%", "11.1%", "12.0%"], "a": 3, "why": "Total return = (20p capital gain + 10p dividends) ÷ 250p = 12.0%. The price return alone is 8.0%.", "eq": "Total return = (End price − Start price + Dividends) ÷ Start price"}, {"id": "CH2S1-CALC-078", "ch": 2, "sec": "ca", "t": "C2-1.3.5", "tl": "1.3.5 Past performance", "calc": true, "q": "A share trades at 500p and goes ex-dividend for a 20p dividend, so its price falls to 480p. Ignoring other movements, what are the price return and total return?", "o": ["Price return 0.0%; total return +4.0%", "Price return −4.0%; total return −4.0%", "Price return +4.0%; total return +4.0%", "Price return −4.0%; total return 0.0%"], "a": 3, "why": "Price return = (480 − 500) ÷ 500 = −4.0%. Total return = (−20 + 20) ÷ 500 = 0.0%. The investor has lost nothing, which is why comparisons must use total return.", "eq": "Price return = (End − Start) ÷ Start. Total return adds dividends"}, {"id": "CH2S1-CALC-079", "ch": 2, "sec": "ca", "t": "C2-1.3.5", "tl": "1.3.5 Past performance", "calc": true, "q": "A share const blankProgress = () => ({v:1, topicsDone:{}, q:{}, cards:{}, nums:{}, history:[]});
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let P = Object.assign(blankProgress(), lsGet("irt.progress")||{});
let CUSTOM = Object.assign({items:[]}, lsGet("irt.custom")||{});
let dbRefs = null;
const dirty = {}, timers = {}, busy = {};
function setSave(t){const el=document.getElementById("savestate"); if(el) el.textContent=t}
function persist(which){
  lsSet(which==="progress"?"irt.progress":"irt.custom", which==="progress"?P:CUSTOM);
  if(window.IRT_REMOTE){ window.IRT_REMOTE.changed(); return }
  if(!dbRefs){ setSave("Saved in this browser"); return }
  dirty[which]=true; clearTimeout(timers[which]); timers[which]=setTimeout(()=>flush(which),800);
}
async function flush(which){
  if(busy[which]||!dirty[which]) return;
  busy[which]=true; dirty[which]=false;
  const data = JSON.parse(JSON.stringify(which==="progress"?P:CUSTOM));
  try{ await dbRefs[which].set(data); setSave("Saved to your account") }
  catch(e){ setSave("Saved in this browser only") }
  busy[which]=false;
  if(dirty[which]) flush(which);
}
(async function connect(){
  try{
    // Hosted copies (e.g. Streamlit) can supply their own cross-device sync.
    if(window.IRT_REMOTE){
      window.IRT_REMOTE.attach({
        get:()=>({progress:P, custom:CUSTOM}),
        set:d=>{ P=Object.assign(blankProgress(), d.progress||{}); CUSTOM=Object.assign({items:[]}, d.custom||{}); lsSet("irt.progress",P); lsSet("irt.custom",CUSTOM); if(!QZ) render() },
        status:setSave
      });
      return;
    }
    if(!window.claude || !window.claude.use){ setSave("Saved in this browser"); return }
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    const uid = user ? await user.id() : null;
    if(!db || !uid){ setSave("Saved in this browser"); return }
    const base = "data/users/"+uid;
    const refs = {progress:db.doc(base+"/progress"), custom:db.doc(base+"/questions")};
    const [ps, cs] = await Promise.all([refs.progress.get(), refs.custom.get()]);
    dbRefs = refs;
    if(ps.exists){ P = Object.assign(blankProgress(), JSON.parse(JSON.stringify(ps.data()))) } else if(hasAnything(P)){ dirty.progress=true; flush("progress") }
    if(cs.exists){ CUSTOM = Object.assign({items:[]}, JSON.parse(JSON.stringify(cs.data()))) } else if(CUSTOM.items.length){ dirty.custom=true; flush("custom") }
    lsSet("irt.progress",P); lsSet("irt.custom",CUSTOM);
    setSave("Saved to your account");
    if(!QZ) render();
  }catch(e){ setSave("Saved in this browser") }
})();
function hasAnything(p){return Object.keys(p.q).length||Object.keys(p.cards).length||Object.keys(p.nums).length||p.history.length||Object.keys(p.topicsDone).length}

function allQuestions(){return QUESTIONS.concat(CUSTOM.items)}
function statFor(tid){
  let r=0,w=0;
  for(const q of allQuestions().concat(EXAM)) if(q.topic===tid){const s=P.q[q.id]; if(s){r+=s.r;w+=s.w}}
  for(const c of CARDS) if(c.topic===tid){const s=P.cards[c.id]; if(s){r+=s.r;w+=s.w}}
  for(const [k,v] of Object.entries(NUM_TYPES)) if(v.topic===tid){const s=P.nums[k]; if(s){r+=s.r;w+=s.w}}
  const n=r+w; return {r,w,n,acc:n?r/n:null};
}
function overall(){
  let r=0,w=0; for(const m of [P.q,P.cards,P.nums]) for(const s of Object.values(m)){r+=s.r;w+=s.w}
  return {r,w,n:r+w,acc:(r+w)?r/(r+w):null};
}
function weakSpots(){
  const out=[];
  for(const t of TOPICS.concat([{id:"mine"}])){const s=statFor(t.id); if(s.n>=2&&s.acc<0.7) out.push({kind:"topic",id:t.id,sec:t.sec,label:(t.id==="mine"?"":tcode(t.id)+" ")+TOPIC_TITLE[t.id],acc:s.acc,n:s.n})}
  for(const [k,v] of Object.entries(NUM_TYPES)){const s=P.nums[k]; if(s&&s.r+s.w>=2&&s.r/(s.r+s.w)<0.7) out.push({kind:"num",id:k,sec:v.sec,label:"Numbers: "+v.label,acc:s.r/(s.r+s.w),n:s.r+s.w})}
  return out.sort((a,b)=>a.acc-b.acc);
}

        </div>
        <div class="ch-secs">${ch.sections.map(sec=>{const n=sec.topics.length,d=sec.topics.filter(t=>P.topicsDone[t.id]).length,st=secStat(sec);

          ${(ch.exams||[]).map(x=>{const st=examStat(x);return `<a class="ch-sec exam" href="#${x.hash}"><span class="num muted">Exam</span><span class="t">${esc(x.nav)}</span><span class="muted" style="font-size:13px">${st.tried}/${st.total} tried</span>${st.n?`<span class="chip ${st.acc>=0.8?"good":st.acc>=0.6?"mid":"bad"}">${pct(st.acc)}</span>`:`<span class="chip">Not tried</span>`}</a>`}).join("")}</div>

      </div>`}).join("")}
      <div class="panel locked" style="display:grid;gap:4px">

        : `<p class="muted">Nothing flagged yet. Topics where you score under 70% (after at least two answers) show up here.</p>`}

      <div class="panel">${hist.length? `<div class="hist">${hist.map(h=>`<div><span>${esc(h.label)} <span class="muted">· ${new Date(h.at).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}</span></span><b class="num">${h.score}/${h.total}</b></div>`).join("")}</div>` : `<p class="muted">No quizzes yet. Start one from a section page.</p>`}</div>

}

function secStat(sec){let r=0,w=0;for(const t of sec.topics){const x=statFor(t.id);r+=x.r;w+=x.w}return {r,w,n:r+w,acc:(r+w)?r/(r+w):null}}
function chapterStat(ch){let r=0,w=0;for(const sec of ch.sections){const x=secStat(sec);r+=x.r;w+=x.w}return {r,w,n:r+w,acc:(r+w)?r/(r+w):null}}
function secCardHTML(sec){
  const sd=sec.topics.filter(t=>P.topicsDone[t.id]).length, n=sec.topics.length;
  const qs=allQuestions().filter(q=>secOfQ(q)===sec.key);
  return `<div class="panel sec-card">
        <div class="sec-head">
          <div style="display:grid;gap:4px"><span class="eyebrow">${sec.eyebrow.replace(/^Chapter \d+ · /,"")}</span><h3 style="font-size:20px">${esc(sec.title)}</h3></div>
          <a class="btn primary" href="#${sec.hash}">Open ${esc(sec.nav)}</a>
        </div>

        <div class="topic-dots">${sec.topics.map(t=>{const s=statFor(t.id);return `<a class="tdot" href="#${sec.hash}" data-act="opentopic" data-id="${t.id}" style="text-decoration:none;color:inherit"><span class="tick ${P.topicsDone[t.id]?"on":""}">${P.topicsDone[t.id]?"✓":""}</span><span class="t"><span class="num muted">${tcode(t.id)}</span> ${esc(t.title)}</span>${s.n?`<span class="chip ${s.acc>=0.8?"good":s.acc>=0.6?"mid":"bad"}">${pct(s.acc)}</span>`:""}</a>`}).join("")}</div>

const chHas = (ch,key) => ch.sections.some(x=>x.key===key) || (ch.exams||[]).some(x=>x.key===key);
const sibsHTML = (ch,cur) => ch.sections.concat(ch.exams||[]).map(x=>`<a href="#${x.hash}" class="${x.exam||x.calc!=null?"x":""}" aria-current="${x===cur?"page":"false"}">${esc(x.nav)}</a>`).join("");
function examStat(x){
  const pool=EXAM.filter(q=>q.exam===x.key); let r=0,w=0,tried=0,missed=0;
  for(const q of pool){const s=P.q[q.id]; if(s){tried++; r+=s.r; w+=s.w; if(isMissed(q)) missed++}}
  return {total:pool.length,tried,missed,r,w,n:r+w,acc:(r+w)?r/(r+w):null};
}

function workCompareHTML(q){
  const mine=((P.work||{})[q.id]||{}).text;
  const model=q.eq?`<div class="eqbox"><span class="eyebrow">${q.calc?"Model working / formula":"Equations / key rule"}</span><div>${esc(q.eq)}</div></div>`:"";
  if(!mine) return model;
  return `<div class="workcmp"><div class="eqbox mine"><span class="eyebrow">Your working</span><div>${esc(mine)}</div></div>${model}</div>`;
}

/* ============================================================
   EXAM-STYLE QUESTION PAGES
   ============================================================ */
function examPool(x, sec, which){
  let pool=EXAM.filter(q=>q.exam===x.key);
  if(sec && sec!=="all") pool=pool.filter(q=>q.sec===sec);
  if(which==="new") pool=pool.filter(q=>!P.q[q.id]);
  if(which==="missed") pool=pool.filter(isMissed);
  return pool;
}
function examStart(ids){
  const x=CUR_X; let pool;
  if(ids) pool=EXAM.filter(q=>ids.includes(q.id)); else pool=examPool(x,XSET.sec,XSET.which);
  if(!pool.length){ toast(XSET.which==="missed"?"Nothing to retry here yet.":XSET.which==="new"?"You've tried them all. Pick another filter.":"No questions match."); return }
  const n = ids || XSET.n==="all" ? pool.length : Math.min(+XSET.n, pool.length);
  const where = XSET.sec==="all" ? "Chapter "+CH[x.ch].num : SEC[XSET.sec].nav;
  QZ={mode:"exam", exam:x.key, sec:x.key, label:ids?`${x.nav} · retry misses`:`${x.nav} · ${where}`,
    items:shuffle(pool).slice(0,n).map(q=>({id:q.id,order:[0,1,2,3]})), i:0, score:0, picked:null, revealed:false, wrong:[]};
  XTAB="practice"; render(); window.scrollTo(0,0);
}

      <div class="xlist">${list.map((q,i)=>{const s=P.q[q.id];return `<details class="xq"><summary><span class="num muted">${i+1}</span><span>${esc(q.q)}</span>${s?`<span class="chip ${isMissed(q)?"bad":"good"}">${s.r}/${s.r+s.w}</span>`:""}</summary>
        <div class="stack" style="gap:10px;padding-top:10px">

          <div class="xopts">${q.options.map((o,k)=>`<div class="${k===q.a?"right":""}"><b>${"ABCD"[k]})</b> ${esc(o)}${k===q.a?" ✓":""}</div>`).join("")}</div>

        <div class="stack" style="gap:6px"><span class="eyebrow">How many</span>${seg("n",[["10","10"],["20","20"],["all","All"]])}</div>

        <div class="row"><button class="btn primary" data-act="examstart" ${matching?"":"disabled"}>Start ${XSET.n==="all"?matching:Math.min(+XSET.n,matching)} question${(XSET.n==="all"?matching:Math.min(+XSET.n,matching))===1?"":"s"}</button><span class="muted" style="font-size:13px">${matching} match${matching===1?"es":""}</span></div>
        <p class="muted" style="font-size:13px">One best answer from A to D, like the exam. After each answer you get the explanation and the ${x.calc?"working and formula":"key rule"}.${x.calc?" Have a calculator ready.":""}</p>

          return `<div class="rate"><span>${esc(s.nav)} <span class="muted">· ${t}/${p.length} tried</span></span><span>${r+w?`<span class="chip ${r/(r+w)>=0.8?"good":r/(r+w)>=0.6?"mid":"bad"}">${pct(r/(r+w))}</span>`:`<span class="chip">Not tried</span>`}</span></div>`}).join("")}</div>

  ${body}`;
}

/* ---------- flashcards ---------- */
function startFlash(deck){
  let cards = CUR.cards.slice();
  if(deck==="Numbers"||deck==="Pairs") cards=cards.filter(c=>c.kind===deck);
  if(deck==="Weak") cards=cards.filter(c=>{const s=P.cards[c.id];return !s||s.w>=s.r});
  cards.sort(()=>Math.random()-0.5);
  FC={deck,cards,i:0,flipped:false,known:0};
}
function flashHTML(){
  if(!FC) startFlash("All");
  const decks=["All","Numbers","Pairs","Weak"];
  const head=`<div class="row" style="justify-content:center;margin-bottom:16px">${decks.map(d=>`<button class="btn small ${FC.deck===d?"primary":""}" data-act="deck" data-deck="${d}">${d==="Weak"?"Not yet known":d==="Numbers"?"Numbers to memorise":d==="Pairs"?"Confused pairs":"All cards"}</button>`).join("")}</div>`;
  if(!FC.cards.length) return head+`<div class="empty">No cards in this deck yet. Cards you mark "Didn't know" land here.</div>`;
  if(FC.i>=FC.cards.length) return head+`<div class="qbox"><div class="panel" style="text-align:center;display:grid;gap:10px"><h2>Deck done</h2><p class="muted">You knew <b class="num">${FC.known}</b> of <b class="num">${FC.cards.length}</b>.</p><div class="row" style="justify-content:center"><button class="btn primary" data-act="deck" data-deck="${FC.deck}">Go again</button><button class="btn" data-act="deck" data-deck="Weak">Just the ones I missed</button></div></div></div>`;
  const c=FC.cards[FC.i];
  return head+`<div class="qbox">
    <div class="progressline"><span>Card ${FC.i+1} of ${FC.cards.length} · ${c.kind==="Numbers"?"Number to memorise":"Confused pair"}</span><span class="num">${tcode(c.topic)} ${esc(TOPIC_TITLE[c.topic])}</span></div>
    <div class="flash ${FC.flipped?"flipped":""}" data-act="flip" role="button" tabindex="0" aria-label="Flip card">
      <div class="flash-inner"><div class="face"><div class="big">${esc(c.front)}</div><span class="muted" style="font-size:13px">Tap to reveal</span></div>
      <div class="face back"><div class="big">${esc(c.back)}</div></div></div>
    </div>
    <div class="row" style="justify-content:center">${FC.flipped?`<button class="btn bad" data-act="card" data-ok="0">Didn't know</button><button class="btn good" data-act="card" data-ok="1">Knew it</button>`:`<button class="btn primary" data-act="flip">Reveal answer</button>`}</div>
  </div>`;
}

/* ---------- quiz ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function secQuestions(key){return allQuestions().filter(q=>secOfQ(q)===key)}
function startQuiz(mode,id,secKey){
  const sec = SEC[secKey] || (id && TOPICS.find(t=>t.id===id) ? SEC[TOPICS.find(t=>t.id===id).sec] : CUR);
  let pool=secQuestions(sec.key), label=sec.nav+": mixed";
  if(mode==="topic"){pool=pool.filter(q=>q.topic===id);label=tcode(id)+" "+TOPIC_TITLE[id]}
  if(mode==="selftest"){pool=sec.questions.filter(q=>q.src==="Self-test");label=sec.nav+": your self-test"}
  if(mode==="mine"){pool=CUSTOM.items.filter(q=>secOfQ(q)===sec.key);label=sec.nav+": my questions"}
  if(mode==="weak"){
    const weakTopics=new Set(weakSpots().filter(w=>w.kind==="topic").map(w=>w.id));
    const missed=new Set(missedQuestions().map(q=>q.id));
    pool=pool.filter(q=>missed.has(q.id)||weakTopics.has(q.topic)); label=sec.nav+": weak spots";
  }
  const n = mode==="selftest"?pool.length:Math.min(10,pool.length);
  if(!pool.length){toast(mode==="weak"?"No weak spots yet. Take a quiz first.":"No questions here yet.");return}
  QZ={mode,label,sec:sec.key,items:shuffle(pool).slice(0,n).map(q=>({id:q.id,order:q.kind==="mcq"?shuffle(q.options.map((_,i)=>i)):null})),i:0,score:0,picked:null,revealed:false,wrong:[]};
  OPEN_TOPIC=null; TAB="quiz"; if(!goSection(sec.key)) render(); window.scrollTo(0,0);
}
function quizHTML(){
  if(!QZ){
    const missed=missedQuestions().filter(q=>secOfQ(q)===CUR.key).length, weak=weakSpots().filter(w=>w.sec===CUR.key).length;
    const mine=CUSTOM.items.filter(q=>secOfQ(q)===CUR.key).length, selfN=CUR.questions.filter(q=>q.src==="Self-test").length;
    return `<div class="stack">
      <div class="modes">

    :`<p class="muted">Answer it in your head (or out loud), then reveal.</p><div class="row"><button class="btn primary" data-act="reveal">Show answer</button></div>`}
  </div>`;
}
function answerQ(ok){
  const it=QZ.items[QZ.i]; bump(P.q,it.id,ok); if(ok) QZ.score++; else QZ.wrong.push(it.id); persist("progress");
}
function finishQuiz(){
  P.history.push({at:Date.now(),section:QZ.sec,mode:QZ.mode,label:QZ.label,score:QZ.score,total:QZ.items.length});
  if(P.history.length>200) P.history=P.history.slice(-200);
  persist("progress");
}

const gbp0 = x => money(x).replace(".00","");
const pc2 = x => (Math.round(x*100)/100).toString();
function sdltSlices(price, bands){
  let tax=0, lines=[], lo=0;
  for(const [top,rate] of bands){
    if(price<=lo) break;
    const slice=Math.min(price,top)-lo;
    if(slice>0){ const t=slice*rate/100; tax+=t; lines.push(`${gbp0(slice)} × ${rate}% = ${money(t)}`) }
    lo=top;
  }
  return {tax, lines};
}

  eq_mcap(){

  pr_sdlt(){

  pr_cap(){

    const price=R(30,800)*10000; const gross=roundTo(price*R(55,100)/1000,1000); const exp=roundTo(gross*R(15,35)/100,500); const ans=(gross-exp)/price*100;

  },
  pr_initial(){
    const reg=pick([["england","England"],["london","London"],["uk","the UK"]]); const price=XREAL.housePrice[reg[0]]; const costs=roundTo(price*R(2,6)/100,500); const ann=XREAL.rent[reg[0]]*12; const ans=ann/(price+costs)*100;
    return {q:`An average ${reg[1]==="the UK"?"UK":reg[1]} home costs <b>${gbp0(price)}</b> plus <b>${gbp0(costs)}</b> of purchase costs. It's let at the average rent of <b>${gbp0(XREAL.rent[reg[0]])} a month</b> (ONS). Initial yield?`,ans,unit:"%",tol:0.02,work:`Annual rent = ${gbp0(ann)}. Value incl. costs = ${gbp0(price+costs)}. Initial yield = ${gbp0(ann)} ÷ ${gbp0(price+costs)} = <b>${ans.toFixed(2)}%</b>. It ignores expenses and voids.`};
  },

  oa_fees(){
    const C=R(1,20)*50000; const gp=pick([-8,-3,4,6,8,10,12,15,20,25]); const gain=C*gp/100; const askNet=Math.random()<0.35;
    const mgmt=C*0.02, perf=Math.max(0,gain)*0.2, fees=mgmt+perf; const ans=askNet?gain-fees:fees;
    return {q:`You put <b>${gbp0(C)}</b> into a hedge fund charging <b>2 and 20</b>. This year it ${gp>=0?"makes":"loses"} <b>${Math.abs(gp)}%</b> before fees. ${askNet?"What is your gain after fees? (Use a minus sign for a loss.)":"What are the total fees?"} (Simplified: fees on starting capital and gross gain, no hurdle.)`,ans,unit:"£",
      work:`Management = 2% × ${gbp0(C)} = ${money(mgmt)}. Performance = 20% × ${gp>=0?gbp0(gain):"£0 (no gain)"} = ${money(perf)}. Fees = ${money(fees)}.${askNet?` Gain after fees = ${money(gain)} − ${money(fees)} = <b>${money(ans)}</b>.`:` Total <b>${money(fees)}</b>.`}`};

  oa_gold(){

      return {q:`Gold was <b>£${g.toLocaleString("en-GB",{minimumFractionDigits:2})}</b> per troy ounce on ${XREAL.gold.note}. What were <b>${oz} oz</b> worth?`,ans,unit:"£",work:`${oz} × ${money(g)} = <b>${money(ans)}</b>.`}}
    if(v==="move"){const oz=pick([1,2,5,10]); const ch=pick([-15,-10,-5,5,8,10,12,20]); const ans=oz*g*ch/100;
      return {q:`You hold <b>${oz} oz</b> of gold bought at <b>${money(g)}</b>/oz (${XREAL.gold.note}). The price ${ch>0?"rises":"falls"} <b>${Math.abs(ch)}%</b>. Your gain or loss in £? (Minus for a loss.)`,ans,unit:"£",work:`${oz} × ${money(g)} × ${ch}% = <b>${money(ans)}</b>. Gold pays no income, so the price move is your whole return.`}}
    const prem=pick([2,3,4,5,6]); const sp=pick([1,2,3]); const ans=((1+prem/100)/(1-sp/100)-1)*100;
    return {q:`Gold is <b>${money(g)}</b>/oz (${XREAL.gold.note}). A dealer sells coins at <b>${prem}%</b> over spot and buys back at <b>${sp}%</b> under spot (illustrative). By what % must spot rise for you to break even?`,ans,unit:"%",tol:0.02,
      work:`You pay ${money(g)} × ${1+prem/100} = ${money(g*(1+prem/100))}. To get that back selling at ${100-sp}% of spot, spot must reach ${money(g*(1+prem/100)/(1-sp/100))}. Rise = <b>${ans.toFixed(2)}%</b>. Physical holding costs bite before any gain.`};

  oa_auction(){
    const H=R(2,80)*1000; const b=pick([10,12,15,20]); const s=pick([10,12,15]); const askPct=Math.random()<0.6;

      work:`Cost = ${gbp0(H)} × ${1+b/100} = ${money(paid)}. You keep ${100-s}% of the sale, so you need ${money(paid)} ÷ ${(1-s/100).toFixed(2)} = ${money(need)}.${askPct?` Rise = <b>${((need/H-1)*100).toFixed(2)}%</b>.`:` Break-even hammer = <b>${money(need)}</b>.`} Fees on both sides make art slow to profit.`};
  },
  oa_6040(){
    const sc=pick([[12,4,"a good year"],[-15,-12,"a 2022-style year when both fell"],[-20,8,"a recession, when rate cuts lift bonds"],[8,XREAL.gilt,"bonds just earn their yield"],[R(-10,20),R(-5,10),"an illustrative year"]]);
    const ans=0.6*sc[0]+0.4*sc[1]; const C=R(2,50)*5000; const askCash=Math.random()<0.35;
    return {q:`A <b>60/40</b> portfolio of <b>${gbp0(C)}</b>. Equities return <b>${sc[0]}%</b> and bonds return <b>${sc[1]}%</b> (${sc[2]}). ${askCash?"What is the gain or loss in £? (Minus for a loss.)":"What is the portfolio return?"}`,ans:askCash?C*ans/100:ans,unit:askCash?"£":"%",
      work:`0.6 × ${sc[0]}% + 0.4 × ${sc[1]}% = ${(0.6*sc[0]).toFixed(2)}% + ${(0.4*sc[1]).toFixed(2)}% = ${askCash?ans.toFixed(2)+"%. On "+gbp0(C)+": <b>"+money(C*ans/100)+"</b>.":"<b>"+ans.toFixed(2)+"%</b>."}${sc[0]<0&&sc[1]<0?" When bonds and shares fall together, the 60/40 cushion fails.":""}`};

});

/* Company Analysis number practice: each problem gets a made-up set of accounts */
const r1=x=>Math.round(x*10)/10;
const fm=x=>"£"+x.toLocaleString("en-GB",{maximumFractionDigits:1})+"m";
const CA_NAMES=["Beta plc","Northgate Foods plc","Orion Engineering plc","Harbour Retail plc","Kestrel Software plc","Mercia Homes plc","Ashby Logistics plc","Solent Leisure plc"];
function caCo(){
  const rev=R(40,600), gp=r1(rev*R(30,60)/100), op=r1(rev*R(8,22)/100);
  const int=r1(Math.max(0.2,op*R(5,25)/100)), pbt=r1(op-int), tax=r1(pbt*0.25), np=r1(pbt-tax);
  const eq=r1(np/(R(8,22)/100)), ncl=r1(eq*R(15,90)/100);
  const cl=r1(rev*R(12,30)/100), ca=r1(cl*R(70,250)/100), inv=r1(ca*R(20,50)/100), cash=r1(ca*R(5,25)/100);
  const sh=R(20,400), eps=Math.round(np/sh*10000)/100, price=Math.max(20,Math.round(eps*R(8,25)));
  return {name:pick(CA_NAMES), rev, cogs:r1(rev-gp), gp, opex:r1(gp-op), op, int, pbt, tax, np, da:r1(rev*R(2,8)/100),
    eq, ncl, cl, ca, inv, cash, sh, eps, price, dps:Math.max(0.5,Math.round(eps*R(30,70)/10)/10), ocf:r1((np+r1(rev*0.05))*R(90,120)/100)};
}
const caTab=(c,rows)=>`<div class="tw"><table class="tbl mini"><tr><th colspan="2">${c.name} <span class="muted" style="font-weight:400">(illustrative figures)</span></th></tr>${rows.map(([l,v])=>`<tr><td>${l}</td><td class="num">${v}</td></tr>`).join("")}</table></div>`;
Object.assign(GEN,{
  ca_margin(){
    const c=caCo(), k=pick(["gross","op","net"]);
    const rows=[["Revenue",fm(c.rev)],["Cost of sales",fm(c.cogs)],["Operating expenses",fm(c.opex)],["Interest payable",fm(c.int)],["Tax",fm(c.tax)]];
    const name={gross:"gross profit margin",op:"operating profit margin",net:"net profit margin"}[k];
    const top={gross:c.gp,op:c.op,net:c.np}[k], ans=top/c.rev*100;
    const step={gross:`Gross profit = ${fm(c.rev)} − ${fm(c.cogs)} = ${fm(c.gp)}`,op:`Gross profit = ${fm(c.rev)} − ${fm(c.cogs)} = ${fm(c.gp)}. Operating profit = ${fm(c.gp)} − ${fm(c.opex)} = ${fm(c.op)}`,
      net:`Operating profit = ${fm(c.rev)} − ${fm(c.cogs)} − ${fm(c.opex)} = ${fm(c.op)}. Net profit = ${fm(c.op)} − ${fm(c.int)} − ${fm(c.tax)} = ${fm(c.np)}`}[k];
    return {q:`${caTab(c,rows)}What is the <b>${name}</b>?`,ans,unit:"%",work:`${step}. Margin = ${fm(top)} ÷ ${fm(c.rev)} = <b>${ans.toFixed(2)}%</b>.`};
  },
  ca_ebitda(){
    const c=caCo(), ebit=Math.random()<0.3;
    const rows=[["Revenue",fm(c.rev)],["Net profit (after tax)",fm(c.np)],["Interest payable",fm(c.int)],["Tax",fm(c.tax)],["Depreciation and amortisation",fm(c.da)]];
    const ans=r1(c.np+c.int+c.tax+(ebit?0:c.da));
    return {q:`${caTab(c,rows)}What is <b>${ebit?"EBIT":"EBITDA"}</b> in £ millions?`,ans,unit:"£m",tol:0.06,
      work:`${ebit?"EBIT":"EBITDA"} = net profit + interest + tax${ebit?"":" + D&A"} = ${c.np} + ${c.int} + ${c.tax}${ebit?"":" + "+c.da} = <b>${fm(ans)}</b>.${ebit?" EBIT is the same as operating profit.":" Revenue is a distractor."}`};
  },
  ca_returns(){
    const c=caCo(), roe=Math.random()<0.5;
    const rows=[["Operating profit",fm(c.op)],["Net profit (after tax)",fm(c.np)],["Shareholders' equity",fm(c.eq)],["Non-current liabilities",fm(c.ncl)]];
    const ans=roe?c.np/c.eq*100:c.op/(c.eq+c.ncl)*100;
    return {q:`${caTab(c,rows)}What is the <b>${roe?"return on equity (ROE)":"return on capital employed (ROCE)"}</b>?`,ans,unit:"%",
      work:roe?`ROE = net income ÷ shareholders' equity = ${fm(c.np)} ÷ ${fm(c.eq)} = <b>${ans.toFixed(2)}%</b>.`
        :`Capital employed = equity + non-current liabilities = ${fm(c.eq)} + ${fm(c.ncl)} = ${fm(r1(c.eq+c.ncl))}. ROCE = operating profit ÷ capital employed = ${fm(c.op)} ÷ ${fm(r1(c.eq+c.ncl))} = <b>${ans.toFixed(2)}%</b>.`};
  },
  ca_liquid(){
    const c=caCo(), quick=Math.random()<0.5;
    const rows=[["Current assets",fm(c.ca)],["of which inventory",fm(c.inv)],["of which cash",fm(c.cash)],["Current liabilities",fm(c.cl)]];
    const ans=quick?(c.ca-c.inv)/c.cl:c.ca/c.cl;
    const note=quick?"The quick ratio leaves out inventory, the hardest current asset to turn into cash."
      :ans<1?"Below 1 suggests a problem paying short-term debts.":ans>2?"Above 2 can mean idle assets.":ans>=1.5?"Within the 1.5 to 2 times that is usually acceptable.":"Between 1 and 1.5: adequate, but below the usual 1.5 to 2.";
    return {q:`${caTab(c,rows)}What is the <b>${quick?"quick ratio (acid test)":"current ratio"}</b>? Answer in times.`,ans,unit:"x",tol:0.011,
      work:`${quick?`(Current assets − inventory) ÷ current liabilities = (${c.ca} − ${c.inv}) ÷ ${c.cl}`:`Current assets ÷ current liabilities = ${c.ca} ÷ ${c.cl}`} = <b>${ans.toFixed(2)} times</b>. ${note}`};
  },
  ca_gear(){
    let c=caCo(); while(c.cash>=c.ncl) c=caCo(); const k=pick(["gear","de","nde","tie"]), pref=(k==="de"||k==="nde")&&Math.random()<0.35?r1(c.eq*R(5,15)/100):0;
    const rows=[["Operating profit (EBIT)",fm(c.op)],["Interest payable",fm(c.int)],["Long-term debt (non-current liabilities)",fm(c.ncl)]].concat(pref?[["Preference share capital",fm(pref)]]:[]).concat([["Cash",fm(c.cash)],["Shareholders' equity",fm(c.eq)]]);
    let ans,unit="%",tol,work;
    if(k==="gear"){ans=c.ncl/(c.eq+c.ncl)*100;work=`Gearing = long-term liabilities ÷ capital employed = ${fm(c.ncl)} ÷ (${c.eq} + ${c.ncl}) = <b>${ans.toFixed(2)}%</b>. Capital employed is equity plus long-term liabilities.`}
    else if(k==="de"){ans=(c.ncl+pref)/c.eq*100;work=`Debt/equity = (debt${pref?" + preference capital":""}) ÷ equity = (${c.ncl}${pref?" + "+pref:""}) ÷ ${c.eq} = <b>${ans.toFixed(2)}%</b>.${pref?" Preference shares count as debt here.":""} Cash is a distractor.`}
    else if(k==="nde"){ans=(c.ncl+pref-c.cash)/c.eq*100;work=`Net debt/equity = (debt${pref?" + preference capital":""} − cash) ÷ equity = (${c.ncl}${pref?" + "+pref:""} − ${c.cash}) ÷ ${c.eq} = <b>${ans.toFixed(2)}%</b>.${pref?" Preference shares count as debt here.":""}`}
    else {ans=c.op/c.int;unit="x";tol=0.011;work=`Times interest earned = EBIT ÷ interest payable = ${c.op} ÷ ${c.int} = <b>${ans.toFixed(2)} times</b>. Higher means less risk to lenders and shareholders.`}
    const name={gear:"gearing ratio",de:"debt/equity ratio (as a %)",nde:"net debt/equity ratio (as a %)",tie:"times interest earned"}[k];
    return {q:`${caTab(c,rows)}What is the <b>${name}</b>?${k==="tie"?" Answer in times.":""}`,ans,unit,tol,work};
  },
  ca_eps(){
    const c=caCo(), k=pick(["eps","pe","peg"]), g=R(4,20);
    if(k==="eps"){const ans=c.np/c.sh*100;
      return {q:`${caTab(c,[["Profit for ordinary shareholders",fm(c.np)],["Weighted average shares in issue",c.sh+"m"],["Share price",c.price+"p"]])}What is the <b>earnings per share (EPS)</b> in pence?`,ans,unit:"p",tol:0.011,
        work:`EPS = profit for ordinary shareholders ÷ weighted average shares = ${fm(c.np)} ÷ ${c.sh}m = <b>${ans.toFixed(2)}p</b>. The share price is a distractor.`}}
    const pe=c.price/c.eps;
    if(k==="pe") return {q:`${caTab(c,[["Share price",c.price+"p"],["EPS",f2(c.eps)+"p"],["Dividend per share",c.dps+"p"]])}What is the <b>P/E ratio</b>?`,ans:pe,unit:"x",tol:0.011,
      work:`P/E = share price ÷ EPS = ${c.price} ÷ ${f2(c.eps)} = <b>${pe.toFixed(2)}</b>. Investors pay ${pe.toFixed(2)} times earnings.`};
    const ans=pe/g;
    return {q:`${caTab(c,[["Share price",c.price+"p"],["EPS",f2(c.eps)+"p"],["Expected EPS growth",g+"% a year"]])}What is the <b>PEG ratio</b>?`,ans,unit:"x",tol:0.011,
      work:`P/E = ${c.price} ÷ ${f2(c.eps)} = ${pe.toFixed(2)}. PEG = P/E ÷ growth = ${pe.toFixed(2)} ÷ ${g} = <b>${ans.toFixed(2)}</b>. ${ans<1?"Below 1 can suggest undervalued.":ans>1?"Above 1 can suggest overvalued.":""} Use growth as a whole number, not 0.${String(g).padStart(2,"0")}.`};
  },
  ca_div(){
    const c=caCo(), k=pick(["dy","cover","ey"]);
    const rows=[["Share price",c.price+"p"],["EPS",f2(c.eps)+"p"],["Dividend per share",c.dps+"p"]];
    let ans,unit="%",tol,work,name;
    if(k==="dy"){ans=c.dps/c.price*100;name="dividend yield";work=`Dividend yield = DPS ÷ share price = ${c.dps} ÷ ${c.price} = <b>${ans.toFixed(2)}%</b>.`}
    else if(k==="ey"){ans=c.eps/c.price*100;name="earnings yield";work=`Earnings yield = EPS ÷ share price = ${f2(c.eps)} ÷ ${c.price} = <b>${ans.toFixed(2)}%</b>. It is 1 ÷ P/E.`}
    else {ans=c.eps/c.dps;unit="x";tol=0.011;name="dividend cover";work=`Dividend cover = EPS ÷ DPS = ${f2(c.eps)} ÷ ${c.dps} = <b>${ans.toFixed(2)} times</b>. ${ans<1?"Below 1: the dividend is paid partly out of reserves.":ans>=2?"Well covered.":"Covered, but not by much."}`}
    return {q:`${caTab(c,rows)}What is the <b>${name}</b>?${unit==="x"?" Answer in times.":""}`,ans,unit,tol,work};
  },
  ca_value(){
    const c=caCo(), k=pick(["nav","pb","pcf","ev"]);
    const ta=r1(c.eq+c.ncl+c.cl), tl=r1(c.ncl+c.cl), nav=c.eq/c.sh*100, mcap=c.sh*c.price/100;
    if(k==="nav"||k==="pb"){
      const rows=[["Total assets",fm(ta)],["Total liabilities",fm(tl)],["Shares in issue",c.sh+"m"],["Share price",c.price+"p"]];
      if(k==="nav") return {q:`${caTab(c,rows)}What is the <b>net asset value (NAV) per share</b> in pence?`,ans:nav,unit:"p",tol:0.011,
        work:`NAV per share = (assets − liabilities) ÷ shares = (${ta} − ${tl}) ÷ ${c.sh}m = ${fm(c.eq)} ÷ ${c.sh}m = <b>${nav.toFixed(2)}p</b>.`};
      const ans=c.price/nav;
      return {q:`${caTab(c,rows)}What is the <b>price-to-book (P/B) ratio</b>?`,ans,unit:"x",tol:0.011,
        work:`Book value per share = (${ta} − ${tl}) ÷ ${c.sh}m = ${nav.toFixed(2)}p. P/B = ${c.price} ÷ ${nav.toFixed(2)} = <b>${ans.toFixed(2)}</b>. ${ans<1?"Below 1: the market values the shares below their book value.":"The market values the shares above their book value."}`};
    }
    if(k==="pcf"){const cfps=c.ocf/c.sh*100, ans=c.price/cfps;
      return {q:`${caTab(c,[["Operating cash flow",fm(c.ocf)],["Net profit",fm(c.np)],["Shares in issue",c.sh+"m"],["Share price",c.price+"p"]])}What is the <b>price to cash flow (P/CF) ratio</b>?`,ans,unit:"x",tol:0.011,
        work:`Operating cash flow per share = ${fm(c.ocf)} ÷ ${c.sh}m = ${cfps.toFixed(2)}p. P/CF = ${c.price} ÷ ${cfps.toFixed(2)} = <b>${ans.toFixed(2)}</b>. Net profit is a distractor.`}}
    const ceq=Math.random()<0.4?r1(c.cash*R(30,120)/100):0, ans=mcap+c.ncl-c.cash-ceq;
    return {q:`${caTab(c,[["Shares in issue",c.sh+"m"],["Share price",c.price+"p"],["Debt",fm(c.ncl)],["Cash",fm(c.cash)]].concat(ceq?[["Cash equivalents",fm(ceq)]]:[]))}What is the <b>enterprise value (EV)</b> in £ millions?`,ans,unit:"£m",tol:0.06,
      work:`Market cap = ${c.sh}m × £${(c.price/100).toFixed(2)} = ${fm(r1(mcap))}. EV = market cap + debt − cash${ceq?" − cash equivalents":""} = ${mcap.toFixed(2)} + ${c.ncl} − ${c.cash}${ceq?" − "+ceq:""} = <b>£${ans.toFixed(2)}m</b>.`};
  }
});

function calc(){

  const go=document.getElementById("g-out"); if(go){const c=v("g-c"),p=v("g-p")||1,y=Math.max(0.0001,v("g-y")),r=v("g-r");const ry=c/p*100,hpr=(r-p)/p*100,ann=hpr/y;go.innerHTML=`<span>Running yield = ${ry.toFixed(2)}%</span><span>HPR = ${hpr.toFixed(2)}%, annualised ${ann.toFixed(2)}%</span><span>Approx GRY = ${(ry+ann).toFixed(2)}%</span>`}
  const dd=document.getElementById("d-out"); if(dd){const D=v("d-d"),y=v("d-y"),c=v("d-c"),p=v("d-p");const md=D/(1+y/100),ch=-md*c;dd.innerHTML=`<span>Modified duration = ${md.toFixed(2)}</span><span>Price change ≈ ${ch.toFixed(2)}%</span><span>New price ≈ ${money(p*(1+ch/100))}</span>`}
  const ao=document.getElementById("a-out"); if(ao){const c=v("a-c"),n=Math.max(1,v("a-n")),d=v("a-d"),per=Math.max(1,v("a-p")),nom=v("a-nom");const a=c/n*d/per;ao.innerHTML=`<span>Accrued = £${a.toFixed(4)} per £100</span><span>On £${nom.toLocaleString("en-GB")} nominal = ${money(a*nom/100)}</span>`}
  calcX();
  const lo=document.getElementById("l-out"); if(lo){const S=v("l-s"),h=v("l-h"),B=v("l-b"),cr=v("l-cr");const int=S*h/100+B*cr/100;const eff=(S+B)?int/(S+B)*100:0;lo.innerHTML=`<span>Interest = ${money(int)}</span><span>Effective rate = ${eff.toFixed(2)}%</span>`}
}
function checkNP(raw){
  const x=parseFloat(String(raw).replace(/[£$%,\s]|m$|p$|x$/gi,"").replace(/[a-z]+$/i,""));
  if(isNaN(x)){toast("Type a number first");return}
  const tol=NP.tol!=null?NP.tol:(NP.unit==="%"?0.015:1);
  NP.given=raw; NP.answered=true; NP.ok=Math.abs(x-NP.ans)<=tol;
  bump(P.nums,NP.type,NP.ok); persist("progress"); render();
}

function parsePasted(text, defTopic){
  const out=[]; const lines=String(text).replace(/\r/g,"").split("\n");
  // 1) table rows: "question<TAB>answer" or "question | answer" (optional leading number column)
  const blocks=[]; let cur=[];
  for(const ln of lines){ if(!ln.trim()){ if(cur.length){blocks.push(cur);cur=[]} } else cur.push(ln) }
  if(cur.length) blocks.push(cur);
  for(const b of blocks){
    const isRowBlock=b.every(l=>/\t| \| /.test(l)) && !b.some(l=>/^\s*\(?[A-Da-d][\).:]\s+/.test(l));
    if(isRowBlock){
      for(const l of b){
        let parts=l.split(/\t| \| /).map(s=>s.trim()).filter(Boolean);
        if(parts.length>=3 && /^#?\d+\.?$/.test(parts[0])) parts=parts.slice(1);
        if(parts.length<2) continue;
        if(/^question$/i.test(parts[0])) continue;
        out.push({kind:"recall",q:parts[0],answer:parts.slice(1).join(" — "),topic:defTopic});
      }
      continue;
    }
    let q="",opts=[],ans="",why="",topic=defTopic;
    for(let l of b){
      l=l.trim(); let m;
      if((m=l.match(/^(?:answer|ans|correct(?: answer)?)\s*[:\-–]\s*(.+)$/i))){ans=m[1].trim();continue}
      if((m=l.match(/^(?:topic|section)\s*[:\-–]\s*(.+)$/i))){const t=m[1].trim().match(/[1-5](?:\.\d{1,2}){1,2}/),pre=(String(CUR.topics[0].id).match(/^C\d+-/)||[""])[0];if(t){const id=[pre+t[0],t[0]].find(k=>TOPIC_TITLE[k]);if(id)topic=id}continue}
      if((m=l.match(/^(?:why|explanation|reason)\s*[:\-–]\s*(.+)$/i))){why=m[1].trim();continue}
      if((m=l.match(/^\(?([A-Fa-f])[\).:]\s+(.+)$/)) && q){opts.push(m[2].trim());continue}
      if((m=l.match(/^(?:q(?:uestion)?\s*\d*\s*[:.)\-–]\s*)(.+)$/i))){q=(q?q+" ":"")+m[1].trim();continue}
      if(opts.length===0){ q=(q?q+" ":"")+l.replace(/^\d+[.)]\s*/,"") ; continue }
      if(!ans && opts.length) {why=(why?why+" ":"")+l}
    }
    if(!q) continue;
    if(opts.length>=2){
      let a=-1; const L=ans.match(/^\(?([A-Fa-f])\)?(?:[\s.):]|$)/);
      if(L) a="abcdef".indexOf(L[1].toLowerCase());
      if(a<0&&ans) a=opts.findIndex(o=>o.toLowerCase()===ans.toLowerCase());
      if(a<0||a>=opts.length){ out.push({kind:"error",q,msg:"Couldn't tell which option is correct. Add a line like \"Answer: B\"."}); continue }
      out.push({kind:"mcq",q,options:opts,a,why,topic});
    } else if(ans){
      out.push({kind:"recall",q,answer:ans,why,topic});
    } else {
      const qa=q.match(/^(.+\?)\s+(.+)$/);
      if(qa) out.push({kind:"recall",q:qa[1],answer:qa[2],why,topic});
      else out.push({kind:"error",q,msg:"No answer found. Add a line like \"Answer: …\"."});
    }
  }
  return out;
}

  ["ca","C2-1.3.3","Interest cover","Interest cover = (Operating profit + Interest receivable + Other income) ÷ Interest payable","Higher = less risk"],
  ["ca","C2-1.3.4","EPS","EPS = Profit for ordinary shareholders ÷ Weighted average shares",""],
  ["ca","C2-1.3.4","P/E and PEG","P/E = Share price ÷ EPS. PEG = P/E ÷ EPS growth rate","Growth as a whole number (10, not 0.10)"],
  ["ca","C2-1.3.4","Dividend and earnings yield","Dividend yield = Gross DPS ÷ Price. Earnings yield = Gross EPS ÷ Price","Earnings yield = 1 ÷ P/E"],
  ["ca","C2-1.3.4","Dividend cover","Dividend cover = EPS ÷ Net DPS",""],
  ["ca","C2-1.3.4","NAV and P/B","NAV per share = (Assets − Liabilities) ÷ Shares. P/B = Price ÷ Book value per share",""],
  ["ca","C2-1.3.4","Price to cash flow","P/CF = Share price ÷ Operating cash flow per share",""],
  ["ca","C2-1.3.4","Enterprise value","EV = Market cap + Debt − Cash − Cash equivalents","Market cap = Shares × Price"]
].map(([sec,topic,name,f,note])=>({sec,topic,name,f,note}));

/* --- calculator: a small safe expression evaluator --- */
function calcEval(src, ans){
  const s=String(src).replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-").replace(/,/g,"").replace(/\s+/g,"").replace(/√/g,"r").replace(/ans/gi,"a");
  let i=0;
  const peek=()=>s[i], eat=c=>{ if(s[i]===c){ i++; return true } return false };
  function expr(){ let v=term(); for(;;){ if(eat("+")) v+=term(); else if(eat("-")) v-=term(); else return v } }
  function term(){ let v=unary(); for(;;){ if(eat("*")) v*=unary(); else if(eat("/")) v/=unary(); else if(/[\d.(ra]/.test(peek()||"")) v*=unary(); else return v } }
  function unary(){ if(eat("-")) return -unary(); if(eat("+")) return unary(); return power() }
  function power(){ let b=postfix(); if(eat("^")) return Math.pow(b, unary()); return b }
  function postfix(){ let v=atom(); while(eat("%")) v/=100; return v }
  function atom(){
    if(eat("(")){ const v=expr(); eat(")"); return v }
    if(eat("r")) return Math.sqrt(postfix());
    if(eat("a")) return ans||0;
    const m=s.slice(i).match(/^\d*\.?\d+(e[-+]?\d+)?/i);
    if(!m) throw new Error("bad");
    i+=m[0].length; return parseFloat(m[0]);
  }
  if(!s) throw new Error("empty");
  const v=expr(); if(i<s.length) throw new Error("bad"); if(!isFinite(v)) throw new Error("bad");
  return v;
}
const fmtCalc = v => Math.abs(v)>=1e15||(Math.abs(v)<1e-9&&v!==0) ? v.toExponential(8) : String(+v.toPrecision(12));

/* --- toolkit state and context --- */
const TK = { open:false, tab:"formulas", search:"", expr:"", ans:0, tape:[], ctx:null, sketches:{} };
try{ Object.assign(TK, {tab:lsGet("irt.tk.tab")||"formulas", tape:lsGet("irt.tk.tape")||[]}) }catch(e){}
function tkContext(){
  // Which question is on screen, if any, on a numbers page.
  const page=route._last;
  if(page==="exam" && CUR_X.calc && XTAB==="practice"){
    const it=QZ&&QZ.exam===CUR_X.key&&QZ.i<QZ.items.length?QZ.items[QZ.i]:null; const q=it&&qById(it.id);
    return {show:true, ch:CUR_X.ch, key:q?q.id:null, sec:q?q.sec:(XSET.sec!=="all"?XSET.sec:null), topic:q?q.topic:null, label:q?q.id:null, hint:q?q.tlabel:""};
  }
  if(page==="section" && TAB==="numbers" && NP){
    return {show:true, key:"np:"+NP.type, sec:CUR.key, topic:NUM_TYPES[NP.type].topic, label:NUM_TYPES[NP.type].label, hint:NUM_TYPES[NP.type].label, scratch:true};
  }
  return {show:false};
}
function tkSync(){
  const c=tkContext();
  if(c.key!==(TK.ctx||{}).key){ if(TK.ctx&&TK.ctx.key) delete TK.sketches[TK.ctx.key]; TK.scratch="" }
  TK.ctx=c;
  const btn=document.getElementById("tk-btn"), panel=document.getElementById("tk");
  btn.hidden=!c.show || TK.open; panel.hidden=!c.show || !TK.open;
  document.body.classList.toggle("tk-open", c.show && TK.open);
  if(c.show && TK.open) tkRender();
}
function tkFormulasHTML(){
  const c=TK.ctx||{}, q=TK.search.trim().toLowerCase();
  let list=FORMULAS.filter(f=>!q || (f.name+" "+f.f+" "+f.note+" "+f.topic).toLowerCase().includes(q));
  const order=SECTIONS.map(s=>s.key);
  const secs=order.filter(k=>list.some(f=>f.sec===k));
  if(c.sec && !q){ secs.sort((a,b)=>(b===c.sec)-(a===c.sec)) }
  else if(c.ch && !q){ secs.sort((a,b)=>(SEC[b].ch===c.ch)-(SEC[a].ch===c.ch)) }
  // Highlight the formulas for this question's topic; the closest name match gets scrolled to.
  const words=String(c.hint||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2&&!/^\d/.test(w));
  const score=f=>words.filter(w=>(f.name+" "+f.f).toLowerCase().includes(w)).length;
  const hits=FORMULAS.filter(f=>c.topic&&f.topic===c.topic);
  const best=hits.length?hits.reduce((a,b)=>score(b)>score(a)?b:a):null;
  return `<input class="plain" id="tk-search" placeholder="Search formulas, e.g. GRY or SDLT" value="${esc(TK.search)}" autocomplete="off">
    ${secs.length?secs.map(k=>`<div class="tk-group"><span class="eyebrow">${esc(SEC[k].nav)}</span>${list.filter(f=>f.sec===k).map(f=>`
      <div class="tk-f ${c.topic&&f.topic===c.topic?"hit":""} ${f===best?"best":""}"><div class="row" style="justify-content:space-between;gap:6px"><b>${esc(f.name)}</b><span class="num muted" style="font-size:11px">${tcode(f.topic)}</span></div>
      <code>${esc(f.f)}</code>${f.note?`<span class="muted" style="font-size:12.5px">${esc(f.note)}</span>`:""}</div>`).join("")}</div>`).join("")
    :`<p class="muted">No formula matches “${esc(TK.search)}”.</p>`}`;
}
function tkCalcHTML(){
  const keys=[["(","("],[")",")"],["^","xʸ"],["√","√"],["C","C"],
              ["7","7"],["8","8"],["9","9"],["÷","÷"],["⌫","⌫"],
              ["4","4"],["5","5"],["6","6"],["×","×"],["%","%"],
              ["1","1"],["2","2"],["3","3"],["−","−"],["ans","Ans"],
              ["0","0"],[".","."],["00","00"],["+","+"],["=","="]];
  let prev=""; try{ prev=TK.expr.trim()?fmtCalc(calcEval(TK.expr,TK.ans)):"" }catch(e){ prev="" }
  return `<div class="calc">
    <input class="calc-in" id="tk-expr" value="${esc(TK.expr)}" placeholder="e.g. 40000 × (1 + 0.044/12)^36" autocomplete="off" inputmode="decimal" spellcheck="false">
    <div class="calc-prev num" id="tk-prev">${prev?"= "+esc(prev):"&nbsp;"}</div>
    <div class="calc-keys">${keys.map(([k,l])=>`<button data-tk="key" data-k="${esc(k)}" class="${k==="="?"eq":/^[0-9.]|00/.test(k)?"d":""}">${l}</button>`).join("")}</div>
    ${TK.tape.length?`<div class="tk-group"><div class="row" style="justify-content:space-between"><span class="eyebrow">Earlier results · tap to reuse</span><button class="linkish" data-tk="cleartape">Clear</button></div>
      <div class="tape">${TK.tape.slice().reverse().map(t=>`<button data-tk="reuse" data-v="${esc(t.v)}"><span class="muted">${esc(t.e)} =</span> <b class="num">${esc(t.v)}</b></button>`).join("")}</div></div>`:""}
    <p class="muted" style="font-size:12px">Type with your keyboard too: * and / work, ^ for powers, Enter to work it out.</p>
  </div>`;
}
function tkWorkHTML(){
  const c=TK.ctx||{};
  if(!c.key) return `<p class="muted">Start a question and your working pad for it appears here.</p>`;
  const w=c.scratch?(TK.scratch||""):((P.work||{})[c.key]||{}).text||"";
  return `<div class="stack" style="gap:8px">
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Working for ${esc(c.label)}</span><span class="muted" style="font-size:12px">${c.scratch?"Clears on the next problem":"Saved with this question"}</span></div>
    <textarea id="tk-work" class="work" rows="9" placeholder="Write your steps, e.g.&#10;RY = 4.25 ÷ 98.55 = 4.31%&#10;HPR = (100 − 98.55) ÷ 98.55 = 1.47%">${esc(w)}</textarea>
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Sketch pad</span><button class="linkish" data-tk="clearsketch">Clear sketch</button></div>
    <canvas id="tk-sketch" class="sketch" height="260"></canvas>
    <span class="muted" style="font-size:12px">Draw with your mouse, finger or pen. The sketch stays on this device until you move to another question.</span>
  </div>`;
}
function tkRender(){
  const el=document.getElementById("tk-body"); const active=document.activeElement&&document.activeElement.id;
  const caret=active&&document.activeElement.selectionStart;
  document.querySelectorAll("#tk .tk-tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===TK.tab));
  el.innerHTML = TK.tab==="formulas"?tkFormulasHTML():TK.tab==="calc"?tkCalcHTML():tkWorkHTML();
  if(active){ const a=document.getElementById(active); if(a&&el.contains(a)){ a.focus(); try{a.setSelectionRange(caret,caret)}catch(e){} } }
  if(TK.tab==="formulas"){ const hit=el.querySelector(".tk-f.best")||el.querySelector(".tk-f.hit"); if(hit&&!TK.search) hit.scrollIntoView({block:"nearest"}) }
  if(TK.tab==="work") tkSketchInit();
}
function tkSketchInit(){
  const cv=document.getElementById("tk-sketch"); if(!cv) return;
  const key=(TK.ctx||{}).key; const ratio=window.devicePixelRatio||1;
  cv.width=cv.clientWidth*ratio; cv.height=260*ratio;
  const g=cv.getContext("2d"); g.scale(ratio,ratio); g.lineCap="round"; g.lineJoin="round"; g.lineWidth=2;
  g.strokeStyle=getComputedStyle(document.body).getPropertyValue("--ink")||"#111";
  const strokes=TK.sketches[key]||(TK.sketches[key]=[]);
  const draw=st=>{ g.beginPath(); st.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.stroke() };
  strokes.forEach(draw);
  let cur=null;
  const pt=e=>{const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]};
  cv.onpointerdown=e=>{ cv.setPointerCapture(e.pointerId); cur=[pt(e)]; strokes.push(cur) };
  cv.onpointermove=e=>{ if(!cur) return; cur.push(pt(e)); g.beginPath(); const a=cur[cur.length-2], b=cur[cur.length-1]; g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke() };
  cv.onpointerup=cv.onpointercancel=()=>{ cur=null };
}
function tkCalcRun(){
  try{ const v=calcEval(TK.expr,TK.ans); const out=fmtCalc(v);
    TK.tape.push({e:TK.expr,v:out}); if(TK.tape.length>12) TK.tape.shift(); lsSet("irt.tk.tape",TK.tape);
    TK.ans=v; TK.expr=out; }
  catch(e){ toast("Check the sum: something doesn't add up") }
  tkRender(); const i=document.getElementById("tk-expr"); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length) }
}
function tkKey(k){
  const i=document.getElementById("tk-expr"); let a=i?i.selectionStart:TK.expr.length, b=i?i.selectionEnd:TK.expr.length;
  if(k==="="){ tkCalcRun(); return }
  if(k==="C"){ TK.expr="" }
  else if(k==="⌫"){ if(a===b&&a>0) a--; TK.expr=TK.expr.slice(0,a)+TK.expr.slice(b); b=a }
  else { const ins=k==="ans"?"Ans":k==="√"?"√(":k; TK.expr=TK.expr.slice(0,a)+ins+TK.expr.slice(b); a=b=a+ins.length }
  tkRender(); const j=document.getElementById("tk-expr"); if(j){ j.focus(); j.setSelectionRange(a,a) }
}
function tkSaveWork(text){
  const c=TK.ctx||{}; if(!c.key) return;
  if(c.scratch){ TK.scratch=text; return }
  P.work=P.work||{};
  if(text.trim()) P.work[c.key]={text,at:Date.now()}; else delete P.work[c.key];
  clearTimeout(tkSaveWork._t); tkSaveWork._t=setTimeout(()=>persist("progress"),600);
}
function tkInit(){
  const host=document.createElement("div");
  host.innerHTML=`<button id="tk-btn" class="tk-btn" hidden data-tk="open">🧮 Toolkit</button>
  <aside id="tk" class="tk" hidden aria-label="Toolkit">
    <div class="tk-head"><div class="tk-tabs" role="tablist">${[["formulas","Formulas"],["calc","Calculator"],["work","Working"]].map(([k,l])=>`<button role="tab" data-tk="tab" data-tab="${k}">${l}</button>`).join("")}</div>
      <button class="tk-x" data-tk="close" aria-label="Close toolkit">✕</button></div>
    <div class="tk-body" id="tk-body"></div>
  </aside>`;
  document.body.append(...host.children);
  document.addEventListener("click",e=>{
    const b=e.target.closest("[data-tk]"); if(!b) return;
    const a=b.dataset.tk;
    if(a==="open"){ TK.open=true; tkSync();
      // On a phone the toolkit covers the lower half, so bring the question to the top.
      const q=document.querySelector(".qtext"); if(q&&innerWidth<=700){ const top=document.querySelector(".top"); window.scrollTo(0, q.getBoundingClientRect().top+scrollY-(top?top.offsetHeight:0)-8) } }
    else if(a==="close"){ TK.open=false; tkSync() }
    else if(a==="tab"){ TK.tab=b.dataset.tab; lsSet("irt.tk.tab",TK.tab); tkRender() }
    else if(a==="key") tkKey(b.dataset.k);
    else if(a==="reuse"){ TK.expr+=b.dataset.v; tkRender() }
    else if(a==="cleartape"){ TK.tape=[]; lsSet("irt.tk.tape",[]); tkRender() }
    else if(a==="clearsketch"){ TK.sketches[(TK.ctx||{}).key]=[]; tkRender() }
  });
  document.addEventListener("input",e=>{
    if(e.target.id==="tk-search"){ TK.search=e.target.value; tkRender() }
    else if(e.target.id==="tk-expr"){ TK.expr=e.target.value; let p=""; try{ p=TK.expr.trim()?"= "+fmtCalc(calcEval(TK.expr,TK.ans)):"" }catch(x){} document.getElementById("tk-prev").innerHTML=p?esc(p):"&nbsp;" }
    else if(e.target.id==="tk-work") tkSaveWork(e.target.value);
  });
  document.addEventListener("keydown",e=>{ if(e.target.id==="tk-expr"&&e.key==="Enter"){ e.preventDefault(); tkCalcRun() } }, true);
}
tkInit();

document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest(".flash")){e.preventDefault();FC.flipped=!FC.flipped;render()} });
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, d=el.dataset;
  switch(act){
    case "tab": TAB=d.tab; lsSet("irt.tab",TAB); OPEN_TOPIC=null; if(TAB==="quiz"&&QZ&&QZ.i>=QZ.items.length) QZ=null; render(); break;
    case "opentopic": { e.preventDefault(); TAB="topics"; const t=TOPICS.find(x=>x.id===d.id); if(location.hash!=="#"+SEC[t.sec].hash){PENDING_TOPIC=d.id; location.hash="#"+SEC[t.sec].hash} else {OPEN_TOPIC=d.id; render(); window.scrollTo(0,0)} break }
    case "closetopic": OPEN_TOPIC=null; render(); break;
    case "toggledone": if(P.topicsDone[d.id]) delete P.topicsDone[d.id]; else P.topicsDone[d.id]=Date.now(); persist("progress"); render(); break;
    case "deck": startFlash(d.deck); render(); break;
    case "flip": if(FC){FC.flipped=!FC.flipped; render()} break;
    case "card": { const c=FC.cards[FC.i]; const ok=d.ok==="1"; bump(P.cards,c.id,ok); if(ok) FC.known++; persist("progress"); FC.i++; FC.flipped=false; render(); break }
    case "startquiz": startQuiz(d.mode,d.id,d.sec); break;
    case "quizhome": QZ=null; render(); break;
    case "xtab": XTAB=d.tab; render(); break;
    case "xset": XSET[d.k]=d.v; render(); break;
    case "examstart": examStart(); break;
    case "examretry": examStart(QZ.wrong.slice()); break;
    case "examopen": XSET.sec=d.sec||"all"; XTAB="practice"; location.hash="#"+d.hash; break;
    case "pick": { const q=qById(QZ.items[QZ.i].id); QZ.picked=+d.i; answerQ(QZ.picked===q.a); render(); break }
    case "reveal": QZ.revealed=true; render(); break;
    case "selfmark": QZ.picked=d.ok==="1"?1:0; answerQ(d.ok==="1"); render(); break;
    case "nextq": QZ.i++; QZ.picked=null; QZ.revealed=false; if(QZ.i>=QZ.items.length) finishQuiz(); render(); window.scrollTo(0,0); break;
    case "newnp": newProblem(NP.filter); render(); break;
    case "skipnp": newProblem(NP.filter); render(); break;
    case "parse": { const t=document.getElementById("mq-text").value; if(!t.trim()){toast("Paste some questions first");break} PASTE_PREVIEW=parsePasted(t,document.getElementById("mq-topic").value); PASTE_PREVIEW._text=t; PASTE_PREVIEW._topic=document.getElementById("mq-topic").value; render(); document.getElementById("mq-text").value=t; document.getElementById("mq-topic").value=PASTE_PREVIEW._topic; break }
    case "clearpaste": PASTE_PREVIEW=null; render(); break;
    case "addparsed": { const ok=PASTE_PREVIEW.filter(x=>x.kind!=="error"); const now=Date.now(); ok.forEach((q,i)=>{q.id="my"+now.toString(36)+i; q.src="Mine"; q.sec=(q.topic!=="mine"&&TOPICS.find(t=>t.id===q.topic))?TOPICS.find(t=>t.id===q.topic).sec:CUR.key; CUSTOM.items.push(q)}); PASTE_PREVIEW=null; persist("custom"); toast(`Added ${ok.length} question${ok.length===1?"":"s"}`); render(); break }
    case "delq": CUSTOM.items=CUSTOM.items.filter(q=>q.id!==d.id); delete P.q[d.id]; persist("custom"); persist("progress"); render(); break;
  }
});
render();
</script>
