<tr><td><b>Market cap</b></td><td>Bigger companies count more</td><td>FTSE 100, S&amp;P 500, Hang Seng</td></tr>
<tr><td><b>Equal</b></td><td>Same amount in each</td><td>MSCI USA Equal Weighted</td></tr>
<tr><td><b>Free float</b></td><td>Only freely tradable shares count</td><td>Most major indices</td></tr></table></div>
<p><b>Capped</b> indices limit any one stock or sector. FTSE 100 is reviewed <b>quarterly</b>.</p>`,
traps:["The <b>Dow</b> is <b>price</b>-weighted.","Free float shows what managers can <b>actually buy</b>."]},

{id:"3.8", title:"Selecting Equities and Funds", blurb:"Active and passive strategies, replication methods, diversification.",
html:`<p>Passive investing rests on the <b>Efficient Market Hypothesis</b>. For passive funds look at <b>tracking error</b>.</p>
<div class="tw"><table class="tbl"><tr><th>Active strategy</th><th>What it does</th></tr>
<tr><td><b>Growth</b></td><td>Above-average earnings growth</td></tr>
<tr><td><b>GARP</b></td><td>Growth <b>not yet priced in</b>; less aggressive</td></tr>
<tr><td><b>Income</b></td><td>High steady dividends from mature firms</td></tr>
<tr><td><b>Value</b></td><td><b>Undervalued</b> firms; hopes for <b>reversion to the mean</b></td></tr>
<tr><td><b>Contrarian</b></td><td>Believes the <b>market has overreacted</b></td></tr>
<tr><td><b>Absolute return</b></td><td>Positive in <b>all</b> conditions</td></tr>
<tr><td><b>Quantitative</b></td><td>Computer-found patterns</td></tr>
<tr><td><b>Long/short</b></td><td>Buy risers, <b>short</b> fallers</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Passive strategy</th><th>What it does</th></tr>
<tr><td><b>Buy and hold</b></td><td>Hold indefinitely</td></tr>
<tr><td><b>Indexation</b></td><td>Full replication, stratified sampling, factor matching, optimisation, <b>synthetic (swaps)</b></td></tr>
<tr><td><b>Rebalancing</b></td><td><b>Calendar</b> or <b>contingent</b> (when weights drift)</td></tr></table></div>
<p>Diversify by region, sector and size. Growth metrics: P/E, PEG, ROE. Dividend metrics: cover, growth, <b>pay-out ratio = dividends ÷ net income</b>.</p>`,
traps:["GARP is the <b>less aggressive</b> growth style.","Contrarian thinks the market <b>overreacted</b>. Value hopes for <b>reversion to the mean</b>.","Synthetic replication uses <b>swaps</b>."]},

{id:"3.9", title:"Pros and Cons of Equities", blurb:"Advantages, disadvantages and market history.",
html:`<div class="tw"><table class="tbl"><tr><th>Advantages</th><th>Disadvantages</th></tr>
<tr><td>Higher long-term returns; traditional <b>inflation hedge</b>; wide access; large caps <b>more liquid</b> than property; part-ownership rights; funds can compound dividends</td><td>Short-term swings; companies can fail; dividends <b>not guaranteed</b>; foreign political and currency risk; individual shares <b>don't compound</b></td></tr></table></div>
<ul><li><b>Portfolio turnover</b> = how often holdings trade. High turnover means more costs.</li>
<li>First exchange: <b>Euronext Amsterdam (1600s)</b>. LSE's first rule book: <b>1812</b>.</li>
<li><b>FTSE 100</b> launched <b>1984 at 1,000</b>. Fewer than 30 originals remain.</li>
<li><b>Smart beta ETFs</b> (first <b>2003</b>) seek alpha passively using alternative weightings.</li></ul>`,
traps:[]},

{id:"3.10", title:"ESG Factors", blurb:"ESG alongside other factors, voting and engagement.",
html:`<ul><li>ESG is weighed alongside value, size, momentum and volatility.</li>
<li>Ordinary shareholders usually have <b>one vote per share</b> and can vote on ESG matters.</li>
<li><b>Engagement</b> is a key tool; it must be relevant or can backfire.</li>
<li>Main problem: <b>no standardised method</b> for measuring ESG risk or impact.</li></ul>`,
traps:[]},

{id:"3.11", title:"Listing and Trading", blurb:"UK and overseas listing, MTFs, OTFs, SIs, dark pools.",
html:`<p>Why list: raise capital, objective value, liquidity, acquisitions, credibility, employee schemes, better controls.</p>
<p><b>Listed</b> = meets the criteria. <b>Admitted to trading</b> = allowed to trade (possible without listing). <b>Quoted</b> = actually trading.</p>
<ul><li>The <b>FCA</b> is the UK listing authority. The <b>LSE</b> is a <b>Recognised Investment Exchange</b> under <b>FSMA 2000</b>. News goes out via the <b>RNS</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>LSE market</th><th>Key details</th></tr>
<tr><td><b>Main Market</b></td><td><b>Min £30m</b> market cap, <b>10% free float</b>, <b>3 years</b> history</td></tr>
<tr><td><b>AIM</b></td><td><b>1995</b>. <b>No minimum size or track record</b></td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Country</th><th>Key facts</th></tr>
<tr><td>Germany</td><td><b>Frankfurt</b> (~90% of turnover). <b>BaFin</b>. Official, Regulated, Open segments</td></tr>
<tr><td>US</td><td><b>NYSE</b> (largest by cap, <b>1792</b> Buttonwood). <b>Nasdaq</b> (bigger by volume, ~3,700 firms). List on <b>one</b> US exchange only</td></tr>
<tr><td>China</td><td><b>Shanghai</b> (A shares in renminbi, B in dollars), Shenzhen, Hong Kong (Hang Seng = top 80, ~70% of value). <b>CSRC</b></td></tr>
<tr><td>Japan</td><td><b>TSE</b>: Prime, Standard, Growth</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th></th><th>NYSE</th><th>Nasdaq</th></tr>
<tr><td>Min public shares</td><td>1.1m</td><td>1.25m</td></tr><tr><td>Min market value</td><td>$100m</td><td>$45m</td></tr><tr><td>Min bid price</td><td>$4</td><td>$4</td></tr></table></div>
<ul><li><b>1998</b>: SEC authorised <b>ECNs</b>. <b>MiFID (2007)</b> brought MTFs, OTFs, SIs; <b>MiFID II (2018)</b> extended venues.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Venue</th><th>Key features</th></tr>
<tr><td><b>MTF</b></td><td>Many buyers and sellers; operator has <b>no discretion</b></td></tr>
<tr><td><b>OTF</b></td><td>Bonds, structured products, derivatives. <b>No equities</b></td></tr>
<tr><td><b>SI</b></td><td>Deals on <b>own account</b> frequently. <b>Can't also run an OTF</b></td></tr></table></div>
<p><b>Dark pools</b>: prices shown only <b>after</b> trades. <b>Agent</b> earns a <b>fee</b>; <b>principal</b> trades from inventory for a <b>mark-up</b>.</p>`,
traps:["OTFs <b>cannot</b> trade equities.","An SI <b>cannot</b> also run an OTF.","AIM has <b>no</b> minimum size or track record."]}
];

const PR_TOPICS = [
{id:"4.0", title:"Property as an Asset Class", blurb:"The four unique features of property and its liquidity problem.",
html:`<p>One of the four main asset classes, but often treated as a <b>special kind of alternative</b>.</p>
<div class="tw"><table class="tbl"><tr><th>Feature</th><th>Detail</th></tr>
<tr><td><b>Fixed and immovable</b></td><td>Tied to one location</td></tr>
<tr><td><b>Not fungible</b></td><td>No two are the same</td></tr>
<tr><td><b>Not divisible</b></td><td>Can't sell part of it</td></tr>
<tr><td><b>Illiquid</b></td><td>Because it's immovable and indivisible</td></tr></table></div>
<ul><li><b>Low correlation</b> with other assets helps diversification.</li>
<li>Bricks-and-mortar funds <b>suspended dealing in the GFC and COVID</b>. Suspensions protect existing investors.</li></ul>`,
traps:[]},

{id:"4.1", title:"Types of Property", blurb:"Residential, commercial and agricultural property compared.",
html:`<div class="tw"><table class="tbl"><tr><th></th><th>Residential</th><th>Commercial</th><th>Agricultural</th></tr>
<tr><td>Tenancies</td><td><b>Short</b></td><td><b>Long</b>, often 10+ years</td><td>Wide range</td></tr>
<tr><td>Repairs</td><td><b>Landlord</b></td><td><b>Tenant</b> usually</td><td>Agreed at the outset</td></tr>
<tr><td>Returns</td><td>Mainly <b>house prices</b></td><td>Big part from <b>rent</b></td><td>Rent + land value</td></tr></table></div>
<ul><li><b>Residential</b>: mainly buy-to-let. A sale takes <b>3 to 6 months</b>.</li>
<li><b>Commercial</b>: retail, offices, industrial. Leases up to <b>25 years</b> with <b>3 or 5-year</b> reviews. <b>Offices, factories and warehouses yield most; retail yields least.</b> Agents match buyers and sellers.</li>
<li><b>Agricultural</b>: less developed, more illiquid, less transparent. Growing interest.</li></ul>
<div class="trap"><b class="lab">IHT change (from 6 April 2026)</b><ul><li>Your notes: full farm relief capped at <b>£1m</b>, then 50% relief (effective rate up to 20%). IHT due within <b>6 months</b>.</li><li>Your notes also flag: the cap was raised to <b>£2.5m</b> in December 2025. Learn the figure your exam edition uses.</li></ul></div>`,
traps:[]},

{id:"4.2", title:"Returns from Property", blurb:"Rental yield, rent tax, capital returns and the key drivers.",
html:`<p>Long term, property <b>beats cash and gilts</b> but <b>slightly lags equities</b>. Strategies: <b>buy and hold</b> or <b>fix and flip</b>.</p>
<p><span class="formula">Rental yield = (Gross rent − Expenses) ÷ Cost incl. purchase costs</span></p>
<ul><li>Allow for <b>voids</b>. Purchase costs include legal fees, surveys, <b>SDLT</b>, agent fees.</li><li><b>Upward-only rent reviews</b> hedge inflation.</li></ul>
<div class="worked"><b class="lab">Worked example</b>£240,000 + £10,000 costs = £250,000. Rent £15,000 − £1,250 void − £2,750 expenses = £11,000. £11,000 ÷ £250,000 = <b>4.4%</b>.</div>
<div class="tw"><table class="tbl"><tr><th>Tax on rent</th><th>Detail</th></tr>
<tr><td>Treatment</td><td>Business income; losses on one property offset another</td></tr>
<tr><td>Rent-a-room</td><td>Tax free up to <b>£7,500</b> (2025/26)</td></tr>
<tr><td>Commercial</td><td>Annual Investment Allowance and Writing Down Allowance</td></tr></table></div>
<ul><li><b>Higher interest rates hurt all property.</b> Neglected buildings depreciate to land value.</li>
<li>Drivers in order: <b>position in the cycle</b>, <b>GDP growth</b>, <b>inflation</b>. Income is the main source of real return.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Scenario</th><th>Effect</th></tr>
<tr><td><b>Best</b></td><td>High growth, low inflation (<b>NICE</b>)</td></tr>
<tr><td><b>Worst</b></td><td>High inflation, low growth (<b>stagflation</b>)</td></tr></table></div>
<p>Rule: property preferred to equities when <b>low inflation</b> is expected, <b>unless</b> growth is also low. Direct property has <b>low</b> measured volatility because it's valued infrequently. Commercial is more vulnerable to downturns.</p>`,
traps:[]},

{id:"4.3", title:"Key Risks", blurb:"Locked-in capital, liquidity, tenants, maintenance and rates.",
html:`<div class="tw"><table class="tbl"><tr><th>Risk</th><th>Detail</th></tr>
<tr><td>Capital locked in</td><td>Years without a return</td></tr>
<tr><td>Liquidity</td><td>Hard to sell, funds may suspend</td></tr>
<tr><td>No tenants / tenant risk</td><td>Costs during voids; unpaid rent, damage</td></tr>
<tr><td>Maintenance</td><td>Safety checks and repairs</td></tr>
<tr><td>Falling prices</td><td>Especially when <b>rates rise</b></td></tr></table></div>
<ul><li><b>LTAFs</b> were introduced to improve liquidity management.</li>
<li>Crashes: <b>UK 1989–92</b> (London office rents <b>halved</b>), <b>subprime from 2006</b>.</li></ul>`,
traps:[]},

{id:"4.4", title:"Direct Ownership", blurb:"Leases, borrowing, SDLT, conveyancing, tenants and voids.",
html:`<div class="tw"><table class="tbl"><tr><th>Interest</th><th>Detail</th></tr>
<tr><td><b>Freehold</b></td><td>Full right to use and sell</td></tr>
<tr><td><b>Leasehold</b></td><td>Use for a set period</td></tr>
<tr><td><b>Commonhold</b></td><td><b>England and Wales only.</b> Each flat freehold; common areas run by a <b>Commonhold Association</b></td></tr></table></div>
<ul><li>A <b>tenant's</b> break clause is assumed to be used (<b>negative</b>). A <b>landlord's</b> break is <b>positive</b>.</li>
<li>Most property is <b>geared</b>: risk of <b>negative equity</b>. <b>Help to Buy</b> (closed 2023): up to <b>20% (40% London)</b>.</li></ul>
<h3>SDLT</h3>
<p>England and NI. Wales has <b>LTT</b>, Scotland <b>LBTT</b>. Charged on <b>each slice</b>.</p>
<div class="tw"><table class="tbl"><tr><th>Residential slice</th><th>Rate</th></tr>
<tr><td>Up to £125,000</td><td>0%</td></tr><tr><td>£125,001–£250,000</td><td>2%</td></tr><tr><td>£250,001–£925,000</td><td>5%</td></tr><tr><td>£925,001–£1.5m</td><td>10%</td></tr><tr><td>Above £1.5m</td><td>12%</td></tr><tr><td>Over £500,000 bought by companies</td><td>15%</td></tr></table></div>
<div class="worked"><b class="lab">Worked example</b>£500,000: £2,500 + £12,500 = <b>£15,000</b>. £930,000: £2,500 + £33,750 + £500 = <b>£36,750</b>.</div>
<ul><li><b>+5%</b> for additional homes (refund if old home sold within <b>3 years</b>). <b>+2%</b> for <b>non-UK residents</b>. First-time buyer relief.</li>
<li>Non-residential: 0% to £150,000, 2% to £250,000, 5% above.</li>
<li>Letting agents charge <b>10–20%</b> of rent.</li></ul>
<h3>Conveyancing</h3>
<p>Searches, contract, queries, then <b>exchange of contracts (legally binding)</b>, then <b>completion</b> (money and keys).</p>
<p><b>Guaranteed rent</b>: stable but below market (fees <b>10–50%</b>). <b>Rent guarantee insurance</b> covers voids, arrears and eviction.</p>`,
traps:["A <b>tenant's</b> break clause is negative. A <b>landlord's</b> is positive.","SDLT is charged on <b>each slice</b>, not the whole price.","Exchange of contracts is the <b>point of no return</b>, not completion."]},

{id:"4.5", title:"AREF and the Red Book", blurb:"The AREF quality mark and RICS valuation standards.",
html:`<ul><li><b>AREF</b>: UK body for property funds. Its <b>quality mark</b> covers <b>three areas</b>: governance, operation, and unit dealing and performance reporting.</li>
<li>Code of Practice: <b>minimum compliance</b> and <b>best practice</b>. Members confirm <b>annually</b>.</li>
<li><b>Red Book</b> = RICS standards. First <b>1976</b>, used in <b>146 countries</b>. Updated <b>January 2024</b> to align with International Valuation Standards.</li></ul>`,
traps:[]},

{id:"4.7", title:"Valuation and Performance", blurb:"Initial yield, GRM, cap rate, rent reviews and property indices.",
html:`<div class="tw"><table class="tbl"><tr><th>Measure</th><th>Formula</th><th>Key points</th></tr>
<tr><td><b>Initial yield</b></td><td>Annual rent ÷ Value</td><td>Simplest snapshot</td></tr>
<tr><td><b>GRM</b></td><td>Price ÷ Gross annual rent</td><td>Lower = more affordable. <b>Ignores expenses</b></td></tr>
<tr><td><b>Cap rate</b></td><td>Net operating income ÷ Price</td><td><b>More reliable</b> than GRM</td></tr></table></div>
<div class="worked"><b class="lab">Worked example</b>£2m office, £160,000 rent, £40,000 costs. GRM = <b>12.5</b>. Cap rate = 120,000 ÷ 2,000,000 = <b>6%</b>.</div>
<ul><li>Sellers want the <b>lowest</b> cap rate (highest price); buyers the highest. Riskier property = <b>higher</b> cap rate.</li>
<li>Rents reviewed every <b>3 to 5 years</b>, often upward-only; disputes go to an <b>independent expert</b>.</li>
<li><b>Reversionary value</b> = value at lease end. Leasehold value falls as the lease runs down. <b>Leaseholder improvements are ignored.</b></li></ul>
<div class="tw"><table class="tbl"><tr><th>Index</th><th>Covers</th></tr>
<tr><td>MSCI Property</td><td>Many sectors; monthly or quarterly</td></tr>
<tr><td>AREF</td><td>Quarterly, collective schemes</td></tr>
<tr><td>Investment Association</td><td>"UK Direct Property" and "Property Other"</td></tr>
<tr><td>AIC</td><td>Investment trusts, <b>8</b> property sectors</td></tr>
<tr><td>Nationwide / Halifax</td><td>House prices, seasonally adjusted</td></tr></table></div>
<p>Indices use <b>valuations, not sale prices</b>, so they <b>understate volatility</b>.</p>`,
traps:["GRM ignores <b>expenses</b>. Cap rate includes them.","Sellers like a <b>low</b> cap rate.","Leaseholder improvements are <b>disregarded</b>."]},

{id:"4.8", title:"Indirect Property", blurb:"Property shares, unit trusts, PAIFs, LTAFs, REITs and other vehicles.",
html:`<ul><li><b>Property shares</b>: main advantage is <b>liquidity</b>; gearing adds volatility.</li>
<li><b>Unit trusts/OEICs</b>: max <b>15%</b> in one property; limits on leases under <b>60 years</b>. Priced at NAV; can <b>postpone</b> redemptions. <b>No CGT inside the fund.</b></li></ul>
<h3>PAIFs</h3>
<p>Must be an <b>OEIC</b>. Rental profits tax-exempt in the fund; other taxable income at <b>20%</b>. Three distribution streams. Conditions: <b>60%+</b> income and <b>60%+</b> assets from property; no corporate holder with <b>10%+</b>.</p>
<h3>LTAFs</h3><p>Introduced <b>2021</b> for open-ended liquidity problems. Allow <b>longer notice periods</b>.</p>
<h3>REITs</h3>
<p>Tax-transparent, <b>closed-ended</b>, listed. UK launch <b>2007</b>. <b>Can borrow</b>. No corporation tax on property income if conditions met; investors still pay income tax and CGT.</p>
<div class="tw"><table class="tbl"><tr><th>REIT condition</th><th>Requirement</th></tr>
<tr><td>Residence</td><td><b>UK only</b></td></tr><tr><td>Listing</td><td>Recognised exchange (<b>AIM counts</b>)</td></tr>
<tr><td>Shareholders</td><td>At least <b>100</b>; none with <b>10%+</b>; not a close company</td></tr>
<tr><td>Income</td><td><b>75%+</b> from rent</td></tr><tr><td>Distribution</td><td><b>90%+</b> paid out</td></tr>
<tr><td>Assets</td><td><b>75%+</b> property; no single property over <b>40%</b></td></tr><tr><td>Interest cover</td><td><b>1.25×</b></td></tr></table></div>
<p><b>Finance Act 2024</b>: one commercial property worth <b>£20m+</b> is enough (no longer need 3).</p>
<div class="tw"><table class="tbl"><tr><th>Other vehicle</th><th>Key points</th></tr>
<tr><td>Property ETFs</td><td>Hold <b>housebuilders and REITs</b>, not buildings</td></tr>
<tr><td>Life assurance property bonds</td><td>A life policy. <b>Can't borrow</b>. Taxed <b>20% in the fund</b>; non-taxpayers <b>can't reclaim</b></td></tr>
<tr><td>Offshore funds</td><td>Lighter regulation</td></tr>
<tr><td>Limited partnerships</td><td>Tax authorities <b>look through</b></td></tr></table></div>`,
traps:["PAIF = <b>OEIC</b>, 60/60/10. REIT = 75% income, <b>90% paid out</b>, 75% assets, 40% single property, 1.25× cover, 100 holders.","REITs <b>can</b> borrow. Life property bonds <b>can't</b>.","Property ETFs usually <b>don't</b> own buildings."]},

{id:"4.9", title:"Strategies, Direct vs Indirect", blurb:"Fund styles, direct vs indirect, pros and cons, open vs closed-ended.",
html:`<ul><li>Indirect funds: active <b>or passive</b> (passive only holds listed shares). Direct funds: <b>active only</b>.</li>
<li>Direct funds follow the <b>economy</b>; indirect follow <b>company results</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th></th><th>Direct</th><th>Indirect</th></tr>
<tr><td>Capital</td><td>Large</td><td>Much lower</td></tr><tr><td>Liquidity</td><td>Illiquid</td><td>Better</td></tr>
<tr><td>Costs</td><td>Higher</td><td>Lower</td></tr><tr><td>Tax reliefs</td><td><b>May be available</b></td><td>Not available</td></tr>
<tr><td>Active/passive</td><td>Active only</td><td>Both</td></tr></table></div>
<p>Pros: cash flow, stable income, inflation hedge, low correlation, tangible. Cons: location, tenants, illiquidity, property <b>shares</b> move with equities, admin, rate sensitivity.</p>
<h3>Open vs closed-ended</h3>
<ul><li>FCA rule: open-ended funds must <b>suspend</b> if a valuer <b>can't value at least 20%</b> of assets.</li>
<li>Funds may switch from <b>offer to bid pricing</b> to protect remaining investors.</li>
<li>Closed-ended funds <b>never have to sell</b>; illiquidity shows as wider discounts.</li></ul>`,
traps:["Direct property funds are <b>active only</b>.","Tax reliefs are only on <b>direct</b> property.","FCA suspension trigger: <b>20%</b> can't be valued."]},

{id:"4.13", title:"Pricing, ESG and Trends", blurb:"Valuers, building emissions, retail decline, offices and logistics.",
html:`<ul><li>Most commercial property isn't exchange traded, so <b>valuers</b> estimate prices using the <b>Red Book</b>.</li>
<li><b>ESG</b>: buildings and construction cause about <b>37%</b> of global operational energy and process CO₂. Links to <b>UN SDG 11</b>. Green certifications.</li>
<li><b>Retail</b>: high street decline began <b>before COVID</b>; the pandemic <b>accelerated</b> it. E-commerce <b>$6.3 trillion in 2024 (3.7× 2014)</b>, driving demand for <b>warehouses and logistics</b>.</li>
<li><b>Offices</b>: remote working. <b>Agriculture</b>: mostly insulated from COVID.</li></ul>`,
traps:[]}
];

const blankProgress = () => ({v:1, topicsDone:{}, q:{}, cards:{}, nums:{}, history:[]});
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let P = Object.assign(blankProgress(), lsGet("irt.progress")||{});
let CUSTOM = Object.assign({items:[]}, lsGet("irt.custom")||{});
let dbRefs = null;
const dirty = {}, timers = {}, busy = {};
function setSave(t){const el=document.getElementById("savestate"); if(el) el.textContent=t}
function persist(which){
  lsSet(which==="progress"?"irt.progress":"irt.custom", which==="progress"?P:CUSTOM);
  if(!dbRefs){ setSave("Saved in this browser"); return }
  dirty[which]=true; clearTimeout(timers[which]); timers[which]=setTimeout(()=>flush(which),800);
}
async function flush(which){
  if(busy[which]||!dirty[which]) return;
  busy[which]=true; dirty[which]=false;
  const data = JSON.parse(JSON.stringify(which==="progress"?P:CUSTOM));
  try{ await dbRefs[which].set(data); setSave("Saved to your account") }
  catch(e){ setSave("Saved in this browser only") }
  busy[which]=false;
  if(dirty[which]) flush(which);
}
(async function connect(){
  try{
    if(!window.claude || !window.claude.use){ setSave("Saved in this browser"); return }
    const [user, db] = await Promise.all([window.claude.use("user"), window.claude.use("db")]);
    const uid = user ? await user.id() : null;
    if(!db || !uid){ setSave("Saved in this browser"); return }
    const base = "data/users/"+uid;
    const refs = {progress:db.doc(base+"/progress"), custom:db.doc(base+"/questions")};
    const [ps, cs] = await Promise.all([refs.progress.get(), refs.custom.get()]);
    dbRefs = refs;
    if(ps.exists){ P = Object.assign(blankProgress(), JSON.parse(JSON.stringify(ps.data()))) } else if(hasAnything(P)){ dirty.progress=true; flush("progress") }
    if(cs.exists){ CUSTOM = Object.assign({items:[]}, JSON.parse(JSON.stringify(cs.data()))) } else if(CUSTOM.items.length){ dirty.custom=true; flush("custom") }
    lsSet("irt.progress",P); lsSet("irt.custom",CUSTOM);
    setSave("Saved to your account");
    if(!QZ) render();
  }catch(e){ setSave("Saved in this browser") }
})();
function hasAnything(p){return Object.keys(p.q).length||Object.keys(p.cards).length||Object.keys(p.nums).length||p.history.length||Object.keys(p.topicsDone).length}

function allQuestions(){return QUESTIONS.concat(CUSTOM.items)}
function statFor(tid){
  let r=0,w=0;
  for(const q of allQuestions()) if(q.topic===tid){const s=P.q[q.id]; if(s){r+=s.r;w+=s.w}}
  for(const c of CARDS) if(c.topic===tid){const s=P.cards[c.id]; if(s){r+=s.r;w+=s.w}}
  for(const [k,v] of Object.entries(NUM_TYPES)) if(v.topic===tid){const s=P.nums[k]; if(s){r+=s.r;w+=s.w}}
  const n=r+w; return {r,w,n,acc:n?r/n:null};
}
function overall(){
  let r=0,w=0; for(const m of [P.q,P.cards,P.nums]) for(const s of Object.values(m)){r+=s.r;w+=s.w}
  return {r,w,n:r+w,acc:(r+w)?r/(r+w):null};
}
function weakSpots(){
  const out=[];
  for(const t of TOPICS.concat([{id:"mine"}])){const s=statFor(t.id); if(s.n>=2&&s.acc<0.7) out.push({kind:"topic",id:t.id,sec:t.sec,label:(t.id==="mine"?"":t.id+" ")+TOPIC_TITLE[t.id],acc:s.acc,n:s.n})}
  for(const [k,v] of Object.entries(NUM_TYPES)){const s=P.nums[k]; if(s&&s.r+s.w>=2&&s.r/(s.r+s.w)<0.7) out.push({kind:"num",id:k,sec:v.sec,label:"Numbers: "+v.label,acc:s.r/(s.r+s.w),n:s.r+s.w})}
  return out.sort((a,b)=>a.acc-b.acc);
}
function missedQuestions(){return allQuestions().filter(q=>{const s=P.q[q.id];return s&&s.w>0&&s.w>=s.r})}
const pct = x => x==null?"–":Math.round(x*100)+"%";

/* ---------- flashcards ---------- */
function startFlash(deck){
  let cards = CUR.cards.slice();
  if(deck==="Numbers"||deck==="Pairs") cards=cards.filter(c=>c.kind===deck);
  if(deck==="Weak") cards=cards.filter(c=>{const s=P.cards[c.id];return !s||s.w>=s.r});
  cards.sort(()=>Math.random()-0.5);
  FC={deck,cards,i:0,flipped:false,known:0};
}
function flashHTML(){
  if(!FC) startFlash("All");

  if(!FC.cards.length) return head+`<div class="empty">No cards in this deck yet. Cards you mark "Didn't know" land here.</div>`;

  const c=FC.cards[FC.i];

/* ---------- quiz ---------- */
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function secQuestions(key){return allQuestions().filter(q=>secOfQ(q)===key)}
function startQuiz(mode,id,secKey){
  const sec = SEC[secKey] || (id && TOPICS.find(t=>t.id===id) ? SEC[TOPICS.find(t=>t.id===id).sec] : CUR);
  let pool=secQuestions(sec.key), label=sec.nav+": mixed";
  if(mode==="topic"){pool=pool.filter(q=>q.topic===id);label=id+" "+TOPIC_TITLE[id]}
  if(mode==="selftest"){pool=sec.questions.filter(q=>q.src==="Self-test");label=sec.nav+": your self-test"}
  if(mode==="mine"){pool=CUSTOM.items.filter(q=>secOfQ(q)===sec.key);label=sec.nav+": my questions"}
  if(mode==="weak"){
    const weakTopics=new Set(weakSpots().filter(w=>w.kind==="topic").map(w=>w.id));
    const missed=new Set(missedQuestions().map(q=>q.id));
    pool=pool.filter(q=>missed.has(q.id)||weakTopics.has(q.topic)); label=sec.nav+": weak spots";
  }
  const n = mode==="selftest"?pool.length:Math.min(10,pool.length);
  if(!pool.length){toast(mode==="weak"?"No weak spots yet. Take a quiz first.":"No questions here yet.");return}
  QZ={mode,label,sec:sec.key,items:shuffle(pool).slice(0,n).map(q=>({id:q.id,order:q.kind==="mcq"?shuffle(q.options.map((_,i)=>i)):null})),i:0,score:0,picked:null,revealed:false,wrong:[]};
  OPEN_TOPIC=null; TAB="quiz"; if(!goSection(sec.key)) render(); window.scrollTo(0,0);
}
function quizHTML(){
  if(!QZ){
    const missed=missedQuestions().filter(q=>secOfQ(q)===CUR.key).length, weak=weakSpots().filter(w=>w.sec===CUR.key).length;

    return `<div class="stack">

        <button class="mode" data-act="startquiz" data-mode="all"><b>Mixed quiz</b><span class="muted">10 random questions from all ${secQuestions(CUR.key).length}</span></button>

        <button class="mode" data-act="startquiz" data-mode="weak" ${weak||missed?"":"disabled"}><b>Weak spots</b><span class="muted">${weak||missed?`${missed} missed question${missed===1?"":"s"}, ${weak} weak area${weak===1?"":"s"}`:"Unlocks once you've missed something"}</span></button>
        <button class="mode" data-act="startquiz" data-mode="mine" ${mine?"":"disabled"}><b>My questions</b><span class="muted">${mine? mine+" you've added":"Add some in the My questions tab"}</span></button>

      <p class="muted">${QZ.score===QZ.items.length?"Full marks.":QZ.score/QZ.items.length>=0.7?"Pass-level score. Review the misses below.":"Below 70%. These topics now show in your weak spots."}</p>
      <div class="row" style="justify-content:center"><button class="btn primary" data-act="startquiz" data-mode="${QZ.mode==="topic"?"topic":QZ.mode}" data-id="${QZ.mode==="topic"?QZ.items.length&&allQuestions().find(q=>q.id===QZ.items[0].id).topic:""}">Try again</button><button class="btn" data-act="quizhome">Back to quizzes</button></div></div>
      ${wrong.length?`<div class="panel stack"><h3>Review your misses</h3>${wrong.map(q=>`<div style="display:grid;gap:2px"><span class="num muted" style="font-size:12px">${q.topic==="mine"?"My question":q.topic}</span><b>${esc(q.q)}</b><span>Answer: ${esc(q.kind==="mcq"?q.options[q.a]:q.answer)}</span>${q.why?`<span class="muted" style="font-size:14px">${esc(q.why)}</span>`:""}</div>`).join("")}</div>`:""}
    </div>`;
  }
  const it=QZ.items[QZ.i], q=allQuestions().find(x=>x.id===it.id);
  const head=`<div class="progressline"><span>${esc(QZ.label)} · Question ${QZ.i+1} of ${QZ.items.length}</span><span class="num">Score ${QZ.score}</span></div><div class="bar"><span style="width:${QZ.i/QZ.items.length*100}%"></span></div>
    <span class="row" style="gap:6px"><span class="chip">${q.topic==="mine"?"My question":q.topic+" "+esc(TOPIC_TITLE[q.topic]||"")}</span>${q.src?`<span class="chip">${esc(q.src)}</span>`:""}</span>
    <div class="qtext">${esc(q.q)}</div>`;
  if(q.kind==="mcq"){
    const answered=QZ.picked!==null;
    return `<div class="qbox">${head}<div class="opts">${it.order.map((oi,k)=>{
      let cls=""; if(answered){ if(oi===q.a) cls="right"; else if(oi===QZ.picked) cls="wrong" }
      return `<button class="opt ${cls}" data-act="pick" data-i="${oi}" ${answered?"disabled":""}><span class="l">${"ABCD"[k]||k+1}</span><span>${esc(q.options[oi])}</span></button>`}).join("")}</div>
      ${answered?`<div class="feedback"><b style="color:${QZ.picked===q.a?"var(--good)":"var(--bad)"}">${QZ.picked===q.a?"Correct.":"Not quite."}</b> ${esc(q.why||"")}</div><div class="row"><button class="btn primary" data-act="nextq">${QZ.i+1<QZ.items.length?"Next question":"See score"}</button></div>`:""}
    </div>`;
  }
  return `<div class="qbox">${head}
    ${QZ.revealed?`<div class="feedback"><b>Answer:</b> ${esc(q.answer)}${q.why?`<div class="muted" style="margin-top:4px">${esc(q.why)}</div>`:""}</div>
      ${QZ.picked===null?`<div class="row"><button class="btn bad" data-act="selfmark" data-ok="0">I missed it</button><button class="btn good" data-act="selfmark" data-ok="1">I got it</button></div>`:`<div class="row"><button class="btn primary" data-act="nextq">${QZ.i+1<QZ.items.length?"Next question":"See score"}</button></div>`}`
    :`<p class="muted">Answer it in your head (or out loud), then reveal.</p><div class="row"><button class="btn primary" data-act="reveal">Show answer</button></div>`}
  </div>`;
}
function answerQ(ok){
  const it=QZ.items[QZ.i]; bump(P.q,it.id,ok); if(ok) QZ.score++; else QZ.wrong.push(it.id); persist("progress");
}
function finishQuiz(){
  P.history.push({at:Date.now(),section:QZ.sec,mode:QZ.mode,label:QZ.label,score:QZ.score,total:QZ.items.length});
  if(P.history.length>200) P.history=P.history.slice(-200);
  persist("progress");
}

/* ---------- number practice ---------- */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const f2=x=>x.toFixed(2);
const GEN = {
  real(){
    if(Math.random()<0.35){const ans=REAL.base-REAL.cpi;return {q:`Bank of England base rate is <b>${REAL.base}%</b> (${REAL.baseNote}). CPI inflation is <b>${REAL.cpi}%</b> (${REAL.cpiNote}). What is the real return on cash paying exactly base rate? Use the Fisher equation.`,ans,unit:"%",work:`Real = nominal − inflation = ${REAL.base} − ${REAL.cpi} = <b>${f2(ans)}%</b>.`}}
    const a=pick(REAL.accounts); const ans=a.aer-REAL.cpi;
    return {q:`<b>${a.name}</b> (${a.type}) pays <b>${f2(a.aer)}% AER</b>. CPI inflation is <b>${REAL.cpi}%</b>. What is the real return? Use the Fisher equation.`,ans,unit:"%",work:`Real = ${f2(a.aer)} − ${REAL.cpi} = <b>${f2(ans)}%</b>. ${ans>0?"Purchasing power is growing.":"Purchasing power is falling."}`};
  },
  growth(){
    const a=pick(REAL.accounts.filter(x=>x.term)); const C=R(5,50)*1000; const T=C*Math.pow(1+a.aer/100,a.term);
    return {q:`You put <b>${money(C).replace(".00","")}</b> into the <b>${a.name}</b> ${a.type} at <b>${f2(a.aer)}% AER</b>. Assume interest compounds annually and is left in. What is the balance at the end of the ${a.term}-year term?`,ans:T,unit:"£",work:`T = ${C.toLocaleString("en-GB")} × (1 + ${a.aer/100})<sup>${a.term}</sup> = <b>${money(T)}</b>.`};
  },
  aer(){
    const freq=pick([[12,"monthly"],[4,"quarterly"],[2,"twice a year"]]);
    const useBase=Math.random()<0.5; const a=pick(REAL.accounts);
    const I=useBase?REAL.base:a.aer;
    const ans=(Math.pow(1+I/100/freq[0],freq[0])-1)*100;
    return {q:useBase?`A bank pays exactly the base rate, <b>${REAL.base}%</b>, as a nominal rate credited <b>${freq[1]}</b>. What is the AER?`:`Suppose a bank quotes a nominal <b>${f2(I)}%</b> (the same figure as ${a.name}'s ${a.type}), credited <b>${freq[1]}</b>. What is the AER?`,ans,unit:"%",work:`AER = (1 + ${f2(I)}%/${freq[0]})<sup>${freq[0]}</sup> − 1 = <b>${ans.toFixed(2)}%</b>. More frequent crediting lifts it above the nominal ${f2(I)}%.`};
  },
  compound(){
    const I=pick([REAL.base,4.40,5.00,5.12]); const N=pick([12,4,2]); const Y=R(1,3); const C=R(2,40)*1000;
    const T=C*Math.pow(1+I/100/N,N*Y);
    return {q:`<b>${money(C)}</b> at a nominal <b>${f2(I)}%</b>, interest paid <b>${N} times a year</b> and left in, for <b>${Y} year${Y>1?"s":""}</b>. Terminal wealth?`,ans:T,unit:"£",work:`T = C × (1 + I/N)<sup>NY</sup> = ${C.toLocaleString("en-GB")} × (1 + ${I/100}/${N})<sup>${N*Y}</sup> = <b>${money(T)}</b>.`};
  },
  linked(){
    const h=pick([5.00,5.12,5.15,5.35]); const S=R(4,20)*1000; const B=R(1,6)*500;
    const ans=S*h/100/(S+B)*100;
    return {q:`A linked saver pays a headline <b>${f2(h)}%</b> (a real top rate this month) on <b>${money(S,"£").replace(".00","")}</b>, but you must keep <b>${money(B).replace(".00","")}</b> in the linked current account at 0%. What is your effective rate across both? (Simple interest, one year.)`,ans,unit:"%",work:`Interest = ${S.toLocaleString("en-GB")} × ${h}% = ${money(S*h/100)}. Effective = ${money(S*h/100)} ÷ ${(S+B).toLocaleString("en-GB")} = <b>${ans.toFixed(2)}%</b>, below the ${f2(h)}% headline.`};
  },
  promo(){
    const a=pick(REAL.accounts.filter(x=>x.promoAfter)); const C=Math.min(a.cap,R(5,25)*1000);
    const int=C*a.aer/100/2+C*a.promoAfter/100/2; const askRate=Math.random()<0.5;
    const ans=askRate?int/C*100:int;
    return {q:`<b>${a.name}</b> pays <b>${f2(a.aer)}%</b> for 6 months, then ${a.promoAfter.toFixed(2)}% (${a.note}). You deposit <b>${money(C).replace(".00","")}</b> and leave it for a year. Ignoring compounding, ${askRate?"what rate did you actually earn over the year?":"how much interest do you earn over the year?"}`,ans,unit:askRate?"%":"£",work:`Half a year at ${f2(a.aer)}% = ${money(C*a.aer/200)}; half at ${a.promoAfter.toFixed(2)}% = ${money(C*a.promoAfter/200)}. Total ${money(int)}${askRate?`, which is <b>${(int/C*100).toFixed(2)}%</b> on ${money(C).replace(".00","")}`:` = <b>${money(int)}</b>`}. The headline rate overstates the year's return.`};
  },
  fscs(){

      ()=>{const x=R(18,30)*10000;return [`You and your partner hold <b>${money(x).replace(".00","")}</b> in a joint account at one UK bank.`,170000,"Joint accounts get £85,000 each = £170,000."]},
      ()=>{const a=R(4,8)*10000,b=R(4,8)*10000;return [`You hold <b>${money(a).replace(".00","")}</b> with Brand A and <b>${money(b).replace(".00","")}</b> with Brand B. Both brands share <b>one banking licence</b>.`,Math.min(85000,a+b),"Brands on one licence share a single £85,000 limit."]},

      ()=>{const x=R(30,90)*10000;return [`You've just sold your house and <b>${money(x).replace(".00","")}</b> sits in your UK bank account for two months before you buy again.`,Math.min(1000000,x),"Temporary high balances are covered up to £1m for 6 months."]}
    ])();
    return {q:`${s[0]} If ${s[0].includes("Bank Y")?"both banks fail":"the bank fails"}, how much does the FSCS pay you?`,ans:s[1],unit:"£",work:`${s[2]} Answer: <b>${money(s[1]).replace(".00","")}</b>.`};
  },
  fx(){
    const bid=1.30+R(0,90)/1000+R(0,9)/10000; const spread=R(2,10)/10000; const offer=bid+spread;

  }
};

Object.assign(GEN,{
  fi_running(){

    return {q:`<b>${g.name}</b>: price about <b>£${f2(g.price)}</b>, coupon ${g.c}%, about <b>${yrs} years</b> to redemption. Work out the approximate GRY.`,ans,unit:"%",tol:0.03,work:`Running yield = ${g.c} ÷ ${f2(g.price)} = ${f2(ry)}%. Annualised capital ${ann>=0?"gain":"loss"} = (100 − ${f2(g.price)}) ÷ ${f2(g.price)} ÷ ${yrs} = ${f2(ann)}%. Approx GRY = <b>${f2(ans)}%</b>. (The full calculation gives about ${f2(g.y)}%, which is the yield level the price was estimated from.)`};
  },
  fi_dur(){
    const D=R(4,18)+pick([0,0.5]); const y=pick(FI_REAL.gilts).y; const dy=pick([0.25,0.5,0.75,1,-0.25,-0.5,-1]);
    const md=D/(1+y/100); const ans=-md*dy;
    return {q:`Gilt yields have been volatile (the 30-year passed <b>6%</b> on 1 October 2026). A gilt has a Macaulay duration of <b>${D} years</b> and a GRY of <b>${f2(y)}%</b>. Yields ${dy>0?"rise":"fall"} by <b>${Math.abs(dy)}%</b>. Approximate % change in price? (Use a minus sign for a fall.)`,ans,unit:"%",tol:0.03,work:`Modified duration = ${D} ÷ ${(1+y/100).toFixed(4)} = ${md.toFixed(2)}. Price change ≈ −${md.toFixed(2)} × ${dy>0?"":"("}${dy}${dy>0?"":")"} = <b>${ans>0?"+":""}${ans.toFixed(2)}%</b>.`};
  },

    return {q:`You buy the <b>${g.name}</b> cum-dividend (it pays ${g.pay}). Settlement is <b>${days} days</b> after the last coupon and the coupon period has <b>${period} days</b>. Accrued interest per £100 nominal?`,ans,unit:"£",tol:0.011,work:`(${g.c}% ÷ 2) × (${days} ÷ ${period}) = ${(g.c/2).toFixed(4).replace(/0+$/,"").replace(/\.$/,"")} × ${(days/period).toFixed(3)} = <b>£${ans.toFixed(2)}</b>. It's added to the clean price because you're buying cum-div.`};
  },
  fi_net(){
    const g=pick(FI_REAL.gilts); const nom=pick([100,100,5000,10000,25000]); const gross=g.c/2*nom/100; const ans=gross*0.8;
    return {q:`You hold <b>£${nom.toLocaleString("en-GB")} nominal</b> of the <b>${g.name}</b> and have chosen 20% withholding. What is the net payment each half year?`,ans,unit:"£",tol:nom>100?0.6:0.006,work:`Gross half-year coupon = ${g.c}% ÷ 2 × £${nom.toLocaleString("en-GB")} = ${money(gross)}. × 0.8 = <b>${money(ans)}</b>.`};
  },

const gbp0 = x => money(x).replace(".00","");
const pc2 = x => (Math.round(x*100)/100).toString();
function sdltSlices(price, bands){
  let tax=0, lines=[], lo=0;
  for(const [top,rate] of bands){
    if(price<=lo) break;
    const slice=Math.min(price,top)-lo;
    if(slice>0){ const t=slice*rate/100; tax+=t; lines.push(`${gbp0(slice)} × ${rate}% = ${money(t)}`) }
    lo=top;
  }
  return {tax, lines};
}

function parsePasted(text, defTopic){
  const out=[]; const lines=String(text).replace(/\r/g,"").split("\n");
  // 1) table rows: "question<TAB>answer" or "question | answer" (optional leading number column)
  const blocks=[]; let cur=[];
  for(const ln of lines){ if(!ln.trim()){ if(cur.length){blocks.push(cur);cur=[]} } else cur.push(ln) }
  if(cur.length) blocks.push(cur);
  for(const b of blocks){
    const isRowBlock=b.every(l=>/\t| \| /.test(l)) && !b.some(l=>/^\s*\(?[A-Da-d][\).:]\s+/.test(l));
    if(isRowBlock){
      for(const l of b){
        let parts=l.split(/\t| \| /).map(s=>s.trim()).filter(Boolean);
        if(parts.length>=3 && /^#?\d+\.?$/.test(parts[0])) parts=parts.slice(1);
        if(parts.length<2) continue;
        if(/^question$/i.test(parts[0])) continue;
        out.push({kind:"recall",q:parts[0],answer:parts.slice(1).join(" — "),topic:defTopic});
      }
      continue;
    }
    let q="",opts=[],ans="",why="",topic=defTopic;
    for(let l of b){
      l=l.trim(); let m;
      if((m=l.match(/^(?:answer|ans|correct(?: answer)?)\s*[:\-–]\s*(.+)$/i))){ans=m[1].trim();continue}
      if((m=l.match(/^(?:topic|section)\s*[:\-–]\s*(.+)$/i))){const t=m[1].trim().match(/[1-5]\.\d{1,2}/);if(t&&TOPIC_TITLE[t[0]])topic=t[0];continue}
      if((m=l.match(/^(?:why|explanation|reason)\s*[:\-–]\s*(.+)$/i))){why=m[1].trim();continue}
      if((m=l.match(/^\(?([A-Fa-f])[\).:]\s+(.+)$/)) && q){opts.push(m[2].trim());continue}
      if((m=l.match(/^(?:q(?:uestion)?\s*\d*\s*[:.)\-–]\s*)(.+)$/i))){q=(q?q+" ":"")+m[1].trim();continue}
      if(opts.length===0){ q=(q?q+" ":"")+l.replace(/^\d+[.)]\s*/,"") ; continue }
      if(!ans && opts.length) {why=(why?why+" ":"")+l}
    }
    if(!q) continue;
    if(opts.length>=2){
      let a=-1; const L=ans.match(/^\(?([A-Fa-f])\)?(?:[\s.):]|$)/);
      if(L) a="abcdef".indexOf(L[1].toLowerCase());
      if(a<0&&ans) a=opts.findIndex(o=>o.toLowerCase()===ans.toLowerCase());
      if(a<0||a>=opts.length){ out.push({kind:"error",q,msg:"Couldn't tell which option is correct. Add a line like \"Answer: B\"."}); continue }
      out.push({kind:"mcq",q,options:opts,a,why,topic});
    } else if(ans){
      out.push({kind:"recall",q,answer:ans,why,topic});
    } else {
      const qa=q.match(/^(.+\?)\s+(.+)$/);
      if(qa) out.push({kind:"recall",q:qa[1],answer:qa[2],why,topic});
      else out.push({kind:"error",q,msg:"No answer found. Add a line like \"Answer: …\"."});
    }
  }
  return out;
}

      <div class="panel stack" style="gap:10px">
        <div class="row" style="justify-content:space-between"><h3>Your list (${items.length})</h3>${items.length?`<button class="btn small primary" data-act="startquiz" data-mode="mine">Quiz me on these</button>`:""}</div>
        ${items.length?`<div class="mylist">${items.slice().reverse().map(q=>{const s=P.q[q.id];return `<div class="myq"><div style="display:grid;gap:2px"><span class="row" style="gap:6px"><span class="chip">${q.topic==="mine"?"No topic":q.topic}</span><span class="chip">${q.kind==="mcq"?"Multiple choice":"Q&amp;A"}</span>${s?`<span class="chip ${s.r>=s.w?"good":"bad"}">${s.r}/${s.r+s.w}</span>`:""}</span><b style="font-weight:500">${esc(q.q)}</b><span class="muted" style="font-size:13px">${esc(q.kind==="mcq"?q.options[q.a]:q.answer)}</span></div><button class="btn small" data-act="delq" data-id="${q.id}" aria-label="Delete question">Delete</button></div>`}).join("")}</div>`:`<div class="empty">Nothing added yet. Questions you add appear in quizzes, weak spots and your progress.</div>`}
      </div>
    </div>
  </div>`;
}
function previewHTML(){
  const ok=PASTE_PREVIEW.filter(x=>x.kind!=="error"), bad=PASTE_PREVIEW.filter(x=>x.kind==="error");
  return `<div class="stack" style="gap:8px">
    <b>Found ${ok.length} question${ok.length===1?"":"s"}${bad.length?`, ${bad.length} need fixing`:""}</b>
    ${ok.map(q=>`<div class="feedback" style="font-size:14px"><b>${esc(q.q)}</b><br><span class="muted">${q.kind==="mcq"?q.options.map((o,i)=>(i===q.a?"✓ ":"")+esc(o)).join(" · "):"Answer: "+esc(q.answer)}</span></div>`).join("")}
    ${bad.map(q=>`<div class="feedback" style="font-size:14px;background:var(--bad-soft)"><b>${esc(q.q)}</b><br><span style="color:var(--bad)">${esc(q.msg)}</span></div>`).join("")}
    ${ok.length?`<div class="row"><button class="btn primary" data-act="addparsed">Add ${ok.length} to my list</button></div>`:""}
  </div>`;
}

/* ============================================================
   EVENTS
   ============================================================ */
function afterRender(){
  calc();
  const sel=document.getElementById("np-type"); if(sel) sel.onchange=()=>{newProblem(sel.value);render()};
  const f=document.getElementById("np-form"); if(f) f.onsubmit=e=>{e.preventDefault();checkNP(document.getElementById("np-ans").value)};
  document.querySelectorAll(".calcs input, .calcs select").forEach(i=>i.oninput=calc);
}
document.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ")&&e.target.closest&&e.target.closest(".flash")){e.preventDefault();FC.flipped=!FC.flipped;render()} });
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, d=el.dataset;
  switch(act){
    case "tab": TAB=d.tab; lsSet("irt.tab",TAB); OPEN_TOPIC=null; if(TAB==="quiz"&&QZ&&QZ.i>=QZ.items.length) QZ=null; render(); break;
    case "opentopic": { e.preventDefault(); TAB="topics"; const t=TOPICS.find(x=>x.id===d.id); if(location.hash!=="#"+SEC[t.sec].hash){PENDING_TOPIC=d.id; location.hash="#"+SEC[t.sec].hash} else {OPEN_TOPIC=d.id; render(); window.scrollTo(0,0)} break }
    case "closetopic": OPEN_TOPIC=null; render(); break;
    case "toggledone": if(P.topicsDone[d.id]) delete P.topicsDone[d.id]; else P.topicsDone[d.id]=Date.now(); persist("progress"); render(); break;
    case "deck": startFlash(d.deck); render(); break;
    case "flip": if(FC){FC.flipped=!FC.flipped; render()} break;
    case "card": { const c=FC.cards[FC.i]; const ok=d.ok==="1"; bump(P.cards,c.id,ok); if(ok) FC.known++; persist("progress"); FC.i++; FC.flipped=false; render(); break }
    case "startquiz": startQuiz(d.mode,d.id,d.sec); break;
    case "quizhome": QZ=null; render(); break;
    case "pick": { const q=allQuestions().find(x=>x.id===QZ.items[QZ.i].id); QZ.picked=+d.i; answerQ(QZ.picked===q.a); render(); break }
    case "reveal": QZ.revealed=true; render(); break;
    case "selfmark": QZ.picked=d.ok==="1"?1:0; answerQ(d.ok==="1"); render(); break;
    case "nextq": QZ.i++; QZ.picked=null; QZ.revealed=false; if(QZ.i>=QZ.items.length) finishQuiz(); render(); window.scrollTo(0,0); break;
    case "newnp": newProblem(NP.filter); render(); break;
    case "skipnp": newProblem(NP.filter); render(); break;
    case "parse": { const t=document.getElementById("mq-text").value; if(!t.trim()){toast("Paste some questions first");break} PASTE_PREVIEW=parsePasted(t,document.getElementById("mq-topic").value); PASTE_PREVIEW._text=t; PASTE_PREVIEW._topic=document.getElementById("mq-topic").value; render(); document.getElementById("mq-text").value=t; document.getElementById("mq-topic").value=PASTE_PREVIEW._topic; break }
    case "clearpaste": PASTE_PREVIEW=null; render(); break;
    case "addparsed": { const ok=PASTE_PREVIEW.filter(x=>x.kind!=="error"); const now=Date.now(); ok.forEach((q,i)=>{q.id="my"+now.toString(36)+i; q.src="Mine"; q.sec=(q.topic!=="mine"&&TOPICS.find(t=>t.id===q.topic))?TOPICS.find(t=>t.id===q.topic).sec:CUR.key; CUSTOM.items.push(q)}); PASTE_PREVIEW=null; persist("custom"); toast(`Added ${ok.length} question${ok.length===1?"":"s"}`); render(); break }
    case "delq": CUSTOM.items=CUSTOM.items.filter(q=>q.id!==d.id); delete P.q[d.id]; persist("custom"); persist("progress"); render(); break;
  }
});
render();
</script>
</body></html>
