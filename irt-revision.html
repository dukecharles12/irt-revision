<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>IRT Revision Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a calm study desk. Top bar, then one centred column; topic cards in a 2-3 column grid; exam traps keep the yellow box from Duke's notes. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --surface-2:#eaefed; --ink:#15201c; --muted:#5a6863; --line:#d9e1dd;
  --accent:#0a6b5c; --accent-ink:#ffffff; --accent-soft:#dcefea;
  --trap-bg:#fff5d1; --trap-ink:#5f4600; --trap-line:#ecc95c;
  --good:#1d7f47; --good-soft:#dcf1e4; --bad:#b93a26; --bad-soft:#fbe3de; --warn:#a86a0b;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1312; --surface:#151c1a; --surface-2:#1c2522; --ink:#e4ebe8; --muted:#94a39d; --line:#27322e;
  --accent:#43c2a7; --accent-ink:#06211b; --accent-soft:#123029;
  --trap-bg:#282210; --trap-ink:#f2d681; --trap-line:#5b4914;
  --good:#53c787; --good-soft:#123222; --bad:#f08068; --bad-soft:#3a1912; --warn:#e3a84a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1312; --surface:#151c1a; --surface-2:#1c2522; --ink:#e4ebe8; --muted:#94a39d; --line:#27322e;
  --accent:#43c2a7; --accent-ink:#06211b; --accent-soft:#123029;
  --trap-bg:#282210; --trap-ink:#f2d681; --trap-line:#5b4914;
  --good:#53c787; --good-soft:#123222; --bad:#f08068; --bad-soft:#3a1912; --warn:#e3a84a;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;font-weight:700}
h1{font-size:clamp(28px,5vw,44px);letter-spacing:-.01em}
h2{font-size:22px}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px}
.brand i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:13px;font-family:var(--f-mono)}
.nav{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none;max-width:100%;min-width:0}
.nav::-webkit-scrollbar{display:none}
@media (max-width:699px){.nav{margin-left:0;width:100%;margin-inline:-6px}}
.nav a{white-space:nowrap;padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.savestate{font-size:12px;color:var(--muted);width:100%;text-align:right;margin-top:-6px}
@media (min-width:700px){.savestate{width:auto;margin:0}}

/* generic */
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.good{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:14px;align-content:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500;white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.mid{background:var(--trap-bg);color:var(--trap-ink)}
.bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:999px}
.section-gap{margin-top:28px}
.tw{overflow-x:auto;margin-block:10px}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:7px 10px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600}
.trap{background:var(--trap-bg);border:1px solid var(--trap-line);color:var(--trap-ink);border-radius:8px;padding:12px 14px;margin-top:12px}
.trap b.lab{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.trap ul{margin:0;padding-left:18px}
.worked{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;margin-top:10px}
.worked b.lab{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.notes p,.notes ul{margin-block:8px}
.notes ul{padding-left:20px}
.formula{font-family:var(--f-mono);background:var(--surface-2);padding:6px 10px;border-radius:6px;display:inline-block}

/* home */
.hero{padding-block:34px 8px;display:grid;gap:10px}
.hero p{max-width:62ch;color:var(--muted);font-size:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .v{font-family:var(--f-mono);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--muted)}
.home-grid{display:grid;gap:16px;grid-template-columns:1fr;align-items:start}
@media (min-width:860px){.home-grid{grid-template-columns:1.6fr 1fr}}
.home-grid>*{min-width:0}
.sec-card{display:grid;gap:14px}
.sec-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.topic-dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tdot{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 8px;border-radius:6px;background:var(--surface-2);min-width:0}
.tdot span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.tick{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:11px;line-height:1}
.tick.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.locked{border-style:dashed;background:transparent}
.ch-secs{display:grid;gap:6px}
.ch-sec{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 12px;border-radius:10px;background:var(--surface-2);text-decoration:none;color:inherit}
.ch-sec:hover{outline:1px solid var(--line)}
.ch-sec .num{font-size:12px;white-space:nowrap}
.ch-sec .t{font-weight:500;min-width:0}
@media (max-width:520px){.ch-sec{grid-template-columns:1fr auto}.ch-sec .num{display:none}.ch-sec>span:nth-child(3){display:none}}
.eqbox{padding:12px 14px;border-radius:8px;border:1px dashed var(--line);display:grid;gap:4px;font-family:var(--f-mono);font-size:13.5px;white-space:pre-line}
.eqbox .eyebrow{font-family:inherit}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);color:inherit;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:600}
.xcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.xlist{display:grid;gap:8px}
.xq{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px}
.xq summary{display:grid;grid-template-columns:auto 1fr auto;gap:10px;cursor:pointer;list-style:none;align-items:start}
.xq summary::-webkit-details-marker{display:none}
.xopts{display:grid;gap:4px}
.xopts .right{color:var(--good);font-weight:600}
.ch-sec.exam{background:transparent;border:1px dashed var(--line)}
.sibs a.x{border-style:dashed}
.crumb{color:inherit;text-decoration:none}.crumb:hover{text-decoration:underline}
.sibs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:4px}
.sibs::-webkit-scrollbar{display:none}
.sibs a{white-space:nowrap;padding:4px 11px;border-radius:999px;font-size:13px;text-decoration:none;color:var(--muted);border:1px solid var(--line)}
.sibs a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.weak-list{display:grid;gap:8px}
.weak{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px}
.hist{display:grid;gap:6px;font-size:14px}
.hist div{display:flex;justify-content:space-between;gap:10px}

/* cash page */
.pagehead{padding-block:28px 6px;display:grid;gap:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-block:18px 20px;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px;align-content:start;cursor:pointer;text-align:left;width:100%}
.tcard:hover{border-color:var(--accent)}
.tcard .code{font-family:var(--f-mono);font-size:13px;color:var(--accent)}
.tcard .meta{display:flex;gap:6px;flex-wrap:wrap}
.topic-open{display:grid;gap:14px}
.topic-open .panel{min-width:0}
.back{justify-self:start;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500}

/* flashcards */
.flash{perspective:1200px;max-width:560px;margin:0 auto;width:100%}
.flash-inner{position:relative;min-height:220px;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped .flash-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:grid;align-content:center;gap:10px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--accent-soft);border-color:var(--accent)}
.face .big{font-family:var(--f-display);font-size:22px;font-weight:600}
@media (prefers-reduced-motion:reduce){.flash-inner{transition:none}}

/* quiz */
.qbox{max-width:680px;margin:0 auto;width:100%;display:grid;gap:14px}
.qtext{font-size:18px;font-weight:500}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 14px;cursor:pointer;display:flex;gap:10px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .l{font-family:var(--f-mono);color:var(--muted)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.feedback{padding:12px 14px;border-radius:8px;background:var(--surface-2)}
.modes{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:grid;gap:4px}
.mode:hover{border-color:var(--accent)}
.mode:disabled{opacity:.5;cursor:default}
.mode b{font-family:var(--f-display);font-size:16px}
.progressline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}

/* numbers */
.calcs{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.calcs>*{min-width:0}
.field{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.field input,.field select,textarea,select.plain{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;color:var(--ink);width:100%}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{font-family:var(--f-mono);font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:7px;padding:10px;font-size:14px;display:grid;gap:2px}
.ratebook{display:grid;gap:6px}
.rate{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.rate .num{color:var(--accent);font-weight:500}
.ansrow{display:flex;gap:8px;flex-wrap:wrap}
.ansrow input{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 11px;font-family:var(--f-mono)}

/* my questions */
textarea{min-height:200px;font-family:var(--f-mono);font-size:13px;line-height:1.5;resize:vertical}
.fmt{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);padding:10px 12px;border-radius:8px;white-space:pre-wrap;overflow-x:auto;margin:0}
.mylist{display:grid;gap:8px}
.myq{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface)}
.myq>div{min-width:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20}
.empty{padding:22px;border:1px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted)}
</style>

    <a class="brand" href="#home"><i>IRT</i>Revision Desk</a>
    <nav class="nav" aria-label="Pages">
      <a href="#home" id="nav-home">Home</a>
    </nav>

<script>
/* ============================================================
   CONTENT: Chapter 1, Section 1 (Cash), from Duke's revision doc
   ============================================================ */
const CASH_TOPICS = [
{id:"1.1", title:"The Role of Cash Deposits", blurb:"Four reasons to hold cash, and the emergency reserve rule.",
html:`<p>There are four reasons to hold cash on deposit:</p>
<div class="tw"><table class="tbl"><tr><th>Reason</th><th>What it means</th></tr>
<tr><td><b>Liquidity</b></td><td>How quickly and easily an asset turns into cash. Instant access is the most liquid. Notice accounts (e.g. 7-day) are less liquid but still quicker than most other assets.</td></tr>
<tr><td><b>Security</b></td><td>Capital is well protected compared with investments like shares.</td></tr>
<tr><td><b>Savings vehicle</b></td><td>A simple, straightforward way to save.</td></tr>
<tr><td><b>Interest return</b></td><td>Depositors earn interest.</td></tr></table></div>`,
traps:["Golden rule: hold an <b>emergency cash reserve before</b> moving into riskier or less liquid assets.","Cash gives <b>income (interest) but no capital growth</b>."]},

{id:"1.2", title:"Interest Rates", blurb:"Gross vs net, compounding, AER, real returns, variable and requirement-linked rates.",
html:`<p><b>Current (checking) accounts usually pay no interest.</b> They are for transactions, not saving.</p>
<div class="tw"><table class="tbl"><tr><th>Factor</th><th>Normal rule</th></tr>
<tr><td>Size of deposit</td><td>Bigger deposit, higher rate (<b>tiered rates</b>)</td></tr>
<tr><td>Length of deposit</td><td>Longer term, higher rate</td></tr>
<tr><td>Access</td><td>Instant access pays less; fixed term pays more</td></tr>
<tr><td>Rate type</td><td>Instant access and notice usually <b>variable</b>; fixed-term usually <b>fixed for the whole term</b></td></tr></table></div>
<p><b>Inverse cash rate:</b> the unusual situation where long-term deposit rates fall <b>below</b> short-term rates.</p>
<h3>Gross vs net</h3>
<ul><li><b>Gross</b> = before tax. <b>Net</b> = after tax.</li><li>Tax is <b>always calculated on the gross</b> amount, however the interest was paid.</li><li>In the UK, deposit interest is <b>paid gross</b>. What you owe depends on your income tax position.</li></ul>
<h3>Compounding</h3>
<p>Compounding is earning interest on interest. The more often interest is credited (and left in), the higher the final amount.</p>
<p><span class="formula">T = C × (1 + I/N)<sup>NY</sup></span></p>
<p class="muted">T terminal wealth · C capital · I annual rate as a decimal · N payments per year · Y years. (1 + I/N)<sup>NY</sup> is the <b>compounding factor</b>.</p>
<div class="worked"><b class="lab">Worked example</b>£10,000 at 4% for one year. Quarterly: 10,000 × 1.01<sup>4</sup> = <b>£10,406.04</b>. Annually: 10,000 × 1.04 = <b>£10,400.00</b>. The £6.04 gap is interest on interest.</div>
<h3>Annual Equivalent Rate (AER)</h3>
<ul><li>A <b>notional rate</b> showing the true return as if interest were compounded and paid <b>once a year</b>, so accounts compare like for like.</li><li>UK savings adverts must show <b>both the nominal rate and the AER</b>. Usually quoted <b>gross</b>, on a 365-day basis.</li><li>More frequent crediting gives an AER <b>higher</b> than the nominal rate.</li></ul>
<p><span class="formula">AER = (1 + I/N)<sup>N</sup> − 1</span></p>
<div class="worked"><b class="lab">Worked example</b>4% paid quarterly: 1.01<sup>4</sup> − 1 = <b>4.06% AER</b>. 4% paid annually: AER = nominal = <b>4.00%</b>.</div>
<h3>Real returns</h3>
<p><b>Fisher equation:</b> Real return = Nominal rate − Inflation. Nominal 5%, inflation 2% gives +3%. Nominal 3%, inflation 5% gives −2%.</p>
<div class="tw"><table class="tbl"><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>Bid rate</b></td><td>Paid to savers (lower)</td></tr><tr><td><b>Offer rate</b></td><td>Charged to borrowers (higher)</td></tr><tr><td><b>Margin</b></td><td>Offer minus bid, the deposit taker's profit</td></tr></table></div>
<p>Deposit rates normally move with borrowing rates. Real world exception: in 2022 to 2023 many high street banks did not pass rate rises on to savers.</p>
<h3>Variable rate accounts</h3>
<p>Track the <b>short-term base rate</b>, and also reflect competition and each institution's credit risk. Higher credit rating means a lower rate (seen as safe). Lower rating means a higher rate (must attract deposits and pay for extra risk).</p>
<h3>Requirement linked accounts</h3>
<p>A higher than average headline rate with conditions: a minimum balance in a linked low or zero interest current account, a minimum monthly pay-in, caps on pay-ins, and often a high rate guaranteed only for a limited time.</p>
<div class="worked"><b class="lab">Worked example</b>£10,000 at 5% = £500. Condition: keep £2,000 in a current account at 0%. £500 ÷ £12,000 = effective rate of about <b>4.17%</b>, not 5%.</div>`,
traps:["If the saver <b>withdraws</b> the interest each quarter there is <b>no compounding</b>, but they get income sooner.","Same nominal rate does not mean same return. Frequency matters.","AER is only meaningful if interest is <b>left in</b>. If it is withdrawn the AER is meaningless.","Requirement linked: the effective return is <b>lower than the headline rate</b>. Look at the AER across both accounts, minimum balance, how long the rate lasts, and the T&amp;Cs."]},

{id:"1.3", title:"Deposit Takers", blurb:"Banks, building societies, credit unions and NS&I.",
html:`<p>A deposit taker is an organisation whose <b>main function is taking deposits</b>. The principal ones are <b>banks (including challenger banks), building societies and credit unions</b>.</p>
<p><b>NS&amp;I (National Savings &amp; Investments)</b> is also a deposit taker. Product detail is in 1.9.</p>
<div class="tw"><table class="tbl"><tr><th>NS&amp;I feature</th><th>Detail</th></tr>
<tr><td>Security</td><td><b>100% backed by the UK government</b></td></tr>
<tr><td>Guarantee limit</td><td><b>No limit</b></td></tr>
<tr><td>Regulation</td><td><b>Does not need authorisation</b> from the UK regulator (government agency)</td></tr></table></div>`,
traps:[]},

{id:"1.4", title:"Risks of Cash Deposits", blurb:"Default, inflation, deflation, interest rate, operational, institutional.",
html:`<p>Deposits are <b>low risk but not risk free</b>.</p>
<div class="tw"><table class="tbl"><tr><th>Risk</th><th>What it is</th></tr>
<tr><td><b>Default (credit)</b></td><td>Deposit taker becomes insolvent and cannot repay.</td></tr>
<tr><td><b>Inflation</b></td><td>Inflation higher than the interest rate, so a negative real return. Worst for <b>fixed-rate</b> accounts.</td></tr>
<tr><td><b>Deflation</b></td><td>Prices fall. Good for cash purchasing power, but rates likely fall too. People delay spending so demand drops. Assets that hedge inflation well are most exposed.</td></tr>
<tr><td><b>Interest rate</b></td><td>Your rate is lower than others available, or you are locked into a fixed rate while market rates rise.</td></tr>
<tr><td><b>Operational</b></td><td>Poor service causes a loss, e.g. the bank fails to move money into a fixed-rate account as instructed.</td></tr>
<tr><td><b>Institutional</b></td><td>Bank fails to manage regulation, e.g. missing money laundering. Leads to penalties and reputational damage.</td></tr></table></div>`,
traps:["<b>Deflation</b> = prices falling. <b>Disinflation</b> = inflation still positive but slowing. Classic MCQ swap.","Default risk and credit risk are the <b>same thing</b>."]},

{id:"1.5", title:"Costs, Charges and Penalties", blurb:"Packaged accounts, common charges, early withdrawal penalties.",
html:`<ul><li>Most accounts are free, but <b>packaged accounts</b> charge monthly or annual fees for extras (breakdown cover, travel insurance).</li>
<li>Common charges: <b>overdraft</b>, <b>foreign transaction</b> fees, <b>ATM</b> fees (e.g. a credit card at an ATM).</li>
<li><b>Early withdrawal penalties</b> apply to <b>fixed-term and notice accounts</b>. Two forms: <b>loss of interest</b> or a <b>monetary penalty</b>. Details are in the T&amp;Cs.</li></ul>`,
traps:[]},

{id:"1.6", title:"Regulation", blurb:"UK twin peaks, plus EU, US, China and Japan.",
html:`<p>The 2007 to 2008 crisis exposed weak bank business models and led to reform. Deposit taking is a <b>regulated activity</b> needing authorisation.</p>
<h3>UK: the twin peaks</h3>
<p>In <b>2013</b> the <b>FSA</b> was replaced by the <b>PRA</b> and the <b>FCA</b>.</p>
<div class="tw"><table class="tbl"><tr><th></th><th>PRA</th><th>FCA</th></tr>
<tr><td>Where it sits</td><td><b>Part of the Bank of England</b></td><td><b>Separate</b> from the BoE</td></tr>
<tr><td>Supervises</td><td>Banks, building societies, insurers, credit unions, major investment firms</td><td>Conduct of all firms, plus prudential regulation of firms the PRA doesn't cover (asset managers, IFAs)</td></tr>
<tr><td>Objectives</td><td>1. Safety and soundness of firms<br>2. Protection for savers, investors, policyholders</td><td>1. Protect consumers<br>2. Promote effective competition<br>3. Protect market integrity</td></tr></table></div>
<ul><li>The BoE's <b>Financial Policy Committee (FPC)</b> looks after overall <b>financial stability</b>.</li>
<li>The <b>2023 Financial Services and Markets Act</b> gave both regulators <b>secondary objectives of growth and competitiveness</b>, plus stronger rule-making powers.</li></ul>
<h3>International</h3>
<div class="tw"><table class="tbl"><tr><th>Region</th><th>Key points</th></tr>
<tr><td><b>EU</b></td><td>National regulators (Germany: Bundesbank + BaFin; France: ACPR, part of Banque de France; Italy: Bank of Italy). Eurozone supervision coordinated by the <b>Single Supervisory Mechanism (SSM)</b>. <b>EBA</b> set up <b>2011</b>, sets common rules and <b>can overrule</b> national regulators.</td></tr>
<tr><td><b>US</b></td><td>Complex, piecemeal. <b>Fed</b> = central bank, supervises large deposit takers and <b>SIFIs</b>. <b>FDIC</b> = banks not in the Fed system. <b>OCC</b> = national banks. <b>CFPB</b> = consumer protection. <b>FSOC</b> = systemic risk.</td></tr>
<tr><td><b>China</b></td><td>Three tiers. Tier 1: NPC laws (Banking Regulation Law 2003, amended 2022; Commercial Banks Law; PBOC Law). Tier 2: admin rules by NPC and State Council. Tier 3: detailed guidance from <b>PBOC</b> and <b>CBIRC</b>.</td></tr>
<tr><td><b>Japan</b></td><td><b>Banking Act 1981</b> (first 1927). Purposes: credibility of bank services, sound management to protect savers, sound development of the economy.</td></tr></table></div>`,
traps:["PRA <b>is</b> part of the BoE; FCA <b>is not</b>.","EBA year = 2011. Japan Banking Act = 1981 (original 1927)."]},

{id:"1.7", title:"Credit Ratings and Deposit Protection", blurb:"Rating scales, FSCS limits and overseas schemes.",
html:`<p>Credit ratings are independent opinions of a deposit taker's financial strength. The big three: <b>Fitch, S&amp;P and Moody's</b>.</p>
<div class="tw"><table class="tbl"><tr><th>S&amp;P / Fitch</th><th>Moody's</th><th>Grade</th><th>Strength</th></tr>
<tr><td>AAA</td><td>Aaa</td><td>Investment</td><td>Strongest</td></tr><tr><td>AA</td><td>Aa</td><td>Investment</td><td>Very strong</td></tr><tr><td>A</td><td>A</td><td>Investment</td><td>Strong</td></tr><tr><td>BBB</td><td>Baa</td><td>Investment</td><td>Adequate (lowest investment grade)</td></tr><tr><td>BB</td><td>Ba</td><td>Non-investment</td><td>Speculative</td></tr><tr><td>B</td><td>B</td><td>Non-investment</td><td>Weak</td></tr><tr><td>C and below</td><td>Caa, Ca, C</td><td>Non-investment</td><td>Weakest</td></tr></table></div>
<ul><li>Non-investment grade = <b>speculative, junk or high yield</b>.</li><li>Sub-grades: <b>+/−</b> for S&amp;P and Fitch (AA+, BBB−), <b>numbers</b> for Moody's (Aa1, Baa3).</li></ul>
<h3>Deposit protection</h3>
<p>Protects depositors if a bank fails and keeps confidence. Big depositors can <b>spread money across banks</b>. The <b>UK FSCS</b> was set up under <b>FSMA 2000</b>.</p>
<div class="tw"><table class="tbl"><tr><th>FSCS scenario</th><th>Cover</th></tr>
<tr><td>Standard</td><td><b>£85,000 per person per authorised firm</b></td></tr><tr><td>Joint account</td><td><b>£170,000</b> (£85,000 each)</td></tr><tr><td>Temporary high balance (e.g. house sale)</td><td><b>Up to £1 million for 6 months</b></td></tr><tr><td>Banks sharing one banking licence</td><td><b>£85,000 in total</b>, not per brand</td></tr></table></div>
<ul><li>Limit reviewed by the <b>PRA every 5 years</b>. Covers individuals and small businesses; <b>large businesses excluded</b>.</li><li>Claims paid in <b>sterling</b> even for foreign currency deposits.</li><li><b>Not covered:</b> deposits outside the UK, Channel Islands and Isle of Man; <b>cryptocurrency</b>.</li><li><b>P2P/crowdfunding:</b> only covered (to £85,000) if an authorised firm gave <b>unsuitable advice on or after 6 April 2016</b> and can't pay. Usually <b>not covered</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Jurisdiction</th><th>Scheme</th><th>Limit</th></tr>
<tr><td>Jersey, Guernsey, Isle of Man</td><td>Own schemes</td><td><b>£50,000</b></td></tr><tr><td>EU</td><td>Deposit Guarantee Scheme, risk-based annual levy</td><td><b>€100,000</b></td></tr><tr><td>US</td><td>FDIC</td><td><b>$250,000</b> per person per institution</td></tr><tr><td>China</td><td>China Deposit Insurance Scheme (PBOC), premiums every 6 months</td><td><b>CNY 500,000</b></td></tr><tr><td>Japan</td><td>Deposit Insurance System</td><td><b>¥10 million + interest</b> per person per institution</td></tr></table></div>`,
traps:["Two brands on <b>one banking licence</b> share a single £85,000 limit.","Crypto is <b>never</b> FSCS covered."]},

{id:"1.8", title:"Foreign Currency Deposits", blurb:"Transactional, investment and speculative reasons, and their risks.",
html:`<div class="tw"><table class="tbl"><tr><th>Reason</th><th>Example</th><th>Main risk</th></tr>
<tr><td><b>Transactional</b></td><td>Overseas income or spending (e.g. property abroad)</td><td>Exchange rate moves</td></tr>
<tr><td><b>Investment</b></td><td>Higher interest rate than sterling</td><td>Currency falls against sterling and wipes out the extra interest</td></tr>
<tr><td><b>Speculative</b></td><td>Expecting the currency to rise</td><td>Currency falls instead (capital loss)</td></tr></table></div>
<ul><li>Currency moves are <b>very hard to predict</b>.</li><li>Banks may charge <b>more</b> (extra admin), which can eat the extra return.</li><li>All the normal deposit risks from 1.4 still apply.</li></ul>`,
traps:[]},

{id:"1.9", title:"Main Types of Deposit Account", blurb:"Current, instant, notice, fixed, money market accounts, and NS&I products.",
html:`<div class="tw"><table class="tbl"><tr><th>Account</th><th>Access</th><th>Interest</th><th>Key feature</th></tr>
<tr><td>Current</td><td>Immediate</td><td>Usually none</td><td>Debit card/cheque book, for transactions</td></tr>
<tr><td>Instant access</td><td>Immediate</td><td>Variable</td><td>No or limited cheque book</td></tr>
<tr><td>Notice</td><td>After notice (<b>min 1 week</b>)</td><td>Variable</td><td>Penalty if notice waived</td></tr>
<tr><td>Fixed rate / term</td><td>End of term</td><td>Fixed</td><td><b>Can't top up</b>; early exit = substantial penalty</td></tr>
<tr><td>Money market account</td><td>Limited withdrawals</td><td>Higher</td><td>Min deposit and balance; money placed in <b>CDs and T-bills</b></td></tr></table></div>
<p class="muted">Also weigh up: fees, online/mobile access, tax, support, bank stability, intro bonuses that expire.</p>
<h3>NS&amp;I</h3>
<ul><li>Executive agency of the <b>Chancellor of the Exchequer</b>, accountable to <b>HM Treasury</b>. Buying NS&amp;I = <b>lending to the UK government</b>.</li><li>No default risk, no guarantee limit, no FCA authorisation needed.</li><li><b>No CGT on any NS&amp;I product</b>, but some are subject to income tax.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Taxable product</th><th>Returns</th><th>Limits</th><th>Term / access</th></tr>
<tr><td>Investment Account</td><td>Variable, gross</td><td>£20 to £1m</td><td>Postal only; no term</td></tr>
<tr><td>Direct Saver</td><td>Variable, gross, <b>annually</b></td><td>£1 to £2m</td><td>Online/phone; easy access</td></tr>
<tr><td>Income Bonds</td><td>Variable, gross, <b>monthly</b></td><td>£500 to £1m</td><td>No notice, no penalty</td></tr>
<tr><td>Green Savings Bond</td><td>Fixed</td><td>£100 to £100,000</td><td><b>3 years</b>, no withdrawals</td></tr>
<tr><td>British Savings Bond</td><td>Fixed, growth or income</td><td>£500 to £1m per bond</td><td><b>2, 3 or 5 years</b>; taxed in <b>year of maturity</b></td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Tax-free product</th><th>Key facts</th></tr>
<tr><td>Premium Bonds</td><td>Monthly prize draw; prizes up to £1m; odds <b>22,000:1</b> per £1; <b>£25 to £50,000</b></td></tr>
<tr><td>Direct ISA</td><td>NS&amp;I cash ISA; up to <b>£20,000</b> (2025/26)</td></tr>
<tr><td>Junior ISA</td><td>Up to <b>£9,000</b> (2025/26); under 18 with <b>no Child Trust Fund</b>; no withdrawals before 18</td></tr></table></div>`,
traps:["<b>Money market account</b> (a bank savings account) is <b>not</b> a <b>money market fund</b> (a collective investment, see 1.10)."]},

{id:"1.10", title:"Money Market Funds", blurb:"Instruments, NAV types, ratings and overnight benchmarks.",
html:`<p><b>Collective investment funds</b> holding cash and near-cash. Investors are shareholders with a pro rata claim. Aims: <b>safety of capital, liquidity, competitive returns</b>.</p>
<div class="tw"><table class="tbl"><tr><th>Instrument</th><th>Issuer</th><th>Notes</th></tr>
<tr><td><b>Treasury bills</b></td><td>Government</td><td>Effectively risk free; <b>most liquid</b></td></tr>
<tr><td><b>Commercial paper</b></td><td>Large companies</td><td>Low risk; usually held to maturity</td></tr>
<tr><td><b>Certificates of deposit</b></td><td>Banks</td><td>Receipt for a deposit; <b>relatively illiquid</b></td></tr></table></div>
<p>Instruments mature in <b>under one year</b>, pay <b>no interest</b> and are bought at a <b>discount to face value</b>. A <b>liquidity premium</b> compensates for less liquid securities.</p>
<div class="tw"><table class="tbl"><tr><th>Type</th><th>NAV</th><th>Income</th></tr>
<tr><td><b>CNAV</b> (constant)</td><td>Stays at e.g. £1</td><td>Accrued daily, paid or reinvested monthly</td></tr>
<tr><td><b>ANAV</b> (accumulating)</td><td>Stable</td><td>Not paid out; unit price rises. <b>Roll-up funds</b></td></tr>
<tr><td><b>LVNAV</b> (low volatility)</td><td>Constant if within <b>0.2%</b> of face value</td><td>Extra safeguards; authorised for <b>max 5 years</b></td></tr>
<tr><td><b>VNAV</b> (variable)</td><td>Moves with <b>mark-to-market</b></td><td>Varies</td></tr></table></div>
<ul><li><b>Breaking the buck</b> = NAV falls <b>below £1</b>.</li><li>Valuation: quoted price or <b>amortised cost</b> (gap to face value released <b>straight-line</b>). MMFs usually use amortised cost.</li></ul>
<h3>Fund ratings</h3>
<p>Objectives in order: <b>capital preservation, liquidity, competitive returns</b>. Rating areas: credit quality, portfolio construction (key metric <b>weighted average maturity</b>), fund management, and post-rating <b>fund surveillance</b>.</p>
<h3>Overnight benchmarks</h3>
<div class="tw"><table class="tbl"><tr><th>Benchmark</th><th>Currency</th><th>Key facts</th></tr>
<tr><td><b>SONIA</b></td><td>GBP</td><td><b>Unsecured</b>. Launched 1997, run by BoE since 2018. Min trade £25m</td></tr>
<tr><td><b>€STR</b></td><td>EUR</td><td>Unsecured. Trades over €1m</td></tr>
<tr><td><b>SOFR</b></td><td>USD</td><td><b>Secured</b> on US Treasuries. NY Fed since 2018</td></tr>
<tr><td><b>SARON</b></td><td>CHF</td><td>Swiss repo market</td></tr>
<tr><td><b>TONA</b></td><td>JPY</td><td>Unsecured interbank overnight</td></tr></table></div>
<p>Costs: <b>loads</b> (entry/exit charges) and <b>expense ratios</b> (running costs).</p>`,
traps:["<b>SOFR is the only secured one.</b> SONIA is <b>unsecured</b>. You dropped this in practice, so drill it.","Unchanging NAV = CNAV. Changing NAV = ANAV or VNAV."]},

{id:"1.11", title:"Peer-to-Peer (P2P) Lending", blurb:"How P2P works, its risks, and how it is taxed.",
html:`<ul><li>Started <b>2005</b>; grew after 2007/08 because of low bank rates and falling trust in banks.</li>
<li>Lending to individuals <b>without a bank in the middle</b>. Platforms match lenders and borrowers for a fee.</li>
<li><b>P2P = debt. Crowdfunding = equity.</b></li><li>Market projections: $251.3bn by end of 2025; $729.1bn by 2029.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Risk</th><th>How it's managed</th></tr>
<tr><td>Default</td><td>Platform checks credit history and identity</td></tr>
<tr><td>Concentration</td><td>Loans split across lenders; often a <b>2% cap</b> each, so <b>at least 50 lenders</b></td></tr>
<tr><td>Illiquidity</td><td>Shown in <b>COVID-19</b> when platforms froze withdrawals</td></tr>
<tr><td>Regulatory</td><td>Rules differ a lot between countries</td></tr></table></div>
<ul><li>Loans usually <b>1 to 5 years</b>, repaid monthly. Early exit = sell the loan, <b>not guaranteed</b>, usually a fee.</li>
<li>Returns can be <b>up to twice</b> high street rates. The quoted rate already allows for expected defaults.</li>
<li>Interest is <b>paid gross</b> and must be declared to HMRC. Inside an <b>Innovative Finance ISA</b> it is tax free.</li></ul>`,
traps:["P2P is usually <b>not</b> FSCS covered (only unsuitable advice on or after 6 April 2016)."]},

{id:"1.12", title:"Foreign Exchange (FX)", blurb:"Market facts, quotes and spreads, risks and regulators.",
html:`<ul><li>FX is the <b>largest financial market</b> (about <b>$7.5 trillion a day</b>), <b>OTC and decentralised</b>.</li>
<li>Trades <b>24 hours, 5 days a week</b>. Sessions: <b>Sydney, Tokyo, London, New York</b>. Busiest when sessions overlap.</li>
<li>Most traded: <b>USD, EUR, JPY, GBP, AUD</b>.</li></ul>
<h3>Quotes and spreads</h3>
<ul><li>Traded in <b>pairs</b>, three-letter codes, quoted to <b>4 decimal places</b> (not yen pairs).</li>
<li><b>Base currency</b> = first, always 1 unit. <b>Counter (quote)</b> = second.</li>
<li>USD is usually the base, <b>except against GBP, EUR and AUD</b>.</li></ul>
<div class="worked"><b class="lab">Worked example</b>EUR/USD 1.1640/60, dealing €100,000. You <b>buy</b> euros at the <b>offer</b> 1.1660: pay <b>$116,600</b>. You <b>sell</b> at the <b>bid</b> 1.1640: receive <b>$116,400</b>. Spread 0.0020. Narrow = liquid; wide = illiquid or volatile.</div>
<div class="tw"><table class="tbl"><tr><th>Topic</th><th>Key points</th></tr>
<tr><td>Risks</td><td>Exchange rate, volatility, liquidity (wider spreads), cost of hedging. Hedging <b>reduces but doesn't remove</b> risk.</td></tr>
<tr><td><b>Rollover</b></td><td>Extends settlement by swapping currencies; used in <b>carry trading</b></td></tr>
<tr><td><b>Stop loss</b></td><td>Closes a position automatically at a set price</td></tr>
<tr><td>Participants</td><td>Central banks, commercial banks, companies (hedging), hedge funds, retail traders</td></tr>
<tr><td>Regulators</td><td><b>FCA</b> (UK), <b>CFTC and NFA</b> (US), <b>ESMA</b> (Europe). AML and KYC required.</td></tr></table></div>`,
traps:[]}
];

{id:"2.1", title:"General Features of Bonds", blurb:"Investment grade vs high yield, bond types by market, and the five characteristics.",
html:`<ul><li>Also called <b>debt securities</b> or <b>fixed-income securities</b>. A loan: the <b>issuer is the borrower</b>, the <b>bondholder is the lender</b>.</li>
<li>A promise to repay capital on a set future date, with interest paid in between.</li></ul>
<p><b>Five types by issuer:</b> government (sovereign debt), corporate, supranational, public authority, and MBSs/ABSs.</p>
<h3>Investment grade vs high yield</h3>
<div class="tw"><table class="tbl"><tr><th></th><th>Investment grade</th><th>High yield (junk / speculative)</th></tr>
<tr><td>Fitch / S&amp;P</td><td><b>BBB and above</b></td><td><b>BB and below</b></td></tr>
<tr><td>Moody's</td><td><b>Baa and above</b></td><td><b>Ba and below</b></td></tr>
<tr><td>Default risk</td><td>Lower</td><td>Higher</td></tr>
<tr><td>Price</td><td>Higher</td><td>Lower</td></tr>
<tr><td>Coupon / yield</td><td>Lower</td><td>Higher (a default premium)</td></tr></table></div>
<p><b>Greece:</b> Moody's cut it from <b>A1 (2007) to C (2012)</b>. Its spread over German bonds went from 0.36% to around 24%.</p>
<h3>Bonds by currency and market</h3>
<div class="tw"><table class="tbl"><tr><th>Type</th><th>Definition</th><th>Example</th></tr>
<tr><td><b>Domestic</b></td><td>Issuer, currency and country of issue all the same</td><td>Yen bond issued in Japan by a Japanese company</td></tr>
<tr><td><b>Foreign</b></td><td>Foreign issuer in a domestic market, in that market's currency</td><td>US company issuing a Canadian dollar bond in Canada</td></tr>
<tr><td><b>Eurobond</b></td><td>Currency differs from the home currency of the country where it is issued. <b>Nothing to do with the euro</b></td><td>Renminbi bond issued in the UK</td></tr>
<tr><td><b>Global</b></td><td>Like a eurobond but <b>also</b> issued and traded in the currency's home country</td><td>Renminbi bond offered in the UK and China</td></tr></table></div>
<p>Foreign bond nicknames: UK = <b>Bulldogs</b>, US = <b>Yankees</b>, China = <b>Dragons</b>.</p>
<h3>Nominal value and price</h3>
<ul><li>Nominal value is also called <b>face</b> or <b>par value</b> and never changes. Standard NVs: <b>£100 (UK), $1,000 (US), CNY100 (China)</b>.</li>
<li><b>Above par = premium. Below par = discount.</b> Price is driven by supply and demand and by rate expectations.</li>
<li><b>Clean</b> price = quoted, excludes accrued interest. <b>Dirty</b> = clean plus accrued, what the buyer pays.</li></ul>
<h3>Maturity</h3>
<div class="tw"><table class="tbl"><tr><th>Type</th><th>Feature</th></tr>
<tr><td><b>Bullet</b></td><td>Single repayment date, e.g. Treasury Gilt 1.125% 22/10/2073</td></tr>
<tr><td><b>Callable</b></td><td><b>Issuer</b> can repay early</td></tr>
<tr><td><b>Puttable</b></td><td><b>Holder</b> can sell back to the issuer early</td></tr>
<tr><td><b>Double-dated</b></td><td>Issuer can redeem any day between two dates. Last UK one: <b>12% Exchequer Stock 2013–17</b></td></tr>
<tr><td><b>Perpetual / undated</b></td><td>No maturity date. Coupon paid forever</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>UK class</th><th>Financial Times</th><th>DMO</th></tr>
<tr><td>Shorts</td><td>Under 5 years</td><td><b>Under 7 years</b></td></tr><tr><td>Mediums</td><td>5 to 15 years</td><td><b>7 to 15 years</b></td></tr><tr><td>Longs</td><td>Over 15 years</td><td>Over 15 years</td></tr></table></div>
<p class="muted">Ultra-longs count as longs, ultra-shorts as shorts. A century bond is 100 years. Double-dated bonds are classified by the <b>later</b> date.</p>
<h3>Coupon</h3>
<ul><li>Interest each year on the NV, paid quarterly, half-yearly or annually. Normally paid <b>gross</b>; investors can opt for <b>20%</b> withholding.</li>
<li>UK coupons are <b>savings income</b>, so they count towards the Personal Savings Allowance.</li></ul>
<div class="worked"><b class="lab">Worked example</b>£100 NV, 6.5% coupon paid half-yearly = £3.25 gross. 20% withheld: £3.25 × 0.8 = <b>£2.60 net</b> per half year.</div>
<div class="tw"><table class="tbl"><tr><th>Special coupon</th><th>Key features</th></tr>
<tr><td><b>FRN (floater)</b></td><td>Reference rate (SONIA, €STR, SOFR) <b>plus a quoted margin</b>. Resets every 1 to 6 months</td></tr>
<tr><td><b>Drop lock</b></td><td>FRN becomes <b>fixed</b> if rates fall to a set level</td></tr>
<tr><td><b>Cap</b></td><td>Ceiling the FRN rate cannot rise above</td></tr>
<tr><td><b>Mini-max / collared</b></td><td>Floor <b>and</b> ceiling</td></tr>
<tr><td><b>ILB (linker)</b></td><td>Coupon <b>and</b> capital linked to inflation. Its GRY is a <b>real</b> yield</td></tr>
<tr><td><b>Zero coupon</b></td><td>Issued at a deep discount, repaid at £100. Taxman deems notional income each year. <b>Duration = maturity</b></td></tr>
<tr><td><b>Convertible</b></td><td>Can be converted into other securities, usually the company's shares</td></tr></table></div>
<div class="worked"><b class="lab">Worked example</b>SONIA 4.20% + 25 basis points. 1bp = 0.01%, so coupon = <b>4.45%</b>.</div>
<h3>Security and ranking</h3>
<p>Terms are in the <b>indenture</b>; full details in the <b>prospectus</b>.</p>
<div class="tw"><table class="tbl"><tr><th>Rank</th><th>Type</th><th>Meaning</th></tr>
<tr><td>1st</td><td><b>Secured</b></td><td>Backed by specific assets</td></tr>
<tr><td>2nd</td><td><b>Unsecured / senior</b></td><td>Repaid before other obligations, no assets behind it</td></tr>
<tr><td>3rd</td><td><b>Subordinated (junior)</b></td><td>Repaid after senior debt. Highest risk</td></tr></table></div>
<p><b>Covenants</b> protect bondholders, e.g. limits on further borrowing, dividends and selling assets.</p>`,
traps:["\"Eurobond\" does <b>not</b> mean euro-denominated. It can be any major currency.","Eurobond vs global: the global bond is <b>also</b> traded in the currency's home country.","<b>Callable = issuer's</b> choice. <b>Puttable = holder's</b> choice.","FT short = under 5 years. <b>DMO short = under 7 years.</b>","Clean price excludes accrued interest. <b>Dirty = what you pay.</b>"]},

{id:"2.2", title:"Government Bonds", blurb:"Gilts, local authority bonds, foreign govies and Treasury bills.",
html:`<p>Governments borrow to fund spending and infrastructure, so government bonds <b>dominate</b> bond markets. Secondary trading is on exchanges in France, Germany and the UK, and <b>off-exchange in the US</b>.</p>
<h3>UK gilts</h3>
<ul><li>Issued by the <b>DMO</b> on behalf of <b>HM Treasury</b>. Bought via the stock market, the DMO's purchase and sale service, or a <b>GEMM</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Term</th><th>Meaning</th></tr>
<tr><td><b>CGNCR</b></td><td>Central government spending minus revenue. <b>The only part gilts fund</b></td></tr>
<tr><td>LGNCR / PCNCR</td><td>Local government / public corporations net cash requirement</td></tr>
<tr><td><b>PSNCR</b></td><td><b>CGNCR + LGNCR + PCNCR</b> = total <b>annual</b> borrowing</td></tr>
<tr><td><b>National debt</b></td><td>Total <b>outstanding</b> debt. <b>Not</b> the PSNCR</td></tr></table></div>
<p>UK debt-to-GDP: <b>240% in 1947</b>, record low <b>21.7% in 1990</b>, COVID peak <b>107.6% in Q1 2021</b>, now about £2.8 trillion (roughly 100%).</p>
<div class="tw"><table class="tbl"><tr><th>Gilt type</th><th>Key features</th></tr>
<tr><td><b>Conventional</b></td><td>Fixed coupon. Biggest share. Usually called "Treasury"</td></tr>
<tr><td><b>Index-linked</b></td><td>Coupon <b>and</b> capital linked to <b>RPI</b>. <b>No deflation floor</b></td></tr>
<tr><td><b>Floating rate</b></td><td>Quarterly coupon. <b>None in issue now</b></td></tr>
<tr><td><b>Convertible</b></td><td>Converts into a different gilt. "Conv" in the FT</td></tr>
<tr><td><b>Double-dated</b></td><td>Last one: 12% Exchequer Stock 2013–17</td></tr>
<tr><td><b>Undated</b></td><td>No maturity. <b>None in issue now</b></td></tr></table></div>
<ul><li>Most gilts pay every <b>6 months</b>. Longest maturity <b>2073</b>.</li>
<li>ILG lag: <b>3 months</b> (issued after Sept 2005), <b>8 months</b> (older). RPI aligns with <b>CPIH by 2030</b>, likely <b>reducing</b> ILG values.</li>
<li><b>2022:</b> inflation and the mini-budget caused a big gilt sell-off. Gilts are not free of market risk.</li></ul>
<h3>Local authority bonds</h3>
<ul><li>Called <b>corporation stocks</b>. Used to be backed by the <b>PWLB</b>, abolished in <b>2020</b>. <b>Less safe than gilts.</b></li>
<li>Fixed stocks are <b>not marketable</b>. <b>Yearlings</b> (negotiable loans): max life <b>2 years</b>, issued at par, marketable.</li></ul>
<h3>Foreign government bonds</h3>
<p>In theory risk free, but <b>Argentina has defaulted 9 times, most recently in 2020</b>.</p>
<div class="tw"><table class="tbl"><tr><th>Feature</th><th>Countries</th></tr>
<tr><td>Issued by central bank</td><td>US, Germany, France</td></tr><tr><td>By ministry of finance</td><td>Netherlands, China, Japan</td></tr><tr><td>By a DMO</td><td>UK, Ireland, Sweden, Portugal, New Zealand</td></tr><tr><td>Sold to bank syndicates</td><td>Switzerland</td></tr><tr><td>Semi-annual interest</td><td>US, UK, Italy, Japan</td></tr><tr><td>Annual interest</td><td>France, Germany, Netherlands, Spain, Belgium</td></tr><tr><td>Priced in 1/32nds</td><td>US</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Country</th><th>Bond</th><th>Maturity</th></tr>
<tr><td>US</td><td>T-notes / T-bonds</td><td>1–10 / over 10 years</td></tr><tr><td>Germany</td><td><b>Bunds</b> / <b>Bobls</b> / <b>Schatz</b></td><td>10–30 / 3–5 / 2 years</td></tr><tr><td>France</td><td><b>OATs</b> / <b>BTFs</b></td><td>2–50 years / up to 12 months</td></tr><tr><td>Japan</td><td>JGBs</td><td>Usually 10 years</td></tr></table></div>
<ul><li>Largest inflation-linked market = <b>US TIPS</b>, which <b>have a deflation floor</b>.</li>
<li>UK investors pay <b>CGT</b> on foreign govies (including currency gains). <b>Gilts are CGT exempt</b>, but gilt losses can't be offset.</li></ul>
<h3>Treasury bills</h3>
<p><b>Zero coupon</b>, issued at a discount. UK: <b>28, 91, 182 days</b>, via a primary participant, <b>minimum £500,000</b>. US: 4, 8, 13, 26, 52 weeks. Both are proxies for the <b>risk-free rate</b>.</p>`,
traps:["UK ILGs have <b>no</b> deflation floor. US TIPS <b>do</b>.","PSNCR = annual borrowing. National debt = the total pile.","Gilts only fund the <b>CGNCR</b>."]},

{id:"2.3", title:"Corporate Bonds", blurb:"Debentures, QCBs, PIBS, convertibles and CoCos.",
html:`<ul><li>Interest paid gross, usually <b>half-yearly</b> for UK corporates.</li>
<li><b>No CGT</b> on a <b>Qualifying Corporate Bond</b>: pays interest (not convertible) <b>and</b> is in <b>sterling</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Type</th><th>Features</th></tr>
<tr><td><b>Secured debenture</b></td><td>Backed by specific assets. <b>Lower</b> rate</td></tr>
<tr><td><b>Unsecured loan stock</b></td><td>Relies on the company's credit. <b>Higher</b> rate</td></tr></table></div>
<h3>PIBS</h3>
<div class="tw"><table class="tbl"><tr><th>Feature</th><th>Detail</th></tr>
<tr><td>Issuer</td><td><b>Building societies</b></td></tr>
<tr><td>Interest</td><td>Gross, fixed, <b>half-yearly</b>; taxed via <b>Self-Assessment</b></td></tr>
<tr><td><b>Non-cumulative</b></td><td>Missed interest is <b>lost</b></td></tr>
<tr><td><b>Irredeemable</b></td><td>Repaid only on winding up; holders are the <b>last creditors</b> paid</td></tr>
<tr><td>CGT</td><td><b>Exempt</b> (QCBs)</td></tr>
<tr><td>Demutualisation</td><td>Holders share any windfall; PIBS become <b>PSBs</b>, which rank <b>lower</b></td></tr></table></div>
<h3>Convertible bonds</h3>
<ul><li>Fixed coupon; right to convert into a <b>set number of shares</b>. If not converted, it <b>stays as loan stock</b>.</li>
<li><b>Premium</b> = gap between the implied conversion price and the share price.</li></ul>
<p><span class="formula">Conversion price = Price per £100 nominal ÷ Shares received</span></p>
<div class="worked"><b class="lab">Worked example</b>£120 per £100 nominal, converts into 40 shares: 120 ÷ 40 = <b>£3.00</b>. Shares trade at £3.40, so converting is worthwhile.</div>
<p>Companies like them: wider appeal, an alternative to a rights issue, and interest is paid <b>before tax</b>. Investors get income <b>plus</b> equity upside.</p>
<h3>CoCos</h3>
<ul><li>Debt that <b>automatically converts</b> to equity on a trigger: <b>capital ratio</b> falls too low, or <b>share price</b> falls below a level.</li>
<li>Mostly issued by <b>banks</b>. Conversion <b>favours the issuer</b>, so CoCos pay a <b>higher yield</b>. Spreads move like <b>subordinated debt</b>.</li></ul>`,
traps:["QCB needs <b>both</b>: non-convertible <b>and</b> sterling.","PIBS are <b>non-cumulative</b>.","A convertible is the <b>holder's</b> choice. A CoCo converts <b>automatically</b> and favours the <b>issuer</b>."]},

{id:"2.4", title:"Supranational Bonds", blurb:"EIB, World Bank and other multi-country issuers.",
html:`<ul><li>Bodies set up by several countries to support development, e.g. <b>EIB, World Bank, WTO</b>.</li>
<li>Powers beyond national borders, but <b>no tax revenue</b>. Pay bondholders from <b>donations, investment income and loan income</b>.</li>
<li>Seen as the <b>safest</b> bonds alongside governments, with very high ratings.</li></ul>`,
traps:["Supranationals have <b>no tax revenue</b>."]},

{id:"2.5", title:"Asset-Backed Securities", blurb:"ABSs, MBSs and their role in the financial crisis.",
html:`<ul><li>Bonds backed by a <b>pool of assets</b> (loans, leases). Turns <b>illiquid assets into tradeable</b> securities.</li>
<li>Started in the <b>1970s</b> with US agencies pooling mortgages: <b>Fannie Mae, Ginnie Mae, Freddie Mac</b>.</li>
<li>Now includes credit card debt, car loans, ticket revenues and equipment leases.</li></ul>
<h3>MBSs and the financial crisis</h3>
<ul><li><b>MBSs are a type of ABS</b> and were a key cause of the crisis.</li>
<li>Lenders sold loans on, <b>passing default risk to investors</b>, so lending standards collapsed and subprime loans were mixed in.</li>
<li>2000 to 2007: Moody's rated <b>over half of about 45,000</b> mortgage securities <b>Aaa</b>. Banks were left with about <b>$1 trillion</b> of toxic assets.</li></ul>`,
traps:[]},

{id:"2.6", title:"Sukuk", blurb:"Shariah-compliant bond-like instruments.",
html:`<ul><li>Comply with <b>Shariah law</b>, which <b>forbids all interest</b>. Based on <b>risk sharing</b>.</li>
<li>Each sukuk represents a share in <b>ownership of an underlying asset</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Structure</th><th>Feature</th></tr>
<tr><td><b>Ijarah</b></td><td>Sale (and lease-back) of a tangible asset. <b>One of the most important</b></td></tr>
<tr><td>Perpetual</td><td>No maturity; redeemed at the issuer's discretion</td></tr>
<tr><td>Convertible</td><td>Can convert into the issuer's shares</td></tr>
<tr><td>ESG</td><td>Funds projects meeting ESG criteria</td></tr></table></div>
<p>Global sukuk issuance was about <b>$900 billion in 2024</b>, up 8.5% (Fitch).</p>`,
traps:["Sukuk pay no interest. Investors <b>own a share of an asset</b>."]},

{id:"2.7", title:"ESG, Green and Blue Bonds", blurb:"ESG pillars, governance frameworks, green gilts and blue bonds.",
html:`<div class="tw"><table class="tbl"><tr><th>Pillar</th><th>Focus areas</th></tr>
<tr><td><b>Environmental</b></td><td>Climate change, pollution, deforestation, fossil fuels</td></tr>
<tr><td><b>Social</b></td><td>Human rights, working conditions, job creation, <b>tax avoidance</b></td></tr>
<tr><td><b>Governance</b></td><td>Board structure and diversity, directors' pay, transparency</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Framework</th><th>Detail</th></tr>
<tr><td><b>SM&amp;CR</b> (UK)</td><td>Personal accountability. Applies to <b>all FCA-authorised firms</b></td></tr>
<tr><td><b>UK Corporate Governance Code</b></td><td>Last updated <b>January 2024</b></td></tr>
<tr><td><b>Sarbanes-Oxley</b> (US)</td><td><b>2002</b>. Accuracy of company disclosures</td></tr></table></div>
<h3>Green bonds</h3>
<ul><li>Money used <b>only</b> for eligible green projects.</li>
<li>GSS+ market = <b>$5.4 trillion (2024)</b>. Green issuance grew from <b>$11bn (2013) to $1 trillion (2024)</b>, driven by the <b>Paris Agreement</b>.</li>
<li>Risk of <b>greenwashing</b>. The <b>ICMA</b> created the voluntary <b>Green Bond Principles</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Green gilts</th><th>Detail</th></tr>
<tr><td>Ten-Point Climate Action Plan</td><td><b>2020</b>, at least <b>£15bn</b> pledged</td></tr>
<tr><td>Green Gilt Framework</td><td><b>2021</b></td></tr>
<tr><td>First green gilt</td><td><b>September 2021</b>, matures <b>July 2033</b>, raised <b>£16.1bn</b></td></tr>
<tr><td>Excluded</td><td>Fossil fuel exploration, weapons, tobacco, gambling, palm oil</td></tr></table></div>
<h3>Blue bonds</h3>
<p>For <b>marine and ocean</b> projects. First sovereign blue bond: <b>Seychelles, 2018, $15 million</b>, partly guaranteed by the <b>World Bank</b> with a <b>GEF</b> loan.</p>`,
traps:["Green = land-based projects. <b>Blue = ocean.</b>","GBP are <b>voluntary</b>, created by the <b>ICMA</b>."]},

{id:"2.8", title:"Yields, Returns and Duration", blurb:"Running yield, GRY, NRY, duration and convexity.",
html:`<p>Two main influences on price: <b>interest rates</b> and <b>time to maturity</b>.</p>
<h3>Running yield</h3>
<p><span class="formula">Running yield = Gross coupon ÷ Market price</span></p>
<div class="worked"><b class="lab">Worked example</b>OAT 4.85% at €114: 4.85 ÷ 114 = <b>4.25%</b>.</div>
<p>Limitation: <b>ignores</b> any capital gain or loss at redemption.</p>
<h3>Capital returns</h3>
<p><span class="formula">HPR = (Redemption − Purchase price) ÷ Purchase price</span> &nbsp; <span class="formula">Annualised = HPR ÷ Years</span></p>
<h3>Gross redemption yield</h3>
<ul><li>Also called <b>yield to maturity</b>. Total return <b>including</b> capital gain or loss.</li><li>Assumes you <b>hold to redemption</b> and <b>reinvest coupons at the GRY</b>.</li></ul>
<p><span class="formula">Approx GRY = Running yield + Annualised capital gain/loss</span></p>
<div class="worked"><b class="lab">Worked example</b>OAT 4.85%, €114, 12 years. Running 4.25%. HPR (100 − 114) ÷ 114 = −12.28%. ÷ 12 = −1.02%. GRY ≈ <b>3.23%</b>.</div>
<ul><li>Bond income is <b>savings income</b>. <b>Gilts and QCBs are exempt from CGT.</b></li><li><b>NRY</b> = GRY after income tax, which comes off the <b>income</b> part only.</li></ul>
<h3>Volatility, duration and convexity</h3>
<p><b>Prices and yields move in opposite directions.</b></p>
<div class="tw"><table class="tbl"><tr><th>Factor</th><th>Price volatility</th></tr>
<tr><td>Longer maturity</td><td><b>More</b></td></tr><tr><td>Lower / zero coupon</td><td><b>More</b></td></tr><tr><td>Higher coupon</td><td><b>Less</b></td></tr><tr><td>Lower credit quality</td><td><b>More</b></td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Measure</th><th>What it is</th></tr>
<tr><td><b>Macaulay duration</b></td><td>Weighted average time to receive cash flows. <b>Zero coupon: duration = maturity</b></td></tr>
<tr><td><b>Modified duration</b></td><td><b>Macaulay ÷ (1 + GRY)</b>: % price change for a 1% yield change</td></tr>
<tr><td><b>Price change</b></td><td><b>−Modified duration × change in yield</b></td></tr>
<tr><td>Option-adjusted</td><td>For callable or puttable bonds</td></tr>
<tr><td><b>Convexity</b></td><td>Modified duration <b>overstates falls</b> and <b>understates rises</b></td></tr></table></div>
<div class="worked"><b class="lab">Worked example</b>Macaulay 8, GRY 5%: modified = 8 ÷ 1.05 = 7.62. Yields up 0.5%: −7.62 × 0.5 = <b>−3.81%</b>.</div>`,
traps:["Running yield <b>ignores</b> capital gain/loss. GRY <b>includes</b> it.","Low coupon = <b>more</b> volatile, not less.","NRY only taxes the <b>income</b> part."]},

{id:"2.9", title:"Risks of Debt Securities", blurb:"Interest rate, inflation, liquidity and default risk, and credit ratings.",
html:`<ul><li>Most bonds are <b>negotiable</b>. Investment grade bonds are a <b>safe haven</b> when shares fall.</li>
<li>Price drivers: <b>home interest rates</b> (the key one), FX, rating changes, the PSNCR, GDP, unemployment, coupon and redemption date.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Risk</th><th>Key points</th></tr>
<tr><td><b>Interest rate</b></td><td>Rates rise, price falls. A <b>"double hit"</b>: stuck on a low rate <b>and</b> capital falls. <b>FRNs</b> protect</td></tr>
<tr><td><b>Inflation</b></td><td>Erodes fixed returns. <b>ILBs</b> protect income and capital</td></tr>
<tr><td><b>Liquidity</b></td><td>Lower for big issues. <b>On-the-run</b> (newest) bonds are most liquid</td></tr>
<tr><td><b>Default</b></td><td>Issuer can't pay interest or capital</td></tr>
<tr><td><b>Credit enhancement</b></td><td>A strong guarantor backs a weaker issuer; you rely on the <b>guarantor's</b> credit</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th></th><th>Bonds</th><th>Equities</th></tr>
<tr><td>Bad year</td><td>Interest must still be paid</td><td>Dividends can be cut</td></tr>
<tr><td>Liquidation</td><td>Repaid <b>before</b> shareholders</td><td>Paid <b>last</b></td></tr>
<tr><td>Upside</td><td>Limited</td><td>Share in growth</td></tr></table></div>
<h3>Credit ratings</h3>
<ul><li>Moody's, S&amp;P, Fitch. Issuers <b>invite</b> them. They rate the <b>issuer</b> and <b>each issue</b> separately (seniority matters).</li></ul>`,
traps:["FRNs protect against <b>interest rate</b> risk. ILBs protect against <b>inflation</b>.","On-the-run = <b>newest and most liquid</b>."]},

{id:"2.10", title:"Primary and Secondary Markets", blurb:"Issue methods, dealing routes, gilt auctions, accrued interest, costs.",
html:`<div class="tw"><table class="tbl"><tr><th>Issue method</th><th>How it works</th></tr>
<tr><td><b>Offer for sale</b></td><td>Bank syndicate buys and sells on; banks <b>underwrite</b>. In a <b>bought deal</b> the lead bank buys it all</td></tr>
<tr><td><b>Fixed price re-offering</b></td><td>Sold at the <b>same price</b> for a set period. <b>US and euromarkets</b></td></tr>
<tr><td><b>Competitive auction</b></td><td>Highest bidders win. Mainly <b>governments</b></td></tr>
<tr><td><b>Private placing</b></td><td>Sold to a <b>small number of professional investors</b></td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Route</th><th>Key points</th></tr>
<tr><td><b>Stockbroker</b></td><td>Commission. <b>At best</b> = best price; <b>at limit</b> = not above a set price</td></tr>
<tr><td><b>DMO retail (Computershare)</b></td><td>Execution-only, state the <b>money amount</b>. <b>No limit orders</b>, no price control</td></tr>
<tr><td><b>DMO auction</b></td><td><b>No commission or spread</b>: cheapest route</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Auction bid</th><th>Rules</th></tr>
<tr><td><b>Competitive</b></td><td>Via a <b>GEMM</b>. You state the price. <b>Min £1m</b></td></tr>
<tr><td><b>Non-competitive</b></td><td><b>£1,000 to £500,000</b>. <b>Always filled</b>. Price = <b>weighted average of successful competitive bids</b></td></tr></table></div>
<div class="worked"><b class="lab">Worked example</b>Gilt quoted £118.00–£118.25. Buy at £118.25, sell at £118.00. Spread = <b>£0.25 per £100</b>.</div>
<h3>Corporate bond markets</h3>
<p>A <b>dealer</b> issues, underwrites and makes a market. Corporates price at a <b>spread over a government bond</b>. Syndicate profit = <b>underwriting spread</b>. Secondary trading is mainly <b>OTC</b>.</p>
<h3>Retail vs wholesale; ORB</h3>
<p>Retail bonds are smaller, via intermediaries on an exchange, usually 5–10 years. <b>ORB</b>: gilts, supranationals, UK corporates; issues <b>£20m–£300m</b>; <b>08:45–16:30</b>; tick <b>£0.01</b>; <b>clean</b> prices; gilts settle <b>T+1</b>, ORB corporates <b>T+2</b>.</p>
<h3>Pricing</h3>
<p>Published prices are <b>mid-market</b> and <b>clean</b>. Bonds trade in a <b>dealer market</b>. <b>Market price is not fair value.</b></p>
<h3>Clean and dirty prices</h3>
<p>Interest accrues <b>daily</b> (1/365, or 1/366 in a leap year). The buyer pays the seller accrued interest on top of the clean price.</p>
<p><span class="formula">Accrued = Coupon payment × Days since last ÷ Days in period</span></p>
<div class="worked"><b class="lab">Worked example</b>4¼% Treasury 2032 pays 7 June and 7 December. 30 days since, 183 in period: 2.125 × 30/183 = <b>£0.35 per £100</b>.</div>
<ul><li>Gilts go <b>ex-dividend 7 working days</b> before payment. Buy after xd and you don't get the next coupon.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Scenario</th><th>Adjustment</th></tr>
<tr><td>Buy / sell <b>cum-div</b></td><td>Interest from last payment to settlement <b>added</b></td></tr>
<tr><td>Buy / sell <b>ex-div</b></td><td>Interest from settlement to next payment <b>deducted</b></td></tr></table></div>
<p>Costs: <b>underwriting spread</b> (primary); commission, spreads, market-making fees (secondary); <b>dealer markups</b> on OTC corporates.</p>`,
traps:["Non-competitive bidders <b>always</b> get stock but <b>don't choose</b> the price.","Fixed price re-offering = <b>US and euromarkets</b>. Competitive auction = <b>governments</b>.","Gilts settle <b>T+1</b>. ORB corporates <b>T+2</b>.","Cum-div = interest <b>added</b>. Ex-div = interest <b>deducted</b>.","Gilts go xd <b>7 working days</b> before payment."]},

{id:"2.11", title:"Bond Indices", blurb:"Why bond indices are hard to build, types, weighting and providers.",
html:`<ul><li>Benchmarks for portfolio performance. First appeared in the <b>1970s</b>.</li>
<li>Harder than equity indices: universe is <b>bigger</b> and <b>constantly changing</b>; <b>issuance-weighted</b> so the <b>most indebted</b> issuers dominate; complex and illiquid constituents drove growth in <b>bond ETFs</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Return type</th><th>Detail</th></tr>
<tr><td><b>Total return</b></td><td>Income plus capital growth. Most common</td></tr>
<tr><td><b>Capital return</b></td><td>Based on the <b>clean price</b>, weighted by nominal outstanding</td></tr></table></div>
<ul><li>Bond indices hold <b>more</b> securities than equity indices and are <b>rules-based</b>. Every constituent needs a bid and offer.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Provider</th><th>Index</th><th>Key points</th></tr>
<tr><td>Bloomberg</td><td><b>Global Aggregate</b></td><td>Min rating <b>Baa/BBB</b>. Uses the <b>middle</b> of three ratings, the <b>lower</b> of two</td></tr>
<tr><td>FTSE Russell</td><td>Fixed income range</td><td>Transparent, rules-based</td></tr>
<tr><td>J.P. Morgan</td><td><b>Global Government Bond Index</b></td><td>Some sub-indices from <b>1985</b></td></tr></table></div>
<ul><li>Passive managers buy a <b>subset</b> and use <b>bond futures</b> to match <b>duration</b>.</li><li>Prices come from <b>dealer banks</b>; index price = <b>mid-price</b>.</li></ul>`,
traps:["Issuance weighting means the <b>most indebted</b> issuers dominate.","Duration is matched using <b>bond futures</b>.","Bloomberg Global Aggregate: with three ratings, use the <b>middle</b> one."]},

{id:"2.12", title:"Bond Funds and Strategies", blurb:"Fund benefits, active and passive strategies, pros and cons.",
html:`<p>Fund benefits: simplicity, access (e.g. T-bills with a <b>£500,000 minimum</b>), liquidity, diversification, easy comparison.</p>
<h3>Active strategies</h3>
<div class="tw"><table class="tbl"><tr><th>Strategy</th><th>How it works</th></tr>
<tr><td><b>Duration switching</b></td><td>Expect rates to <b>fall</b>: <b>increase</b> duration</td></tr>
<tr><td><b>Riding the yield curve</b></td><td>Buy long, sell before maturity as yield falls. Needs an <b>upward-sloping</b> curve</td></tr>
<tr><td><b>Anomaly switch</b></td><td>Between <b>similar</b> bonds to exploit mispricing</td></tr>
<tr><td><b>Policy switch</b></td><td>Between <b>dissimilar</b> bonds on expected changes</td></tr>
<tr><td><b>Intermarket spread</b></td><td>Between <b>government and corporate</b> bonds</td></tr></table></div>
<h3>Passive strategies</h3>
<div class="tw"><table class="tbl"><tr><th>Strategy</th><th>How it works</th></tr>
<tr><td><b>Cash flow matching</b></td><td>Redemptions pay each liability as it falls due</td></tr>
<tr><td><b>Immunisation</b></td><td>Portfolio <b>duration</b> (not maturity) matches liabilities</td></tr>
<tr><td><b>Laddering</b></td><td>Evenly spread maturities</td></tr>
<tr><td><b>Bullet</b></td><td>Bunched near the liability (9 and 11-year for a 10-year liability)</td></tr>
<tr><td><b>Barbell</b></td><td><b>Short and long</b> only, e.g. 1 and 30-year</td></tr>
<tr><td><b>Combination</b></td><td>Cash flow match early, immunise later</td></tr></table></div>
<h3>Pros and cons</h3>
<div class="tw"><table class="tbl"><tr><th>Advantages</th><th>Disadvantages</th></tr>
<tr><td>Pay more than savings; fairly safe capital; less volatile than shares; regular income; little management</td><td>No protection from inflation or rate rises (conventionals); can be volatile; lower long-term returns; hard to sell; individual bonds <b>don't compound</b></td></tr></table></div>
<p>The bond market is over <b>$140 trillion</b>, the world's largest securities market. EM bonds pay more for political and economic risk. People buy <b>negative-yield</b> bonds expecting yields to fall further.</p>`,
traps:["<b>Barbell</b> = short + long. <b>Bullet</b> = bunched. <b>Ladder</b> = evenly spread.","Immunisation matches <b>duration</b>, not maturity.","Riding the yield curve needs an <b>upward-sloping</b> curve."]},

{id:"2.13", title:"ESG Bond Types and SIBs", blurb:"ESG bond risks, the four ICMA bond types, and social impact bonds.",
html:`<div class="tw"><table class="tbl"><tr><th>Risk</th><th>Detail</th></tr>
<tr><td><b>Falling from green grace</b></td><td>Loses ESG status; price falls</td></tr>
<tr><td><b>Green default</b></td><td>Penalties if sustainability terms are broken, <b>even if repaid in full</b></td></tr>
<tr><td><b>Credit rating</b></td><td>Recourse is to the <b>issuer, not the project</b>, so same rating as normal bonds</td></tr>
<tr><td><b>Greenium</b></td><td>Trades <b>above face value</b>; held to maturity, that premium becomes a <b>capital loss</b></td></tr>
<tr><td>Liquidity</td><td>Small market, harder to trade</td></tr></table></div>
<div class="tw"><table class="tbl"><tr><th>Bond type</th><th>Use of money</th><th>ICMA guidance</th></tr>
<tr><td><b>Green</b></td><td>Environmental projects only</td><td>GBP</td></tr>
<tr><td><b>Social</b></td><td>Social projects only. First <b>2006</b> (IFFIm, vaccines)</td><td>SBP</td></tr>
<tr><td><b>Sustainability</b></td><td>A <b>mix of green and social</b></td><td>SBG</td></tr>
<tr><td><b>Sustainability-linked</b></td><td><b>General purposes</b>; terms linked to <b>KPIs</b> (miss them and the coupon rises)</td><td>SLBP, <b>2020</b></td></tr></table></div>
<p>All four are <b>voluntary</b> and published by the <b>ICMA</b>.</p>
<h3>Social Impact Bonds</h3>
<ul><li><b>Not the same as social bonds.</b> Investors are paid <b>only if social outcomes are met</b>; no fixed return.</li>
<li>Risk is more like a <b>structured product or equity</b>. Also called <b>pay for success</b> or <b>social benefit bonds</b>.</li>
<li>Social investors pay upfront; government pays on results. Used for children in care, homelessness, youth unemployment.</li></ul>`,
traps:["Social bond (fixed coupon) is <b>not</b> a SIB (paid only on outcomes).","SLB money is <b>not</b> ring-fenced to projects.","Greenium held to maturity = <b>capital loss</b>."]}
];

{id:"3.2", title:"Ordinary and Preference Shares", blurb:"Share classes, preference share types and their rights.",
html:`<ul><li><b>Shareholders' funds</b> = assets − liabilities = share capital + reserves + retained profits. <b>Share capital</b> = par value × shares issued.</li>
<li><b>Primary market</b>: IPO, company gets the money. <b>Secondary</b>: existing shares, company gets nothing.</li>
<li>Share capital is <b>permanent</b>. Returns: capital growth, dividends (interim and final), buybacks.</li>
<li>Votes on directors, auditors and pay. Only <b>indirect</b> influence. Hold for <b>5+ years</b>. <b>Last in line</b> on liquidation, <b>unlimited upside</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Class</th><th>Key features</th></tr>
<tr><td><b>Straight ordinary</b></td><td>Full votes and all declared dividends</td></tr>
<tr><td><b>Redeemable</b></td><td>Bought back on a set date. Must be issued <b>alongside non-redeemables</b>, allowed by the <b>articles</b>. Redeemed shares are retired</td></tr>
<tr><td><b>Dual-class</b></td><td>Public get limited or no votes ('A' shares); founders get more</td></tr>
<tr><td><b>Deferred dividend</b></td><td>Full votes but <b>no dividend until a condition is met</b>. Suit growth investors</td></tr>
<tr><td><b>Founder shares</b></td><td>Little or no dividend until others get a minimum</td></tr></table></div>
<h3>Preference shares</h3>
<ul><li><b>Priority over ordinary</b> holders for dividends and capital (but only <b>nominal value</b> back). <b>Not classed as equity.</b> Dividend usually <b>fixed</b>.</li></ul>
<div class="tw"><table class="tbl"><tr><th>Type</th><th>Key features</th></tr>
<tr><td><b>Cumulative</b></td><td>Missed dividends <b>build up</b>. <b>The default</b> unless it says "non-cum"</td></tr>
<tr><td><b>Non-cumulative</b></td><td>Missed dividends are <b>lost</b></td></tr>
<tr><td><b>Participating</b></td><td>Fixed dividend <b>plus</b> a share of surplus profits</td></tr>
<tr><td><b>Redeemable</b></td><td>Bought back on a set date</td></tr>
<tr><td><b>Convertible</b></td><td>Converts into a set number of ordinary shares</td></tr></table></div>
<p class="muted">Features combine, e.g. "XYZ plc £1 Cum. Red. Pref."</p>`,
traps:["Preference shares are <b>cumulative unless stated otherwise</b>.","On liquidation preference holders get <b>nominal</b>, not market, value.","Redeemable ordinary shares must be issued <b>alongside</b> non-redeemables."]},

{id:"3.3", title:"Private Equity", blurb:"Buy-outs, venture, growth, distressed and mezzanine capital.",

{id:"3.4", title:"Investment Risk and Shares", blurb:"Capital and income risk, liquidity, and the reward for risk.",
html:`<ul><li><b>Capital risk</b>: price falls or lags inflation. <b>Income risk</b>: dividends fall or stop. Not paying = <b>"passing a dividend"</b>.</li>
